<!doctype html>
<html><head><meta charset="utf-8"><title>feature</title><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="500"></canvas>
<script>
// Google Play feature graphic (1024x500): the icon artwork beside the wordmark.
const c = document.getElementById('c'), x = c.getContext('2d');
const g = x.createLinearGradient(0, 0, 1024, 500);
g.addColorStop(0, '#3A2E7A'); g.addColorStop(0.6, '#2A2160'); g.addColorStop(1, '#191339');
x.fillStyle = g; x.fillRect(0, 0, 1024, 500);
const halo = x.createRadialGradient(250, 250, 20, 250, 250, 330);
halo.addColorStop(0, 'rgba(140,200,255,0.35)'); halo.addColorStop(1, 'rgba(140,200,255,0)');
x.fillStyle = halo; x.fillRect(0, 0, 1024, 500);
const im = new Image();
im.onload = () => {
  // the icon art without its square: clip a circle around the orb
  x.save(); x.beginPath(); x.arc(250, 250, 225, 0, Math.PI * 2); x.clip();
  x.drawImage(im, 250 - 270, 250 - 260, 540, 540);
  x.restore();
  x.fillStyle = '#FFFFFF'; x.textBaseline = 'alphabetic';
  x.font = '900 128px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText('SHARD', 500, 260);
  x.font = '800 38px ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillStyle = 'rgba(255,255,255,0.78)';
  x.fillText('Aim. Fire. Shatter.', 506, 322);
  x.fillStyle = '#FF6B57';
  x.beginPath(); x.roundRect(506, 352, 330, 54, 27); x.fill();
  x.fillStyle = '#FFFFFF'; x.font = '900 24px ui-rounded, system-ui, sans-serif';
  x.fillText('120 levels · Daily puzzle', 530, 387);
  document.title = 'ready';
};
im.src = '/tools/qa/icon.html' ? '/assets/icon-512.png' : '';
</script></body></html>
