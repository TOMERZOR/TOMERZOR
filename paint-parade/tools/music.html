<!doctype html>
<html><head><meta charset="utf-8"><title>Music render</title></head>
<body>
<script type="module">
// Renders the in-game music to a WAV (base64 in window.__wav) for trailers.
import { renderMusic } from '../js/audio.js';
const secs = Number(new URLSearchParams(location.search).get('s') || 30);
const buf = await renderMusic(secs);
const n = buf.length, ch = 2, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
const w = (o, str) => { for (let i = 0; i < str.length; i++) out.setUint8(o + i, str.charCodeAt(i)); };
w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, buf.sampleRate, true);
out.setUint32(28, buf.sampleRate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
const L = buf.getChannelData(0), R = buf.getChannelData(1);
for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
let bin = ''; const u8 = new Uint8Array(out.buffer);
for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
window.__wav = btoa(bin);
</script>
</body></html>
