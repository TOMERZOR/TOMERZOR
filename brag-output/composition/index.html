<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ערסלייט · פרסומת</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/local.css">
<style>
/* Every frame is a pure function of time: render(t) sets all styles, nothing animates on its own.
   The stage is 1080×1920; in preview it is scaled to fit the window and plays in a loop. */
:root {
  --sky-1: #C9DCF6; --sky-2: #E3ECF9; --sky-3: #F4F7FC;
  --ink: #0E1116; --ink-2: #4A5261; --ink-3: #8A93A3;
  --card: #FFFFFF; --card-2: #F7F9FC; --line: rgba(14, 17, 22, .08);
  --gold-1: #F1D597; --gold-2: #D6AE62; --gold-3: #A27326;
  --select: rgba(70, 120, 210, .22);
  --shadow: 0 3px 3px rgba(30, 60, 110, .04), 0 26px 60px -20px rgba(30, 60, 110, .16), 0 80px 160px -60px rgba(30, 60, 110, .26);
  --font: "Heebo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #DCE6F4; overflow: hidden; }
body { display: grid; place-items: center; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden; flex: none; transform-origin: 50% 50%;
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 100%);
}
body.render { display: block; }
body.render #stage { transform: none !important; }
.layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }
.glow-bg { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; left: -160px; top: 200px;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); pointer-events: none; }

/* ---------- Chat ---------- */
#chatA, #chatB { background: radial-gradient(900px 900px at 30% 40%, rgba(255, 255, 255, .6), transparent 70%), linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 100%); }
.status { position: absolute; top: 0; left: 0; right: 0; height: 120px; display: flex; align-items: center; justify-content: space-between;
  padding: 18px 78px 0; direction: ltr; font-weight: 700; font-size: 42px; letter-spacing: -.01em; }
.status .icons { display: flex; gap: 18px; align-items: center; }
.status svg { height: 34px; }
.chathead { position: absolute; top: 120px; left: 0; right: 0; height: 170px; display: flex; align-items: center; gap: 30px; padding: 0 54px;
  background: rgba(255, 255, 255, .55); border-bottom: 2px solid var(--line); backdrop-filter: blur(30px); }
.chathead .back { width: 54px; height: 54px; color: var(--ink); flex: none; }
.avatar { width: 112px; height: 112px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 50px; color: var(--gold-1);
  background: linear-gradient(180deg, #2A2E35, #0E1013); box-shadow: 0 2px 0 rgba(255, 255, 255, .12) inset, 0 14px 30px -12px rgba(14, 17, 22, .5); }
.avatar svg { width: 56px; height: 56px; }
.who b { display: block; font-size: 50px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.who span { display: block; font-size: 34px; color: var(--ink-3); font-weight: 500; margin-top: 4px; }
.msgs { position: absolute; top: 290px; left: 0; right: 0; bottom: 300px; display: flex; flex-direction: column; justify-content: flex-end; gap: 26px; padding: 40px 72px; }
.day { align-self: center; font-size: 30px; font-weight: 600; color: var(--ink-3); background: rgba(255, 255, 255, .6); padding: 8px 26px; border-radius: 999px; margin-bottom: auto; margin-top: 30px; }
.b { position: relative; max-width: 800px; padding: 30px 40px 30px; border-radius: 52px; font-size: 50px; line-height: 1.32; letter-spacing: -.015em; font-weight: 500; }
.b small { display: block; font-size: 28px; font-weight: 500; margin-top: 8px; opacity: .55; text-align: left; }
.b.in { align-self: flex-start; background: var(--card); border-bottom-right-radius: 16px; box-shadow: 0 2px 2px rgba(30, 60, 110, .05), 0 18px 40px -20px rgba(30, 60, 110, .25); transform-origin: 100% 100%; }
.b.out { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-left-radius: 16px; box-shadow: 0 18px 40px -18px rgba(14, 17, 22, .55); transform-origin: 0 100%; }
.price { position: relative; display: inline-block; font-weight: 800; }
.price i { position: absolute; right: -6px; top: 52%; height: 6px; border-radius: 3px; background: #D9443B; width: 0; }
.typing { align-self: flex-start; display: flex; gap: 14px; padding: 36px 40px; background: var(--card); border-radius: 52px; border-bottom-right-radius: 16px; transform-origin: 100% 100%;
  box-shadow: 0 18px 40px -20px rgba(30, 60, 110, .25); }
.typing i { width: 20px; height: 20px; border-radius: 50%; background: var(--ink-3); }
.save { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 34px 18px 30px; border-radius: 999px; background: var(--ink); color: var(--gold-1);
  font-weight: 800; font-size: 40px; letter-spacing: -.02em; box-shadow: 0 20px 40px -16px rgba(14, 17, 22, .6); }
.composer { position: absolute; left: 64px; right: 64px; bottom: 90px; display: flex; align-items: flex-end; gap: 22px; }
.field { flex: 1; min-height: 124px; background: var(--card); border-radius: 62px; padding: 32px 44px; font-size: 48px; line-height: 1.34; letter-spacing: -.012em;
  box-shadow: 0 2px 2px rgba(30, 60, 110, .05), 0 22px 50px -24px rgba(30, 60, 110, .3); }
.field .ph { color: var(--ink-3); }
.field .sel { background: var(--select); border-radius: 8px; }
.caret { display: inline-block; width: 4px; height: 52px; margin: 0 2px -10px; background: var(--ink); border-radius: 2px; }
.sendb { width: 124px; height: 124px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #E4E8EF; color: #A7AFBC; }
.sendb svg { width: 54px; height: 54px; }
.sendb.on { background: var(--ink); color: #fff; box-shadow: 0 20px 40px -18px rgba(14, 17, 22, .6); }
.thought { position: absolute; left: 0; right: 0; bottom: 600px; display: flex; justify-content: center; }
.thought span { display: inline-flex; align-items: center; gap: 18px; padding: 24px 40px; border-radius: 999px; background: rgba(255, 255, 255, .85); font-size: 42px; font-weight: 700;
  letter-spacing: -.02em; color: var(--ink-2); box-shadow: 0 20px 50px -24px rgba(30, 60, 110, .4); backdrop-filter: blur(20px); }
.thought em { font-style: normal; color: var(--ink); }
.tag { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px 12px 20px; border-radius: 999px; background: var(--ink); color: var(--gold-1);
  font-size: 32px; font-weight: 800; letter-spacing: -.02em; box-shadow: 0 14px 30px -12px rgba(14, 17, 22, .6); }
.tag svg { width: 34px; height: 34px; }

/* ---------- Hook ---------- */
.hook { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; text-align: center; }
.hook .l { font-size: 196px; font-weight: 800; letter-spacing: -.055em; line-height: 1.02; white-space: nowrap; }
.hook .l2 { display: flex; align-items: center; justify-content: center; margin-top: 40px; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.slot { position: relative; height: 216px; border-radius: 40px; background: var(--ink); color: #fff; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(14, 17, 22, .6); }
.slot span { position: absolute; top: 0; right: 0; height: 216px; padding: 0 46px; display: flex; align-items: center; white-space: nowrap; font-size: 140px; }
.slot span.gold { background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Logo ---------- */
.mark { display: grid; place-items: center; color: var(--gold-1); border-radius: 28%;
  background: linear-gradient(180deg, #2A2E35, #0E1013); box-shadow: 0 3px 0 rgba(255, 255, 255, .12) inset, 0 40px 80px -30px rgba(14, 17, 22, .6); }
.mark svg { width: 64%; height: 64%; overflow: visible; }
.mark rect { fill: none; stroke-width: 3; stroke-linecap: round; }
.mark .trk { stroke: rgba(231, 200, 135, .25); }
.mark .lnk { stroke: url(#gold); }
.reveal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 56px; transform-origin: 50% 50%; }
.logo .mark { width: 300px; height: 300px; }
.wordmark { font-size: 230px; font-weight: 800; letter-spacing: -.06em; line-height: 1; }
.wordmark .w { display: inline-block; }
.subline { margin-top: 44px; font-size: 56px; font-weight: 500; color: var(--ink-2); letter-spacing: -.02em; }
.ring { position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 6px solid var(--gold-2); left: 50%; top: 50%; margin: -150px 0 0 -150px; opacity: 0; }

/* ---------- App ---------- */
.app { position: absolute; inset: 0; padding: 0 64px; }
.apphead { position: absolute; top: 150px; right: 64px; display: flex; align-items: center; gap: 26px; }
.apphead .mark { width: 96px; height: 96px; border-radius: 27px; }
.apphead span { font-size: 64px; font-weight: 800; letter-spacing: -.04em; }

.appsub { position: absolute; top: 600px; left: 0; right: 0; text-align: center; font-size: 52px; font-weight: 500; color: var(--ink-2); letter-spacing: -.015em; }
.card { position: absolute; top: 760px; left: 64px; right: 64px; background: var(--card); border-radius: 76px; box-shadow: var(--shadow); padding: 60px 64px 46px; }
.card::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; border-radius: 0 0 76px 76px; pointer-events: none; background: linear-gradient(180deg, transparent, var(--card-2)); }
.ta { position: relative; z-index: 1; min-height: 250px; font-size: 54px; line-height: 1.42; letter-spacing: -.015em; font-weight: 400; }
.ta .ph { color: var(--ink-3); }
.cbar { position: relative; z-index: 2; display: flex; align-items: center; gap: 30px; margin-top: 18px; height: 120px; }
.model { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 14px; height: 96px; padding: 0 30px; border-radius: 999px; font-size: 42px; font-weight: 600; color: var(--ink-2); background: var(--line); }
.model svg { width: 36px; height: 36px; }
.card .sendb { width: 120px; height: 120px; position: relative; }
.spin { position: absolute; inset: -10px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 70%, var(--ink-3) 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); opacity: 0; }
.think { position: absolute; top: 1330px; right: 80px; display: flex; align-items: center; gap: 26px; }
.think svg { width: 76px; height: 76px; overflow: visible; }
.think rect { fill: none; stroke-width: 3; stroke-linecap: round; }
.think .trk { stroke: rgba(201, 162, 90, .22); }
.think .run { stroke: url(#gold); stroke-dasharray: 38 62; filter: drop-shadow(0 0 3px rgba(231, 200, 135, .9)); }
.tw { position: relative; height: 70px; width: 600px; }
.tw span { position: absolute; right: 0; top: 0; white-space: nowrap; font-size: 50px; font-weight: 600; letter-spacing: -.015em;
  background: linear-gradient(90deg, var(--ink-3) 0%, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%, var(--ink-3) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.answer { position: absolute; top: 1300px; left: 80px; right: 80px; font-size: 84px; font-weight: 800; letter-spacing: -.04em; line-height: 1.12; }
.pills { position: absolute; top: 1720px; right: 80px; display: flex; gap: 20px; }
.pill { display: inline-flex; align-items: center; gap: 14px; height: 96px; padding: 0 36px; border-radius: 999px; font-size: 40px; font-weight: 600; color: var(--ink-2);
  background: rgba(255, 255, 255, .7); box-shadow: 0 0 0 2px var(--line); }
.pill.ink { background: var(--ink); color: #fff; box-shadow: none; }
.pill svg { width: 40px; height: 40px; }
.cursor { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: rgba(14, 17, 22, .16); border: 4px solid rgba(255, 255, 255, .9);
  box-shadow: 0 10px 24px -8px rgba(14, 17, 22, .4); margin: -37px 0 0 -37px; opacity: 0; pointer-events: none; }

/* ---------- Outro ---------- */
.outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.outro .mark { width: 240px; height: 240px; }
.outro .wordmark { margin-top: 60px; font-size: 220px; }
.outro .tagline { margin-top: 30px; font-size: 66px; font-weight: 700; letter-spacing: -.03em; color: var(--ink-2); }
.chips { margin-top: 90px; display: flex; gap: 24px; }
.chip { display: inline-flex; align-items: center; gap: 14px; height: 104px; padding: 0 44px; border-radius: 999px; background: var(--card); font-size: 44px; font-weight: 700; letter-spacing: -.02em;
  box-shadow: 0 2px 2px rgba(30, 60, 110, .05), 0 22px 50px -24px rgba(30, 60, 110, .35); }
.chip b { font-weight: 800; color: var(--gold-3); }
.url { position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 600; color: var(--ink-3); letter-spacing: -.01em; direction: ltr; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D597"/><stop offset=".5" stop-color="#D6AE62"/><stop offset="1" stop-color="#A27326"/></linearGradient>
    <symbol id="links" viewBox="0 0 32 32"><rect x="3.5" y="11" width="15" height="10" rx="5" transform="rotate(-45 11 16)"/><rect x="13.5" y="11" width="15" height="10" rx="5" transform="rotate(-45 21 16)"/></symbol>

<div id="stage">

<script>
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const T = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const inOutCubic = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const inQuad = (p) => p * p;
const spring = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(10.5 * p));
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
function vis(el, op, tf = "", blur = 0) {
  el.style.opacity = op; el.style.transform = tf; el.style.filter = blur > .05 ? `blur(${blur}px)` : "none";
  el.style.visibility = op <= 0.001 ? "hidden" : "visible";
}
/* a bubble or chip popping in with a spring */
function pop(el, t, at, dur = .55, from = .4) {
  const p = T(t, at, at + dur);
  vis(el, clamp(p * 3), `scale(${lerp(from, 1, spring(p))})`);
}
/* words rising in, one after another */
function rise(spans, t, at, stagger = .07, dur = .6, dist = 60) {
  spans.forEach((s, i) => {
    const p = T(t, at + i * stagger, at + i * stagger + dur);
    vis(s, clamp(p * 2.2), `translateY(${(1 - outExpo(p)) * dist}px)`, (1 - outCubic(p)) * 10);
  });
}
function splitWords(el, text) { el.innerHTML = text.split(" ").map((w) => `<span class="w">${w}</span>`).join(" "); return [...el.querySelectorAll(".w")]; }
function splitChars(el, text) { el.innerHTML = [...text].map((c) => `<span class="w">${c}</span>`).join(""); return [...el.querySelectorAll(".w")]; }
/* typing schedule: uneven, human key timing; spaces and punctuation take a little longer */
function schedule(text, a, b, seed) {
  const w = [...text].map((c, i) => 1 + .7 * rnd(i + seed) + (c === " " ? .6 : 0) + (/[,.?]/.test(c) ? 1.4 : 0));
  const tot = w.reduce((x, y) => x + y, 0); let acc = 0;
  return w.map((x) => { acc += x; return a + (b - a) * (acc / tot); });
}
const count = (times, t) => { let n = 0; while (n < times.length && times[n] <= t) n++; return n; };

/* ================= script ================= */
const FORMAL = "שלום רב שמעון, ברצוני לברר האם קיימת אפשרות להפחתה קלה במחיר? בברכה, יונתן";
const FORMAL_SHORT = "שלום רב שמעון, האם קיימת אפשרות להפחתה קלה במחיר?";
const ARS = "שמעון אחשלי, סידרת אותי מלך. תעשה לי מחיר, כפרה עליך עשה טובה";
const REPLY = "בשבילך אחשלי? 2,000 וסגרנו. על העיניים";
const DAD_Q = "אז אתה החבר של מיכל?";
const DAD_FORMAL = "נעים מאוד, אדוני. שמח להכיר.";
const DAD_ARS = "מה אומר אבא? כבוד גדול להכיר, באמא שלי";
const DAD_REPLY = "וואלה, ילד טוב. בוא לשבת, יש חריימה";

const tFormal = schedule(FORMAL, .95, 3.35, 1);
const tCard = schedule(FORMAL_SHORT, 12.85, 13.95, 7);
const DEL_A = 4.45, DEL_B = 5.05;
const DUR = 30.5;

const ICON_SEND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
const ICON_BACK = `<svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`;
const ICON_WRENCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L4 16.7 7.3 20l5.3-5.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>`;
const STATUS = `<div class="status"><span>21:47</span><span class="icons">
  <svg viewBox="0 0 34 22"><rect x="0" y="14" width="6" height="8" rx="1.5" fill="#0E1116"/><rect x="9" y="10" width="6" height="12" rx="1.5" fill="#0E1116"/><rect x="18" y="5" width="6" height="17" rx="1.5" fill="#0E1116"/><rect x="27" y="0" width="6" height="22" rx="1.5" fill="#0E1116"/></svg>
  <svg viewBox="0 0 52 24"><rect x="1" y="1" width="44" height="22" rx="7" fill="none" stroke="#0E1116" stroke-opacity=".4" stroke-width="2"/><rect x="4" y="4" width="34" height="16" rx="4.5" fill="#0E1116"/><rect x="47" y="8" width="3.5" height="8" rx="1.5" fill="#0E1116" fill-opacity=".4"/></svg></span></div>`;

function chatHTML(p, name, sub, avatar) {
  return `${STATUS}
  <div class="chathead">${ICON_BACK}<div class="avatar">${avatar}</div><div class="who"><b>${name}</b><span id="${p}st">${sub}</span></div></div>
  <div class="msgs" id="${p}msgs"></div>
  <div class="thought" id="${p}th"></div>
  <div class="composer"><div class="field" id="${p}field"></div><div class="sendb" id="${p}send">${ICON_SEND}</div></div>`;
}
$("chatA").innerHTML = chatHTML("a", "שמעון המוסך", "מחובר/ת", ICON_WRENCH);
$("chatB").innerHTML = chatHTML("b", "אבא של מיכל", "מחובר/ת", "א");
$("amsgs").innerHTML = `<div class="day">היום</div>
  <div class="b in" id="a1">האוטו מוכן. <span class="price">2,400 ₪<i id="strike"></i></span><small>21:41</small></div>
  <div class="b out" id="a2">${ARS}<small>21:48</small></div>
  <div class="typing" id="atyp"><i></i><i></i><i></i></div>
  <div class="b in" id="a3">${REPLY}<small>21:48</small></div>`;
$("ath").innerHTML = `<span id="thA">רגע… <em>זה נשמע כמו מכתב מהבנק.</em></span>`;
$("bmsgs").innerHTML = `<div class="day">היום</div>
  <div class="b in" id="b1">${DAD_Q}<small>19:02</small></div>
  <div class="b out" id="b2"><span id="b2t">${DAD_FORMAL}</span><small>19:03</small></div>
  <div class="typing" id="btyp"><i></i><i></i><i></i></div>
  <div class="b in" id="b3">${DAD_REPLY}<small>19:03</small></div>`;
const save = document.createElement("div"); save.className = "save"; save.id = "save";
save.innerHTML = `חסכת 400 ₪`; $("chatA").appendChild(save);
const tagB = document.createElement("div"); tagB.className = "tag"; tagB.id = "tagB";
tagB.innerHTML = `<svg viewBox="0 0 32 32" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"><use href="#links"/></svg>תורגם בערסלייט`; $("chatB").appendChild(tagB);

const wmChars = splitChars($("wm"), "ערסלייט");
const owmChars = splitChars($("owm"), "ערסלייט.");
const h1Words = [...$("h1").querySelectorAll(".w")];
const hl1Words = [$("hl1").querySelector(".w"), $("hl2")];

/* sounds, read by the audio builder: [time, kind] */
const SFX = [];
(function buildSfx() {
  SFX.push([.35, "pop"]);
  tFormal.forEach((x, i) => SFX.push([x, FORMAL[i] === " " ? "space" : "key"]));
  SFX.push([3.55, "soft"]);
  for (let i = 0; i < 18; i++) SFX.push([DEL_A + (DEL_B - DEL_A) * Math.sqrt(i / 18), "del"]);
  SFX.push([5.2, "whoosh"]);
  SFX.push([5.55, "tick"], [5.7, "tick"], [5.9, "tick"], [6.05, "thud"]);
  SFX.push([7.55, "roll"]);
  SFX.push([8.0, "riser"]);
  SFX.push([9.0, "boom"], [9.05, "shimmer"]);
  SFX.push([11.55, "whoosh"]);
  SFX.push([12.1, "swish"]);
  tCard.forEach((x, i) => SFX.push([x, FORMAL_SHORT[i] === " " ? "space" : "key"]));
  SFX.push([14.15, "click"], [14.2, "send"]);
  SFX.push([15.65, "chime"]);
  SFX.push([16.95, "click"], [17.0, "pop"]);
  SFX.push([17.45, "whoosh"]);
  SFX.push([17.95, "paste"], [18.35, "click"], [18.4, "send"]);
  SFX.push([20.05, "pop"], [20.9, "strike"], [21.1, "cash"]);
  SFX.push([22.05, "whoosh"]);
  SFX.push([22.55, "pop"], [23.05, "send"], [23.9, "scramble"], [24.4, "chime"], [25.2, "pop"]);
  SFX.push([26.6, "whoosh"], [26.8, "boom"], [26.85, "shimmer"], [27.7, "tick"], [27.85, "tick"]);
  SFX.sort((a, b) => a[0] - b[0]);
})();

/* ================= render ================= */
let morph = null;
function render(t) {
  /* background light drifts slowly */
  set($("glow"), { transform: `translate(${Math.sin(t * .35) * 120}px, ${Math.cos(t * .27) * 160}px)` });

  /* ---------- chat A: the mechanic ---------- */
  const A = $("chatA");
  let aOp = 0, aTf = "", aBlur = 0;
  if (t < 5.7) {
    const pin = outExpo(T(t, 0, .7)), pout = inOutCubic(T(t, 5.05, 5.6));
    const zoom = lerp(1, 1.07, inOutCubic(T(t, .7, 3.6)));
    aOp = pin * (1 - pout); aTf = `scale(${lerp(1.06, 1, pin) * lerp(1, .9, pout) * zoom})`; aBlur = pout * 26;
  } else if (t >= 17.4 && t < 22.6) {
    const pin = outExpo(T(t, 17.4, 18.0)), pout = inOutCubic(T(t, 22.0, 22.5));
    aOp = 1; aTf = `translateX(${(1 - pin) * -1080 + pout * 1080}px) scale(${lerp(1.02, 1.07, inOutCubic(T(t, 18.3, 21.5)))})`;
  }
  A.style.transformOrigin = "50% 92%";
  A.style.zIndex = t >= 17.4 ? 5 : 0; $("chatB").style.zIndex = 6;
  vis(A, aOp, aTf, aBlur);
  if (aOp > 0) {
    const second = t >= 17.4;
    pop($("a1"), t, second ? -1 : .35);
    // composer
    let txt = "", sel = false, caret = false;
    if (!second) {
      let n = count(tFormal, t);
      if (t >= DEL_A) n = Math.round(FORMAL.length * (1 - inQuad(T(t, DEL_A, DEL_B))));
      txt = [...FORMAL].slice(0, n).join("");
      caret = t > .8;
    } else if (t >= 17.95 && t < 18.38) { txt = ARS; sel = t < 18.15; }
    const blink = (t * 1.8) % 1 < .55 || (t > .9 && t < 3.5) || (t > DEL_A && t < DEL_B);
    $("afield").innerHTML = txt ? `<span class="${sel ? "sel" : ""}">${txt}</span>${caret && blink ? '<span class="caret"></span>' : ""}`
      : `${caret && blink ? '<span class="caret"></span>' : ""}<span class="ph">הודעה</span>`;
    const sb = $("asend"); sb.className = "sendb" + (txt ? " on" : "");
    const press = (x) => 1 - .14 * Math.sin(Math.PI * T(t, x, x + .2));
    sb.style.transform = `scale(${second ? press(18.33) : 1})`;
    // hesitation thought
    const th = $("thA"); const pth = T(t, 3.55, 4.1), pthOut = T(t, 4.95, 5.2);
    vis(th, clamp(pth * 3) * (1 - pthOut), `translateY(${(1 - spring(pth)) * 40}px) scale(${lerp(.8, 1, spring(pth))})`);
    // sent bubble flies up from the composer
    const a2 = $("a2");
    if (second && t >= 18.4) { const p = T(t, 18.4, 18.95); vis(a2, clamp(p * 4), `translateY(${(1 - outExpo(p)) * 240}px) scale(${lerp(.85, 1, spring(p))})`); a2.style.display = ""; }
    else { a2.style.display = "none"; }
    const typ = $("atyp"); typ.style.display = second && t >= 19.0 && t < 20.05 ? "" : "none";
    if (typ.style.display === "") {
      pop(typ, t, 19.0, .4);
      [...typ.children].forEach((d, i) => d.style.transform = `translateY(${-Math.max(0, Math.sin((t * 7) - i * .9)) * 12}px)`);
    }
    const a3 = $("a3"); a3.style.display = second && t >= 20.05 ? "" : "none";
    if (a3.style.display === "") pop(a3, t, 20.05);
    $("ast").textContent = second && t >= 19.0 && t < 20.05 ? "מקליד/ה…" : "מחובר/ת";
    $("strike").style.width = `calc(${outCubic(T(t, 20.9, 21.2)) * 100}% + 12px)`;
    if (!(t >= 20.9)) $("strike").style.width = "0";
    const sv = $("save"), a1 = $("a1"), am = $("amsgs");
    set(sv, { left: `${am.offsetLeft + a1.offsetLeft + 20}px`, top: `${am.offsetTop + a1.offsetTop - 64}px` });
    pop(sv, t, 21.1, .6, .2);
    if (t < 21.1) vis(sv, 0);
  }

  /* ---------- hook ---------- */
  const H = $("hookL");
  if (t > 5.2 && t < 9.3) {
    const pout = inOutCubic(T(t, 8.75, 9.1));
    vis(H, 1 - pout, `scale(${lerp(1, .8, pout)})`, pout * 20);
    rise(hl1Words, t, 5.5, .16, .7, 120);
    rise([$("hAm")], t, 5.86, 0, .7, 120);
    const slot = $("slot"), s1 = $("s1"), s2 = $("s2");
    const ps = T(t, 6.0, 6.75);
    vis(slot, clamp(ps * 3), `translateY(${(1 - outExpo(ps)) * 120}px) scale(${lerp(.7, 1, spring(ps))})`);
    const pr = inOutCubic(T(t, 7.5, 7.95));
    const w1 = s1.offsetWidth, w2 = s2.offsetWidth;
    slot.style.width = `${lerp(w1, w2, pr)}px`;
    s1.style.transform = `translateY(${-pr * 216}px)`; s1.style.opacity = 1 - pr;
    s2.style.transform = `translateY(${(1 - pr) * 216}px)`; s2.style.opacity = pr;
  } else vis(H, 0);

  /* ---------- reveal ---------- */
  const R = $("revealL");
  if (t > 8.85 && t < 12.3) {
    vis(R, 1);
    const pm = T(t, 8.95, 9.75);
    const mk = $("bigMark");
    const draw = outCubic(T(t, 9.05, 9.8));
    $("lnkDraw").querySelectorAll("rect").forEach((rc) => { rc.style.strokeDasharray = "100 100"; rc.style.strokeDashoffset = 100 - draw * 100; });
    ["ring1", "ring2"].forEach((id, i) => {
      const p = T(t, 9.05 + i * .14, 9.9 + i * .14);
      vis($(id), p > 0 && p < 1 ? (1 - p) * .9 : 0, `scale(${lerp(.8, 3.6 + i, outExpo(p))})`);
      $(id).style.borderWidth = `${lerp(10, 1, p)}px`;
    });
    rise(wmChars, t, 9.45, .055, .6, 90);
    const psub = T(t, 10.05, 10.7), psubOut = T(t, 11.3, 11.6);
    vis($("rsub"), clamp(psub * 2) * (1 - psubOut), `translateY(${(1 - outExpo(psub)) * 40}px)`);
    // morph into the app header
    const pm2 = inOutCubic(T(t, 11.45, 12.2));
    const logo = $("logo");
    if (pm2 > 0) {
      if (!morph) {
        const st = $("stage").getBoundingClientRect(), sc = st.width / 1080;
        logo.style.transform = ""; const a = $("bigMark").getBoundingClientRect(), b = $("smallMark").getBoundingClientRect();
        morph = { dx: ((b.left + b.width / 2) - (a.left + a.width / 2)) / sc, dy: ((b.top + b.height / 2) - (a.top + a.height / 2)) / sc, s: b.width / a.width };
      }
      logo.style.transform = `translate(${morph.dx * pm2}px, ${morph.dy * pm2}px) scale(${lerp(1, morph.s, pm2)})`;
      logo.style.transformOrigin = "50% 0";
      $("wm").style.opacity = 1 - clamp(pm2 * 2.5);
    } else { logo.style.transform = ""; $("wm").style.opacity = 1; }
    vis(mk, clamp(pm * 4), `scale(${spring(pm)}) rotate(${(1 - spring(pm)) * -30}deg)`);
    if (t > 12.15) vis(R, 0);
  } else vis(R, 0);

  /* ---------- app ---------- */
  const P = $("appL");
  if (t > 11.4 && t < 18.1) {
    const pout = inOutCubic(T(t, 17.35, 17.9));
    vis(P, 1 - pout, `scale(${lerp(1, .9, pout)})`, pout * 16);
    vis($("apphead"), t > 12.12 ? 1 : 0);
    const ap = $("apphead").querySelector("span"); ap.style.opacity = clamp((t - 11.95) / .35);
    rise(h1Words, t, 11.95, .09, .7, 80);
    const pas = T(t, 12.3, 12.9); vis($("asub"), clamp(pas * 2), `translateY(${(1 - outExpo(pas)) * 30}px)`);
    const pc = T(t, 12.15, 13.0); vis($("card"), clamp(pc * 3), `translateY(${(1 - spring(pc)) * 420}px)`);
    const n = count(tCard, t);
    const txt = [...FORMAL_SHORT].slice(0, n).join("");
    $("ta").innerHTML = txt ? txt + (t < 14.15 ? '<span class="caret" style="height:62px"></span>' : "") : '<span class="ph">מה רוצים להגיד?</span>';
    const sb = $("csend"); sb.className = "sendb" + (txt ? " on" : "");
    sb.style.transform = `scale(${1 - .14 * Math.sin(Math.PI * T(t, 14.1, 14.32))})`;
    const busy = t > 14.2 && t < 15.65;
    $("cspin").style.opacity = busy ? 1 : 0; $("cspin").style.transform = `rotate(${t * 450}deg)`;
    // thinking
    const pth = T(t, 14.25, 14.6), pthOut = T(t, 15.5, 15.7);
    vis($("think"), clamp(pth * 2) * (1 - pthOut), `translateY(${(1 - outExpo(pth)) * 20}px)`);
    $("tlogo").style.transform = `rotate(${(t - 14.25) * 160}deg)`;
    $("run1").style.strokeDashoffset = -(t * 90) % 100; $("run2").style.strokeDashoffset = (t * 90 + 50) % 100;
    const sw = T(t, 14.85, 15.05);
    [["tw1", 1 - sw, -sw * 20], ["tw2", sw, (1 - sw) * 20]].forEach(([id, op, y]) => {
      const el = $(id); el.style.opacity = op; el.style.transform = `translateY(${y}px)`;
      el.style.backgroundPosition = `${100 - ((t * .55) % 1) * 250}% 0`;
    });
    // answer
    const ans = $("answer");
    if (!ans.dataset.ready) { splitWords(ans, ARS); ans.dataset.ready = 1; }
    const aw = [...ans.querySelectorAll(".w")];
    if (t >= 15.6) rise(aw, t, 15.65, .06, .6, 70); else aw.forEach((s) => vis(s, 0));
    const pp = T(t, 16.35, 16.8); vis($("pills"), clamp(pp * 2), `translateY(${(1 - outExpo(pp)) * 30}px)`);
    $("copyTxt").textContent = t >= 16.98 ? "הועתק ✓" : "העתקה";
    $("copyPill").style.transform = `scale(${1 - .1 * Math.sin(Math.PI * T(t, 16.92, 17.12))})`;
    // a finger tap on send and on copy
    const cur = $("cur"), sendR = $("csend").getBoundingClientRect(), copyR = $("copyPill").getBoundingClientRect(), st = $("stage").getBoundingClientRect(), sc = st.width / 1080;
    const at = (r) => [((r.left + r.width / 2) - st.left) / sc, ((r.top + r.height / 2) - st.top) / sc];
    let cop = 0, cx = 0, cy = 0, cs = 1;
    if (t > 13.85 && t < 14.5) { [cx, cy] = at(sendR); cop = Math.min(T(t, 13.85, 14.0), 1 - T(t, 14.3, 14.5)); cs = 1 - .18 * Math.sin(Math.PI * T(t, 14.08, 14.3)); }
    if (t > 16.7 && t < 17.3) { [cx, cy] = at(copyR); cop = Math.min(T(t, 16.7, 16.85), 1 - T(t, 17.1, 17.3)); cs = 1 - .18 * Math.sin(Math.PI * T(t, 16.9, 17.12)); }
    set(cur, { left: cx + "px", top: cy + "px", opacity: cop, transform: `scale(${cs})` });
  } else vis(P, 0);

  /* ---------- chat B: the girlfriend's dad ---------- */
  const B = $("chatB");
  if (t > 22.0 && t < 27.0) {
    const pin = outExpo(T(t, 22.0, 22.55)), pout = inOutCubic(T(t, 26.4, 26.9));
    B.style.transformOrigin = "50% 92%";
    vis(B, 1 - pout, `translateX(${(1 - pin) * -1080}px) scale(${lerp(1, .9, pout) * lerp(1.02, 1.07, inOutCubic(T(t, 22.6, 26.2)))})`, pout * 24);
    pop($("b1"), t, 22.55);
    const b2 = $("b2"); b2.style.display = t >= 23.05 ? "" : "none";
    if (t >= 23.05) {
      const p = T(t, 23.05, 23.55); vis(b2, clamp(p * 4), `translateY(${(1 - outExpo(p)) * 200}px) scale(${lerp(.85, 1, spring(p))})`);
      // the formal line scrambles into ars
      const ps = T(t, 23.9, 24.4);
      let s = DAD_FORMAL;
      if (ps > 0) {
        const L = Math.round(lerp(DAD_FORMAL.length, DAD_ARS.length, ps)); const AB = "אבגדהוזחטיכלמנסעפצקרשת";
        s = ""; for (let i = 0; i < L; i++) {
          const th = (i / L) * .6 + rnd(i + 40) * .35;
          s += ps >= th + .05 ? (DAD_ARS[i] || "") : (DAD_ARS[i] === " " ? " " : AB[Math.floor(rnd(i * 7 + Math.floor(t * 24)) * AB.length)]);
        }
        if (ps >= 1) s = DAD_ARS;
        const bump = Math.sin(Math.PI * ps) * .05; b2.style.transform += ` scale(${1 + bump})`;
      }
      $("b2t").textContent = s;
    }
    const typ = $("btyp"); typ.style.display = t >= 24.6 && t < 25.2 ? "" : "none";
    if (typ.style.display === "") { pop(typ, t, 24.6, .4); [...typ.children].forEach((d, i) => d.style.transform = `translateY(${-Math.max(0, Math.sin((t * 7) - i * .9)) * 12}px)`); }
    const b3 = $("b3"); b3.style.display = t >= 25.2 ? "" : "none"; if (t >= 25.2) pop(b3, t, 25.2);
    const tg = $("tagB"), bm = $("bmsgs");
    if (t >= 24.35) { set(tg, { left: `${bm.offsetLeft + b2.offsetLeft + 10}px`, top: `${bm.offsetTop + b2.offsetTop - 66}px` }); pop(tg, t, 24.4, .55, .3); } else vis(tg, 0);
    $("bst").textContent = t >= 24.6 && t < 25.2 ? "מקליד/ה…" : "מחובר/ת";
    $("bfield").innerHTML = '<span class="ph">הודעה</span>';
  } else vis(B, 0);

  /* ---------- outro ---------- */
  const O = $("outroL");
  if (t > 26.5) {
    vis(O, 1);
    const pm = T(t, 26.75, 27.5);
    vis($("oMark"), clamp(pm * 4), `scale(${spring(pm)}) rotate(${(1 - spring(pm)) * -30}deg)`);
    rise(owmChars, t, 26.95, .05, .6, 90);
    const pt = T(t, 27.45, 28.1); vis($("otag"), clamp(pt * 2), `translateY(${(1 - outExpo(pt)) * 40}px)`, (1 - pt) * 6);
    pop($("chip1"), t, 27.7, .6); pop($("chip2"), t, 27.85, .6);
    const pu = T(t, 28.2, 28.8); vis($("ourl"), clamp(pu * 2), `translateY(${(1 - outExpo(pu)) * 20}px)`);
  } else vis(O, 0);
}

/* ================= preview / render ================= */
window.__render = render; window.__dur = DUR; window.__sfx = SFX;
const params = new URLSearchParams(location.search);
const stage = $("stage");
if (params.has("render")) { document.body.classList.add("render"); render(+params.get("t") || 0); }
else {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920) * .96; stage.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
