# ArsLate API. Deployed by .github/workflows/arslate-api.yml once the repository
# secrets exist; by hand: `npx wrangler deploy`, then `npx wrangler secret put ANTHROPIC_API_KEY`.
name = "arslate-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of sites allowed to call the API. "*" allows any site.
ALLOWED_ORIGINS = "https://tomerzor.github.io,http://localhost:8080,http://127.0.0.1:8080"
# AI translations per visitor per day (needs the KV namespace below). 0 = no limit.
DAILY_LIMIT = "60"
ARSLATE_MODEL = "claude-opus-5-5"
# Rewriting one short message is easy work: low effort keeps it fast and cheap.
ARSLATE_EFFORT = "low"

# Optional: caches translations for a day and enforces the daily limit. The
# deploy workflow creates and binds it (tools/ensure-kv.mjs).
# [[kv_namespaces]]
# binding = "ARSLATE_KV"
# id = "paste-the-id-here"

# The API key is a secret, never put it in this file:
#   npx wrangler secret put ANTHROPIC_API_KEY

[[kv_namespaces]]
binding = "ARSLATE_KV"
id = "71472465df9347baaa6f098162f9162d"
