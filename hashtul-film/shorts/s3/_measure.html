<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts.css"><link rel="stylesheet" href="../../vendor/game.css">
<style>body{margin:0;background:#000}.p{position:relative;width:430px;height:932px;overflow:visible}#phone .screen__body{overflow:visible!important}</style></head>
<body><div id="phone"></div>
<script src="../../vendor/screens.js"></script><script src="screens.js"></script>
<script>
window.measure=async(name,sels)=>{await document.fonts.ready;const ph=document.getElementById('phone');ph.innerHTML='<div class="p">'+SCREENS[name]+'</div>';
 await new Promise(r=>setTimeout(r,200));const p0=ph.firstChild.getBoundingClientRect();const o={};
 for(const s of sels){o[s]=[...ph.querySelectorAll(s)].map(e=>{const r=e.getBoundingClientRect();const cs=getComputedStyle(e);return [Math.round(r.left-p0.left),Math.round(r.top-p0.top),Math.round(r.width),Math.round(r.height),cs.fontSize]})}return o;}
</script></body></html>
