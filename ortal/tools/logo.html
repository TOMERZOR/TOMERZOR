<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:SO;src:url(sec.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:SO;src:url(secl.woff2) format('woff2')}
body{margin:0;background:transparent}
#logo{display:inline-flex;flex-direction:column;align-items:center;padding:30px 60px 40px;position:relative}
#logo img{width:420px;margin-bottom:-70px;position:relative;z-index:0;filter:drop-shadow(0 0 30px rgba(255,120,20,.55))}
.t{position:relative;z-index:1;font-family:SO;font-size:230px;line-height:.95;letter-spacing:4px;white-space:nowrap}
.t span{position:absolute;inset:0}
.t .back{color:#2a1300;-webkit-text-stroke:26px #2a1300;filter:drop-shadow(0 14px 0 #120800) drop-shadow(0 0 40px rgba(255,110,0,.75))}
.t .edge{color:transparent;-webkit-text-stroke:12px #f7c75a}
.t .face{background:linear-gradient(180deg,#fffbe0 0%,#ffe27a 22%,#e7a525 46%,#8a4f08 52%,#d99a22 62%,#ffe8a0 82%,#b67812 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t .shine{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 47%,transparent 55%);-webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:screen}
.t .sizer{position:relative;visibility:hidden}
.year{position:relative;z-index:2;margin-top:6px;font-family:SO;font-size:56px;color:#fff;background:linear-gradient(180deg,#ff4a4a,#a80010);padding:0 34px;border-radius:10px;transform:skewX(-10deg);box-shadow:0 6px 0 #4a0006,0 0 24px rgba(255,0,0,.5);border:3px solid #ffd27a}
</style></head><body>
<div id="logo"><img src="emblem.png"><div class="t"><span class="back">אורטל קומבט</span><span class="edge">אורטל קומבט</span><span class="face">אורטל קומבט</span><span class="shine">אורטל קומבט</span><span class="sizer">אורטל קומבט</span></div><div class="year">2026</div></div>
</body></html>
