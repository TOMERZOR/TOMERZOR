# Easy2Study API. Deployed by .github/workflows/easy2study-api.yml once the
# repository secrets exist; by hand: `npx wrangler deploy`, then
# `npx wrangler secret put ANTHROPIC_API_KEY`.
name = "easy2study-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of sites allowed to call the API. "*" allows any site.
ALLOWED_ORIGINS = "https://tomerzor.github.io,http://localhost:8080,http://127.0.0.1:8080"
# Per visitor per day (needs the KV namespace below). 0 = no limit.
DAILY_LESSONS = "15"
DAILY_HELP = "120"
E2S_MODEL = "claude-opus-5-5"
# Writing a lesson needs some thought; one re-explanation is quick.
LESSON_EFFORT = "medium"
HELP_EFFORT = "low"

# Optional: enforces the daily limits. The deploy workflow creates and binds it
# (tools/ensure-kv.mjs).
# [[kv_namespaces]]
# binding = "E2S_KV"
# id = "paste-the-id-here"

# The API key is a secret, never put it in this file:
#   npx wrangler secret put ANTHROPIC_API_KEY
