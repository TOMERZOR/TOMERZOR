<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>השתול · S2 · שלוש שאלות</title>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../vendor/game.css">
<style>
/* A short on the kit (../kit.js, ../endcard.js): the film's page shell, unchanged. 1080×1920. Every frame is a pure function of time: __seek(t) draws it (film.js). The UI is the game's own:
   its stylesheet, fonts, captured screens and character generator (vendor/). The game's CSS animations and
   transitions are switched off, so nothing moves unless the film moves it. */
html, body { margin: 0; height: 100%; background: #0b0420; overflow: hidden; }
body { display: grid; place-items: center; }
body.render { display: block; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; flex: none; transform-origin: 50% 50%;
  font-family: var(--font); color: #fff; }
body.render #stage { transform: none !important; }
#ground { position: absolute; inset: 0;
  background: radial-gradient(120% 60% at 50% -10%, #8a3bf2 0%, transparent 60%),
              radial-gradient(90% 50% at 100% 100%, #7a1fb8 0%, transparent 60%),
              linear-gradient(180deg, var(--v-800) 0%, var(--v-900) 55%, var(--v-950) 100%); }
#dots, #fxc { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
#cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#phone { position: absolute; left: 0; top: 0; width: 430px; height: 932px; transform-origin: 0 0; transform: scale(2.5); }
.scr { position: absolute; left: 0; top: 0; width: 430px; height: 932px; display: none; }
.scr.on { display: block; }
#grain { position: absolute; inset: 0; pointer-events: none; background-repeat: repeat; }

/* the game's own motion is replaced by the film's */
#phone *, #phone *::before, #phone *::after { animation: none !important; transition: none !important; }
#phone .screen__body { overflow: visible !important; }
#phone .dots::after { content: var(--dots, "") !important; }
#phone .switch::after { transform: translate(var(--knob, 0px)) !important; }
#phone .wordmark::after { transform: rotate(1.5deg) scaleX(var(--bar, 1)); transform-origin: 100% 50%; }
#phone .wordmark .ltr { display: inline-block; }
#phone .w { display: inline-block; white-space: pre; }
#phone .answer__q-text .w, #phone .result__fake .w { white-space: normal; }

/* film-only pieces, drawn in the game's own language */
#fx { position: absolute; left: 0; top: 0; width: 430px; height: 932px; pointer-events: none; }
#fx > * { position: absolute; left: 0; top: 0; }
.finger { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #fff 0 42%, #efe6ff 78%); border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink), 0 12px 22px rgba(12, 2, 36, .45); }
.ripple { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; }
.dealcard { width: 78px; height: 50px; margin: -25px 0 0 -39px; border-radius: 12px; border: 2.5px solid var(--ink);
  background: var(--cream); box-shadow: 0 3px 0 var(--ink); }
.dealcard.is-pink { background: var(--pink); }
.dealcard i { position: absolute; left: 12px; right: 12px; height: 5px; border-radius: 2px; background: #1b0a3640; }
.dealcard.is-pink i { background: #ffffff8c; }
.dealcard i:nth-child(1) { top: 13px; } .dealcard i:nth-child(2) { top: 24px; right: 26px; }
.flyemoji { font-size: 34px; line-height: 1; margin: -17px 0 0 -17px; }
.coinfly { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2.5px solid var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, var(--yellow) 40%, var(--yellow-d) 100%); }
.sweatdrop { width: 14px; height: 20px; margin: -10px 0 0 -7px; }
.ghostbtn { box-sizing: border-box; }
.cta { position: absolute; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.cta .chip { height: 46px; padding: 0 20px; font-size: 21px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); border-width: 3px; }
.cta .chip svg { width: 22px; height: 22px; }
.facts { position: absolute; white-space: nowrap; }
/* ── S2: three stations made of the game's own parts (the answer screen's question card, the result's figure, plate,
   bubble and verdict sticker). Positions are station-local game px; a station is one 432×768 frame at zoom 1. ── */
.s2st, .s2ride { width: 432px; height: 768px; }
.s2st > *, .s2ride > * { position: absolute; }
.s2card { left: 20px; top: 172px; width: 392px; height: 176px; perspective: 1100px; }
.s2flip { position: absolute; inset: 0; transform-style: preserve-3d; }
.s2face { position: absolute; inset: 0; }
.s2face .answer__q { margin: 0; height: 100%; box-sizing: border-box; display: grid; align-content: center; padding: 24px 18px 18px; }
#phone .s2face .answer__q-text { font-size: 32px; line-height: 1.13; }
.s2face .answer__hint { font-size: 17px; top: -19px; }
.s2back .answer__q { background: var(--pink); color: #fff; }
.s2back .answer__q-mark i { color: #ffffff2e; }
.s2chipwrap { left: 0; width: 432px; top: 70px; text-align: center; }
.s2chip { height: 42px; padding: 0 18px; font-size: 20px; font-weight: 900; border-width: 3px; box-shadow: 0 4px 0 var(--ink); gap: 7px; }
.s2chip .num { display: inline-block; min-width: .6em; text-align: center; }
.s2label { left: 26px; top: 118px; }
.s2label .sticker { position: absolute; left: 0; top: 0; font-size: 22px; padding: 3px 14px 6px; }
.s2fig { left: 186px; top: 316px; width: 250px; height: 260px; isolation: isolate; }
.s2fig .result__rays { width: 360%; margin: -180% 0 0 -180%; top: 52%; }
.s2sq { position: absolute; inset: 0; transform-origin: 50% 100%; }
.s2sq > span { position: absolute; inset: 0; display: block; line-height: 0; }
.s2sq .avatar { width: 100% !important; height: 100% !important; }
.s2platewrap { left: 186px; width: 250px; top: 535px; text-align: center; }
.s2plate { font-size: 25px; padding: 2px 18px 6px; }
.s2bubwrap { right: 200px; top: 428px; }
.s2bub { transform-origin: 100% 55%; padding: 4px 22px 9px; border-radius: 22px; box-shadow: 0 5px 0 var(--ink); }
.s2bub .result__bubble-text { gap: 10px; white-space: nowrap; }
.s2bub .s2num { font-size: 76px; font-style: italic; line-height: 1; padding: 0 6px; }
#phone .s2bub .ans { font-size: 42px !important; gap: 10px; --beside: 0px; }
#phone .s2bub .ans .ans__text { overflow: visible; }
.s2bub .s2word { font-size: 42px; line-height: 1.1; }
.s2verdict { left: 176px; top: 360px; }
.s2verdict .sticker { box-shadow: 0 5px 0 var(--ink); border-radius: 16px; padding: 4px 18px 8px; font-size: 34px; }
.s2intro { left: 0; top: 0; width: 432px; }
.s2introrow { position: absolute; left: 30px; width: 404px; text-align: center; }
.s2intro .sticker { font-size: 23px; padding: 4px 15px 7px; }
body.hud #hud { display: block; }
#hud { display: none; position: absolute; left: 12px; top: 12px; z-index: 99; font: 700 28px/1.2 ui-monospace, monospace; color: #0f0;
  background: #000a; padding: 6px 10px; border-radius: 8px; direction: ltr; }
</style>
</head>
<body>
<div id="stage">
  <div id="ground"></div>
  <canvas id="dots" width="1080" height="1920"></canvas>
  <div id="cam"><div id="phone"></div></div>
  <canvas id="fxc" width="1080" height="1920"></canvas>
  <div id="grain"></div>
  <div id="hud"></div>
</div>
<script src="../../motion.js"></script>
<script src="../../vendor/chars.js"></script>
<script src="../../vendor/screens.js"></script>
<script src="screens.js"></script>
<script src="../kit.js"></script>
<script src="../endcard.js"></script>
<script src="film.js"></script>
</body>
</html>
