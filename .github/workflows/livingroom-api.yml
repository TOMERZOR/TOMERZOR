# Deploys the Living Room API (livingroom/server) to Cloudflare Workers and points the site at it.
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   required ("Edit Cloudflare Workers" template, already used by the other apps)
#   CLOUDFLARE_ACCOUNT_ID  only if the token reaches several accounts
#   ANTHROPIC_API_KEY      reads product pages with Claude (already set for ArsLate); without it, a simpler parser
#   TRIPO_API_KEY          AI 3D models from product photos (platform.tripo3d.ai); without it, items use shapes and photos
# Until the Cloudflare token exists, the workflow skips itself instead of failing.
name: Deploy Living Room API

on:
  workflow_dispatch:
  push:
    branches: [claude/playwright-mcp-add-8e6qct]
    paths: ["livingroom/server/**", ".github/workflows/livingroom-api.yml"]

concurrency:
  group: livingroom-api
  cancel-in-progress: false

permissions:
  contents: write # to save the API address in the site's config
  pages: write # to rebuild the site afterwards

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          [ -z "$ANTHROPIC_API_KEY" ] && echo "::warning::ANTHROPIC_API_KEY is not set: product pages are read without AI."
          [ -z "$TRIPO_API_KEY" ] && echo "::warning::TRIPO_API_KEY is not set: AI 3D models are off."
          true

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install and test
        if: steps.secrets.outputs.ready == 'true'
        working-directory: livingroom/server
        run: |
          npm ci
          npm test

      - name: Daily limit storage
        if: steps.secrets.outputs.ready == 'true'
        working-directory: livingroom/server
        run: node tools/ensure-kv.mjs

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: livingroom/server
        run: |
          npx wrangler deploy | tee deploy.log
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
          if [ -n "$TRIPO_API_KEY" ]; then printf '%s' "$TRIPO_API_KEY" | npx wrangler secret put TRIPO_API_KEY; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then echo "::error::Could not find the workers.dev address in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Living Room API is at $url"

      - name: Check the API answers
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | tee health.json | grep -q '"service":"livingroom"'; then exit 0; fi
            sleep 10
          done
          echo "::error::The API did not answer /api/health"; cat health.json; exit 1

      - name: Point the site at the API
        if: steps.secrets.outputs.ready == 'true'
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i -E "s|^(  api: )\"[^\"]*\",|\1\"$API_URL\",|" livingroom/js/config.js
          if git diff --quiet; then echo "The site already uses $API_URL"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Living Room: use the deployed API at $API_URL"
          git push
          # pushes made with the workflow token don't start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not start a Pages build; it runs on the next push."
