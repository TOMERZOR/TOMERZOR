<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>רצים בשוק · Shuk Rush</title>
<meta name="description" content="משחק ריצה תלת־ממדי בשוק מחנה יהודה: מתחמקים מסבא עם העגלה, מהנחמנים ומהספק עם הג׳ק, ואוספים מטבעות של 10 שקל.">
<meta name="theme-color" content="#0e2f73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="רצים בשוק · Shuk Rush">
<meta property="og:description" content="כמה רחוק תגיעו בשוק ביום שישי?">
<meta property="og:image" content="img/keyart.jpg">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="models/anims.glb" as="fetch" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Shuk Rush"></canvas>

<div id="ui">
  <!-- loading -->
  <section id="loading" class="screen show" aria-live="polite">
    <div class="keyart"></div>
    <div class="loading-inner">
      <div class="logo big"><img class="logo-plate" src="img/ui/logo_plate.webp" alt=""><span class="logo-top" data-t="titleTop"></span><span class="logo-main gt" data-t="title"></span></div>
      <div class="bar"><i id="load-bar"></i></div>
      <p id="load-tip" class="tip"></p>
      <button id="btn-enter" class="gbtn yellow big hidden" data-t="enter"></button>
    </div>
  </section>

  <!-- main menu -->
  <section id="menu" class="screen">
    <header class="topbar">
      <button class="rbtn" id="btn-settings" aria-label="settings"><img src="img/ui/rb_gear.webp" alt=""></button>
      <div class="capsule"><img src="img/ui/ico_trophy.webp" alt=""><b id="menu-best">0</b></div>
      <div class="capsule gold"><img src="img/ui/ico_coin.webp" alt=""><b id="menu-coins">0</b></div>
    </header>
    <div class="menu-title">
      <div class="logo"><img class="logo-plate" src="img/ui/logo_plate.webp" alt=""><span class="logo-top" data-t="titleTop"></span><span class="logo-main gt" data-t="title"></span></div>
    </div>
    <div class="menu-bottom">
      <button class="level-chip" id="btn-missions">
        <span class="lvl-num"><small data-t="level"></small><b id="menu-level">1</b></span>
        <span class="lvl-info"><span class="lvl-bar"><i id="menu-mprog"></i></span><span id="menu-mtext" class="lvl-text"></span></span>
        <span class="lvl-mult">×<b id="menu-mult">1</b></span>
      </button>
      <div class="char-ribbon"><b id="menu-char"></b><span id="menu-char-title"></span></div>
      <button id="btn-play" class="gbtn yellow huge pulse" data-t="play"></button>
      <p class="swipe-note" data-t="swipeNote"></p>
      <nav class="menu-nav">
        <button class="tile" id="btn-chars"><img src="img/ui/ico_chars.webp" alt=""><span data-t="charsTitle"></span></button>
        <button class="tile" id="btn-upgrades"><img src="img/ui/ico_upgrades.webp" alt=""><span data-t="upgrades"></span></button>
        <button class="tile" id="btn-missions2"><img src="img/ui/ico_missions.webp" alt=""><span data-t="missions"></span></button>
      </nav>
    </div>
  </section>

  <!-- in-run HUD -->
  <section id="hud" class="screen">
    <div class="hud-top">
      <div class="hud-score">
        <b id="hud-score" class="gt num" data-text="0">0</b>
        <div class="hud-sub">
          <span class="capsule gold small"><img src="img/ui/ico_coin.webp" alt=""><b id="hud-coins">0</b></span>
          <span class="mult-badge" id="hud-mult">×1</span>
        </div>
        <div class="hud-dist"><b id="hud-dist">0</b> <span data-t="meters"></span></div>
      </div>
      <button class="rbtn" id="btn-pause" aria-label="pause"><img src="img/ui/rb_pause.webp" alt=""></button>
    </div>
    <div id="powers" class="powers"></div>
    <div id="zone-banner" class="zone-banner"><b class="gt"></b><span></span></div>
    <div id="toasts" class="toasts"></div>
    <div id="hint" class="hint"><div class="hint-hand"></div><b class="hint-text"></b></div>
  </section>

  <!-- pause -->
  <section id="pause" class="screen modal">
    <div class="panel">
      <div class="awning"></div>
      <h2 class="panel-title gt" data-t="pause"></h2>
      <p class="muted" data-t="pauseSub"></p>
      <button class="gbtn yellow big" id="btn-resume" data-t="resume"></button>
      <div class="row">
        <button class="gbtn teal" id="btn-restart" data-t="restart"></button>
        <button class="gbtn teal" id="btn-home" data-t="home"></button>
      </div>
      <div class="toggles" data-toggles></div>
    </div>
  </section>

  <!-- revive -->
  <section id="revive" class="screen modal">
    <div class="panel">
      <div class="awning"></div>
      <h2 class="panel-title gt" data-t="reviveTitle"></h2>
      <div class="revive-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="track"/><circle cx="50" cy="50" r="44" class="prog" id="revive-prog"/></svg><img src="img/ui/ico_hamsa.webp" alt=""><b id="revive-count" class="gt">5</b></div>
      <button class="gbtn yellow big" id="btn-revive"><span data-t="reviveBtn"></span><img class="ico" src="img/ui/ico_coin.webp" alt=""><b id="revive-cost">0</b></button>
      <button class="link" id="btn-norevive" data-t="noThanks"></button>
    </div>
  </section>

  <!-- game over -->
  <section id="over" class="screen modal">
    <div class="panel over-panel">
      <div class="awning"></div>
      <h2 class="panel-title gt" data-t="overTitle"></h2>
      <div class="over-cause" id="over-cause"></div>
      <div class="newbest hidden" id="over-newbest" data-t="newBest"></div>
      <div class="over-score gt num" id="over-score" data-text="0">0</div>
      <div class="over-stats">
        <div><img src="img/ui/ico_trophy.webp" alt=""><span data-t="best"></span><b id="over-best">0</b></div>
        <div><img src="img/ui/ico_coin.webp" alt=""><span data-t="earned"></span><b id="over-earned">0</b></div>
        <div><img src="img/ui/ico_sneakers.webp" alt=""><span data-t="dist"></span><b id="over-dist">0</b></div>
      </div>
      <div class="over-missions" id="over-missions"></div>
      <div class="levelup hidden" id="over-levelup"></div>
      <button class="gbtn yellow big" id="btn-again" data-t="again"></button>
      <div class="row">
        <button class="gbtn teal" id="btn-over-home" data-t="home"></button>
        <button class="gbtn red" id="btn-over-shop" data-t="shop"></button>
      </div>
    </div>
  </section>

  <!-- characters -->
  <section id="chars" class="screen sheet">
    <header class="sheet-head">
      <button class="rbtn" data-close aria-label="close"><img src="img/ui/rb_close.webp" alt=""></button>
      <h2 class="gt" data-t="charsTitle"></h2>
      <div class="capsule gold"><img src="img/ui/ico_coin.webp" alt=""><b data-coins>0</b></div>
    </header>
    <div class="char-picker">
      <button class="arrow" id="char-prev" aria-label="previous"></button>
      <div class="panel char-panel">
        <div class="char-loading hidden" id="char-loading" data-t="loading"></div>
        <h3 id="char-name" class="gt"></h3>
        <p class="char-title" id="char-title"></p>
        <p class="char-bio" id="char-bio"></p>
        <div class="char-dots" id="char-dots"></div>
        <button class="gbtn yellow big" id="char-action"></button>
      </div>
      <button class="arrow next" id="char-next" aria-label="next"></button>
    </div>
  </section>

  <!-- upgrades -->
  <section id="upgrades" class="screen sheet dim">
    <header class="sheet-head">
      <button class="rbtn" data-close aria-label="close"><img src="img/ui/rb_close.webp" alt=""></button>
      <h2 class="gt" data-t="upgrades"></h2>
      <div class="capsule gold"><img src="img/ui/ico_coin.webp" alt=""><b data-coins>0</b></div>
    </header>
    <div class="list" id="upgrade-list"></div>
  </section>

  <!-- missions -->
  <section id="missions" class="screen sheet dim">
    <header class="sheet-head">
      <button class="rbtn" data-close aria-label="close"><img src="img/ui/rb_close.webp" alt=""></button>
      <h2 class="gt" data-t="missions"></h2>
      <div class="capsule gold"><img src="img/ui/ico_coin.webp" alt=""><b data-coins>0</b></div>
    </header>
    <div class="list">
      <div class="panel mis-head">
        <img src="img/ui/ico_missions.webp" alt="">
        <div><div class="big-level gt"><span data-t="level"></span> <span id="mis-level">1</span></div><p id="mis-explain"></p></div>
      </div>
      <div id="mission-list" class="mission-list"></div>
    </div>
  </section>

  <!-- settings -->
  <section id="settings" class="screen sheet dim">
    <header class="sheet-head">
      <button class="rbtn" data-close aria-label="close"><img src="img/ui/rb_close.webp" alt=""></button>
      <h2 class="gt" data-t="settings"></h2>
      <span></span>
    </header>
    <div class="list">
      <div class="panel settings-panel">
        <div class="toggles" data-toggles></div>
        <div class="setting-row"><span data-t="quality"></span>
          <div class="seg" id="quality-seg"><button data-q="high" data-t="qHigh"></button><button data-q="auto" data-t="qAuto"></button><button data-q="low" data-t="qLow"></button></div>
        </div>
        <div class="setting-row"><span data-t="language"></span>
          <div class="seg" id="lang-seg"><button data-l="he">עברית</button><button data-l="en">English</button></div>
        </div>
      </div>
      <div class="panel howto">
        <h3 class="gt" data-t="howTitle"></h3>
        <p data-t="how1"></p><p data-t="how2"></p><p data-t="how3"></p>
      </div>
      <button class="link danger" id="btn-reset" data-t="reset"></button>
      <p class="credits" data-t="credits"></p>
    </div>
  </section>

  <div id="confirm" class="screen modal">
    <div class="panel"><div class="awning"></div><h2 class="panel-title gt" id="confirm-text"></h2><div class="row"><button class="gbtn red" id="confirm-yes" data-t="yes"></button><button class="gbtn teal" id="confirm-no" data-t="cancel"></button></div></div>
  </div>
  <div id="rotate-note" class="rotate-note" data-t="rotate"></div>
</div>

<noscript><p style="padding:2em;font-family:sans-serif">Shuk Rush needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
