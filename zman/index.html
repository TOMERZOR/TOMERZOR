<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>זמן</title>
<meta name="description" content="מפת לוויין של כל העולם עם סרגל זמן: צילומים אמיתיים מ־2014 ועד היום, ושחזור משוער של איך המקום נראה עד 12,000 שנה אחורה.">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="זמן">
<meta property="og:description" content="גוללים בזמן מעל כל מקום בעולם: צילומי לוויין מ־2014 ועד היום, ושחזור משוער עד 10,000 לפנה״ס.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230b0d10'/><path d='M14 40h36' stroke='%23f3f1ec' stroke-width='3' stroke-linecap='round'/><path d='M38 22v26' stroke='%2393c9ff' stroke-width='4' stroke-linecap='round'/></svg>">
<link rel="preload" href="fonts/geist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="מפת לוויין"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="hud" id="hud" data-mode="real">
  <div class="readout" aria-live="polite">
    <div class="year"><span class="year__num" id="yearNum"></span><span class="year__era" id="yearEra"></span></div>
    <div class="caption" id="captionRow"><span class="caption__mark" aria-hidden="true"></span><span id="caption"></span></div>
  </div>

  <div class="scrubber" id="scrubber" dir="ltr" role="slider" tabindex="0"
       aria-label="שנה" aria-valuemin="0" aria-valuemax="1000" aria-orientation="horizontal">
    <div class="track" id="track">
      <svg class="ruler" id="ruler" viewBox="0 0 1000 24" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="loading" aria-hidden="true"><span></span></div>
      <div class="playhead" id="playhead" aria-hidden="true"><span class="playhead__line"></span><span class="playhead__knob"></span></div>
      <div class="labels" id="labels"></div>
    </div>
  </div>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
