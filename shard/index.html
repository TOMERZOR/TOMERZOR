<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FBF5EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="SHARD: aim, fire, and watch glass explode. A satisfying physics smasher.">
  <title>SHARD</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage" aria-label="Game"></canvas>

  <!-- HOME -->
  <section id="home" class="screen" aria-label="Home">
    <header class="topbar">
      <div class="topleft">
        <div class="pill" id="home-stars"><svg><use href="#i-star"/></svg><span>0</span></div>
        <button class="gembtn" id="btn-crystal" aria-label="Star crystal">
          <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15.5"/><circle class="fill" cx="18" cy="18" r="15.5"/></svg>
          <svg class="ico" aria-hidden="true"><use href="#i-gem"/></svg>
        </button>
      </div>
      <div class="pill" id="home-coins"><svg><use href="#i-coin"/></svg><span>0</span></div>
    </header>
    <div class="brand">
      <h1 class="logo" aria-label="SHARD"><span>S</span><span>H</span><span>A</span><span>R</span><span>D</span></h1>
      <p class="tagline">Aim. Fire. Shatter.</p>
    </div>
    <div class="home-bottom">
      <button class="daily-card" id="btn-daily">
        <span class="daily-icon"><svg><use href="#i-cal"/></svg></span>
        <span class="daily-text"><b>Daily Smash</b><small id="daily-sub">A new puzzle every day</small></span>
        <span class="daily-badge" id="daily-badge">NEW</span>
      </button>
      <button class="btn primary big" id="btn-play"><svg><use href="#i-play"/></svg><span id="play-label">Play</span></button>
      <nav class="home-nav">
        <button class="navbtn" id="btn-levels"><svg><use href="#i-grid"/></svg><span>Levels</span></button>
        <button class="navbtn" id="btn-shop"><svg><use href="#i-ball"/></svg><span>Balls</span></button>
        <button class="navbtn" id="btn-store"><svg><use href="#i-bag"/></svg><span>Store</span></button>
        <button class="navbtn" id="btn-settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
      </nav>
    </div>
  </section>

  <!-- a new world announces itself once -->
  <div class="worldcard" id="worldcard" aria-hidden="true"><small></small><b></b><span></span></div>

  <!-- HUD -->
  <section id="hud" class="screen" aria-label="Game controls">
    <div class="hud-top">
      <button class="iconbtn" id="btn-pause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <div class="hud-title">
        <div class="hud-level" id="hud-level">Level 1</div>
        <div class="hud-glass" id="hud-glass" aria-live="polite"></div>
      </div>
      <button class="iconbtn" id="btn-hint" aria-label="Hint"><svg><use href="#i-bulb"/></svg><span class="badge" id="hint-badge">1</span></button>
    </div>
    <div class="coach" id="coach" hidden>
      <div class="coach-track" aria-hidden="true"><span class="coach-arrow"></span><span class="coach-line"></span><span class="coach-dot"></span></div>
      <p id="coach-text">Pull back anywhere, then release</p>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="screen page" aria-label="Levels">
    <header class="pagebar">
      <button class="iconbtn" data-back aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2>Levels</h2>
      <div class="pill" id="levels-stars"><svg><use href="#i-star"/></svg><span>0</span></div>
    </header>
    <div class="world-tabs" id="world-tabs" role="tablist"></div>
    <div class="world-head" id="world-head"></div>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- SHOP (balls) -->
  <section id="shop" class="screen page" aria-label="Balls">
    <header class="pagebar">
      <button class="iconbtn" data-back aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2>Balls</h2>
      <div class="pill" id="shop-coins"><svg><use href="#i-coin"/></svg><span>0</span></div>
    </header>
    <div class="ball-preview"><canvas id="ball-preview" width="240" height="240"></canvas><div class="ball-name" id="ball-name">Steel</div></div>
    <div class="skin-grid" id="skin-grid"></div>
  </section>

  <!-- STORE (IAP) -->
  <section id="store" class="screen page" aria-label="Store">
    <header class="pagebar">
      <button class="iconbtn" data-back aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2>Store</h2>
      <div class="pill" id="store-coins"><svg><use href="#i-coin"/></svg><span>0</span></div>
    </header>
    <div class="store-list" id="store-list"></div>
    <button class="linkbtn" id="btn-restore">Restore purchases</button>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="screen page" aria-label="Settings">
    <header class="pagebar">
      <button class="iconbtn" data-back aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2>Settings</h2>
      <div style="width:44px"></div>
    </header>
    <div class="list">
      <label class="row"><span>Sound effects</span><input type="checkbox" class="toggle" data-setting="sfx"></label>
      <label class="row"><span>Music</span><input type="checkbox" class="toggle" data-setting="music"></label>
      <label class="row"><span>Haptics</span><input type="checkbox" class="toggle" data-setting="haptics"></label>
      <label class="row" id="row-reminders" hidden><span>Daily reminder</span><input type="checkbox" class="toggle" id="set-reminders"></label>
    </div>
    <div class="list">
      <button class="row" id="btn-restore2"><span>Restore purchases</span><svg><use href="#i-chev"/></svg></button>
      <a class="row" href="privacy.html" target="_blank" rel="noopener"><span>Privacy policy</span><svg><use href="#i-chev"/></svg></a>
      <a class="row" href="terms.html" target="_blank" rel="noopener"><span>Terms of use</span><svg><use href="#i-chev"/></svg></a>
      <button class="row" id="btn-reset"><span class="danger">Reset progress</span><svg><use href="#i-chev"/></svg></button>
    </div>
    <p class="fineprint" id="version">SHARD 1.0</p>
  </section>

  <!-- SHEETS -->
  <div id="scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- ICONS -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2 6.2 20.4l1.2-6.5L2.6 9.4l6.5-.8z" fill="currentColor"/></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 7.5l1.6 3 3.4.5-2.5 2.3.6 3.3L12 15l-3.1 1.6.6-3.3L7 11l3.4-.5z" fill="#fff" opacity=".9"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M12 3a6.5 6.5 0 0 0-3.9 11.7c.6.5.9 1.1.9 1.8V17h6v-.5c0-.7.3-1.3.9-1.8A6.5 6.5 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 20.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></g></symbol>
      <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/><ellipse cx="9.2" cy="8.8" rx="2.6" ry="1.6" fill="#fff" opacity=".6" transform="rotate(-35 9.2 8.8)"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="currentColor"/><path d="M9 8V7a3 3 0 0 1 6 0v1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 0 1-1.7 1l-.3 2h-4l-.3-2a7 7 0 0 1-1.7-1l-1.9.7-2-3.4 1.6-1.2a7 7 0 0 1 0-2L3.2 9.3l2-3.4 1.9.7a7 7 0 0 1 1.7-1l.3-2h4l.3 2a7 7 0 0 1 1.7 1l1.9-.7 2 3.4-1.6 1.2a7 7 0 0 1 0 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.8" fill="currentColor"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="10" rx="2.5" fill="currentColor"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M5 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3" fill="currentColor"/><path d="M17 10.5l4-2.5v8l-4-2.5z" fill="currentColor"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.8 3.2 4.8 5.3 4.8 10.2A4.8 4.8 0 0 1 12 17.5a4.8 4.8 0 0 1-4.8-4.8c0-2 1-3.4 2.1-4.6.3 1.4 1 2.3 1.9 2.7.2-3.2.1-5.6.8-8.3zM7 18.5h10v2H7z" fill="currentColor"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-noads" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="15.2" text-anchor="middle" font-size="7.5" font-weight="900" font-family="system-ui, sans-serif" fill="currentColor">AD</text><path d="M4 20L20 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7.4 4h9.2l4.6 5.3L12 20.6 2.8 9.3z" fill="currentColor"/><path d="M2.8 9.3h18.4M7.4 4 9.9 9.3 12 20.6 14.1 9.3 16.6 4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
