<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tokef · המצגת</title>
<link rel="icon" href="../media/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Rubik:wght@400..800&display=swap">
<style>
:root{--ink:#1A1916;--paper:#F2EEE6;--soft:#A8A194;--line:#3A3833;--accent:#E2581F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:'Rubik',system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,3vw,32px)}
.mark{font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--paper);text-decoration:none;direction:ltr}
.mark b{color:var(--accent)}
header nav{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);color:var(--paper);text-decoration:none;font-size:15px;font-weight:500;background:transparent;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--soft)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#1A1916;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 clamp(16px,3vw,32px) 16px;min-height:0}
.stage{position:relative;width:min(100%,calc((100vh - 170px) * 16 / 9));aspect-ratio:16/9;background:#0E0D0B;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(242,238,230,.08),0 30px 80px rgba(0,0,0,.45)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.bar{display:flex;align-items:center;gap:14px;direction:ltr}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--paper);font-size:22px;cursor:pointer;display:grid;place-items:center}
.nav:hover:not(:disabled){border-color:var(--soft)}
.nav:disabled{opacity:.3;cursor:default}
.count{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--soft);min-width:72px;text-align:center}
.hint{font-size:13px;color:#6E685E}
@media (max-width:640px){header{flex-direction:column;align-items:flex-start}.hint{display:none}}
</style>
</head>
<body>
<header>
  <a class="mark" href="../">Tokef<b>.</b></a>
  <nav>
    <a class="btn" href="Tokef-deck.pdf" download>הורדת המצגת (PDF)</a>
    <a class="btn solid" href="../app/">לנסות את האפליקציה</a>
  </nav>
</header>
<main>
  <div class="stage"><img id="slide" src="slides/01.jpg" alt=""></div>
  <div class="bar">
    <button class="nav" id="prev" aria-label="השקף הקודם">‹</button>
    <span class="count" id="count">1 / 19</span>
    <button class="nav" id="next" aria-label="השקף הבא">›</button>
  </div>
  <p class="hint">אפשר לדפדף עם החצים במקלדת או בהחלקה</p>
</main>
<script>
const ALTS = ["47","47 עובדים נהרגו באתרי בנייה בישראל ב-2025","07:40 — קבלן הטפסנות עולה לקומה 9, ואישור הביטוח שלו פג לפני 19 יום","ובמשרד, מישהו צריך לבדוק עשרות אישורים כאלה","האחריות נשארת אצל הקבלן הראשי, ולכן הבדיקה היא חובה","כך נבדק אישור ביטוח היום","Tokef — מעקב אוטומטי אחרי אישורי קיום ביטוחים של קבלני משנה","Tokef בודקת שלכל מי שעובד באתר בנייה יש ביטוח תקין, לפני שקורה משהו","Tokef קורא את האישור ומשווה אותו לחוזה","ה-MVP כבר בנוי ועובד","השינויים שמאפשרים את זה דווקא עכשיו","הלקוחות: מי שמעסיק קבלני משנה ונושא באחריות","לא מצאנו כלי שבודק אישור ישראלי מול החוזה","מה מבדיל אותנו","תמחור לפי קבלן משנה פעיל, בכל חודש","מה כבר עשינו, ומה הלאה","מי בונה את Tokef","מה אנחנו מבקשים: 3 מיליון ₪ ל-18 חודשים","Tokef. כל קבלן משנה באתר: מבוטח, מאושר ובתוקף"];
const N = ALTS.length, img = document.getElementById('slide'), count = document.getElementById('count');
const prev = document.getElementById('prev'), next = document.getElementById('next');
const src = (i) => 'slides/' + String(i + 1).padStart(2, '0') + '.jpg';
let i = Math.min(N - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function show(k) {
  i = Math.min(N - 1, Math.max(0, k));
  img.src = src(i); img.alt = ALTS[i];
  count.textContent = (i + 1) + ' / ' + N;
  prev.disabled = i === 0; next.disabled = i === N - 1;
  history.replaceState(null, '', '#' + (i + 1));
  [i + 1, i + 2].filter((j) => j < N).forEach((j) => { new Image().src = src(j); });
}
prev.onclick = () => show(i - 1);
next.onclick = () => show(i + 1);
document.addEventListener('keydown', (e) => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(i + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(N - 1);
});
let x0 = null;
img.parentElement.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
img.parentElement.addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
});
show(i);
</script>
</body>
</html>
