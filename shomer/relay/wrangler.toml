# Shomer relay on Cloudflare Workers: the camera-phone link and push forwarding. Deploy with the GitHub workflow
# (.github/workflows/shomer-push.yml) or `npx wrangler deploy` from this folder.
name = "shomer-push"
main = "worker.js"
compatibility_date = "2026-10-01"

# One Durable Object per camera: the room that connects it with its phone(s).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
