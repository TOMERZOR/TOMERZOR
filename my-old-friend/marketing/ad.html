<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מופי – מודעה לעיתון</title>
<style>
  /* Print ad, 165 x 250 mm (about a quarter page in a broadsheet daily). Same look as the app:
     white paper, Moffy pink, the deeper pink base under pressable things, Rubik. */
  @font-face { font-family: Rubik; font-weight: 500; src: url(fonts/rubik-hebrew-500-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Rubik; font-weight: 700; src: url(fonts/rubik-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Rubik; font-weight: 800; src: url(fonts/rubik-hebrew-800-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Rubik; font-weight: 500; src: url(fonts/rubik-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Rubik; font-weight: 700; src: url(fonts/rubik-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Rubik; font-weight: 800; src: url(fonts/rubik-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @page { size: 165mm 250mm; margin: 0; }
  :root { --ink: #1d1a1c; --ink-2: #5f575c; --pink: #d6336f; --pink-deep: #a82157; --moffy: #ec6c9c; --moffy-deep: #b8336a; --blush: #fbf1f5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 165mm; height: 250mm; background: #fff; }
  body { font-family: Rubik, "DejaVu Sans", sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ad { position: relative; width: 165mm; height: 250mm; padding: 13mm 12mm 9mm; display: flex; flex-direction: column; align-items: center; }
  .ad::before { content: ""; position: absolute; inset: 4mm; border: 0.9mm solid var(--pink); border-radius: 7mm; }

  h1 { font-size: 14.5mm; font-weight: 800; line-height: 1.12; text-align: center; letter-spacing: -0.2mm; text-wrap: balance; }
  h1 .ai { color: var(--pink); }

  .moffy { position: relative; width: 68mm; height: 68mm; margin: 15mm 0 13mm; }
  .moffy .body { position: absolute; inset: 0; border-radius: 30%; background: linear-gradient(180deg, #f283ad, var(--moffy)); box-shadow: 0 4.6mm 0 var(--moffy-deep); }
  .moffy .shine { position: absolute; left: 14%; right: 14%; top: 7%; height: 7%; border-radius: 99px; background: rgba(255, 255, 255, 0.38); }
  /* Eyes glance down toward the QR code. */
  .moffy .eye { position: absolute; top: 34%; width: 13%; height: 36%; border-radius: 99px; background: #fff; }
  .moffy .eye.l { left: 27%; } .moffy .eye.r { right: 33%; }
  .floor { position: absolute; left: 10%; right: 10%; bottom: -9mm; height: 4mm; border-radius: 50%; background: rgba(184, 51, 106, 0.16); }

  .band { width: 100%; margin-top: auto; background: var(--blush); border-radius: 6mm; padding: 7mm 7mm 7mm 6mm; display: flex; align-items: center; gap: 7mm; }
  .pitch { flex: 1; font-size: 9.6mm; line-height: 1.22; font-weight: 700; text-wrap: balance; }
  .pitch b { color: var(--pink); font-weight: 800; }
  .try { width: 56mm; display: flex; flex-direction: column; align-items: center; gap: 2.2mm; }
  .try .label { font-size: 7.6mm; font-weight: 800; color: var(--pink); }
  .try .qr { width: 46mm; height: 46mm; background: #fff; border-radius: 4mm; padding: 3.2mm; box-shadow: 0 1.4mm 0 var(--pink-deep), 0 0 0 0.7mm var(--pink); }
  .try .qr img { width: 100%; height: 100%; display: block; }
  .try .hint { white-space: nowrap; font-size: 3.3mm; font-weight: 500; color: var(--ink-2); text-align: center; line-height: 1.3; }

  .brand { margin-top: 5mm; font-size: 4.4mm; font-weight: 700; color: var(--ink-2); letter-spacing: 0.1mm; }
  .brand span { direction: ltr; unicode-bidi: isolate; color: var(--ink); }
</style>
</head>
<body>
  <div class="ad">
    <h1>לא מבינים על מה כל המהומה של הצעירים על ה&#8209;<span class="ai">AI</span>?</h1>
    <div class="moffy"><div class="body"></div><div class="shine"></div><div class="eye l"></div><div class="eye r"></div><div class="floor"></div></div>
    <div class="band">
      <p class="pitch"><b>מופי,</b> עוזרת בינה מלאכותית שבאמת קל להבין.</p>
      <div class="try">
        <div class="label">נסו בעצמכם!</div>
        <div class="qr"><img src="qr-go.svg" alt="QR"></div>
        <div class="hint">מכוונים את מצלמת הטלפון אל הריבוע</div>
      </div>
    </div>
    <div class="brand"><span>My Old Friend</span> · החבר הוותיק שלי</div>
  </div>
</body>
</html>
