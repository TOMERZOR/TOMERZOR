<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Heebo"; font-weight: 500; src: url("assets/fonts/heebo-hebrew-500-normal.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 500; src: url("assets/fonts/heebo-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("assets/fonts/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("assets/fonts/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-hebrew-900-normal.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }

      :root {
        --ink: #0d0e12;
        --glass: rgba(13, 14, 18, 0.86);
        --paper: #f6f4ef;
        --accent: #ffd23f;
        --hot: #ff6b5e;
        --cool: #4fc3f7;
        --claude: #d97757;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Heebo", sans-serif; }

      /* ---------- footage ---------- */
      #cam { position: absolute; inset: 0; transform-origin: 50% 30%; }
      #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #swiss-wrap { position: absolute; inset: 0; opacity: 0; }
      #swiss-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

      /* ---------- captions ---------- */
      #captions { position: absolute; left: 70px; right: 70px; top: 1240px; height: 150px; }
      .cap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-wrap: wrap; gap: 0 38px; direction: rtl; opacity: 0;
      }
      .cap .w {
        display: inline-block; font-weight: 900; font-size: 84px; line-height: 1.12; color: #fff;
        -webkit-text-stroke: 14px #000; paint-order: stroke fill;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      }
      .cap .w.latin { direction: ltr; letter-spacing: -0.01em; }

      /* ---------- Claude Code badge ---------- */
      #badge {
        position: absolute; top: 120px; left: 0; right: 0; display: flex; justify-content: center;
      }
      #badge .pill {
        display: flex; align-items: center; gap: 20px; padding: 18px 36px 18px 28px;
        background: var(--paper); border-radius: 999px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        direction: ltr;
      }
      #badge svg { width: 64px; height: 64px; display: block; }
      #badge span { font-weight: 900; font-size: 56px; color: var(--ink); letter-spacing: -0.02em; }

      /* ---------- explainer card ---------- */
      #card {
        position: absolute; left: 50px; right: 50px; top: 1200px; height: 470px;
        background: var(--glass); border-radius: 44px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.08);
      }
      #card-title {
        position: absolute; left: 0; right: 0; top: 0; height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; direction: rtl; transform-origin: 50% 0%;
      }
      #card-title .he { font-weight: 900; font-size: 100px; color: var(--accent); line-height: 1; }
      #card-title .en { font-weight: 700; font-size: 40px; color: rgba(255, 255, 255, 0.6); margin-top: 18px; direction: ltr; letter-spacing: 0.08em; }

      #chart { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
      #chart svg { position: absolute; left: 0; top: 0; width: 980px; height: 470px; overflow: visible; }
      .lbl { font-family: "Heebo", sans-serif; font-weight: 700; fill: #fff; }
      .axis { stroke: rgba(255, 255, 255, 0.55); stroke-width: 4; fill: none; stroke-linecap: round; }
      #curve { stroke: var(--accent); stroke-width: 9; fill: none; stroke-linecap: round; }
      .guide { stroke: var(--hot); stroke-width: 4; stroke-dasharray: 12 10; fill: none; }

      #bubble {
        position: absolute; right: 40px; top: 30px; padding: 16px 28px; background: var(--paper); color: var(--ink);
        border-radius: 28px; font-weight: 900; font-size: 44px; direction: rtl; white-space: nowrap;
      }

      #compare { position: absolute; inset: 0; display: flex; direction: rtl; padding: 44px 50px; gap: 50px; }
      .col { flex: 1; display: flex; flex-direction: column; gap: 22px; }
      .col h3 { font-weight: 900; font-size: 64px; line-height: 1; display: flex; align-items: center; gap: 18px; }
      .col.novice h3 { color: var(--hot); }
      .col.expert h3 { color: var(--cool); }
      .tag {
        display: inline-block; font-size: 34px; font-weight: 900; padding: 6px 18px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.12); color: #fff;
      }
      .meter { display: flex; flex-direction: column; gap: 10px; }
      .meter .name { font-weight: 700; font-size: 38px; color: rgba(255, 255, 255, 0.8); }
      .meter .track { position: relative; width: 100%; height: 40px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .meter .fill { position: absolute; top: 0; right: 0; height: 100%; width: 100%; border-radius: 20px; transform-origin: 100% 50%; }
      .novice .fill { background: var(--hot); }
      .expert .fill { background: var(--cool); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32.9" data-width="1080" data-height="1920">
      <!-- Footage: one source, nine hard-cut ranges (silences, filler and side-instructions removed) -->
      <div id="cam">
        <video id="s1" src="assets/source.mp4" data-start="0" data-duration="5.38" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s2" src="assets/source.mp4" data-start="5.38" data-duration="5.18" data-media-start="6.92" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s3" src="assets/source.mp4" data-start="10.56" data-duration="2.65" data-media-start="12.45" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s4" src="assets/source.mp4" data-start="13.21" data-duration="2.29" data-media-start="35.5" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s5" src="assets/source.mp4" data-start="15.51" data-duration="0.68" data-media-start="38.5" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s6" src="assets/source.mp4" data-start="16.19" data-duration="2.02" data-media-start="39.72" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s7" src="assets/source.mp4" data-start="18.22" data-duration="3.9" data-media-start="42.05" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s8" src="assets/source.mp4" data-start="22.12" data-duration="6.13" data-media-start="46.42" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="s9" src="assets/source.mp4" data-start="28.25" data-duration="4.65" data-media-start="53.75" data-track-index="0" playsinline data-has-audio="true"></video>
      </div>

      <!-- AI edit (Swiss Alps + companion) laid over segment 2, picture only; the voice stays on s2 -->
      <div id="swiss-wrap">
        <video id="swiss" src="assets/swiss.mp4" data-start="5.38" data-duration="5.04" data-media-start="0" data-track-index="1" playsinline muted></video>
      </div>
      <div id="flash"></div>

      <!-- Claude Code badge -->
      <div id="badge" class="clip" data-start="2.0" data-duration="3.4" data-track-index="3">
        <div class="pill">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <g fill="#d97757" transform="translate(32 32)">
              <rect x="-4" y="-28" width="8" height="24" rx="4" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(45)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(90)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(135)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(180)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(225)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(270)" />
              <rect x="-4" y="-28" width="8" height="24" rx="4" transform="rotate(315)" />
            </g>
          </svg>
          <span>Claude Code</span>
        </div>
      </div>

      <!-- Dunning–Kruger explainer card -->
      <div id="card" class="clip" data-start="11.9" data-duration="21.0" data-track-index="4">
        <div id="card-title">
          <div class="he">אפקט דאנינג-קרוגר</div>
          <div class="en">DUNNING–KRUGER EFFECT</div>
        </div>

        <div id="chart">
          <svg viewBox="0 0 980 470">
            <!-- axes -->
            <path id="ax-y" class="axis" d="M90 50 L90 400" />
            <path id="ax-x" class="axis" d="M90 400 L930 400" />
            <text id="lbl-y" class="lbl" x="70" y="40" font-size="34" text-anchor="start" fill-opacity="0.8">ביטחון ↑</text>
            <text id="lbl-x" class="lbl" x="930" y="448" font-size="34" text-anchor="end" fill-opacity="0.8">ידע וניסיון →</text>

            <!-- guides at the peak -->
            <path id="g-h" class="guide" d="M90 92 L210 92" />
            <path id="g-v" class="guide" d="M210 92 L210 400" />
            <text id="g-conf" class="lbl" x="230" y="110" font-size="34" text-anchor="start" fill="#ff5a4e">ביטחון: 100%</text>
            <text id="g-know" class="lbl" x="230" y="385" font-size="34" text-anchor="start" fill="#ff5a4e">ידע: כמעט 0</text>

            <!-- the curve -->
            <path id="curve" d="M105 392 C150 250 170 92 210 92 C265 92 300 350 420 350 C600 350 740 190 905 150" />

            <!-- stage labels -->
            <text id="lbl-peak" class="lbl" x="250" y="62" font-size="40" text-anchor="start" fill="#ffd23f">פסגת הטיפשות</text>
            <text id="lbl-valley" class="lbl" x="420" y="320" font-size="34" text-anchor="middle" fill-opacity="0.75">עמק הייאוש</text>
            <text id="lbl-expert" class="lbl" x="905" y="215" font-size="40" text-anchor="end" fill="#4fc3f7">מומחה</text>

            <circle id="dot" r="20" cx="0" cy="0" fill="#fff" stroke="#ffd23f" stroke-width="8" />
          </svg>
          <div id="bubble">״אני לא יודע כלום בזה״</div>
        </div>

        <div id="compare">
          <div class="col novice">
            <h3>בור <span class="tag" id="tag-novice">בטוח בעצמו</span></h3>
            <div class="meter"><div class="name">ביטחון</div><div class="track"><div class="fill" id="nv-conf"></div></div></div>
            <div class="meter"><div class="name">ידע</div><div class="track"><div class="fill" id="nv-know"></div></div></div>
          </div>
          <div class="col expert">
            <h3>מומחה <span class="tag" id="tag-expert">צנוע</span></h3>
            <div class="meter"><div class="name">ביטחון</div><div class="track"><div class="fill" id="ex-conf"></div></div></div>
            <div class="meter"><div class="name">ידע</div><div class="track"><div class="fill" id="ex-know"></div></div></div>
          </div>
        </div>
      </div>

      <!-- Captions: one page at a time, word-synced to the cut timeline -->
      <div id="captions"></div>
    </div>

    <script>
      // [text, start, end, highlight?] on the edited timeline. Pages break on phrases, 1-4 words each.
      const PAGES = [
        [["אז",0.0,0.24],["אני",0.24,0.4],["עכשיו",0.4,0.78],["פה",0.78,1.06]],
        [["עורך",1.06,1.5],["סרטון",1.5,1.96],["עם",1.96,2.12]],
        [["Claude Code",2.12,2.66,1]],
        [["כמו",2.8,3.2],["שאתם",3.2,3.4],["רואים",3.4,3.56],["פה",3.56,3.72]],
        [["על",3.72,3.86],["היד",3.86,4.0],["שלי",4.0,4.22]],
        [["יש",4.22,4.42],["את",4.42,4.52],["הלוגו",4.52,4.72,1]],
        [["של",4.72,4.9],["Claude",4.9,5.32,1]],
        [["משמאלי",5.42,6.02],["אני",6.02,6.16],["רוצה",6.16,6.44]],
        [["שתוסיף",6.44,7.08],["בחורה",7.08,8.04,1],["לידי",8.04,8.62]],
        [["ותעשה",9.18,9.66],["שאני",9.66,9.88],["בשווייץ",9.88,10.48,1]],
        [["עכשיו",10.88,11.14],["אני",11.14,11.28],["אסביר",11.28,11.78],["על",11.78,12.08]],
        [["אפקט",12.08,12.42],["דאנינג-קרוגר",12.42,13.12,1]],
        [["אז",13.24,13.36],["אפקט",13.36,13.56],["דאנינג-קרוגר",13.56,14.12,1]],
        [["הוא",14.12,14.24],["בעצם",14.24,14.6],["אפקט",14.6,15.06],["שאומר",15.06,15.51]],
        [["שיש",15.51,16.19],["מישהו",16.4,16.74]],
        [["שחושב",16.74,17.2],["שהוא",17.2,17.4],["יודע",17.4,17.68,1],["הכל",17.68,18.14,1]],
        [["אבל",18.34,18.54],["בעצם",18.54,18.84]],
        [["מרוב",18.84,19.46],["שהוא",19.46,19.7],["טיפש",19.7,20.44,1]],
        [["הוא",20.44,20.64],["לא",20.64,20.74],["יודע",20.74,20.86],["בעצם",20.86,21.22]],
        [["כמה",21.22,21.68,1],["הוא",21.68,21.78,1],["לא",21.78,21.88,1],["יודע",21.88,22.06,1]],
        [["זה",22.3,22.5],["למה",22.5,22.74],["נגיד",22.74,22.94],["לדוגמה",22.94,23.36]],
        [["מישהו",23.36,23.62],["שהיה",23.62,23.84]],
        [["הרבה",23.84,24.0],["יותר",24.0,24.2],["בקיא",24.2,24.5,1]],
        [["ממנו",24.5,24.7],["בנושא",24.7,25.2]],
        [["ידע",25.32,25.96],["להגיד",25.96,26.42]],
        [["״וואלה",27.0,27.24],["אני",27.24,27.34],["לא",27.34,27.46]],
        [["יודע",27.46,27.62],["כלום",27.62,27.92,1],["בזה״",27.92,28.18]],
        [["ויהיה",28.18,28.94],["יותר",28.94,29.18],["צנוע",29.18,29.6,1]],
        [["לעומת",29.6,29.92],["מישהו",29.92,30.3]],
        [["שלא",30.3,31.52],["יודע",31.52,31.66],["כלום",31.66,32.02]],
        [["ובור",32.02,32.36,1],["בעניין",32.36,32.9]],
      ];
      const END = 32.9;

      const tl = gsap.timeline({ paused: true });

      // ---------- captions ----------
      const capRoot = document.getElementById("captions");
      PAGES.forEach((words, i) => {
        const page = document.createElement("div");
        page.className = "cap";
        page.id = "cap-" + i;
        words.forEach(([t, s, e, hi], j) => {
          const w = document.createElement("span");
          w.className = "w" + (/[A-Za-z]/.test(t) ? " latin" : "");
          w.id = `cap-${i}-${j}`;
          w.textContent = t;
          page.appendChild(w);
        });
        capRoot.appendChild(page);

        const pStart = words[0][1];
        const next = PAGES[i + 1];
        // hold the page through short gaps, never past the next page
        const pEnd = next ? Math.min(next[0][1], words[words.length - 1][2] + 0.5) : END;
        tl.fromTo(page, { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "power2.out" }, pStart);
        tl.set(page, { opacity: 0 }, pEnd);

        words.forEach(([t, s, e, hi], j) => {
          const w = page.children[j];
          const on = hi ? "#ffd23f" : "#ffffff";
          tl.set(w, { color: "#ffffff" }, pStart);
          tl.fromTo(w, { scale: 1 }, { scale: 1.12, color: on, duration: 0.08, ease: "power2.out" }, s);
          tl.to(w, { scale: 1, duration: 0.12, ease: "power2.inOut", color: hi ? "#ffd23f" : "#ffffff" }, Math.max(s + 0.08, e - 0.04));
        });
      });

      // ---------- camera: punch-ins on every jump cut ----------
      const cam = "#cam";
      tl.set(cam, { scale: 1, y: 0 }, 0);
      tl.set(cam, { scale: 1.12, y: 40 }, 2.8);      // "כמו שאתם רואים" punch-in
      tl.set(cam, { scale: 1, y: 0 }, 5.38);         // Swiss segment
      // explainer: face moves up to make room for the card
      tl.set(cam, { scale: 1.16, y: -150 }, 10.56);
      tl.set(cam, { scale: 1.24, y: -170 }, 13.21);
      tl.set(cam, { scale: 1.16, y: -150 }, 16.19);
      tl.set(cam, { scale: 1.26, y: -175 }, 18.22);
      tl.to(cam, { scale: 1.34, y: -195, duration: 0.25, ease: "power3.out" }, 21.22); // "כמה הוא לא יודע"
      tl.set(cam, { scale: 1.16, y: -150 }, 22.12);
      tl.to(cam, { scale: 1.26, y: -175, duration: 0.25, ease: "power3.out" }, 27.0);  // "וואלה אני לא יודע"
      tl.set(cam, { scale: 1.18, y: -155 }, 28.25);
      tl.to(cam, { scale: 1.3, y: -185, duration: 0.3, ease: "power3.out" }, 32.0);   // "ובור"

      // captions sit lower on the plain shots, above the card during the explainer
      tl.set(capRoot, { y: 0 }, 0);
      tl.set(capRoot, { y: -205 }, 10.56);

      // ---------- Swiss reveal ----------
      tl.set("#swiss-wrap", { opacity: 0 }, 0);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.9, duration: 0.08 }, 5.38);
      tl.set("#swiss-wrap", { opacity: 1 }, 5.46);
      tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.46);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.8, duration: 0.08, immediateRender: false }, 10.34);
      tl.set("#swiss-wrap", { opacity: 0 }, 10.42);
      tl.to("#flash", { opacity: 0, duration: 0.25, ease: "power2.out" }, 10.42);

      // ---------- Claude Code badge ----------
      tl.fromTo("#badge .pill", { scale: 0.4, opacity: 0, y: -40 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 2.0);
      tl.fromTo("#badge svg", { rotation: -90 }, { rotation: 0, duration: 0.6, ease: "power3.out" }, 2.0);
      tl.to("#badge svg", { rotation: 180, duration: 2.6, ease: "none" }, 2.6);
      tl.to("#badge .pill", { scale: 0.6, opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 5.12);

      // ---------- explainer card ----------
      const T0 = 11.9;
      tl.fromTo("#card", { y: 520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T0);
      tl.fromTo("#card-title .he", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, T0 + 0.2);
      tl.fromTo("#card-title .en", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, T0 + 0.45);
      tl.to("#card-title", { opacity: 0, y: -60, duration: 0.3, ease: "power2.in" }, 13.4);

      // chart build
      const chartEls = ["#ax-y", "#ax-x", "#lbl-y", "#lbl-x", "#curve", "#lbl-peak", "#lbl-valley", "#lbl-expert", "#dot", "#g-h", "#g-v", "#g-conf", "#g-know", "#bubble"];
      tl.set(chartEls, { opacity: 0 }, T0);
      tl.to(["#ax-y", "#ax-x"], { opacity: 1, duration: 0.3 }, 13.6);
      tl.fromTo("#ax-y", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 13.6);
      tl.fromTo("#ax-x", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 13.6);
      tl.to(["#lbl-y", "#lbl-x"], { opacity: 1, duration: 0.3 }, 13.9);

      // dot rides the curve: sampled once at build time, then driven by a seekable tween
      const curve = document.getElementById("curve");
      const L = curve.getTotalLength();
      const dot = document.getElementById("dot");
      curve.setAttribute("stroke-dasharray", L);
      const at = (p) => curve.getPointAtLength(L * p);
      const ease = gsap.parseEase("power1.inOut");
      // dot + stroke share one eased progress, sampled into short linear steps
      const ride = (p0, p1, start, dur) => {
        const N = 40;
        tl.fromTo(curve, { attr: { "stroke-dashoffset": L * (1 - p0) } }, { attr: { "stroke-dashoffset": L * (1 - p1) }, duration: dur, ease: "power1.inOut", immediateRender: false }, start);
        for (let k = 1; k <= N; k++) {
          const pt = at(p0 + (p1 - p0) * ease(k / N));
          tl.to(dot, { attr: { cx: pt.x, cy: pt.y }, duration: (dur / N) * 0.98, ease: "none" }, start + (dur * (k - 1)) / N);
        }
      };
      const p0pt = at(0);
      dot.setAttribute("cx", p0pt.x);
      dot.setAttribute("cy", p0pt.y);
      curve.setAttribute("stroke-dashoffset", L);
      const PEAK = 0.27, END_P = 1;
      tl.to("#curve", { opacity: 1, duration: 0.01 }, 15.3);
      tl.to("#dot", { opacity: 1, duration: 0.15 }, 15.3);
      // climb to the peak while he says "שיש מישהו שחושב שהוא יודע הכל"
      ride(0, PEAK, 15.5, 2.2);
      tl.fromTo("#lbl-peak", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 17.4);
      tl.fromTo("#dot", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.35, duration: 0.15, yoyo: true, repeat: 1 }, 17.5);

      // "אבל ... לא יודע כמה הוא לא יודע": expose the gap
      tl.fromTo("#g-h", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 18.5);
      tl.fromTo("#g-conf", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3 }, 18.6);
      tl.fromTo("#g-v", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 19.7);
      tl.fromTo("#g-know", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3 }, 19.8);
      tl.fromTo("#g-know", { scale: 1, transformOrigin: "0% 50%" }, { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, 21.3);

      // expert path: the rest of the curve while he describes the expert
      tl.to(["#g-h", "#g-v", "#g-conf", "#g-know"], { opacity: 0, duration: 0.25 }, 22.3);
      ride(PEAK, END_P, 22.5, 2.6);
      tl.fromTo("#lbl-valley", { opacity: 0 }, { opacity: 0.75, duration: 0.3 }, 23.3);
      tl.fromTo("#lbl-expert", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 24.3);
      tl.to("#dot", { stroke: "#4fc3f7", duration: 0.3 }, 24.3);
      tl.fromTo("#bubble", { opacity: 0, scale: 0.6, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 26.95);
      tl.to("#lbl-peak", { opacity: 0, duration: 0.2 }, 26.85);

      // comparison
      tl.to("#chart", { opacity: 0, duration: 0.25 }, 28.1);
      tl.set(".col", { opacity: 0 }, T0);
      tl.set(["#nv-conf", "#nv-know", "#ex-conf", "#ex-know"], { scaleX: 0 }, T0);
      tl.fromTo(".col.novice", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 28.3);
      tl.fromTo(".col.expert", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 28.45);
      tl.to("#ex-know", { scaleX: 0.92, duration: 0.6, ease: "power3.out" }, 28.6);
      tl.to("#ex-conf", { scaleX: 0.45, duration: 0.6, ease: "power3.out" }, 28.75);
      tl.fromTo("#tag-expert", { scale: 1 }, { scale: 1.25, backgroundColor: "#4fc3f7", color: "#0d0e12", duration: 0.2, ease: "power2.out" }, 29.2);
      tl.to("#tag-expert", { scale: 1, duration: 0.2 }, 29.45);
      tl.to("#nv-conf", { scaleX: 0.98, duration: 0.6, ease: "power3.out" }, 30.0);
      tl.to("#nv-know", { scaleX: 0.08, duration: 0.6, ease: "power3.out" }, 31.6);
      tl.fromTo("#tag-novice", { scale: 1 }, { scale: 1.25, backgroundColor: "#ff6b5e", color: "#0d0e12", duration: 0.2, ease: "power2.out" }, 32.02);
      tl.to("#tag-novice", { scale: 1, duration: 0.2 }, 32.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
