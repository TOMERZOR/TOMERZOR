<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0716;font-family:"Secular One",sans-serif}
.bg{position:absolute;inset:0;background:url(../img/stage_hall.webp) center/cover;filter:brightness(.55) saturate(1.3)}
.row{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:0}
.row img{height:400px;width:200px;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.lg{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:560px;z-index:2;filter:drop-shadow(0 8px 20px #000)}
h1{position:absolute;top:10px;left:0;right:0;text-align:center;margin:0;font-size:150px;line-height:1;background:linear-gradient(180deg,#fff6c8,#ffd768 30%,#c98a1c 55%,#ffe39a 70%,#a0640c);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a2404) drop-shadow(0 0 30px rgba(255,170,60,.6));z-index:2}
p{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:40px;z-index:2;text-shadow:0 3px 10px #000}
.icon{width:512px;height:512px;position:relative;overflow:hidden;border-radius:0;background:radial-gradient(circle at 50% 40%,#5a1a6a,#12081e)}
.icon img{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);height:560px}
.icon b{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:120px;line-height:1;background:linear-gradient(180deg,#fff6c8,#ffd768 40%,#c98a1c);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #3a2404)}
</style></head><body>
<div id="og" style="position:relative;width:1200px;height:630px">
<div class="bg"></div>
<div class="row"><img src="../img/p_tahel.webp"><img src="../img/p_lian.webp"><img src="../img/p_liel.webp"><img src="../img/p_shontal.webp"><img src="../img/p_revital.webp"><img src="../img/p_maayan.webp"></div>
<img class="lg" src="../img/logo.webp"><p>שמונה לוחמות · אייפונים עפים · כיסא כתר אחד</p>
</div>
<div id="icon" class="icon"><img src="../img/p_shontal.webp"><b>OK</b></div>
</body></html>
