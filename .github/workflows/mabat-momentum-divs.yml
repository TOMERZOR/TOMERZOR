# One-off: income for the funds, which Nasdaq doesn't list. T-bill rates from FRED (for cash), and
# the funds' dividends from Yahoo where it answers. Merged into mabat/backtest/long.
name: Mabat momentum fund dividends

on:
  push:
    branches: [claude/mabat-momentum]
    paths: [".github/workflows/mabat-momentum-divs.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: T-bill rates (Treasury)
        if: false
        timeout-minutes: 6
        continue-on-error: true
        run: |
          : > mabat/backtest/long-tbill.csv
          for y in $(seq 2016 2026); do
            curl -sS --http1.1 --max-time 40 -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" -o y.csv "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/$y/all?type=daily_treasury_bill_rates&field_tdr_date_value=$y&page&_format=csv" || true
            echo "$y $(wc -l < y.csv 2>/dev/null) $(head -c 150 y.csv 2>/dev/null | tr '\n' ' ')"
            cat y.csv >> mabat/backtest/long-tbill.csv 2>/dev/null || true
          done
          rm -f y.csv
      - name: Treasury yield curve
        timeout-minutes: 6
        run: |
          : > mabat/backtest/long-yields.csv
          for y in $(seq 2016 2026); do
            curl -sS --http1.1 --max-time 40 -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" -o y.csv "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/$y/all?type=daily_treasury_yield_curve&field_tdr_date_value=$y&page&_format=csv" || true
            echo "$y $(wc -l < y.csv 2>/dev/null) $(head -c 200 y.csv 2>/dev/null | tr '\n' ' ')"
            cat y.csv >> mabat/backtest/long-yields.csv 2>/dev/null || true
          done
          rm -f y.csv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mabat/backtest/long-yields.csv || true
          git commit -m "Mabat momentum: fund income downloaded $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git push
