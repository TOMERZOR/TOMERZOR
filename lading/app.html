<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lading Order Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2316181D' d='M5 4h4v19h12v4H5z'/%3E%3Crect fill='%232340D8' x='23' y='21' width='8' height='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<script>
  // Apply saved language and theme before first paint, so the page never flashes the wrong direction.
  (function () {
    try {
      var l = localStorage.getItem("lading-lang"), t = localStorage.getItem("lading-theme");
      if (l === "he") { document.documentElement.lang = "he"; document.documentElement.dir = "rtl"; }
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
/* Layout: one working desk. A sticky header with three views (Review, Orders, Client updates);
   each view is a list at the start edge and the thing you act on beside it, stacking on phones.
   All spacing uses logical properties, so Hebrew mirrors the whole desk, timelines included. */
:root {
  --paper: #F3F4F6;
  --sheet: #FCFCFD;
  --ink: #16181D;
  --ink-2: #596070;
  --rule: #D9DCE2;
  --rule-2: #C4C8D0;
  --carbon: #2340D8;
  --carbon-ink: #FCFCFD;
  --carbon-wash: #E5E9FB;
  --late: #A8500C;
  --late-wash: #FAEBD9;
  --risk: #BF2630;
  --risk-wash: #FBE3E4;
  --ok: #1D7549;
  --ok-wash: #DFF1E6;
  --shadow: 0 1px 2px rgb(22 24 29 / .06), 0 12px 32px rgb(22 24 29 / .12);

  --f-stencil: "Big Shoulders Stencil Display", "IBM Plex Sans Hebrew", "Arial Narrow", Impact, sans-serif;
  --f-text: "Schibsted Grotesk", "IBM Plex Sans Hebrew", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --track: 0.06em;

  --r: 3px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --head-h: 56px;
  color-scheme: light;
}
:root[lang="he"] {
  --f-text: "IBM Plex Sans Hebrew", "Schibsted Grotesk", Arial, system-ui, sans-serif;
  --track: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101216; --sheet: #171A1F; --ink: #E8EAEE; --ink-2: #A0A7B3;
    --rule: #2A2E36; --rule-2: #3A3F49; --carbon: #8EA1FF; --carbon-ink: #101216; --carbon-wash: #1C2442;
    --late: #F0A35C; --late-wash: #36260F; --risk: #FF8B8F; --risk-wash: #3A1C1F; --ok: #6FD39C; --ok-wash: #13301F;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 16px 40px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101216; --sheet: #171A1F; --ink: #E8EAEE; --ink-2: #A0A7B3;
  --rule: #2A2E36; --rule-2: #3A3F49; --carbon: #8EA1FF; --carbon-ink: #101216; --carbon-wash: #1C2442;
  --late: #F0A35C; --late-wash: #36260F; --risk: #FF8B8F; --risk-wash: #3A1C1F; --ok: #6FD39C; --ok-wash: #13301F;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 16px 40px rgb(0 0 0 / .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-text);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; }
.icon { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.15em; }
[dir="rtl"] .icon.dir { transform: scaleX(-1); }
.mono { font-family: var(--f-data); font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--ink-2); }
/* Plex Mono has no Hebrew letters: Hebrew dates use the text face with tabular figures. Codes stay mono. */
:root[lang="he"] .mono:not([dir="ltr"]) { font-family: var(--f-text); letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.cap { font-size: 13px; text-transform: uppercase; letter-spacing: var(--track); color: var(--ink-2); font-weight: 500; }

.wrap {
  max-width: 1360px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Logo ---------- */
.logo { display: block; flex: none; }
.logo .ink { fill: var(--ink); }
.logo .eta { fill: var(--carbon); }

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--sheet);
  border-bottom: 1px solid var(--rule);
}
.top .wrap { display: flex; align-items: center; gap: 24px; min-height: var(--head-h); }
.mark {
  display: inline-flex; align-items: center; gap: 9px;
  color: var(--ink); text-decoration: none;
}
.mark .lockup { display: inline-flex; align-items: center; gap: 9px; }
.mark .word { font: 700 26px/1 "Big Shoulders Stencil Display", "Arial Narrow", sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
.mark small { font: 500 12px/1 var(--f-text); color: var(--ink-2); align-self: flex-end; padding-bottom: 3px; }
nav.views { display: flex; gap: 4px; align-self: stretch; }
nav.views a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 12px;
  color: var(--ink-2); text-decoration: none; font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: color .16s var(--ease), border-color .16s var(--ease);
}
nav.views a:hover { color: var(--ink); }
nav.views a .lbl-short { display: none; }
nav.views a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--carbon); }
.count {
  font: 700 17px/1 var(--f-stencil);
  min-width: 20px; padding: 3px 5px 2px;
  text-align: center;
  border-radius: var(--r);
  background: var(--carbon); color: var(--carbon-ink);
}
.count[data-n="0"] { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule-2); }
.studio { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 13px; }
.studio strong { color: var(--ink); font-weight: 500; }
.sample {
  border-bottom: 1px solid var(--rule);
  font-size: 12px; color: var(--ink-2);
}
.sample .wrap { display: flex; gap: 12px; align-items: center; min-height: 32px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--carbon); text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Settings ---------- */
.settings { position: relative; }
.pop {
  position: absolute; inset-inline-end: 0; top: calc(100% + 8px); z-index: 25;
  width: 260px; padding: 16px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  display: grid; gap: 16px;
  animation: pop .16s var(--ease);
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop h2 { font-size: 15px; color: var(--ink); }
.pop fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 6px; }
.pop legend { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); border: 1px solid var(--rule-2); border-radius: var(--r); overflow: hidden; }
.seg label { position: relative; text-align: center; padding: 7px 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg label + label { border-inline-start: 1px solid var(--rule-2); }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--ink); color: var(--paper); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--carbon); outline-offset: -2px; }
.seg .he { font-family: "IBM Plex Sans Hebrew", sans-serif; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 14px;
  border-radius: var(--r);
  border: 1px solid var(--rule-2);
  background: var(--sheet); color: var(--ink);
  font-weight: 500; white-space: nowrap; text-decoration: none;
  transition: background .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease);
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--carbon); border-color: var(--carbon); color: var(--carbon-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); background: var(--paper); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--r); border: 1px solid var(--rule); background: transparent; color: var(--ink-2); flex: none; }
.iconbtn:hover, .iconbtn[aria-expanded="true"] { color: var(--ink); border-color: var(--rule-2); }

/* ---------- Hang tag (status chip). The pointed end and hole sit on the start side. ---------- */
.tag {
  --tag-bg: var(--paper); --tag-fg: var(--ink-2); --tag-edge: var(--rule-2);
  --cut: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%);
  --cut-in: polygon(7.5px 0, 100% 0, 100% 100%, 7.5px 100%, 0 50%);
  display: inline-flex; align-items: center;
  position: relative;
  height: 22px; padding-inline: 17px 9px;
  font: 500 12px/1 var(--f-text); letter-spacing: 0.01em; white-space: nowrap;
  color: var(--tag-fg);
  background: var(--tag-edge);
  clip-path: var(--cut);
}
[dir="rtl"] .tag {
  --cut: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%);
  --cut-in: polygon(0 0, calc(100% - 7.5px) 0, 100% 50%, calc(100% - 7.5px) 100%, 0 100%);
  letter-spacing: 0;
}
.tag::after { content: ""; position: absolute; inset: 1px; background: var(--tag-bg); clip-path: var(--cut-in); }
.tag::before {
  content: ""; position: absolute; inset-inline-start: 7px; top: 50%; z-index: 1;
  width: 4px; height: 4px; margin-top: -2px; border-radius: 50%;
  background: var(--tag-edge);
}
.tag > span { position: relative; z-index: 1; }
.t-c { --tag-bg: var(--carbon-wash); --tag-fg: var(--carbon); --tag-edge: var(--carbon); }
.t-ok { --tag-bg: var(--ok-wash); --tag-fg: var(--ok); --tag-edge: var(--ok); }
.t-late { --tag-bg: var(--late-wash); --tag-fg: var(--late); --tag-edge: var(--late); }
.t-risk { --tag-bg: var(--risk-wash); --tag-fg: var(--risk); --tag-edge: var(--risk); }

/* ---------- Page heads ---------- */
.view { padding-block: 28px 64px; }
.view-head { display: grid; gap: 6px; margin-bottom: 20px; }
.view-head h1 { font-size: 24px; letter-spacing: -0.015em; }
.view-head p { color: var(--ink-2); max-width: 64ch; }

/* ---------- Review ---------- */
.review { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; }
.queue { display: grid; gap: 16px; position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px) + 16px); }
.queue ol { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
.q-row {
  width: 100%; text-align: start;
  display: grid; gap: 3px;
  padding-block: 12px; padding-inline: 14px 12px;
  background: transparent; border: 0; border-bottom: 1px solid var(--rule);
  border-inline-start: 2px solid transparent;
  transition: background .16s var(--ease), border-color .16s var(--ease);
}
.q-row:hover { background: var(--sheet); }
.q-row[aria-selected="true"] { background: var(--carbon-wash); border-inline-start-color: var(--carbon); }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.q-vendor { font-weight: 600; }
.q-subj { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-match { font-size: 13px; color: var(--ink); }
.q-match .mono { color: var(--ink-2); font-size: 12px; }
.done-list summary { cursor: pointer; color: var(--ink-2); font-size: 13px; padding: 4px 0; }
.done-list ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.done-list li { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); }
.done-list li .icon { color: var(--ok); }

.detail { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.back { display: none; }
.sheet {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--r);
}
.email { padding: 20px 22px 24px; min-width: 0; }
.email-meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); margin: 0; }
.email-meta dt { color: var(--ink-2); }
.email-meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.email-subj { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 16px 0 12px; text-wrap: balance; }
.attach { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.attach span { display: inline-flex; gap: 6px; align-items: center; font: 400 12px/1 var(--f-data); padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r); color: var(--ink-2); direction: ltr; }
.email-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.65; }
mark.src {
  background: transparent; color: inherit;
  text-decoration: underline; text-decoration-color: var(--carbon); text-decoration-thickness: 1.5px; text-underline-offset: 3px;
  border-radius: 2px;
  transition: background .16s var(--ease), box-shadow .16s var(--ease);
}
mark.src.lit { background: var(--carbon-wash); box-shadow: 0 0 0 3px var(--carbon-wash); }

.reading { display: grid; gap: 16px; min-width: 0; }
.kind-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.conf { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.conf.check { color: var(--late); }
.match { padding: 14px 16px; display: grid; gap: 4px; }
.match .lbl { font-size: 12px; color: var(--ink-2); }
.match strong { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.match .why { font-size: 13px; color: var(--ink-2); }
.fields { margin: 0; display: grid; border-top: 1px solid var(--rule); }
.field {
  display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px;
  padding: 10px 4px; border-bottom: 1px solid var(--rule);
  border-radius: var(--r);
  cursor: default;
  transition: background .16s var(--ease);
}
.field:hover, .field:focus-visible { background: var(--carbon-wash); }
.field dt { color: var(--ink-2); font-size: 13px; padding-top: 1px; }
.field dd { margin: 0; min-width: 0; }
.field .val { text-decoration: underline; text-decoration-color: var(--carbon); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.field .from { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1px; margin-inline-end: 6px; }
.field .explain { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r); font-size: 14px; background: var(--late-wash); color: var(--ink); }
.note .icon { color: var(--late); margin-top: 2px; }
.impact { display: grid; gap: 10px; padding: 14px 16px; }
.impact p { font-size: 14px; }
.impact.risk { border-color: var(--risk); }
.impact.risk p strong { color: var(--risk); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; flex: none; }
.lg.promise { width: 2px; height: 12px; background: var(--ink-2); }
.lg.eta { width: 8px; height: 8px; background: var(--ink); }
.lg.ghost { width: 8px; height: 8px; border: 1.5px dashed var(--ink-2); }
.lg.install { width: 0; height: 12px; border-inline-start: 1.5px dashed var(--carbon); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; }
.pick legend { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.pick label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); cursor: pointer; }
.pick label:has(input:checked) { border-color: var(--carbon); background: var(--carbon-wash); }
.pick input { margin-top: 4px; accent-color: var(--carbon); }
.pick small { display: block; color: var(--ink-2); font-size: 13px; }
.other { display: grid; gap: 6px; }
.other label { font-size: 13px; color: var(--ink-2); }
.other select { min-height: 38px; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: var(--r); background: var(--sheet); max-width: 100%; }
.caught { padding: 48px 28px; display: grid; gap: 8px; justify-items: start; grid-column: 1 / -1; }
.caught .icon { width: 28px; height: 28px; color: var(--ok); }
.caught h2 { font-size: 18px; }
.caught p { color: var(--ink-2); max-width: 52ch; }

/* ---------- Drift line. Positions use inset-inline-start, so time runs right to left in Hebrew. ---------- */
.track { position: relative; display: block; height: 22px; }
.track::before { content: ""; position: absolute; inset-inline: 0; top: 50%; border-top: 1px solid var(--rule); }
.track .tick { position: absolute; top: 4px; bottom: 4px; border-inline-start: 1px solid var(--rule); }
.track .today { position: absolute; top: 0; bottom: 0; border-inline-start: 1px solid var(--ink-2); opacity: .5; }
.track .install { position: absolute; top: -6px; bottom: -6px; border-inline-start: 1.5px dashed var(--carbon); }
.track .gap { position: absolute; top: 6px; height: 10px; transform-origin: left center; }
[dir="rtl"] .track .gap { transform-origin: right center; }
.track .gap.late { background: repeating-linear-gradient(-45deg, var(--late) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 1px 0 var(--late), inset 0 -1px 0 var(--late); }
.track .gap.early { background: repeating-linear-gradient(-45deg, var(--ok) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 1px 0 var(--ok), inset 0 -1px 0 var(--ok); }
.track .promise { position: absolute; top: 3px; height: 16px; width: 2px; margin-inline-start: -1px; background: var(--ink-2); }
.track .eta { position: absolute; top: 5px; width: 12px; height: 12px; margin-inline-start: -6px; background: var(--ink); border-radius: 1px; }
.track .eta.done { background: var(--ok); border-radius: 50%; width: 10px; height: 10px; top: 6px; margin-inline-start: -5px; }
.track .eta.bad { background: var(--risk); }
.track .ghost { position: absolute; top: 5px; width: 12px; height: 12px; margin-inline-start: -6px; border: 1.5px dashed var(--ink-2); border-radius: 1px; }
.moved .eta { animation: slide .9s var(--ease) both; }
.moved .gap { animation: grow .9s var(--ease) both; }
@keyframes slide { from { inset-inline-start: var(--from); } }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- Orders ---------- */
.o-head { display: grid; gap: 16px; margin-bottom: 8px; }
.o-head h1 { font-size: 24px; letter-spacing: -0.015em; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.summary div { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); }
.summary b { font: 700 40px/0.9 var(--f-stencil); color: var(--ink); letter-spacing: 0.01em; }
.summary .late b:not([data-n="0"]) { color: var(--late); }
.summary .risk b:not([data-n="0"]) { color: var(--risk); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  min-height: 34px; padding: 0 12px;
  border: 1px solid var(--rule-2); border-radius: var(--r);
  background: var(--sheet); color: var(--ink-2); font-size: 14px; font-weight: 500;
  display: inline-flex; gap: 8px; align-items: center;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters button span { font-family: var(--f-data); font-size: 12px; opacity: .8; }

.grid-row {
  display: grid;
  grid-template-columns: 136px minmax(0, 1.25fr) minmax(220px, 2fr) 72px 64px;
  gap: 16px; align-items: center;
}
.axis { position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--paper); padding: 10px 0 8px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--ink-2); }
.axis-scale { display: block; position: relative; height: 32px; }
.axis-scale span { position: absolute; top: 0; padding-inline-start: 4px; border-inline-start: 1px solid var(--rule-2); line-height: 16px; white-space: nowrap; }
.axis-scale span.today-lbl { top: 16px; border-inline-start-color: var(--ink-2); color: var(--ink); font-weight: 500; }
.axis .r { text-align: end; }

.proj { padding-top: 28px; }
.proj > header { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding-bottom: 6px; }
.proj > header h2 { font-size: 18px; letter-spacing: -0.01em; }
.proj > header span { color: var(--ink-2); font-size: 14px; }
.room { margin-top: 10px; }
.room-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 10px 0 8px; border-bottom: 1px solid var(--rule); }
.room-head h3 { font-size: 15px; font-weight: 600; }
.ready { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: baseline; }
.ready.risk { color: var(--risk); }
.ready .icon { align-self: center; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  width: 100%; text-align: start;
  padding: 10px 0; background: transparent; border: 0; border-bottom: 1px solid var(--rule);
  transition: background .16s var(--ease);
}
.row:hover { background: var(--sheet); }
.row .name { display: grid; min-width: 0; }
.row .name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name small { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .arr { text-align: end; }
.drift { text-align: end; font: 700 20px/1 var(--f-stencil); letter-spacing: 0.01em; white-space: nowrap; }
.drift .u { font: 500 12px/1 var(--f-text); margin-inline-start: 2px; }
.drift.late { color: var(--late); }
.drift.early { color: var(--ok); }
.drift.zero { color: var(--ink-2); font: 400 12px/1 var(--f-text); }
.drift.bad { color: var(--risk); font: 500 12px/1 var(--f-text); }
.empty-orders { padding: 48px 0; color: var(--ink-2); }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(16 18 22 / .32); animation: fade .24s var(--ease); }
.drawer {
  position: fixed; z-index: 41; top: 0; bottom: 0; inset-inline-end: 0;
  width: min(480px, 100%);
  background: var(--sheet); border-inline-start: 1px solid var(--rule); box-shadow: var(--shadow);
  overflow-y: auto;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; align-content: start;
  animation: drawer .24s var(--ease);
}
[dir="rtl"] .drawer { animation-name: drawer-rtl; }
@keyframes drawer { from { transform: translateX(24px); opacity: 0; } }
@keyframes drawer-rtl { from { transform: translateX(-24px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.drawer-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.drawer h2 { font-size: 24px; letter-spacing: -0.015em; }
.drawer .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0; }
.facts div { padding: 12px 0; display: grid; gap: 2px; }
.facts div + div { padding-inline-start: 14px; border-inline-start: 1px solid var(--rule); }
.facts dt { font-size: 12px; color: var(--ink-2); }
.facts dd { margin: 0; }
.history { list-style: none; margin: 0; padding: 0; display: grid; }
.history li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.history .when { color: var(--ink-2); padding-top: 2px; }
.history .src { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.history .src q { color: var(--ink); text-decoration: underline; text-decoration-color: var(--carbon); text-underline-offset: 3px; }

/* ---------- Updates ---------- */
.updates { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; }
.plist { display: grid; gap: 16px; }
.plist ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.p-row { width: 100%; text-align: start; display: grid; gap: 2px; padding-block: 12px; padding-inline: 14px 12px; border: 0; border-bottom: 1px solid var(--rule); border-inline-start: 2px solid transparent; background: transparent; }
.p-row:hover { background: var(--sheet); }
.p-row[aria-current="true"] { background: var(--carbon-wash); border-inline-start-color: var(--carbon); }
.p-row b { font-weight: 600; }
.p-row small { color: var(--ink-2); font-size: 13px; }
.p-row .pending { color: var(--carbon); font-weight: 500; }
.composer { padding: 22px 24px 24px; display: grid; gap: 18px; min-width: 0; }
.composer header { display: grid; gap: 2px; }
.composer header h2 { font-size: 18px; letter-spacing: -0.01em; }
.composer header p { color: var(--ink-2); font-size: 14px; }
.included { margin: 0; padding: 0; border: 0; display: grid; gap: 6px; }
.included legend { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.included label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--rule); }
.included input { margin-top: 4px; accent-color: var(--carbon); }
.included small { display: block; color: var(--ink-2); font-size: 12px; }
.draft-wrap { display: grid; gap: 6px; }
.draft-wrap label { font-size: 13px; color: var(--ink-2); }
.draft-wrap textarea {
  width: 100%; min-height: 240px; resize: vertical; overflow: hidden;
  padding: 16px 18px; border: 1px solid var(--rule-2); border-radius: var(--r);
  background: var(--paper); line-height: 1.6; font-size: 15px;
}
.draft-wrap textarea:focus-visible { outline: 2px solid var(--carbon); outline-offset: 0; border-color: var(--carbon); }
.edited { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 50;
  left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; gap: 14px; align-items: center;
  max-width: calc(100% - 32px);
  padding-block: 10px; padding-inline: 16px 10px;
  background: var(--ink); color: var(--paper);
  border-radius: var(--r); box-shadow: var(--shadow);
  font-size: 14px;
  animation: toast .24s var(--ease);
}
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--paper) 35%, transparent); color: var(--paper); border-radius: var(--r); min-height: 30px; padding: 0 10px; font-weight: 500; }
@keyframes toast { from { transform: translate(-50%, 8px); opacity: 0; } }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .top .wrap { gap: 12px; }
  .studio > span, .studio > strong { display: none; }
  .review, .updates { grid-template-columns: minmax(0, 1fr); }
  .queue { position: static; }
  .review.has-sel .queue { display: none; }
  .review:not(.has-sel) .detail { display: none; }
  .back { display: flex; grid-column: 1 / -1; }
  .grid-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name drift" "track track" "tag arr"; gap: 8px 12px; }
  .grid-row > .c-tag { grid-area: tag; }
  .grid-row > .name { grid-area: name; }
  .grid-row > .c-track { grid-area: track; }
  .grid-row > .arr { grid-area: arr; }
  .grid-row > .drift { grid-area: drift; }
  .axis .c-tag, .axis .name, .axis .arr, .axis .drift-h { display: none; }
  .axis .grid-row { grid-template-columns: minmax(0, 1fr); grid-template-areas: "track"; }
}
@media (max-width: 560px) {
  .mark small, .mark .word { display: none; }
  nav.views a { padding: 0 8px; font-size: 14px; }
  nav.views a .lbl-long { display: none; }
  nav.views a .lbl-short { display: inline; }
  .email { padding: 16px; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .facts div + div { padding-inline-start: 0; border-inline-start: 0; border-top: 1px solid var(--rule); }
  .composer { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  const LOCALE = () => (LANG === "he" ? "he-IL" : "en-US");

  const TODAY = "2026-10-24";

  const D = (s) => new Date(s + "T00:00:00Z");
  const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 86400000);
  const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const fmt = (s, o) => new Intl.DateTimeFormat(LOCALE(), Object.assign({ month: "short", day: "numeric", timeZone: "UTC" }, o)).format(D(s));
  const fmtLong = (s) => fmt(s, { weekday: "short" });
  const fmtMonth = (s) => new Intl.DateTimeFormat(LOCALE(), { month: "short", timeZone: "UTC" }).format(D(s));
  const pct = (s) => Math.max(0, Math.min(100, daysBetween(AX0, s) / daysBetween(AX0, AX1) * 100));
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const icon = (id, cls) => `<svg class="icon${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${id}"></use></svg>`;

  const heDays = (n) => (n === 1 ? "יום אחד" : n === 2 ? "יומיים" : `${n} ימים`);
  const T = {

      title: "Lading Order Desk", sub: "order desk",

          why: "הזמנת הרכש HR-1025 ושם הפריט תואמים להזמנה הזו.",
          fields: [["מה הם צריכים", "אישור של לוח A17, או בקשה ללוח אחר"], ["תשובה עד", "יום ד׳, 28 באוקטובר", "תשובה מאוחרת מסכנת את מועד 4 בדצמבר."]],
          summary: "אבני ארדן ביקשו אישור ללוח A17 עד 28 באוקטובר.", quote: "אנחנו צריכים תשובה עד 28/10 כדי לשמור על מועד 4/12."
        },
        m6: {
          fromName: "הולם טקסטיל", subject: "הודעה על הפסקת ייצור: בוקלה פנל, גוון 04",
          body: "לשותפינו במקצוע,\n\n[[disc|ייצור הבוקלה פנל בגוון 04 (שיבולת) הופסק]], בתוקף מיידי.\nמלאי שנותר: 10 מטר במחסן שלנו בקיסריה.\n\n[[fill|הזמנות פתוחות שכבר אושרו יסופקו.]]\n\n[[alt|גוון 06 (פשתן) הוא החלופה הקרובה ביותר.]] דוגמיות זמינות לפי בקשה.\n\nהולם טקסטיל",
          why: "בהודעה אין מספר הזמנה. שתיים מההזמנות שלך משתמשות בבוקלה פנל 04.",
          note: "שתי ההזמנות כבר אושרו או נמסרו, והולם כותבים שהזמנות מאושרות יסופקו. שום דבר לא נדחה. Lading יוסיף הערה כדי שאף אחד לא יזמין שוב את גוון 04.",
          fields: [["הופסק", "בוקלה פנל, גוון 04 (שיבולת)"], ["הזמנות פתוחות", "הזמנות מאושרות יסופקו"], ["חלופה", "גוון 06 (פשתן)"]],
          summary: "בד פנל 04 הופסק. הזמנות מאושרות יסופקו; הזמנות חוזרות צריכות את גוון 06.", quote: "הזמנות פתוחות שכבר אושרו יסופקו."
        }
      }
    }
  };
  const c = () => C[LANG];

  /* ================= State (language-free, so switching language keeps your work) ================= */
  const KEY = "lading-demo-v2";
  const fresh = () => ({
    items: JSON.parse(JSON.stringify(SEED_ITEMS)),
    msgs: {},
    events: JSON.parse(JSON.stringify(SEED_EVENTS)),
    drafts: {},
    sent: { p3: "2026-10-12" }
  });
  let state = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* storage unavailable: keep sample data */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };
  const pref = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
  const readPref = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  const ui = { view: "review", sel: null, filter: "all", project: "p1", pick: {}, other: null, drawer: null, moved: null, toast: null, settings: false };
  const narrow = () => window.matchMedia("(max-width: 900px)").matches;

  const item = (id) => state.items.find((i) => i.id === id);
  const proj = (id) => PROJECTS.find((p) => p.id === id);
  const room = (it) => proj(it.p).rooms.find((r) => r.id === it.room);
  const iw = (it) => c().items[it.id];
  const pw = (pid) => c().projects[pid];
  const rw = (rid) => c().rooms[rid];
  const mw = (m) => c().msgs[m.id];
  const pending = () => MSGS.filter((m) => !state.msgs[m.id]);
  const pendingEvents = (pid) => state.events.filter((e) => e.p === pid && !e.sent);

  /* ================= Order logic ================= */
  const slip = (it) => daysBetween(it.promised, it.eta);
  const arrived = (it) => ARRIVED.has(it.status) && it.eta <= TODAY;
  const pastInstall = (it) => !arrived(it) && it.eta > room(it).install;
  const attention = (it) => it.status === "backorder" || it.status === "damaged" || pastInstall(it);
  const FILTERS = [
    ["all", () => true],
    ["attention", attention],
    ["slipped", (it) => slip(it) > 0],
    ["ontrack", (it) => !attention(it) && slip(it) <= 0 && !arrived(it)],
    ["arrived", arrived]
  ];

  function readiness(pid, r) {
    const its = state.items.filter((i) => i.p === pid && i.room === r.id);
    const open = its.filter((i) => !arrived(i));
    const R = t().ready;
    if (!open.length) return { cls: "", text: R.all(fmt(r.install)) };
    const last = open.reduce((a, b) => (b.eta > a.eta ? b : a));
    const gap = daysBetween(last.eta, r.install);
    const bad = open.find((i) => i.status === "damaged");
    if (gap < 0) return { cls: "risk", icon: "warning", text: R.short(fmt(last.eta), fmt(r.install), -gap, iw(last).short) };
    if (bad) return { cls: "risk", icon: "warning", text: R.bad(iw(bad).short, fmt(last.eta)) };
    return { cls: "", text: R.ok(fmt(last.eta), fmt(r.install), gap) };
  }

  /* ================= Drift line ================= */
  function track(it, opts = {}) {
    const eta = opts.eta || it.eta;
    const install = opts.install || room(it).install;
    const p = pct(it.promised), e = pct(eta);
    const isDone = !opts.eta && arrived(it);
    const lo = Math.min(p, e), w = Math.abs(e - p);
    const gapCls = e > p ? "late" : "early";
    const moved = opts.from ? ` moved" style="--from:${pct(opts.from)}%` : "";
    const ticks = ["2026-11-01", "2026-12-01", "2027-01-01", "2027-02-01"].map((m) => `<span class="tick" style="inset-inline-start:${pct(m)}%"></span>`).join("");
    return `<span class="track${moved}" aria-hidden="true">
      ${ticks}
      <span class="today" style="inset-inline-start:${pct(TODAY)}%"></span>
      <span class="install" style="inset-inline-start:${pct(install)}%"></span>
      ${w > 0.05 ? `<span class="gap ${gapCls}" style="inset-inline-start:${lo}%;width:${w}%"></span>` : ""}
      <span class="promise" style="inset-inline-start:${p}%"></span>
      ${opts.ghost ? `<span class="ghost" style="inset-inline-start:${pct(opts.ghost)}%"></span>` : ""}
      <span class="eta${isDone ? " done" : ""}${it.status === "damaged" && !opts.eta ? " bad" : ""}" style="inset-inline-start:${e}%"></span>
    </span>`;
  }
  function driftFig(it) {
    const DR = t().drift;
    if (it.status === "damaged") return `<span class="drift bad">${DR.damage}</span>`;
    if (arrived(it)) return `<span class="drift zero">${DR.arrived}</span>`;
    const d = slip(it);
    if (d > 0) return `<span class="drift late" title="${esc(DR.lateT(d))}">${ltr("+" + d)}<span class="u">${DR.unit}</span></span>`;
    if (d < 0) return `<span class="drift early" title="${esc(DR.earlyT(-d))}">${ltr("−" + -d)}<span class="u">${DR.unit}</span></span>`;
    return `<span class="drift zero">${DR.on}</span>`;
  }
  const tag = (label, cls) => `<span class="tag ${cls || ""}"><span>${esc(label)}</span></span>`;
  const statusTag = (it) => tag(c().status[it.status], STATUS_CLS[it.status]);
  const kindTag = (m) => tag(c().kinds[m.kind], KIND_CLS[m.kind]);

  /* ================= Header ================= */
  function renderHead() {
    const n1 = pending().length;
    const n3 = PROJECTS.reduce((a, p) => a + pendingEvents(p.id).filter((e) => e.on !== false).length, 0);
    const views = [["review", n1], ["orders", null], ["updates", n3]];
    const theme = readPref("lading-theme") || "system";
    document.getElementById("head").innerHTML = `
      <a class="mark" href="#review" aria-label="Lading"><span class="lockup" dir="ltr">${LOGO}<span class="word" aria-hidden="true">Lading</span></span><small>${esc(t().sub)}</small></a>
      <nav class="views" aria-label="${LANG === "he" ? "תצוגות" : "Views"}">${views.map(([id, n]) => {
        const [long, short] = t().nav[id];
        return `<a href="#${id}" ${ui.view === id ? 'aria-current="page"' : ""}><span class="lbl-long">${long}</span><span class="lbl-short">${short}</span>${n !== null ? `<span class="count" data-n="${n}"><span class="sr">, </span>${n}<span class="sr"> ${t().waiting}</span></span>` : ""}</a>`;

        <div class="settings">

          ${ui.settings ? `<div class="pop" id="settings-pop" role="dialog" aria-labelledby="settings-h">
            <h2 id="settings-h">${t().settings}</h2>
            <fieldset><legend>${t().language}</legend>
              <div class="seg" style="--n:2">
                <label lang="en"><input type="radio" name="lang" value="en" data-action="lang" ${LANG === "en" ? "checked" : ""}>English</label>
                <label class="he" lang="he"><input type="radio" name="lang" value="he" data-action="lang" ${LANG === "he" ? "checked" : ""}>עברית</label>
              </div>
            </fieldset>
            <fieldset><legend>${t().theme}</legend>
              <div class="seg" style="--n:3">
                ${["system", "light", "dark"].map((v) => `<label><input type="radio" name="theme" value="${v}" data-action="theme" ${theme === v ? "checked" : ""}>${t()[v]}</label>`).join("")}
              </div>
            </fieldset>
          </div>` : ""}
        </div>
      </div>`;
    document.getElementById("sample").innerHTML = `<span>${esc(t().sample)}</span><button class="linkbtn" type="button" data-action="reset">${esc(t().reset)}</button>`;
  }

  /* ---------- Review ---------- */
  function renderReview() {
    const list = pending();
    if (ui.sel && state.msgs[ui.sel]) ui.sel = null;
    if (!ui.sel && list.length && !narrow()) ui.sel = list[0].id;
    const done = MSGS.filter((m) => state.msgs[m.id]);
    const needDecision = list.filter((m) => m.conf !== "high" || m.reply).length;

    const queue = `<aside class="queue">
      <div class="view-head"><h1>${t().reviewH}</h1><p>${esc(t().reviewP(list.length, needDecision))}</p></div>
      ${list.length ? `<ol role="listbox" aria-label="${t().emails}" id="queue">${list.map((m) => {
        const it = m.item ? item(m.item) : null;
        const matchTxt = it ? `${esc(pw(it.p).name)}, ${esc(iw(it).short)} <span class="mono" dir="ltr">${it.po}</span>` : esc(t().possible(m.candidates.length));
        return `<li><button class="q-row" role="option" type="button" data-action="select" data-id="${m.id}" aria-selected="${ui.sel === m.id}">

      ${done.length ? `<details class="done-list" ${list.length ? "" : "open"}><summary>${t().doneToday(done.length)}</summary><ul>${done.map((m) => {
        const s = state.msgs[m.id];

      }).join("")}</ul></details>` : ""}
    </aside>`;

    let detail;
    if (!list.length) {
      detail = `<div class="detail"><div class="sheet caught">${icon("check")}<h2>${t().caughtH}</h2><p>${t().caughtP}</p><div class="actions"><a class="btn primary" href="#updates">${t().openUpdates} ${icon("arrow-right", "dir")}</a><a class="btn" href="#orders">${t().seeOrders}</a></div></div></div>`;
    } else if (!ui.sel) {
      detail = `<div class="detail"></div>`;
    } else {
      detail = renderDetail(MSG[ui.sel]);
    }
    return `<section class="view review ${ui.sel ? "has-sel" : ""}">${queue}${detail}</section>`;
  }

  function renderBody(m) {
    return esc(mw(m).body).replace(/\[\[(\w+)\|([\s\S]+?)\]\]/g, (_, id, txt) => `<mark class="src" data-src="${id}" id="src-${m.id}-${id}">${txt}</mark>`);
  }

  function renderDetail(m) {
    const W = mw(m);
    const choosing = ui.other && ui.other.msg === m.id;
    const targetId = choosing ? ui.other.to : m.item;
    const target = targetId ? item(targetId) : null;
    const confTxt = `${icon(m.conf === "high" ? "check" : "warning")} ${t().conf[m.conf]}`;

    const fields = m.fields.map((f, i) => {
      const [label, value, explain] = W.fields[i];
      return `<div class="field" tabindex="0" data-src="${f.src}" data-msg="${m.id}">
        <dt>${esc(label)}</dt>
        <dd>${f.to ? `<span class="from mono">${fmt(f.from)}</span><span class="val mono">${fmtLong(f.to)}</span>` : `<span class="val">${esc(value)}</span>`}${explain ? `<span class="explain">${esc(explain)}</span>` : ""}</dd>
      </div>`;
    }).join("");

    let impact = "";
    if (target && m.set && m.set.eta) {
      const r = room(target);
      const late = m.set.eta > r.install;
      const d = daysBetween(r.install, m.set.eta);
      const R = rw(r.id), name = esc(iw(target).short);
      const where = LANG === "he" ? R[1] : R[0];
      const msg = late ? t().impLate(fmt(r.install), where, name, fmt(m.set.eta), d)
        : m.set.eta < target.eta ? t().impEarly(name, daysBetween(m.set.eta, target.eta), where, fmt(r.install))
        : t().impStill(name, where, fmt(r.install));
      const L = t().lg;
      impact = `<div class="sheet impact ${late ? "risk" : ""}">
        <p>${msg}</p>
        ${track(target, { eta: m.set.eta, ghost: target.eta })}
        <div class="legend"><span><i class="lg promise"></i>${L.promised}</span><span><i class="lg ghost"></i>${L.before}</span><span><i class="lg eta"></i>${L.now}</span><span><i class="lg install"></i>${L.install}</span></div>
      </div>`;
    } else if (m.act) {
      impact = `<div class="sheet impact risk"><p><strong>${t().actSoon}</strong> ${esc(W.impactText)}</p></div>`;
    }

    let actions;
    if (m.conf === "pick") {
      const chosen = ui.pick[m.id] || m.candidates;
      actions = `<fieldset class="pick"><legend>${t().addNoteTo}</legend>${m.candidates.map((cid) => {
        const x = item(cid);
        return `<label><input type="checkbox" data-action="pick" data-msg="${m.id}" value="${cid}" ${chosen.includes(cid) ? "checked" : ""}><span>${esc(iw(x).name)} <span class="mono muted" dir="ltr">${x.po}</span><small>${esc(pw(x.p).name)}, ${esc(c().status[x.status])}</small></span></label>`;
      }).join("")}</fieldset>
      <div class="actions"><button class="btn primary" type="button" data-action="apply" data-id="${m.id}" ${chosen.length ? "" : "disabled"}>${icon("check")}${t().addNote(chosen.length)}</button><button class="btn quiet" type="button" data-action="dismiss" data-id="${m.id}">${t().dismiss}</button></div>`;
    } else if (m.reply) {
      actions = `<div class="actions"><button class="btn primary" type="button" data-action="answered" data-id="${m.id}">${icon("check")}${t().answered}</button><button class="btn quiet" type="button" data-action="dismiss" data-id="${m.id}">${t().dismiss}</button></div>`;
    } else {
      const opts = state.items.map((x) => `<option value="${x.id}" ${x.id === targetId ? "selected" : ""}>${esc(pw(x.p).name)}: ${esc(iw(x).name)} (${x.po})</option>`).join("");
      actions = `${choosing ? `<div class="other"><label for="other-${m.id}">${t().otherOrder}</label><select id="other-${m.id}" data-action="other" data-msg="${m.id}">${opts}</select></div>` : ""}
        <div class="actions">
          <button class="btn primary" type="button" data-action="apply" data-id="${m.id}">${icon("check")}${t().apply}</button>
          ${choosing ? "" : `<button class="btn" type="button" data-action="choose" data-id="${m.id}">${t().notThis}</button>`}
          <button class="btn quiet" type="button" data-action="dismiss" data-id="${m.id}">${t().dismiss}</button>
        </div>`;
    }

    const matchBlock = target
      ? `<div class="sheet match"><span class="lbl">${choosing ? t().chose : t().matched}</span><strong>${esc(iw(target).name)}</strong><span>${esc(pw(target.p).name)}, ${esc(rw(target.room)[0])} <span class="mono muted" dir="ltr">${target.po}</span> ${statusTag(target)}</span>${choosing ? "" : `<span class="why">${esc(W.why)}</span>`}</div>`
      : `<div class="sheet match"><span class="lbl">${t().noMatch}</span><strong>${t().useFabric(m.candidates.length)}</strong><span class="why">${esc(W.why)}</span></div>`;

    return `<div class="detail">
      <div class="back"><button class="btn quiet" type="button" data-action="back">${icon("arrow-left", "dir")}${t().allEmails}</button></div>
      <article class="sheet email" aria-label="${t().original}">
        <dl class="email-meta">
          <dt>${t().from}</dt><dd>${esc(W.fromName)} <span class="mono muted" dir="ltr">&lt;${esc(m.from)}&gt;</span></dd>
          <dt>${t().to}</dt><dd><span class="mono" dir="ltr">orders@adlerlind.studio</span></dd>
          <dt>${t().received}</dt><dd>${fmtLong(m.received)}, <span dir="ltr">${m.time}</span></dd>
        </dl>
        <h2 class="email-subj">${esc(W.subject)}</h2>
        ${m.attachments.length ? `<div class="attach">${m.attachments.map((a) => `<span>${icon(a.endsWith(".pdf") ? "file-pdf" : "eye")}${esc(a)}</span>`).join("")}</div>` : ""}
        <div class="email-body">${renderBody(m)}</div>
      </article>
      <section class="reading" aria-labelledby="read-h">
        <h2 id="read-h" class="cap">${t().read}</h2>
        <div class="kind-line">${kindTag(m)}<span class="conf ${m.conf === "high" ? "" : "check"}">${confTxt}</span></div>
        ${matchBlock}
        <dl class="fields">${fields}</dl>
        ${W.note ? `<p class="note">${icon("warning")}<span>${esc(W.note)}</span></p>` : ""}
        ${impact}
        ${actions}
      </section>
    </div>`;
  }

  /* ---------- Orders ---------- */
  function renderOrders() {
    const f = FILTERS.find((x) => x[0] === ui.filter);
    const open = state.items.filter((i) => !arrived(i));
    const slipped = state.items.filter((i) => slip(i) > 0 && !arrived(i));
    const roomsAtRisk = PROJECTS.flatMap((p) => p.rooms.map((r) => readiness(p.id, r))).filter((x) => x.cls === "risk").length;
    const A = t().ax;

    const months = ["2026-10-01", "2026-11-01", "2026-12-01", "2027-01-01", "2027-02-01"];
    const axis = `<div class="axis" aria-hidden="true"><div class="grid-row">
      <span class="c-tag">${A.status}</span><span class="name">${A.item}</span>
      <span class="c-track"><span class="axis-scale">${months.map((d) => `<span style="inset-inline-start:${pct(d)}%">${fmtMonth(d)}</span>`).join("")}<span class="today-lbl" style="inset-inline-start:${pct(TODAY)}%">${A.today}</span></span></span>
      <span class="arr r">${A.arrives}</span><span class="r drift-h">${A.drift}</span>
    </div></div>`;

    let any = false;
    const body = PROJECTS.map((p) => {
      const rooms = p.rooms.map((r) => {
        const rows = state.items.filter((i) => i.p === p.id && i.room === r.id && f[1](i)).sort((a, b) => (a.eta < b.eta ? -1 : 1));
        if (!rows.length) return "";
        any = true;
        const rd = readiness(p.id, r);
        return `<div class="room">
          <div class="room-head"><h3>${esc(rw(r.id)[0])}</h3><p class="ready ${rd.cls}">${rd.icon ? icon(rd.icon) : ""}${esc(rd.text)}</p></div>
          <ul class="rows">${rows.map((it) => {
            const mv = ui.moved && ui.moved.id === it.id ? ui.moved.from : null;
            return `<li><button class="row grid-row" type="button" data-action="open" data-id="${it.id}" aria-label="${esc(t().rowLabel(iw(it).name, c().status[it.status], fmt(it.eta)))}">
              <span class="c-tag">${statusTag(it)}</span>
              <span class="name"><b>${esc(iw(it).name)}</b><small>${esc(iw(it).vendor)} <span class="mono" dir="ltr">${it.po}</span></small></span>
              <span class="c-track">${track(it, mv ? { from: mv } : {})}</span>
              <span class="arr mono">${fmt(it.eta)}</span>
              ${driftFig(it)}
            </button></li>`;
          }).join("")}</ul>
        </div>`;
      }).join("");
      if (!rooms) return "";
      return `<section class="proj"><header><h2>${esc(pw(p.id).name)}</h2><span>${esc(pw(p.id).client)}</span></header>${rooms}</section>`;
    }).join("");

    return `<section class="view">
      <div class="o-head">
        <h1>${t().ordersH}</h1>
        <div class="summary">
          <div><b>${open.length}</b>${t().openItems(PROJECTS.length)}</div>
          <div class="late"><b data-n="${slipped.length}">${slipped.length}</b>${t().late}</div>
          <div class="risk"><b data-n="${roomsAtRisk}">${roomsAtRisk}</b>${t().atRisk(roomsAtRisk)}</div>
        </div>
        <div class="filters" role="group" aria-label="${t().filterLabel}">${FILTERS.map(([id, fn]) => `<button type="button" data-action="filter" data-id="${id}" aria-pressed="${ui.filter === id}">${t().filters[id]}<span>${state.items.filter(fn).length}</span></button>`).join("")}</div>
      </div>
      ${axis}
      ${any ? body : `<p class="empty-orders">${t().noRows}</p>`}
    </section>`;
  }

  function histText(it, h) {
    if (h.k === "seed") { const [tx, src, q] = iw(it).h[h.i]; return { tx, src: `${src}, ${fmt(h.date)}`, q }; }
    const m = MSG[h.msg], W = c().msgs[h.msg];
    return { tx: h.k === "answered" ? t().answeredHist : W.summary, src: `${W.fromName}, ${fmt(m.received)}`, q: W.quote };
  }

  function renderDrawer() {
    const it = item(ui.drawer);
    if (!it) return "";
    const r = room(it), L = t().lg;
    return `<div class="scrim" data-action="close"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-h" id="drawer">
      <div class="drawer-top">
        <div><h2 id="dr-h">${esc(iw(it).name)}</h2><p class="sub">${esc(pw(it.p).name)}, ${esc(rw(it.room)[0])}</p></div>
        <button class="iconbtn" type="button" data-action="close" aria-label="${t().close}">${icon("x")}</button>
      </div>
      <div class="kind-line">${statusTag(it)}<span class="mono muted" dir="ltr">${it.po}</span><span class="muted">${esc(iw(it).vendor)}</span></div>
      <dl class="facts">
        <div><dt>${t().ordered}</dt><dd class="mono">${fmt(it.ordered)}</dd></div>
        <div><dt>${t().promised}</dt><dd class="mono">${fmt(it.promised)}</dd></div>
        <div><dt>${arrived(it) ? t().arrivedL : t().arrivesEst}</dt><dd class="mono">${fmt(it.eta)}</dd></div>
      </dl>
      <div>${track(it)}<div class="legend" style="margin-top:8px"><span><i class="lg promise"></i>${L.promised}</span><span><i class="lg eta"></i>${L.now}</span><span><i class="lg install"></i>${L.install} ${fmt(r.install)}</span></div></div>
      <div>
        <h3 class="cap" style="margin-bottom:6px">${t().history}</h3>
        <ol class="history">${it.history.slice().reverse().map((h) => {
          const x = histText(it, h);
          return `<li><span class="when mono">${fmt(h.date)}</span><span>${esc(x.tx)}<span class="src">${t().srcFrom} ${esc(x.src)}${x.q ? `: <q>${esc(x.q)}</q>` : ""}</span></span></li>`;
        }).join("")}</ol>
      </div>
    </aside>`;
  }

  /* ---------- Client updates ---------- */
  function eventText(e) {
    if (e.k === "seed") return c().events[e.id];
    const m = MSG[e.msg], W = c().msgs[e.msg], it = item(e.item), r = room(it), roomRef = rw(r.id)[1], CL = t().client, n = iw(it).short;
    if (m.clientKind === "late") return CL.late(n, iw(it).v, fmt(e.eta), fmt(e.before), W.reason, e.eta > r.install, roomRef, fmt(r.install), fmtLong(addDays(e.eta, 2)));
    if (m.clientKind === "backorder") return CL.backorder(n, W.phrase, roomRef);
    if (m.clientKind === "early") return CL.early(n, fmt(e.eta));
    if (m.clientKind === "damaged") return CL.damaged(n);
    return "";
  }
  function buildDraft(pid) {
    const evs = pendingEvents(pid).filter((e) => e.on !== false);
    if (!evs.length) return "";
    return t().draft(pw(pid).greet, evs.map(eventText).join("\n\n"), t().sign);
  }
  function draftFor(pid) {
    const d = state.drafts[pid];
    return d && d.edited ? d.text : buildDraft(pid);
  }

  function renderUpdates() {
    const pid = ui.project, P = pw(pid);
    const evs = pendingEvents(pid);
    const list = `<aside class="plist">
      <div class="view-head"><h1>${t().updatesH}</h1><p>${t().updatesP}</p></div>
      <ul>${PROJECTS.map((q) => {
        const n = pendingEvents(q.id).filter((e) => e.on !== false).length;
        return `<li><button class="p-row" type="button" data-action="project" data-id="${q.id}" aria-current="${q.id === pid}"><b>${esc(pw(q.id).name)}</b><small>${esc(pw(q.id).client)}</small><small class="${n ? "pending" : ""}">${n ? t().toShare(n) : state.sent[q.id] ? t().upToDate(fmt(state.sent[q.id])) : t().nothingYet}</small></button></li>`;
      }).join("")}</ul>
    </aside>`;

    let comp;
    if (!evs.length) {
      comp = `<div class="sheet caught">${icon("check")}<h2>${esc(t().nothingNew(P.greet))}</h2><p>${state.sent[pid] ? t().lastWent(fmtLong(state.sent[pid])) : ""}${t().whenApply}</p><div class="actions"><a class="btn" href="#review">${t().goReview}</a></div></div>`;
    } else {
      const d = state.drafts[pid];
      comp = `<div class="sheet composer">
        <header><h2>${esc(t().toClient(P.client))}</h2><p>${esc(P.name)}. ${state.sent[pid] ? t().lastSent(fmtLong(state.sent[pid])) : t().noneSent}</p></header>
        <fieldset class="included"><legend>${t().inDraft}</legend>${evs.map((e) => `<label><input type="checkbox" data-action="toggle-ev" data-id="${e.id}" ${e.on !== false ? "checked" : ""}><span>${esc(iw(item(e.item)).name)}<small>${t().appliedOn(fmt(e.date))}</small></span></label>`).join("")}</fieldset>
        <div class="draft-wrap"><label for="draft-${pid}">${t().message}</label><textarea id="draft-${pid}" data-action="draft" data-id="${pid}" dir="auto" spellcheck="true">${esc(draftFor(pid))}</textarea></div>
        ${d && d.edited ? `<p class="edited">${icon("warning")}<span>${t().edited}</span><button class="linkbtn" type="button" data-action="rebuild" data-id="${pid}">${t().rebuild}</button></p>` : ""}
        <div class="actions">
          <button class="btn primary" type="button" data-action="copy" data-id="${pid}">${icon("copy")}${t().copy}</button>
          <button class="btn" type="button" data-action="sent" data-id="${pid}">${icon("paper-plane-tilt", "dir")}${t().sent}</button>
        </div>
      </div>`;
    }
    return `<section class="view updates">${list}${comp}</section>`;
  }

  /* ================= Render ================= */
  const app = document.getElementById("app");
  const layer = document.getElementById("layer");
  function fit(ta) { ta.style.height = "auto"; ta.style.height = Math.max(240, ta.scrollHeight + 2) + "px"; }
  function render(focusSel) {
    document.title = t().title;
    renderHead();
    app.innerHTML = ui.view === "orders" ? renderOrders() : ui.view === "updates" ? renderUpdates() : renderReview();
    layer.innerHTML = (ui.drawer ? renderDrawer() : "") + (ui.toast ? `<div class="toast" role="status"><span>${esc(ui.toast.text)}</span>${ui.toast.undo ? `<button type="button" data-action="undo">${t().undo}</button>` : ""}</div>` : "");
    document.querySelectorAll("textarea[data-action=draft]").forEach(fit);
    if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus(); }
    ui.moved = null;
  }

  let toastTimer;
  function toast(text, undo) {
    ui.toast = { text, undo };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { ui.toast = null; ui.undo = null; const el = layer.querySelector(".toast"); if (el) el.remove(); }, undo ? 7000 : 3200);
  }

  function setLang(l) {
    LANG = l === "he" ? "he" : "en";
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
    pref("lading-lang", LANG);
    render(`input[name=lang][value=${LANG}]`);
  }
  function setTheme(v) {
    if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
    else document.documentElement.removeAttribute("data-theme");
    pref("lading-theme", v === "system" ? null : v);
    render(`input[name=theme][value=${v}]`);
  }

  /* ================= Actions ================= */
  function applyMsg(m) {
    ui.undo = JSON.stringify(state);
    const targets = m.conf === "pick" ? (ui.pick[m.id] || m.candidates) : [ui.other && ui.other.msg === m.id ? ui.other.to : m.item];
    targets.forEach((tid) => {
      const it = item(tid);
      const before = it.eta;
      if (m.set) {
        if (m.set.eta) it.eta = m.set.eta;
        if (m.set.status) it.status = m.set.status;
      }
      it.history.push({ date: TODAY, k: "msg", msg: m.id });
      if (m.clientKind) state.events.push({ id: "e" + Date.now() + tid, p: it.p, item: it.id, date: TODAY, on: true, k: "msg", msg: m.id, before, eta: it.eta });
      if (m.set && m.set.eta && m.set.eta !== before) ui.moved = { id: it.id, from: before };
      if (state.drafts[it.p] && !state.drafts[it.p].edited) delete state.drafts[it.p];
    });
    state.msgs[m.id] = { status: "applied", to: targets };
    ui.other = null;
    save();
    toast(targets.length > 1 ? t().noteAdded(targets.length) : t().appliedTo(iw(item(targets[0])).short), true);
  }

  function route() {
    const h = (location.hash || "").replace("#", "");
    ui.view = ["review", "orders", "updates"].includes(h) ? h : "review";
    ui.drawer = null;
    render();
  }

  document.addEventListener("click", (ev) => {
    if (ui.settings && !ev.target.closest(".settings")) { ui.settings = false; render(); }
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action, id = el.dataset.id;
    if (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA") return;
    if (a === "settings") { ui.settings = !ui.settings; render(ui.settings ? "input[name=lang]:checked" : "[data-action=settings]"); }
    else if (a === "select") { ui.sel = id; ui.other = null; render(); if (narrow()) window.scrollTo(0, 0); else document.querySelector(`.q-row[data-id="${id}"]`)?.focus(); }
    else if (a === "back") { ui.sel = null; render(); }
    else if (a === "apply") { applyMsg(MSG[id]); ui.sel = null; render(narrow() ? null : ".q-row[aria-selected=true]"); }
    else if (a === "dismiss") { ui.undo = JSON.stringify(state); state.msgs[id] = { status: "dismissed" }; save(); ui.sel = null; toast(t().dismissed, true); render(); }
    else if (a === "answered") {
      ui.undo = JSON.stringify(state);
      const it = item(MSG[id].item);
      it.history.push({ date: TODAY, k: "answered", msg: id });
      state.msgs[id] = { status: "answered", to: [it.id] }; save(); ui.sel = null; toast(t().answeredT, true); render();
    }
    else if (a === "choose") { ui.other = { msg: id, to: MSG[id].item }; render(`#other-${id}`); }
    else if (a === "undo") { if (ui.undo) { state = JSON.parse(ui.undo); save(); } ui.undo = null; ui.toast = null; render(); }
    else if (a === "filter") { ui.filter = id; render(); }
    else if (a === "open") { ui.drawer = id; ui.lastFocus = id; render("#drawer .iconbtn"); }
    else if (a === "close") { ui.drawer = null; render(); document.querySelector(`.row[data-id="${ui.lastFocus}"]`)?.focus(); }
    else if (a === "project") { ui.project = id; render(); }
    else if (a === "rebuild") { delete state.drafts[id]; save(); render(); }
    else if (a === "copy") {
      const ta = document.getElementById(`draft-${id}`);
      const done = () => { toast(t().copied); render(); };
      const fallback = () => { ta.focus(); ta.select(); toast(t().selected); layer.innerHTML = `<div class="toast" role="status"><span>${esc(ui.toast.text)}</span></div>`; };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
    }
    else if (a === "sent") {
      ui.undo = JSON.stringify(state);
      pendingEvents(id).filter((e) => e.on !== false).forEach((e) => { e.sent = TODAY; });
      state.sent[id] = TODAY; delete state.drafts[id]; save();
      toast(t().sentTo(pw(id).greet), true); render();
    }
    else if (a === "reset") { state = fresh(); save(); ui.sel = null; ui.other = null; ui.pick = {}; toast(t().resetDone); render(); }
  });

  document.addEventListener("change", (ev) => {
    const el = ev.target;
    const a = el.dataset.action;
    if (a === "lang") setLang(el.value);
    else if (a === "theme") setTheme(el.value);
    else if (a === "pick") {
      const m = MSG[el.dataset.msg];
      const cur = new Set(ui.pick[m.id] || m.candidates);
      el.checked ? cur.add(el.value) : cur.delete(el.value);
      ui.pick[m.id] = m.candidates.filter((x) => cur.has(x));
      render(`input[data-action=pick][value="${el.value}"]`);
    } else if (a === "other") {
      ui.other = { msg: el.dataset.msg, to: el.value }; render(`#other-${el.dataset.msg}`);
    } else if (a === "toggle-ev") {
      const e = state.events.find((x) => x.id === el.dataset.id); e.on = el.checked; save(); render(`input[data-id="${e.id}"]`);
    }
  });

  document.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.dataset.action === "draft") { fit(el); state.drafts[el.dataset.id] = { text: el.value, edited: true }; save(); }
  });
  document.addEventListener("focusout", (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.action === "draft" && state.drafts[el.dataset.id]?.edited && !document.querySelector(".edited")) {
      const pos = window.scrollY; render(); window.scrollTo(0, pos);
    }
  });

  /* Source highlighting: field -> the email line it came from */
  const lit = (el, on) => {
    const mark = document.getElementById(`src-${el.dataset.msg}-${el.dataset.src}`);
    if (!mark) return;
    mark.classList.toggle("lit", on);
    if (on && !narrow()) { const r = mark.getBoundingClientRect(); if (r.top < 80 || r.bottom > innerHeight) mark.scrollIntoView({ block: "center", behavior: "smooth" }); }
  };
  ["mouseover", "focusin"].forEach((ty) => document.addEventListener(ty, (ev) => { const f = ev.target.closest?.(".field"); if (f) lit(f, true); }));
  ["mouseout", "focusout"].forEach((ty) => document.addEventListener(ty, (ev) => { const f = ev.target.closest?.(".field"); if (f) lit(f, false); }));

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && ui.settings) { ui.settings = false; render("[data-action=settings]"); return; }
    if (ev.key === "Escape" && ui.drawer) { ui.drawer = null; render(); return; }
    if (ui.drawer && ev.key === "Tab") {
      const f = [...document.querySelectorAll("#drawer button")];
      if (f.length && !document.getElementById("drawer").contains(document.activeElement)) { ev.preventDefault(); f[0].focus(); }
    }
    const row = ev.target.closest?.(".q-row");
    if (row && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
      ev.preventDefault();
      const rows = [...document.querySelectorAll(".q-row")];
      const next = rows[rows.indexOf(row) + (ev.key === "ArrowDown" ? 1 : -1)];
      if (next) { ui.sel = next.dataset.id; ui.other = null; render(`.q-row[data-id="${next.dataset.id}"]`); }
    }
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
