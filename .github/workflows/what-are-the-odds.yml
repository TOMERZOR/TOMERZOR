# What are the odds? has its own home on Cloudflare: every push to its branch deploys the
# site (what-are-the-odds/public/) and its API (what-are-the-odds/worker/) as one Worker.
#   https://what-are-the-odds.moffy-app.workers.dev
# Questions that aren't in the checked list are answered by Workers AI (free daily allowance).
# Needs the repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template), and
# CLOUDFLARE_ACCOUNT_ID only if the token reaches several accounts.
# Until the token exists, the workflow skips itself instead of failing.
name: Deploy What are the odds

on:
  workflow_dispatch:
  push:
    branches: [claude/dazzling-sagan-sthauu]
    paths: ["what-are-the-odds/**", ".github/workflows/what-are-the-odds.yml"]

concurrency:
  group: what-are-the-odds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Test
        if: steps.secrets.outputs.ready == 'true'
        working-directory: what-are-the-odds
        run: npm test

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: what-are-the-odds
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then echo "::error::Could not find the workers.dev address in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the site and API answer
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/health" | grep -q '"service":"what-are-the-odds"' && curl -fsS "$url/" | grep -q 'What are the odds'; then
              curl -fsS -X POST "$url/api/odds" -H 'content-type: application/json' -d '{"q":"להיוולד בן","lang":"he"}' | grep -q '"id":"boy"' || { echo "::error::/api/odds did not answer a checked question"; exit 1; }
              curl -fsS -X POST "$url/api/room" | grep -qE '"code":"[A-Z]{4}"' || { echo "::error::/api/room did not make a game room"; exit 1; }
              ai=$(curl -sS -X POST "$url/api/odds" -H 'content-type: application/json' -d '{"q":"that it snows in Tel Aviv this year","lang":"en"}')
              echo "AI check: $ai"
              echo "$ai" | grep -qE '"kind":"(ai|unknown)"' || echo "::warning::Workers AI did not answer: $ai"
              grep -q "server: \"$url\"" what-are-the-odds/public/js/config.js || echo "::warning::what-are-the-odds/public/js/config.js should have server: \"$url\""
              echo "::notice::What are the odds is live at $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site did not answer"; exit 1
