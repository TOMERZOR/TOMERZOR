# Deploys the ArsLate API (arslate/worker) to Cloudflare Workers and points
# the site at it. Add these repository secrets (Settings > Secrets and
# variables > Actions), then run this workflow from the Actions tab:
#   ANTHROPIC_API_KEY      from console.anthropic.com (set a monthly spend limit there)
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard > My Profile > API Tokens > "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  optional; needed only if the token reaches several accounts
# Until the secrets exist, the workflow skips itself instead of failing.
name: Deploy ArsLate API

on:
  workflow_dispatch:
  push:
    branches: [claude/playwright-mcp-add-8e6qct]
    paths: ["arslate/worker/**", "arslate/examples.js", ".github/workflows/arslate-api.yml"]

concurrency:
  group: arslate-api
  cancel-in-progress: false

permissions:
  contents: write # to save the API address in the site's config
  pages: write # to rebuild the site afterwards

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::ANTHROPIC_API_KEY or CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install and test
        if: steps.secrets.outputs.ready == 'true'
        working-directory: arslate/worker
        run: |
          npm ci
          npm test

      - name: Cache and daily limit storage
        if: steps.secrets.outputs.ready == 'true'
        working-directory: arslate/worker
        run: node tools/ensure-kv.mjs

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: arslate/worker
        run: |
          npx wrangler deploy | tee deploy.log
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then echo "::error::Could not find the workers.dev address in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::ArsLate API is at $url"

      - name: Check the API answers
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | tee health.json | grep -q '"ai":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::The API did not report ai: true"; cat health.json; exit 1

      - name: Sample translations
        if: steps.secrets.outputs.ready == 'true'
        # A few real translations in the log, to see the live model's voice after each deploy (never fails the job).
        continue-on-error: true
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
        run: |
          while IFS='|' read -r persona text; do
            body=$(jq -nc --arg t "$text" --arg p "$persona" '{text: $t, persona: $p}')
            out=$(curl -sS -X POST "$API_URL/api/translate" -H 'content-type: application/json' \
              -H 'origin: https://tomerzor.github.io' --data "$body" | jq -r '.text // .error')
            echo "[$persona] $text  =>  $out"
          done <<'EOF_SAMPLES'
          ars|שלום, מה שלומך?
          ars|קניתי אוטו חדש והוא ממש יפה
          ars|תביא לי מים בבקשה
          ars|הבוס שלי מעצבן אותי, נמאס לי מהעבודה
          ars|השכן שלי משקר כל הזמן
          ars|אני מאחר קצת, אני תקוע בפקק
          ars|תוכל לבדוק לי את הרכב השבוע? כמה זה יעלה?
          ars|אתה רוצה לבוא למסיבה הערב?
          arsit|איזה כלב חמוד
          arsit|זה מצחיק מאוד
          arsit|תעזבי אותי, אני עייפה
          arsit|אני מאוד רוצה את השמלה הזאת
          EOF_SAMPLES

      - name: Point the site at the API
        if: steps.secrets.outputs.ready == 'true'
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i -E "s|^(  apiBase: )\"[^\"]*\",|\1\"$API_URL\",|" arslate/config.js
          if git diff --quiet; then echo "The site already uses $API_URL"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ArsLate: use the deployed API at $API_URL"
          git push
          # pushes made with the workflow token don't start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not start a Pages build; it runs on the next push."
