<!DOCTYPE html>
<!-- Pointy · "the cursor is the film" — a onetake composition (skill: .claude/skills/onetake, PolyForm Noncommercial) -->
<html lang="he">
<head>
<meta charset="utf-8">
<title>Pointy · onetake</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F4EFE7}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#hud{position:absolute;right:16px;bottom:12px;font:22px monospace;color:#c00;display:none}
#warm{position:absolute;left:-9999px;top:0;font-family:Heebo}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="warm"><b style="font-weight:500">אב Ab</b><b style="font-weight:700">אב Ab</b><b style="font-weight:800">אב Ab</b></div>
<script src="motion.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════════════════════════
// Every value is a pure function of t. One canvas; a keyed, operated camera over one world.
// The subject is one orange point: dot → caret → arrow → icon. BEATS.md is the beat sheet.
// ═══════════════════════════════════════════════════════════════════════════════════════════════
const W = 1080, H = 1920, DUR = 15, WH = { W, H };
const C = { paper: '#F4EFE7', ink: '#1C1813', mute: '#978E83', line: '#DCD3C6', card: '#FBF8F3', key: '#DDD4C7',
  img: '#E3DACC', hill: '#CDC3B4', subj: '#3A332C', chkA: '#E8E1D6', chkB: '#FBF8F3', lat: '#D4CABC', or: '#EE7A22', or2: '#F79B45', ord: '#D2600E' };
const { clamp, lerp, seg, sstep, ssstep, ease } = OM, spr = OM.spring;
const F = (w, s) => `${w} ${s}px Heebo`;

// ───────────────────────────── timeline (seconds) ─────────────────────────────
const T = {
  keysIn: 0.10, press: 0.80, keysOut: 1.08, dotPop: 0.84, hop0: 0.90, land: 1.40,
  barIn: 1.42, barDone: 1.85, type0: 1.95, cps: 26, send: 3.45,
  winIn: 3.70, winDone: 4.35, fly0: 3.80, land1: 4.85, card1: 4.95, click1: 5.55, remove: 5.65, done1: 6.35,
  iris2: 7.45, fly2: 7.95, land2: 8.25, click2: 8.32, iris3: 8.45, fly3: 8.75, land3: 9.05, click3: 9.12,
  words1: 7.50, words2: 9.10, wordsOut: 9.85, fold: 9.90, foldEnd: 10.45, glide: 10.40, center: 10.95,
  tag1: 10.80, tag2: 11.05, tagOut: 11.85, icon: 11.95, mark: 12.30, cta: 13.00, pill: 13.25,
};
const CLICKS = [T.click1, T.click2, T.click3];

// ───────────────────────────── world layout (1080×1920 at zoom 1) ─────────────────────────────
const OPT = { x: 270, y: 830, w: 170, h: 150, r: 26 }, SPC = { x: 460, y: 830, w: 350, h: 150, r: 26 };
const BAR = { x: 100, y: 1035, w: 880, h: 90, r: 45 }, BARY = 1080, TX_R = 902;
const WIN = { x: 60, y: 470, w: 960, h: 1000, r: 30 };
const DOT0 = { x: 540, y: 812 };
const IMG = { x: 100, y: 580, w: 580, h: 700 };
const ROW = i => ({ x: 710, y: 600 + i * 86, w: 270, h: 70 });
const PROP = i => ({ y: 1060 + i * 60 }), VAL = i => ({ x: 760, y: 1064 + i * 60, w: 150, h: 42 });
const TB = i => ({ x: 110 + i * 130, y: 590, w: 120, h: 46 });
const CARD = { x: 100, y: 1320, w: 880, h: 110, r: 22 };
const T1 = { x: 905, y: 812 }, T2 = { x: 885, y: 1090 }, T3 = { x: 330, y: 622 }, CEN = { x: 520, y: 880 };
const IC = { x: 540, y: 930, s: 250 };
const Q = ['איך מסירים רקע מתמונה?', 'איך עושים זום-אין איטי?', 'איך מוסיפים גרף לטבלה?'];
const STEP = [['לחצו על Remove BG', 'הרקע הוסר. זהו.'], ['הגדילו את Scale ל-130'], ['לחצו על Chart']];
const TARGET = [ROW(2), VAL(1), TB(1)];
const LANDS = [T.land1, T.land2, T.land3];

// ───────────────────────────── camera: keyed, then operated (hand + shakes) ─────────────────────────────
const KEYS = [
  { t: 0.00, x: 540, y: 905, zoom: 1.75 },
  { t: 0.86, x: 540, y: 905, zoom: 1.75 },
  { t: 1.12, x: 600, y: 860, zoom: 1.62, curve: ease.sineInOut },
  { t: 1.36, x: 760, y: 1060, zoom: 1.58, curve: ease.expoInOut },
  { t: 1.95, x: 720, y: 1075, zoom: 1.45, curve: ease.cubicInOut },
  { t: 2.85, x: 575, y: 1075, zoom: 1.45, curve: ease.sineInOut },
  { t: 3.45, x: 575, y: 1075, zoom: 1.45 },
  { t: 4.30, x: 540, y: 965, zoom: 1.00, curve: ease.cubicInOut },
  { t: 4.75, x: 640, y: 890, zoom: 1.10, curve: ease.expoInOut },
  { t: 5.45, x: 720, y: 860, zoom: 1.30, curve: ease.sineInOut },
  { t: 6.30, x: 540, y: 960, zoom: 1.04, curve: ease.cubicInOut },
  { t: 7.40, x: 540, y: 960, zoom: 1.04 },
  { t: 8.15, x: 600, y: 990, zoom: 1.07, curve: ease.expoInOut },
  { t: 8.95, x: 490, y: 900, zoom: 1.07, curve: ease.expoInOut },
  { t: 9.85, x: 490, y: 900, zoom: 1.07 },
  { t: 10.75, x: 530, y: 1000, zoom: 1.30, curve: ease.cubicInOut },
  { t: 11.85, x: 530, y: 1000, zoom: 1.30 },
  { t: 12.45, x: 540, y: 1115, zoom: 1.15, curve: ease.cubicInOut },
  { t: 15.00, x: 540, y: 1115, zoom: 1.15 },
];
const HITS = [[T.press, 6, 10], [T.land, 7, 10], [T.land1, 7, 9], [T.click1, 4, 12], [T.land2, 6, 10], [T.land3, 6, 10], [T.icon + 0.08, 10, 8]];
const RESTS = [[2.85, 3.45], [6.40, 7.35], [9.15, 9.85], [11.15, 11.85], [13.40, 15.5]];
function handEnv(t) { let r = 0; for (const [a, b] of RESTS) r = Math.max(r, sstep(a - 0.3, a, t) * (1 - sstep(b, b + 0.3, t))); return sstep(0.1, 0.6, t) * (1 - r); }
function camAt(t) {
  const c = OM.camera(t, KEYS, WH), e = handEnv(t) * 4.0;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom, y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom, rot = c.rot;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ───────────────────────────── canvas ─────────────────────────────
const DPR = Math.max(1, window.devicePixelRatio || 1);
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR;
const g = cv.getContext('2d');
let CAM, VIEW;
const setM = M => g.setTransform(DPR * M[0], DPR * M[1], DPR * M[2], DPR * M[3], DPR * M[4], DPR * M[5]);
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
function text(s, x, y, font, color, align = 'right', dir = 'rtl', alpha = 1) {
  if (alpha <= 0.002) return; g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.textAlign = align; g.direction = dir; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); g.restore();
}
function shadow(blur, dy, a) { const k = DPR * CAM.zoom; g.shadowColor = `rgba(60,40,20,${a})`; g.shadowBlur = blur * k; g.shadowOffsetY = dy * k; }
const noShadow = () => { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; };

// fixed grain (a dark-ish ground bands after encoding otherwise) — decided once, never on the render path
const GRAIN = (() => { const n = document.createElement('canvas'); n.width = n.height = 256; const c = n.getContext('2d'), d = c.createImageData(256, 256), r = OM.rng(11);
  for (let i = 0; i < 256 * 256; i++) { const v = r() < 0.5 ? 0 : 255; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = Math.floor(r() * 7); } c.putImageData(d, 0, 0); return n; })();

// ───────────────────────────── measured in __ready ─────────────────────────────
let TW = [], P0 = { x: 0, y: 0 }, MARKW = [], MARK_X0 = 0;
function measure() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.direction = 'rtl'; g.font = F(500, 42);
  TW = [...Array(Q[0].length + 1).keys()].map(n => g.measureText(Q[0].slice(0, n)).width);
  P0 = { x: TX_R - TW[TW.length - 1] - 8, y: BARY - 27 };
  g.direction = 'ltr'; g.font = F(800, 132); MARKW = [...'Pointy'].map(ch => g.measureText(ch).width);
  MARK_X0 = 540 - MARKW.reduce((a, b) => a + b, 0) / 2;
}

// ───────────────────────────── the point ─────────────────────────────
const ARROW = [[0, 0], [40, 16], [21, 21], [16, 40]];     // the Pointy pointer, tip at the origin
const caretX = t => TX_R - TW[OM.typeOn(t, T.type0, Q[0], { cps: T.cps }).n] - 8;
const PATH = [
  { t0: T.fly0, t1: T.land1, to: T1, arc: 230, curve: ease.quintInOut },
  { t0: T.fly2, t1: T.land2, to: T2, arc: 70, curve: ease.expoInOut },
  { t0: T.fly3, t1: T.land3, to: T3, arc: 90, curve: ease.expoInOut },
  { t0: T.glide, t1: T.center, to: CEN, arc: 90, curve: ease.quintInOut },
];
function tipAt(t) {
  let p = P0;
  for (const s of PATH) {
    if (t < s.t0) return p;
    if (t <= s.t1) { const u = s.curve(seg(t, s.t0, s.t1)); return { x: lerp(p.x, s.to.x, u), y: lerp(p.y, s.to.y, u) - s.arc * 4 * u * (1 - u) }; }
    p = s.to;
  }
  return p;
}
// → {kind:'rect', cx, cy, w, h, r} | {kind:'poly', pts, out, col} ; pos = the point the camera and probe follow
function pointer(t) {
  if (t < T.dotPop) return null;
  if (t < T.land) {
    const s = Math.max(0, spr(t - T.dotPop, 0.5, 18)), p = OM.hop(t, T.hop0, T.land, DOT0, { x: TX_R - 8, y: BARY }, { height: 260 });
    const im = OM.impact(t, T.land); return { kind: 'rect', cx: p.x, cy: p.y, w: 28 * s, h: 28 * s, r: 14 * s, pos: p };
  }
  if (t < T.send) {
    const k = spr(t - T.land, 0.55, 22), cx = caretX(t), blink = t > T.type0 ? OM.typeOn(t, T.type0, Q[0], { cps: T.cps }).caret : 1;
    return { kind: 'rect', cx, cy: BARY, w: Math.max(3, lerp(28, 6, k)), h: lerp(28, 54, k), r: lerp(14, 3, k), op: blink, pos: { x: cx, y: BARY } };
  }
  // caret → arrow, then the arrow; then it becomes the arrow inside the icon
  const km = clamp(spr(t - T.send, 0.62, 20), 0, 1.2), cx = P0.x + 8 - 0 * 1, top = { x: P0.x, y: P0.y };
  let tip = t < T.fly0 ? top : tipAt(t), S = 1.6, col = C.or, out = clamp(km, 0, 1);
  if (t >= T.icon) { const ki = spr(t - T.icon, 0.62, 15); const goal = { x: IC.x - 20 * 3.3 - 2, y: IC.y - 20 * 3.3 - 4 };
    tip = { x: lerp(CEN.x, goal.x, ki), y: lerp(CEN.y, goal.y, ki) }; S = lerp(1.6, 3.3, ki); out = 1 - clamp(ki * 1.4, 0, 1); col = ki; }
  for (const c of CLICKS) { const d = t - c; if (d >= 0 && d < 0.14) S *= 0.84; }
  const caret = [[-3, -27], [3, -27], [3, 27], [-3, 27]].map(([x, y]) => [P0.x + x, BARY + y]);
  const arrow = ARROW.map(([x, y]) => [tip.x + x * S, tip.y + y * S]);
  const pts = t < T.send + 0.6 ? caret.map((c, i) => [lerp(c[0], arrow[i][0], km), lerp(c[1], arrow[i][1], km)]) : arrow;
  return { kind: 'poly', pts, out, col, pos: tip, S };
}
function drawPointer(t) {
  const p = pointer(t); if (!p) return;
  g.save();
  if (p.kind === 'rect') { g.globalAlpha = p.op ?? 1; rr(p.cx - p.w / 2, p.cy - p.h / 2, p.w, p.h, p.r); shadow(10, 3, 0.18); g.fillStyle = C.or; g.fill(); }
  else {
    const path = () => { g.beginPath(); p.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
    g.lineJoin = 'round';
    if (p.out > 0.01) { path(); g.globalAlpha = p.out; g.lineWidth = 10; g.strokeStyle = '#fff'; shadow(14, 4, 0.22); g.stroke(); noShadow(); g.globalAlpha = 1; }
    const fill = typeof p.col === 'number' ? mix(C.or, '#ffffff', p.col) : p.col;
    path(); g.fillStyle = fill; g.fill(); g.lineWidth = 5; g.strokeStyle = fill; g.stroke();
  }
  g.restore();
}
function mix(a, b, k) { const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16)); return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(k)))).join(',')})`; }

// ───────────────────────────── keys ─────────────────────────────
function drawKey(K, t, i) {
  const e = OM.popIn(t, T.keysIn + i * 0.07, { rise: 70, s0: 0.9 }), o = OM.liftOut(t, T.keysOut + i * 0.04, { dur: 0.3, dist: 140, blur: 0 });
  const op = e.op * o.op; if (op <= 0.002) return;
  const down = 9 * (sstep(T.press - 0.05, T.press, t) - sstep(T.press + 0.10, T.press + 0.26, t));
  const cx = K.x + K.w / 2, cy = K.y + K.h / 2;
  g.save(); g.globalAlpha = op; g.translate(cx, cy + e.dy + o.dy); g.scale(e.s * o.s, e.s * o.s); g.translate(-cx, -cy);
  g.lineWidth = 2.5; g.strokeStyle = C.ink;
  rr(K.x, K.y + 12, K.w, K.h, K.r); g.fillStyle = C.key; shadow(24, 10, 0.16); g.fill(); noShadow(); g.stroke();
  const y = K.y + down; rr(K.x, y, K.w, K.h, K.r); g.fillStyle = C.card; g.fill(); g.stroke();
  if (i === 0) { // ⌥ drawn as strokes (Heebo has no U+2325)
    const gx = K.x + K.w / 2, gy = y + 58; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
    g.moveTo(gx - 26, gy - 13); g.lineTo(gx - 8, gy - 13); g.lineTo(gx + 8, gy + 13); g.lineTo(gx + 26, gy + 13); g.moveTo(gx + 6, gy - 13); g.lineTo(gx + 26, gy - 13); g.stroke();
    text('option', gx, y + 122, F(500, 26), C.ink, 'center', 'ltr');
  } else text('space', K.x + K.w / 2, y + 122, F(500, 26), C.ink, 'center', 'ltr');
  g.restore();
}

// ───────────────────────────── bar → window ─────────────────────────────
function shellRect(t) {
  if (t < T.winIn) { const m = OM.morphRect(t, T.barIn, T.barDone, { x: TX_R - 22, y: BARY - 14, w: 28, h: 28, r: 14 }, BAR); return m; }
  return OM.morphRect(t, T.winIn, T.winDone, BAR, WIN);
}
function irisR(t) { // the window's current clip radius around the arrow for the fold (Infinity = none)
  if (t < T.fold) return Infinity;
  const ir = OM.iris(t, T.fold, T.foldEnd, T3.x - WIN.x, T3.y - WIN.y, { W: WIN.w, H: WIN.h, curve: ease.quintInOut });
  return farOf(T3) * (1 - ir.k);                  // the iris run backwards: the window closes into the arrow
}
const farOf = p => Math.max(...[[WIN.x, WIN.y], [WIN.x + WIN.w, WIN.y], [WIN.x, WIN.y + WIN.h], [WIN.x + WIN.w, WIN.y + WIN.h]].map(([x, y]) => Math.hypot(x - p.x, y - p.y))) + 4;
function openR(t, t0, at) { const k = ease.expoOut(seg(t, t0, t0 + 0.5)); return k * farOf(at); }

function drawShell(t) {
  if (t < T.barIn) return;
  const R = shellRect(t), kw = t < T.winIn ? 0 : ease.expoOut(seg(t, T.winIn, T.winDone));
  const fr = irisR(t); if (fr <= 0.5) return;
  g.save();
  if (fr < Infinity) { const tp = tipAt(t); g.beginPath(); g.arc(T3.x, T3.y, fr, 0, Math.PI * 2); g.clip(); }
  rr(R.x, R.y, R.w, R.h, lerp(45, 30, kw)); g.fillStyle = C.card; shadow(lerp(20, 50, kw), lerp(6, 18, kw), 0.14); g.fill(); noShadow();
  g.lineWidth = 2.5; g.strokeStyle = C.ink; g.stroke();
  if (t < T.winIn + 0.2) { // bar contents: sparkle, mic, the typed question
    const a = sstep(T.barIn + 0.2, T.barIn + 0.45, t) * (1 - sstep(T.winIn, T.winIn + 0.2, t));
    g.save(); g.globalAlpha = a; sparkle(944, BARY, 16, C.or); mic(142, BARY); g.restore();
    if (t < T.winIn) { const ty = OM.typeOn(t, T.type0, Q[0], { cps: T.cps }); text(ty.str, TX_R, BARY + 15, F(500, 42), C.ink); }
  }
  if (t >= T.winIn) {
    g.save(); rr(R.x, R.y, R.w, R.h, 30); g.clip();
    const ta = sstep(0.45, 0.9, kw);  // title bar
    g.globalAlpha = ta; g.strokeStyle = C.line; g.lineWidth = 2; g.beginPath(); g.moveTo(R.x, R.y + 72); g.lineTo(R.x + R.w, R.y + 72); g.stroke();
    [0, 1, 2].forEach(i => { g.beginPath(); g.arc(R.x + 40 + i * 30, R.y + 36, 9, 0, Math.PI * 2); g.fillStyle = C.line; g.fill(); });
    g.globalAlpha = 1;
    // the apps: each new one opens from the arrow inside the window
    const a1 = sstep(T.winIn + 0.35, T.winIn + 0.75, t);
    drawApp(0, t, a1, kw);
    for (const [i, t0, at] of [[1, T.iris2, T1], [2, T.iris3, T2]]) {
      if (t < t0) continue; const r = openR(t, t0, at);
      g.save(); g.beginPath(); g.arc(at.x, at.y, r, 0, Math.PI * 2); g.clip(); rr(R.x, R.y, R.w, R.h, 30); g.fillStyle = C.card; g.fill(); drawApp(i, t, 1, 1); g.restore();
      if (r < farOf(at) - 2) { g.beginPath(); g.arc(at.x, at.y, r, 0, Math.PI * 2); g.lineWidth = 6; g.strokeStyle = C.or; g.stroke(); }
    }
    g.restore();
    rr(R.x, R.y, R.w, R.h, 30); g.lineWidth = 2.5; g.strokeStyle = C.ink; g.stroke();
  }
  g.restore();
  if (fr < Infinity && fr > 2) { g.beginPath(); g.arc(T3.x, T3.y, fr, 0, Math.PI * 2); g.lineWidth = 6; g.strokeStyle = C.or; g.globalAlpha = sstep(0, 0.1, seg(t, T.fold, T.foldEnd)); g.stroke(); g.globalAlpha = 1; }
}
function sparkle(x, y, r, col) { g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, rad = i % 2 ? r * 0.32 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } g.closePath(); g.fillStyle = col; g.fill(); }
function mic(x, y) { g.lineWidth = 3; g.strokeStyle = C.mute; g.lineCap = 'round'; rr(x - 7, y - 16, 14, 22, 7); g.stroke(); g.beginPath(); g.arc(x, y - 2, 13, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke(); g.beginPath(); g.moveTo(x, y + 11); g.lineTo(x, y + 17); g.stroke(); }

// ───────────────────────────── the three apps ─────────────────────────────
function title(i, t, kw) {
  if (i === 0) { const k = kw; text(Q[0], lerp(TX_R, WIN.x + WIN.w - 36, k), lerp(BARY + 15, WIN.y + 46, k), F(500, lerp(42, 27, k)), k < 0.5 ? C.ink : C.mute); }
  else text(Q[i], WIN.x + WIN.w - 36, WIN.y + 46, F(500, 27), C.mute);
}
function ringOn(i, t) { const land = LANDS[i]; if (t < land) return; const end = i === 0 ? T.click1 + 0.45 : 99;
  const a = sstep(land, land + 0.08, t) * (1 - sstep(end - 0.2, end, t)); if (a <= 0) return;
  const s = 1 - spr(t - land, 0.45, 16), R = TARGET[i], pad = 7 + 16 * s;
  g.save(); g.globalAlpha = a; rr(R.x - pad, R.y - pad, R.w + pad * 2, R.h + pad * 2, 16 + pad); g.lineWidth = 4; g.strokeStyle = C.or; g.stroke(); g.restore(); }
function stepCard(i, t, a) {
  let dy = 0, s = 1, op = a; if (i === 0) { const e = OM.popIn(t, T.card1, { rise: 30 }); dy = e.dy; s = e.s; op *= e.op; }
  if (op <= 0.002) return;
  const done = i === 0 && t >= T.done1, tk = OM.tick(t, T.done1);
  g.save(); g.globalAlpha = op; const cx = CARD.x + CARD.w / 2, cy = CARD.y + CARD.h / 2; g.translate(cx, cy + dy); g.scale(s, s); g.translate(-cx, -cy);
