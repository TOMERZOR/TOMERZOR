<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What are the odds?</title>
<meta name="description" content="מה הסיכוי ש...? כתבו כל שאלה וקבלו את הסיכוי האמיתי, או שחקו מול חבר: גבוה או נמוך? What are the odds? Ask anything, or play higher or lower with a friend.">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="What are the odds?">
<meta property="og:description" content="כתבו כל שאלה וקבלו את הסיכוי האמיתי, או שחקו מול חבר: גבוה או נמוך?">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/assistant-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<a class="skip" href="#q" data-t="skip">דלגו לשאלה</a>

<header class="bar">
  <a class="mark" href="./" dir="ltr">What are the odds<span>?</span></a>
  <div class="bar__tools">
    <button class="iconbtn" type="button" id="sound" aria-pressed="true"></button>
    <button class="iconbtn iconbtn--text" type="button" id="lang">EN</button>
  </div>
</header>

<div class="modes" role="tablist" aria-label="Mode">
  <button class="modes__tab" role="tab" type="button" id="tab-curious" aria-controls="view-curious" aria-selected="true" data-t="curious">סתם סקרן</button>
  <button class="modes__tab" role="tab" type="button" id="tab-game" aria-controls="view-game" aria-selected="false" data-t="game">משחק</button>
  <span class="modes__thumb" aria-hidden="true"></span>
</div>

<main>
  <section class="view" id="view-curious" role="tabpanel" aria-labelledby="tab-curious">
    <form class="ask" id="ask" autocomplete="off" role="search">
      <label class="ask__line" for="q">
        <input id="q" name="q" type="text" maxlength="170" enterkeyhint="go" spellcheck="false" value="מה הסיכוי ש" aria-label="מה הסיכוי ש...">
      </label>
      <button class="ask__dice" type="button" id="random"></button>
    </form>

    <section class="result" id="result" aria-live="polite" hidden>
      <p class="result__q" id="r-q"></p>
      <p class="thinking" id="r-thinking" hidden><span data-t="thinking">מחשב סיכויים</span><span class="thinking__dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <div class="result__body" id="r-body">
        <div class="odds" id="r-odds">
          <span class="odds__pre" id="r-pre"></span>
          <span class="odds__num" id="r-num"></span>
          <span class="odds__alt" id="r-alt"></span>
        </div>
        <div class="after" id="r-after">
          <p class="badge" id="r-badge"></p>
          <div class="meter" id="r-meter" aria-hidden="true">
            <div class="meter__track"><div class="meter__fill" id="r-fill"></div><div class="meter__dot" id="r-dot"></div></div>
            <div class="meter__marks" id="r-marks"></div>
            <div class="meter__ends"><span data-t="impossible">בלתי אפשרי</span><span data-t="certain">ודאי</span></div>
          </div>
          <p class="compare" id="r-compare"></p>
          <p class="explain" id="r-explain"></p>
          <p class="source" id="r-source"></p>
          <div class="actions">
            <button class="pill pill--ink" type="button" id="share"></button>
            <button class="pill" type="button" id="again" data-t="again">שאלה אחרת</button>
          </div>
        </div>
      </div>
      <div class="related" id="r-related" hidden>
        <p class="related__title" id="r-related-title"></p>
        <div class="chips" id="r-related-list"></div>
      </div>
    </section>

  </section>

  <section class="view" id="view-game" role="tabpanel" aria-labelledby="tab-game" hidden>
    <div id="game"></div>
  </section>
</main>

<footer class="foot">
  <p data-t="foot1">סטטיסטיקה על אוכלוסיות, לא תחזית עליך. לא ייעוץ רפואי, משפטי או כלכלי.</p>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<script src="js/config.js?v=5"></script>
<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
