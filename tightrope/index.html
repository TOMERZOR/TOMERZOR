<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>על החבל · Full Bucket</title>
<meta name="description" content="משחק איזון לטלפון: הולך על חבל בין שני הרים עם דלי מלא מים על הראש. מטים את הטלפון כדי לאזן, ואסור לשפוך יותר מדי.">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<canvas id="game" aria-label="על החבל"></canvas>

<div id="hud" hidden>
  <div class="hud-top">
    <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="hud-mid">
      <div class="hud-level" id="hud-level"></div>
      <div class="track"><i id="track-fill"></i><b id="track-man"></b></div>
    </div>
    <div class="hud-gauge-space" aria-hidden="true"></div>
  </div>
  <div class="hud-spill" id="hud-spill"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="countdown" id="countdown" hidden></div>
</div>

<div id="ui">
  <section id="menu" class="screen show">
    <div class="poster">
      <p class="eyebrow" data-t="tagline"></p>
      <h1 class="title" data-t="title"></h1>
      <div class="stack">
        <button class="btn primary" id="play-btn" type="button" data-t="play"></button>
        <button class="btn" id="levels-btn" type="button" data-t="levels"></button>
        <button class="btn ghost" id="settings-btn" type="button" data-t="settings"></button>
      </div>
    </div>
  </section>

  <section id="levels" class="screen">
    <div class="card">
      <h2 data-t="levels"></h2>
      <div class="grid" id="level-grid"></div>
      <button class="btn ghost" type="button" data-back data-t="back"></button>
    </div>
  </section>

  <section id="settings" class="screen">
    <div class="card">
      <h2 data-t="settings"></h2>
      <div class="row"><span data-t="sound"></span><button class="toggle" id="set-sound" type="button" role="switch"></button></div>
      <div class="row"><span data-t="invert"></span><button class="toggle" id="set-invert" type="button" role="switch"></button></div>
      <div class="row"><label for="set-sens" data-t="sensitivity"></label><input id="set-sens" type="range" min="0.5" max="1.8" step="0.1"></div>
      <div class="row"><span data-t="language"></span>
        <div class="seg"><button type="button" id="lang-he">עברית</button><button type="button" id="lang-en">English</button></div>
      </div>
      <button class="btn ghost" type="button" data-back data-t="back"></button>
    </div>
  </section>

  <section id="brief" class="screen">
    <div class="card">
      <p class="eyebrow" id="brief-num"></p>
      <h2 id="brief-name"></h2>
      <p id="brief-blurb"></p>
      <ul class="facts">
        <li id="brief-limit"></li>
        <li id="brief-length"></li>
      </ul>
      <p class="hint" id="brief-hold"></p>
      <button class="btn primary" id="brief-start" type="button" data-t="start"></button>
      <button class="btn ghost" type="button" id="brief-back" data-t="back"></button>
    </div>
  </section>

  <section id="pause" class="screen">
    <div class="card">
      <h2 data-t="paused"></h2>
      <button class="btn primary" id="resume-btn" type="button" data-t="resume"></button>
      <button class="btn" id="recal-btn" type="button" data-t="recalibrate"></button>
      <button class="btn" id="restart-btn" type="button" data-t="restart"></button>
      <button class="btn ghost" id="pause-menu-btn" type="button" data-t="menu"></button>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="card">
      <div class="stars" id="result-stars" hidden></div>
      <h2 id="result-title"></h2>
      <p id="result-sub"></p>
      <button class="btn primary" id="result-main" type="button"></button>
      <button class="btn ghost" id="result-menu" type="button" data-t="menu"></button>
    </div>
  </section>
</div>

<!-- Bump v= on every release so phones fetch the new files instead of cached ones. -->
<script type="importmap">
{ "imports": {
  "./js/assets.js": "./js/assets.js?v=3",
  "./js/audio.js": "./js/audio.js?v=3",
  "./js/i18n.js": "./js/i18n.js?v=3",
  "./js/levels.js": "./js/levels.js?v=3",
  "./js/render.js": "./js/render.js?v=3",
  "./js/sensors.js": "./js/sensors.js?v=3",
  "./js/sim.js": "./js/sim.js?v=3"
} }
</script>
<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
