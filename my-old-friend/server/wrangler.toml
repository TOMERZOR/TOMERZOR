# The server behind the My Old Friend app. Holds the Claude and ElevenLabs keys so the app needs no setup.
name = "my-old-friend"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Keep the server's log messages (errors from Claude or ElevenLabs) in the Cloudflare dashboard.
[observability]
enabled = true

# Secrets (set once, never committed):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ELEVENLABS_API_KEY
#   npx wrangler secret put APP_TOKEN        # any long random string; the same one goes in the app
#   npx wrangler secret put APPLE_ISSUER_ID  # App Store Connect → Users and Access → Integrations →
#   npx wrangler secret put APPLE_KEY_ID     #   In-App Purchase: the issuer ID, the key's ID,
#   npx wrangler secret put APPLE_PRIVATE_KEY #  and the whole downloaded .p8 file

# Free questions per phone, and the fair-use cap per subscriber per day.
[vars]
TRIAL_QUESTIONS = "20"
DAILY_LIMIT = "40"
BUNDLE_ID = "com.tomerzor.myoldfriend"
# Once the app is live, the QR code in printed ads (/go) redirects here:
# APP_STORE_URL = "https://apps.apple.com/il/app/..."

# Counts free questions and checks subscriptions. Create it once with
#   npx wrangler kv namespace create USAGE
# and paste the id it prints here.
[[kv_namespaces]]
binding = "USAGE"
id = "PASTE-THE-ID-FROM-wrangler-kv-namespace-create"

# Optional: keep every voice clip forever, shared by all users (create it first:
#   npx wrangler r2 bucket create moffy-voice), then uncomment:
# [[r2_buckets]]
# binding = "VOICE_CACHE"
# bucket_name = "moffy-voice"
