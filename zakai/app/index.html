<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF3E4">
  <title>זכאי – הסבא שיודע הכול</title>
  <link rel="icon" href="../zakai-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.elevenlabs.io">
  <link rel="preconnect" href="https://livekit.rtc.elevenlabs.io">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="wordmark" src="../zakai-transparent.svg" alt="זכiA">
    <button class="gear" id="settingsBtn" aria-label="הגדרות: בחירת מודל וקול">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
      <span id="modelChip">Gemini 3.5 Flash</span>
    </button>
  </header>

  <main class="stage">
    <div class="bubble" id="bubble" hidden><p id="bubbleText"></p></div>
    <div class="mascot-wrap" id="mascotWrap">
      <div class="halo" id="halo"></div>
      <div id="mascot"></div>
    </div>
    <p class="status" id="status" aria-live="polite">לחץ על המיקרופון ותשאל את זכאי מה שבא לך</p>
  </main>

  <section class="controls">
    <button class="mic" id="micBtn" aria-label="התחל שיחה עם זכאי">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span id="micLabel">דבר עם זכאי</span>
    </button>
    <form class="ask" id="askForm" autocomplete="off">
      <input id="askInput" type="text" placeholder="או תכתוב לו כאן…" aria-label="שאלה לזכאי">
      <button type="submit" aria-label="שלח">שלח</button>
    </form>
    <details class="log">
      <summary>מה דיברנו</summary>
      <ol id="log"></ol>
    </details>
  </section>

  <dialog id="settings" class="sheet">
    <form method="dialog">
      <h2>ההגדרות של זכאי</h2>

      <fieldset>
        <legend>המוח (מודל שפה)</legend>
        <div class="options" id="llmOptions"></div>
      </fieldset>

      <fieldset>
        <legend>הקול</legend>
        <div class="options" id="voiceOptions"></div>
      </fieldset>

      <label class="speed">קצב דיבור <output id="speedOut">0.92</output>
        <input id="speedInput" type="range" min="0.7" max="1.2" step="0.02" value="0.92">
      </label>

      <p class="note" id="settingsNote">השינוי ייכנס לתוקף בשיחה הבאה.</p>
      <menu><button value="save" class="primary">שמור</button></menu>
    </form>
  </dialog>

  <dialog id="setup">
    <form method="dialog">
      <h2>חיבור לזכאי</h2>
      <p>הדבק את מזהה הסוכן (Agent ID) מ־ElevenLabs:</p>
      <input id="agentIdInput" placeholder="agent_…" dir="ltr">
      <menu><button value="save">שמור</button></menu>
    </form>
  </dialog>

  <script src="vendor/elevenlabs-client-1.30.0.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
