<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>סימולטור הנדימן</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7cc4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="סימולטור הנדימן: בחר מקצוע, אסוף חלקים מהטנדר, תקן לשכנים, גבה מחיר (הוגן? בלי קבלה? מחיר מוסך?) והפוך לאגדה שעונה לטלפון.">
<meta property="og:title" content="סימולטור הנדימן">
<meta property="og:description" content="אינסטלטור, חשמלאי, מנעולן, שיפוצניק, טכנאי מיזוג או גנן. 5 דקות. מילה של מקצוען.">
<meta property="og:image" content="https://tomerzor.github.io/TOMERZOR/miktzoan/img/og.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="הנדימן">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>

<div id="hud" hidden>
  <div class="hud-row">
    <div class="pill coins"><span class="ico">🪙</span><b id="coins">0</b></div>
    <div class="pill rating"><span class="ico">⭐</span><b id="rating">5.0</b></div>
    <button class="pill btn-menu" id="menuBtn" aria-label="תפריט">☰</button>
  </div>
  <div class="level">
    <div class="lvl-badge" id="lvlNum">1</div>
    <div class="lvl-body">
      <div class="lvl-title" id="lvlTitle">שוליה</div>
      <div class="lvl-bar"><i id="lvlBar"></i></div>
    </div>
    <div class="day" id="dayBox"><span id="dayLabel">יום 1</span><div class="day-bar"><i id="dayBar"></i></div></div>
  </div>
  <div id="ribbon" class="ribbon" hidden><span></span></div>
</div>

<div id="toasts"></div>
<button id="excuseBtn" class="excuse" hidden>📱 <span>"אני בדרך!"</span></button>
<div id="joy" hidden><div class="knob"></div></div>

<!-- title -->
<section id="title" class="screen">
  <div class="logo">
    <div class="logo-top">סימולטור</div>
    <div class="logo-bot">הנדימן</div>
    <div class="logo-sub">5 דקות. מילה של מקצוען.™</div>
  </div>
  <p class="pick">בחר מקצוע:</p>
  <div class="pros" id="pros"></div>
  <p class="fine">* המשחק לא אחראי לנזקי מים, חשמל, או ביקורות בגוגל</p>
</section>

<!-- minigame -->
<section id="mg" hidden>
  <div class="mg-card">
    <div class="mg-head">
      <div class="mg-title"></div>
      <div class="mg-cust"></div>
    </div>
    <div class="mg-time"><i></i></div>
    <div class="mg-stage"><canvas></canvas></div>
    <div class="mg-foot">
      <div class="mg-prog"><i></i></div>
      <div class="mg-hint"></div>
      <button class="mg-kick" hidden>🦶 בעיטה בדלת</button>
    </div>
  </div>
</section>

<!-- generic modal -->
<section id="modal" hidden><div class="card"></div></section>

<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
