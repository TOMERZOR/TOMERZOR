<title>Never Have I Ever</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one white phone-width column, blurred sticky header, floating tab bar with a sliding dot.
   Motion: spring presses + ripples, staggered screen entrances, scroll-linked card rise,
   sliding segment thumbs, emoji bursts, flying tickets, stamp slam with confetti. */
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --soft: #F5F5F8;
  --ink: #111118;
  --muted: #74748A;
  --line: #EBEBF0;
  --blue: #2F4BFF;
  --blue-soft: #EEF0FF;
  --sun: #FFC93C;
  --sun-ink: #2B2000;
  --live: #F0384A;
  --mint: #22C98E;
  --scrim: rgb(17 17 24 / .32);
  --shadow: 0 1px 2px rgb(17 17 24 / .05), 0 10px 30px rgb(17 17 24 / .07);
  --shadow-lg: 0 2px 6px rgb(17 17 24 / .06), 0 22px 60px rgb(17 17 24 / .16);
  --spring: cubic-bezier(.3, 1.55, .5, 1);
  --out: cubic-bezier(.2, .9, .25, 1);
  --font-display: "Fredoka", "Rubik", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 22px;
  --col: 440px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 3px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
b { font-weight: 600; }

.app {
  max-width: var(--col); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-inline: -16px; padding: 14px 16px 12px;
  background: rgb(255 255 255 / .82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom: 1px solid transparent; transition: border-color .3s, box-shadow .3s;
}
.top.scrolled { border-bottom-color: var(--line); box-shadow: 0 6px 20px rgb(17 17 24 / .05); }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -.5px; direction: ltr; display: inline-flex; }
.logo .n { position: relative; color: var(--muted); animation: fadeN .4s .6s both; }
.logo .n::after {
  content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 3.5px; border-radius: 3px; background: var(--blue);
  transform: scaleX(0); transform-origin: left; animation: strike .5s var(--out) .5s forwards;
}
.logo .rest { animation: rise .6s var(--spring) both; }
@keyframes strike { to { transform: scaleX(1); } }
@keyframes fadeN { from { color: var(--ink); } }
.tagline { font-size: 13px; color: var(--muted); direction: ltr; font-style: italic; animation: rise .6s var(--out) .2s both; }

/* Screen entrances */
.view { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.view > * { --i: 0; }
.enter-fade > * { animation: rise .55s var(--out) both; animation-delay: calc(var(--i) * 45ms); }
.enter-fwd > * { animation: inFwd .5s var(--out) both; animation-delay: calc(var(--i) * 40ms); }
.enter-back > * { animation: inBack .5s var(--out) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes rise { from { opacity: 0; translate: 0 18px; } }
@keyframes inFwd { from { opacity: 0; translate: -36px 0; } }
@keyframes inBack { from { opacity: 0; translate: 36px 0; } }
@supports (animation-timeline: view()) {
  .view:not(.enter-fade):not(.enter-fwd):not(.enter-back) .feed-item:not(.game) {
    animation: scrollIn linear both; animation-timeline: view(); animation-range: entry 0% cover 22%;
  }
}
@keyframes scrollIn { from { opacity: .35; transform: translateY(34px) scale(.95); } }

.section { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.15; }

/* Pressables: spring scale + ripple */
.btn, .chip, .cheer, .tab, .tab-add, .seg button, .ticket, .x, .back {
  position: relative; overflow: hidden; transition: transform .45s var(--spring), background-color .25s, color .25s, border-color .25s, box-shadow .3s;
}
.btn:active, .chip:active, .cheer:active, .tab:active, .seg button:active, .x:active { transform: scale(.93); transition-duration: .08s; }
.ticket:active { transform: scale(.97); transition-duration: .1s; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); pointer-events: none; animation: ripple .65s var(--out) forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

.btn { border: 0; border-radius: 999px; padding: 13px 20px; font-size: 16px; font-weight: 600; }
.btn-ink { background: var(--ink); color: var(--bg); box-shadow: 0 6px 18px rgb(17 17 24 / .18); }
.btn-sun { background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 18px rgb(255 201 60 / .45); }
.btn-ghost { background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); }
.btn-shine { background-image: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / .65) 50%, transparent 65%); background-size: 250% 100%; background-repeat: no-repeat; animation: shine 3.2s ease-in-out 1s infinite; }
@keyframes shine { 0% { background-position: 130% 0; } 45%, 100% { background-position: -130% 0; } }
@media (hover: hover) {
  .btn:hover { transform: translateY(-2px); }
  .btn-ink:hover { box-shadow: 0 10px 24px rgb(17 17 24 / .24); }
  .chip:hover { border-color: var(--blue); }
  .ticket:hover { transform: translateY(-3px) rotate(-.5deg); }
  .card:hover, .post:hover { box-shadow: var(--shadow-lg); }
}
.btn-link { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 6px 0; transition: transform .3s var(--spring); }
.btn-link:active { transform: scale(.94); }
.btn-link[disabled] { color: var(--mint); cursor: default; }
.btn[disabled] { opacity: .4; cursor: default; box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip .ck { display: inline-block; width: 0; overflow: hidden; transition: width .3s var(--spring); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #FFFFFF; box-shadow: 0 6px 16px rgb(47 75 255 / .3); }
.chip[aria-pressed="true"] .ck { width: 1em; }
.boing { animation: boing .5s var(--spring); }
@keyframes boing { 30% { transform: scale(1.14); } 60% { transform: scale(.96); } }
.bump { display: inline-block; animation: bump .45s var(--spring); }
@keyframes bump { 40% { transform: scale(1.45); } }

/* Segmented with sliding thumb */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: var(--soft); }
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; inset-inline-start: 4px; width: calc((100% - 8px) / var(--n)); border-radius: 999px;
  background: var(--bg); box-shadow: 0 2px 8px rgb(17 17 24 / .1);
  transform: translateX(calc(var(--idx) * -100%)); transition: transform .5s var(--spring);
}
.seg button { z-index: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .count { display: inline-block; min-width: 20px; margin-inline-start: 6px; padding: 0 6px; border-radius: 999px; background: var(--live); color: #FFFFFF; font-size: 12px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }

/* Cards */
.card, .post { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); transition: box-shadow .35s; }
.card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.post { overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--blue); }
.who { display: inline-flex; align-items: center; gap: 9px; }
.av {
  width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font-weight: 700; font-size: 14px; background: hsl(var(--h) 85% 88%); color: hsl(var(--h) 60% 25%);
}
.avs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.avs .av { border: 2.5px solid var(--bg); margin-inline-start: -11px; animation: popIn .5s var(--spring) both; animation-delay: calc(var(--k, 0) * 70ms + .15s); }
.avs .av:first-child { margin-inline-start: 0; }
.avs .small { margin-inline-start: 6px; }
@keyframes popIn { from { transform: scale(0); } }
.confess { font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.2; text-wrap: balance; }
.reacts { display: flex; flex-wrap: wrap; gap: 8px; }
.cheer { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.cheer .e { display: inline-block; transition: transform .4s var(--spring); }
.cheer[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.cheer[aria-pressed="true"] .e { transform: scale(1.25) rotate(-10deg); }
.comment { font-size: 15px; border-inline-start: 3px solid var(--line); padding-inline-start: 10px; }
.pill { font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

/* Daily game card: animated gradient border + live countdown */
.game { position: relative; isolation: isolate; border-color: transparent; box-shadow: 0 14px 40px rgb(47 75 255 / .14); }
.game::before {
  content: ""; position: absolute; inset: -2.5px; z-index: -2; border-radius: calc(var(--r) + 2px);
  background: conic-gradient(from var(--angle), var(--blue), var(--sun), var(--live), var(--mint), var(--blue)); animation: spin 5s linear infinite;
}
.game::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: calc(var(--r) - 1px); background: var(--bg); }
@keyframes spin { to { --angle: 360deg; } }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); background: var(--soft); border-radius: 8px; padding: 1px 7px; }
.game-pre { font-weight: 600; color: var(--muted); }
.game-q { font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1.12; margin-top: -6px; }
.flip-out { animation: flipOut .22s ease-in forwards !important; }
.flip-in { animation: flipIn .55s var(--spring) both !important; }
@keyframes flipOut { to { transform: perspective(900px) rotateX(88deg); opacity: .3; } }
@keyframes flipIn { from { transform: perspective(900px) rotateX(-88deg); opacity: .3; } }
.pop-out { animation: popOut .16s ease-in forwards !important; }
.pop-in { animation: popInCard .45s var(--spring) both !important; }
@keyframes popOut { to { transform: scale(.97); opacity: .4; } }
@keyframes popInCard { from { transform: scale(.96); opacity: .4; } }
.unfold { animation: unfold .45s var(--out) both; }
@keyframes unfold { from { opacity: 0; translate: 0 -8px; } }

.big-num { display: flex; align-items: baseline; gap: 8px; }
.big-num b { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }

/* Live */
.live-tag { display: inline-flex; align-items: center; gap: 7px; color: var(--live); font-size: 13px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: beacon 1.6s ease-out infinite; }
@keyframes beacon { 0% { box-shadow: 0 0 0 0 rgb(240 56 74 / .55); } 100% { box-shadow: 0 0 0 10px rgb(240 56 74 / 0); } }
.timeline { list-style: none; margin: 0; padding: 0; padding-inline-start: 14px; border-inline-start: 2px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
.timeline li { display: flex; gap: 10px; position: relative; }
.timeline li::before { content: ""; position: absolute; inset-inline-start: -20px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
.timeline li:last-child::before { border-color: var(--live); background: var(--live); }
.timeline time { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline li:last-child span { font-weight: 600; }
.timeline li.new { animation: rise .5s var(--spring) both; }
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 10px; background: var(--soft); border-radius: 12px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

/* Bet */
.betbar { display: flex; gap: 3px; font-size: 13px; font-weight: 600; }
.betbar span { padding: 7px 12px; white-space: nowrap; border-radius: 999px; transition: flex-grow .7s var(--spring); transform-origin: right; animation: grow .9s var(--out) .2s both; }
.betbar .y { background: var(--blue); color: #FFFFFF; }
.betbar .n { background: var(--soft); color: var(--ink); text-align: end; }
@keyframes grow { from { transform: scaleX(.2); opacity: 0; } }

.expect { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.expect dt { font-weight: 600; color: var(--muted); }
.expect dd { margin: 0; }
.expect dd:last-of-type { font-weight: 500; }

/* Photo area */
.ph {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%; display: grid; place-items: center; overflow: hidden;
  background-size: 220% 220%; animation: drift 9s ease-in-out infinite alternate;
}
@keyframes drift { from { background-position: 0% 30%; } to { background-position: 100% 70%; } }
.ph .e { font-size: 66px; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgb(17 17 24 / .15)); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: zoomIn .7s var(--out) both; }
@keyframes zoomIn { from { transform: scale(1.12); opacity: 0; } }
.ph .stamp-at { left: 14px; bottom: 14px; }
.ph .stamp { background: rgb(255 255 255 / .9); }
.post-body { padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
.post-head { font-size: 15px; }
.post-head em { font-style: normal; font-family: var(--font-display); font-weight: 600; font-size: 20px; display: block; line-height: 1.25; }
.post-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 2px; }

/* Ticket */
.ticket {
  --stub: 92px;
  display: grid; grid-template-columns: minmax(0, 1fr) var(--stub); width: 100%; padding: 0; border: 0; border-radius: var(--r);
  background: var(--soft); text-align: start;
  -webkit-mask: radial-gradient(circle 10px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle 10px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 10px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle 10px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
}
.ticket.big { --stub: 108px; }
.t-main { padding: 18px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.t-pre { font-size: 13px; font-weight: 600; color: var(--muted); }
.t-text { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.ticket.big .t-text { font-size: 30px; }
.t-meta { font-size: 14px; color: var(--muted); }
.t-stub { background: var(--blue-soft); border-inline-start: 2px dashed rgb(47 75 255 / .25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 6px; text-align: center; }
.t-stub b { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
.t-stub small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.ticket.done .t-text { color: var(--muted); }
.t-priv { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; background: var(--bg); }
.ticket.shake { animation: shake .45s ease-out .4s; }
@keyframes shake { 20% { translate: -5px 2px; } 40% { translate: 4px -2px; } 60% { translate: -3px 1px; } 80% { translate: 2px 0; } }
.float { animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -5px; } }

/* Stamp */
.stamp-at { position: absolute; pointer-events: none; }
.ticket .stamp-at { left: calc(var(--stub) + 14px); top: 50%; translate: 0 -50%; }
.stamp {
  display: block; transform: rotate(-10deg); color: var(--blue); text-align: center; line-height: 1.1;
  border: 3px solid var(--blue); outline: 1.5px solid var(--blue); outline-offset: 2px; border-radius: 10px; padding: 5px 11px;
  font-family: var(--font-display); font-weight: 700;
}
.stamp span { display: block; font-size: 15px; }
.stamp b { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.stamp.big span { font-size: 22px; }
.stamp.fail { color: var(--live); border-color: var(--live); outline-color: var(--live); border-style: dashed; }
.stamp.slam { animation: slam .55s var(--out) .1s both; }
@keyframes slam {
  0% { transform: rotate(-26deg) scale(2.8); opacity: 0; }
  55% { transform: rotate(-8deg) scale(.9); opacity: 1; }
  75% { transform: rotate(-11deg) scale(1.05); }
  100% { transform: rotate(-10deg) scale(1); }
}
.stamp-at.inked::after { content: ""; position: absolute; inset: -12px; border-radius: 18px; border: 3px solid var(--blue); opacity: 0; animation: ring .7s var(--out) .42s; }
@keyframes ring { from { opacity: .7; transform: scale(.7); } to { opacity: 0; transform: scale(1.7); } }

/* Onboarding */
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 10px 4px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(42px, 13vw, 54px); line-height: .98; direction: ltr; text-align: left; letter-spacing: -1px; }
.hero h1 .w { display: inline-block; animation: wordIn .7s var(--spring) both; animation-delay: calc(var(--w) * 110ms + .1s); }
.hero h1 .w.blue { color: var(--blue); }
@keyframes wordIn { from { opacity: 0; transform: translateY(40px) rotate(6deg) scale(.8); } }
.hero p { font-size: 17px; color: var(--muted); }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: rgb(255 255 255 / .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  animation: dockIn .6s var(--spring) .5s both;
}
@keyframes dockIn { from { transform: translateY(100%); } }
.dock-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.dock-inner .btn { flex: 1; }

/* Tab bar */
.tabs {
  position: fixed; z-index: 6;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  animation: dockIn .6s var(--spring) both;
}
.tabs-inner {
  position: relative; max-width: 400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
  background: rgb(255 255 255 / .9); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-lg); padding: 6px;
}
.tab { background: none; border: 0; border-radius: 20px; color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tab svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .hop { animation: hop .55s var(--spring); }
@keyframes hop { 35% { transform: translateY(-6px) scale(1.15); } }
.tab-ind { position: absolute; bottom: 5px; width: 20px; height: 4px; border-radius: 4px; background: var(--blue); transition: left .5s var(--spring); }
.tab-add {

function swapCard(card, html, kind = 'pop') {
  const n = htmlEl(html);

function countUp(el) {
  if (RM) return;
  const to = +el.dataset.count, t0 = performance.now(), d = 900;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };

}

}

    </div>
    <div class="section"><span class="label">יש לי ניסיון ב</span>
      <div class="chips stagger">${S.veteran.map((v, k) => `<span class="chip" style="--k:${k}">${esc(v)}</span>`).join('')}</div></div>
    <div class="section"><span class="label">השושלת שלי</span>
      <div class="card">
        <p><b>למדתי מ:</b> ${learned.map(l => `${esc(l.name)} <span class="muted">(${esc(l.what)})</span>`).join(', ')}</p>
        <p><b>למדו ממני:</b> <span data-count="${S.taughtBase + S.tipsSent}">${S.taughtBase + S.tipsSent}</span> אנשים</p>
      </div></div>
    ${done.length ? `<div class="section"><span class="label">הפעמים הראשונות שלי</span>${done.map(n => ticket(n)).join('')}</div>` : ''}
    <div><button class="btn-link" data-a="reset">להתחיל את אב-הטיפוס מההתחלה</button></div>`;
}

// ---------- Render ----------
const lastSeg = {};
let liveT = null, enterT = null;
function render(dir = 'fade') {
  const v = $('#view');
  $('#tabs').hidden = !S.onboarded;
  $('#dock').hidden = S.onboarded;
  if (S.view && !findNever(S.view)) S.view = null;
  v.innerHTML = !S.onboarded ? viewOnboard()
    : S.view ? viewNever(findNever(S.view))
    : S.tab === 'home' ? viewHome() : S.tab === 'list' ? viewList() : viewProfile();
  if (!S.onboarded) renderDock();
  [...v.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 8)));
  v.classList.remove('enter-fade', 'enter-fwd', 'enter-back');
  if (dir && !RM) { void v.offsetWidth; v.classList.add('enter-' + dir); clearTimeout(enterT); enterT = setTimeout(() => v.classList.remove('enter-' + dir), 1000); }
  afterRender();
}
function afterRender() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  moveTabInd();
  document.querySelectorAll('#view .seg').forEach(seg => {
    const key = seg.dataset.segKey, idx = +getComputedStyle(seg).getPropertyValue('--idx');
    const thumb = seg.querySelector('.seg-thumb');
    if (key in lastSeg && lastSeg[key] !== idx && !RM) {
      thumb.style.transition = 'none'; seg.style.setProperty('--idx', lastSeg[key]); void thumb.offsetWidth;
      thumb.style.transition = ''; seg.style.setProperty('--idx', idx);
    }
    lastSeg[key] = idx;
  });
  document.querySelectorAll('#view [data-count]').forEach(e => io?.observe(e));
  if (S.onboarded && !S.view && S.tab === 'home' && S.seg === 'friends') scheduleLive();
}
function moveTabInd() {
  const act = document.querySelector(`.tab[data-tab="${S.tab}"]`), ind = $('#tab-ind');
  if (act && ind && act.offsetWidth) ind.style.left = (act.offsetLeft + act.offsetWidth / 2 - 10) + 'px';
}
addEventListener('resize', moveTabInd);
addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
function scheduleLive() {
  if (S.fun.liveMore || liveT) return;
  liveT = setTimeout(() => {
    const ol = document.querySelector('[data-card="live"] .timeline');
    if (!ol) { liveT = null; return; }
    const li = document.createElement('li'); li.className = 'new';
    li.innerHTML = `<time>…</time><span class="typing" aria-label="מקליד"><i></i><i></i><i></i></span>`;
    ol.appendChild(li);
    setTimeout(() => {
      const [t, x] = FUN.live.more;
      li.innerHTML = `<time>${t}</time><span>${esc(x)}</span>`; li.classList.remove('new'); void li.offsetWidth; li.classList.add('new');
      S.fun.liveMore = true; save(); liveT = null;
      burst(li, '🌊', 6);
    }, 2400);
  }, 3500);
}

// ---------- Sheets ----------
let comp = null, addPriv = 'friends';
function openSheet(html) {
  hideToast();
  const s = $('#sheet'), wasOpen = !s.hidden;
  s.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`;
  s.hidden = false; document.body.classList.add('sheet-open');
  if (!wasOpen) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('open')));
}
function closeSheet(then) {
  const s = $('#sheet');
  if (s.hidden) { then?.(); return; }
  s.classList.remove('open'); document.body.classList.remove('sheet-open');
  setTimeout(() => { s.hidden = true; s.innerHTML = ''; comp = null; then?.(); }, RM ? 0 : 300);
}
function openComposer(id) {
  const n = findNever(id);
  comp = { id, photo: null, helpers: new Set() };
  const people = [...new Set([...n.tips.map(t => t.by), ...n.nudges.map(x => x.by)])];
  openSheet(`
    <div class="panel-head"><h2>פעם ראשונה ש${esc(n.text)}</h2><button class="x" data-a="close" aria-label="סגירה">✕</button></div>
    <label class="photo-pick" for="c-photo" id="c-photo-box"><span class="cam">📸</span><span>להוסיף תמונה מהרגע</span><input type="file" id="c-photo" accept="image/*"></label>
    <div class="section"><label class="label" for="c-feel">איך היה?</label>
      <textarea id="c-feel" rows="3" placeholder="מה הפתיע? מה היית אומר/ת למי שעוד לא עשה?"></textarea></div>
    ${people.length ? `<div class="section"><span class="label">מי עזר לי</span>
      <div class="chips">${people.map(p => `<button class="chip" data-a="helper" data-name="${esc(p)}" aria-pressed="false"><span class="ck">✓</span>${esc(p)}</button>`).join('')}</div></div>` : ''}
    <button class="btn btn-sun btn-shine" data-a="publish">לחתום ולפרסם ✦</button>`);
}
function publish() {
  const n = findNever(comp.id);
  n.done = { date: today(), photo: comp.photo, feeling: $('#c-feel').value.trim(), helpers: [...comp.helpers] };
  if (!S.veteran.includes(n.text)) S.veteran.push(n.text);
  S.feed.unshift({ id: 'f' + S.nid++, cat: n.cat, never: n.text, caption: n.done.feeling, helpers: n.done.helpers, date: 'עכשיו', photo: n.done.photo });
  if (n.count) S.help.unshift({ id: 'h' + S.nid++, who: 'גל', never: n.text, note: 'רוצה לעשות את זה כבר שנה ולא מעז. איך מתחילים?', open: false, sent: false });
  save();
  openSheet(`
    <div class="celebrate">
      ${ticket(n, { big: true, slam: true, asButton: false, cls: 'shake' })}
      <h2>ברוך הבא לוותיקים 🎉</h2>
      <p>${n.count ? `${fmt(n.count)} אנשים עוד לא עשו את זה. מישהו מהם כבר שאל שאלה, ועכשיו יש לך מה לענות.` : 'זה Never חדש, ויש לך ניסיון בו לפני כולם.'}</p>
      ${n.done.helpers.length ? `<p class="small muted">${n.done.helpers.map(esc).join(', ')} יקבלו הודעה שעזרו לך.</p>` : ''}
      <div class="row">
        <button class="btn btn-ghost" data-a="closeToList">לרשימה</button>
        ${n.count ? `<button class="btn btn-sun btn-shine" data-a="goHelp">לעזור למישהו</button>` : ''}
      </div>
    </div>`);
  setTimeout(() => {
    const st = document.querySelector('.celebrate .stamp'); if (!st) return;
    const r = st.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2);
  }, 470);
}
function openAdd() {
  addPriv = 'friends';
  const mineTexts = S.mine.map(n => n.text);
  const sugg = CATALOG.filter(i => !mineTexts.includes(i.text)).slice(0, 8);
  openSheet(`
    <div class="panel-head"><h2>Never חדש</h2><button class="x" data-a="close" aria-label="סגירה">✕</button></div>
    <div class="section"><label class="label" for="add-text">אף פעם לא…</label>
      <input type="text" id="add-text" placeholder="למשל: צללתי עם בלון" maxlength="60" autocomplete="off"></div>
    <div class="section"><span class="label">רעיונות</span>
      <div class="chips stagger">${sugg.map((i, k) => `<button class="chip" style="--k:${k}" data-a="sugg" data-text="${esc(i.text)}">${esc(i.text)}</button>`).join('')}</div></div>
    <div class="section"><span class="label">מי יראה את זה</span>
      ${segCtl('priv', Object.entries(PRIV).map(([v, label]) => ({ a: 'priv', v, label })), addPriv)}</div>
    <button class="btn btn-ink" data-a="addSubmit">להוסיף לרשימה</button>`);
  setTimeout(() => $('#add-text')?.focus(), 350);
}
function addSubmit() {
  const inp = $('#add-text'), text = inp.value.trim();
  if (!text) { boing(inp); toast('צריך לכתוב מה עוד לא עשית'); return; }
  if (S.mine.some(n => n.text === text)) { boing(inp); toast('זה כבר ברשימה'); return; }
  const c = CATALOG.find(i => i.text === text);
  S.mine.unshift(makeNever(text, c ? c.cat : 'life', c ? c.count : 0, addPriv));
  S.tab = 'list'; S.listSeg = 'open'; S.view = null; save();
  closeSheet(() => { render('fade'); scrollTo(0, 0); toast(c ? `נוסף. ${fmt(c.count)} אנשים איתך בזה` : 'נוסף. נודיע כשיגיעו ותיקים'); });
}

// ---------- Events ----------
const go = (patch, dir = 'fade') => { Object.assign(S, patch); save(); render(dir); scrollTo(0, 0); };
const listTab = () => document.querySelector('.tab[data-tab="list"]');
const H = {
  pick: el => {
    const id = el.dataset.id;
    S.picked = S.picked.includes(id) ? S.picked.filter(x => x !== id) : [...S.picked, id];
    el.setAttribute('aria-pressed', S.picked.includes(id)); boing(el); save(); renderDock(); bump($('#pick-count'));
  },
  finish: () => {
    S.mine = S.picked.map(id => CATALOG.find(c => c.id === id)).map(c => makeNever(c.text, c.cat, c.count));
    go({ onboarded: true, tab: 'home', seg: 'friends', view: null });
    toast('הרשימה שלך מחכה בלשונית "הרשימה שלי"');
  },
  skip: () => { if (!S.picked.length) S.picked = fresh().picked; H.finish(); },
  tab: el => { const svg = el.querySelector('svg'); svg.classList.remove('hop'); void svg.offsetWidth; svg.classList.add('hop'); go({ tab: el.dataset.tab, view: null }); },
  seg: el => go({ seg: el.dataset.v }),
  lseg: el => go({ listSeg: el.dataset.v }),
  open: el => go({ view: el.dataset.id }, 'fwd'),
  back: () => go({ view: null }, 'back'),
  react: el => {
    const k = el.dataset.k, on = (S.fun.r[k] = !S.fun.r[k]); save();
    el.setAttribute('aria-pressed', on);
    const n = el.querySelector('.n'); n.textContent = fmt(+el.dataset.base + (on ? 1 : 0)); bump(n);
    if (on) burst(el, el.dataset.e);
  },
  answer: el => {
    S.fun.q = el.dataset.v; save();
    swapCard(el.closest('[data-card]'), cardQ(), 'flip');
    toast('התשובה נשמרה בסוד. החשיפה ב-21:00 🤫');
  },
  bet: el => {
    S.fun.bet = el.dataset.v; save();
    const card = el.closest('[data-card]'), c = betCounts();
    card.querySelector('.y').style.flexGrow = c.yes; card.querySelector('.n').style.flexGrow = c.no;
    card.querySelectorAll('.bn').forEach((b, i) => { b.textContent = i ? c.no : c.yes; });
    bump(card.querySelector(el.dataset.v === 'yes' ? '.y .bn' : '.n .bn'));
    burst(el, el.dataset.v === 'yes' ? '☕' : '🙈', 7);
    card.querySelector('.bet-actions').replaceWith(htmlEl(betActions()));
  },
  join: el => {
    S.fun.joined = true;
    if (!S.mine.some(n => n.text === FUN.group.never)) { const c = CATALOG.find(i => i.text === FUN.group.never); S.mine.unshift(makeNever(c.text, c.cat, c.count)); }
    save();
    const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top, 28);
    flyTo(el, listTab(), 'זריחה מהמצדה');
    swapCard(el.closest('[data-card]'), cardGroup());
    toast('שמרו לך מקום. יציאה בחמישי ב-02:30');
  },
  addFromFeed: el => {
    const text = el.dataset.text, c = CATALOG.find(i => i.text === text);
    S.mine.unshift(makeNever(text, c ? c.cat : 'life', c ? c.count : 0)); save();
    flyTo(el, listTab(), text);
    const nb = htmlEl(addBtn(text, '')); el.replaceWith(nb); bump(nb);
    toast('נוסף לרשימה שלך');
  },
  organize: el => { burst(el, '🍿', 8); toast('נשלחה הזמנה לחמישה חברים: ערב טיטאניק, שישי ב-20:00'); },
  failTip: el => { burst(el, '💡', 6); toast('הטיפ שלך יגיע לעומר לפני הניסיון השני'); },
  thank: el => {
    findNever(el.dataset.id).tips[+el.dataset.i].thanked = true; save();
    burst(el, '💙', 7);
    const nb = htmlEl('<button class="btn-link" disabled>התודה נשלחה ✓</button>'); el.replaceWith(nb); bump(nb);
  },
  nudge: el => {
    const n = findNever(el.dataset.id), msg = { by: 'מאיה', text: 'יאללה, אני איתך בזה 💪' };
    n.nudges.push(msg); save();
    const box = $('#nudges'); box.hidden = false;
    box.insertAdjacentHTML('beforeend', `<p class="bubble"><b>${esc(msg.by)}:</b> ${esc(msg.text)}</p>`);
    box.lastElementChild.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' });
    burst(el, '💪', 6); toast('ביקשת דחיפה. מאיה כבר ענתה');
  },
  done: el => openComposer(el.dataset.id),
  helper: el => { const p = el.dataset.name; comp.helpers.has(p) ? comp.helpers.delete(p) : comp.helpers.add(p); el.setAttribute('aria-pressed', comp.helpers.has(p)); boing(el); },
  publish: () => publish(),
  close: () => closeSheet(),
  closeToList: () => closeSheet(() => go({ tab: 'list', listSeg: 'done', view: null })),
  goHelp: () => closeSheet(() => go({ tab: 'home', seg: 'help', view: null })),
  tipOpen: el => {
    const h = S.help.find(x => x.id === el.dataset.id);
    S.help.forEach(x => (x.open = x === h));
    swapCard(el.closest('[data-card]'), cardHelp(h));
    setTimeout(() => $(`#tip-${h.id}`)?.focus(), 250);
  },
  tipSend: el => {
    const h = S.help.find(x => x.id === el.dataset.id), ta = $(`#tip-${h.id}`);
    if (!ta.value.trim()) { boing(ta); toast('הטיפ ריק'); return; }
    h.sent = true; h.open = false; S.tipsSent++; save();
    burst(el, '✨', 10);
    swapCard(el.closest('[data-card]'), cardHelp(h));
    const cnt = document.querySelector('.seg .count'), left = S.help.filter(x => !x.sent).length;
    if (cnt) { if (left) { cnt.textContent = left; bump(cnt); } else cnt.remove(); }
    toast(`${h.who} קיבל/ה את הטיפ שלך`);
  },
  add: () => openAdd(),
  sugg: el => { const i = $('#add-text'); i.value = el.dataset.text; boing(el); boing(i); },
  priv: el => {
    addPriv = el.dataset.v;
    const seg = el.closest('.seg'), btns = [...seg.querySelectorAll('button')];
    btns.forEach(b => b.setAttribute('aria-pressed', b === el));
    seg.style.setProperty('--idx', btns.indexOf(el));
  },
  addSubmit: () => addSubmit(),
  reset: () => closeSheet(() => { S = fresh(); save(); Object.keys(lastSeg).forEach(k => delete lastSeg[k]); render('fade'); scrollTo(0, 0); }),
};
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && H[el.dataset.a]) H[el.dataset.a](el, e);
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn, .chip, .cheer, .tab, .seg button, .ticket, .back');
  if (!b || b.disabled || RM) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2;
  const rp = document.createElement('span'); rp.className = 'ripple';
  rp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(rp); rp.addEventListener('animationend', () => rp.remove());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'add-text') addSubmit();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'c-photo' || !e.target.files[0] || !comp) return;
  const r = new FileReader();
  r.onload = () => { comp.photo = r.result; $('#c-photo-box').insertAdjacentHTML('beforeend', `<img src="${r.result}" alt="">`); };
  r.readAsDataURL(e.target.files[0]);
});

if (location.hash === '#feed' && !S.onboarded) H.skip(); else render('fade');
</script>
