<!DOCTYPE html>
<!-- Pointy — narrated screen reel (TikTok / Instagram, 1080×1920, Hebrew). A onetake composition: every value is a pure
     function of t, every beat sits on a word of the voiceover (vo.js = word timings of the chosen take). -->
<html lang="he">
<head>
<meta charset="utf-8">
<title>Pointy · screen reel</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#hud{position:absolute;left:16px;top:12px;font:24px monospace;color:#f33;display:none;z-index:9}
#warm{position:absolute;left:-9999px;top:0;font-family:Heebo}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="warm"><b style="font-weight:500">אב Ab</b><b style="font-weight:700">אב Ab</b><b style="font-weight:800">אב Ab</b></div>
<script src="motion.js"></script>
<script src="vo.js"></script>
<script>
const W = 1080, H = 1920;
const { clamp, lerp, seg, sstep, ease } = OM, spr = OM.spring;
const F = (w, s) => `${w} ${s}px Heebo`;
const C = { or: '#F08A2E', or2: '#FFAE5C', ord: '#D2600E', red: '#FF3B30', ppBlue: '#37a3f0' };
const cv = document.getElementById('cv'); cv.width = W; cv.height = H; const g = cv.getContext('2d');

// ───────────────────────────── beats on words ─────────────────────────────
const clean = s => s.replace(/[.,?!:"]/g, '');
const V = (word, k = 0) => { const ws = VO.filter(w => clean(w.w) === word); if (!ws[k]) throw new Error('no word ' + word + ' #' + k); return ws[k].t0; };
const VE = (word, k = 0) => VO.filter(w => clean(w.w) === word)[k].t1;
const K = {
  stuck: V('נתקעתם'), button: V('הכפתור'), instead: V('במקום'), n14: V('14'), yt: V('ביוטיוב'), meet: V('תכירו'), pointy: V('פוינטי'),
  press: V('לוחצים'), opt: V('אופשן'), space: V('ורווח'), ask: V('ושואלים'), type0: V('איך'), typeEnd: VE('איטי'),
  looks: V('מסתכל'), cursor: V('והסמן'), shows: V('מראה'), click: V('ללחוץ'), press2: V('לוחצים', 1), done: V('עשיתי'), next: V('בשלב'),
  thatsit: V('וזהו'), ready: V('מוכן'), noguide: V('בלי'), every: V('בכל'), excel: V('אקסל'), ae: V('אפטר'), all: V('כל'),
  mac: V('במק'), win: V('ובווינדוס'), want: V('רוצים'), comment: V('תגיבו'), plugin: V('פלאגין'), dm: V('בפרטי'), end: VO[VO.length - 1].t1,
};
const ENTER = K.typeEnd + 0.12;
const T = { land1: K.shows, card1: K.shows + 0.15, click1: K.press2 + 0.05, land2: K.next - 0.05, click2: K.next + 0.45,
  land3: K.thatsit + 0.05, val3: K.thatsit + 0.25, play: K.ready - 0.45 };
const SW1 = K.every + 0.3, SW2 = K.ae - 0.45, MC = K.all + 0.15;     // app switches and Mission Control
const DUR = K.end + 1.35;

// ───────────────────────────── assets ─────────────────────────────
const IMG = { pr: new Image(), xl: new Image(), ae: new Image() };
IMG.pr.src = 'premiere.jpg'; IMG.xl.src = 'excel.jpg'; IMG.ae.src = 'ae.jpg';
const BLUR = {};      // a blurred, darkened copy of each app for the backdrop, made once
function makeBlur(k) { const c = document.createElement('canvas'); c.width = 270; c.height = 480; const x = c.getContext('2d');
  x.filter = 'blur(10px) brightness(0.42) saturate(1.3)'; x.drawImage(IMG[k], 1300, 0, 1240, 2160, -30, -30, 330, 540); BLUR[k] = c; }

// ───────────────────────────── helpers ─────────────────────────────
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
function text(s, x, y, font, color, align = 'right', dir = 'rtl', alpha = 1) { if (alpha <= 0.003) return; g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.textAlign = align; g.direction = dir; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); g.restore(); }
function shadow(b, dy, a, col = '0,0,0') { g.shadowColor = `rgba(${col},${a})`; g.shadowBlur = b; g.shadowOffsetY = dy; }
const noShadow = () => { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; };
const pop = (t, t0, o) => OM.popIn(t, t0, { rise: 40, s0: 0.6, ds: 0.4, zeta: 0.55, omega: 16, ...o });
function ARROW(x, y, S, col, outline = 1) {
  const P = [[0, 0], [40, 16], [21, 21], [16, 40]].map(([a, b]) => [x + a * S, y + b * S]);
  const path = () => { g.beginPath(); P.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath(); };
  g.save(); g.lineJoin = 'round';
  if (outline) { path(); g.lineWidth = 5 * S; g.strokeStyle = '#fff'; shadow(10 * S, 3 * S, 0.35); g.stroke(); noShadow(); }
  path(); g.fillStyle = col; g.fill(); g.lineWidth = 2.4 * S; g.strokeStyle = col; g.stroke(); g.restore();
}
function MACCURSOR(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); g.beginPath();
  g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.2, 17); g.lineTo(9, 25.5); g.lineTo(12.4, 24); g.lineTo(8.8, 15.8); g.lineTo(15.6, 15.6); g.closePath();
  shadow(4, 1.5, 0.45); g.fillStyle = '#000'; g.fill(); noShadow(); g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.stroke(); g.restore(); }
function sparkle(x, y, r, col) { g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, d = i % 2 ? r * 0.3 : r; g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } g.closePath(); g.fillStyle = col; g.fill(); }
function pointyIcon(cx, cy, s, alpha = 1) { if (alpha <= 0.003 || s <= 0.5) return; g.save(); g.globalAlpha *= alpha; g.translate(cx, cy);
  const gr = g.createLinearGradient(0, -s / 2, 0, s / 2); gr.addColorStop(0, C.or2); gr.addColorStop(1, C.ord);
  rr(-s / 2, -s / 2, s, s, s * 0.26); shadow(s * 0.25, s * 0.08, 0.5); g.fillStyle = gr; g.fill(); noShadow(); ARROW(-s * 0.27, -s * 0.27, s / 75, '#fff', 0); g.restore(); }
function chip(cx, cy, label, t0, t, { out = 99, icon = null, font = F(800, 44) } = {}) {
  if (t < t0 - 0.02 || t > out + 0.4) return; const e = pop(t, t0), o = OM.liftOut(t, out, { dur: 0.25, dist: 40, blur: 0 });
  g.save(); g.font = font; const tw = g.measureText(label).width, iw = icon ? 74 : 0, w = tw + 64 + iw, h = 96;
  g.globalAlpha = e.op * o.op; g.translate(cx, cy + e.dy + o.dy); g.scale(e.s, e.s);
  rr(-w / 2, -h / 2, w, h, h / 2); shadow(30, 10, 0.45); g.fillStyle = 'rgba(22,18,28,0.9)'; g.fill(); noShadow(); g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.16)'; g.stroke();
  if (icon) icon(-w / 2 + 32 + 28, 0); text(label, -w / 2 + 32 + iw, 15, font, '#fff', 'left', 'ltr'); g.restore();
}
function glass(R, r, tint, img) { g.save(); rr(R.x, R.y, R.w, R.h, r); shadow(40, 14, 0.5); g.fillStyle = 'rgba(40,40,46,0.35)'; g.fill(); noShadow(); g.clip();
  if (img && img.complete) { const m = 40; g.filter = 'blur(16px)'; g.drawImage(img, (R.x - m) * 2, (R.y - 26 - m) * 2 * 1080 / 1054, (R.w + 2 * m) * 2, (R.h + 2 * m) * 2 * 1080 / 1054, R.x - m, R.y - m, R.w + 2 * m, R.h + 2 * m); g.filter = 'none'; }
  tint(); g.restore(); rr(R.x, R.y, R.w, R.h, r); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.65)'; g.stroke(); }
const whiteTint = (R, a = 0.82) => () => { g.fillStyle = `rgba(246,246,248,${a})`; g.fillRect(R.x - 50, R.y - 50, R.w + 100, R.h + 100); };
const rainbowTint = R => () => { g.fillStyle = 'rgba(250,250,252,0.55)'; g.fillRect(R.x, R.y, R.w, R.h);
  const gr = g.createLinearGradient(R.x + R.w, R.y, R.x, R.y + R.h); gr.addColorStop(0, 'rgba(165,205,255,0.62)'); gr.addColorStop(0.5, 'rgba(196,240,206,0.55)'); gr.addColorStop(1, 'rgba(252,240,160,0.62)'); g.fillStyle = gr; g.fillRect(R.x, R.y, R.w, R.h); };
function pill(x, y, w, h, label, fill, fg, outline) { rr(x, y, w, h, h / 2); if (fill) { g.fillStyle = fill; g.fill(); } if (outline) { g.lineWidth = 1.6; g.strokeStyle = outline; g.stroke(); } text(label, x + w / 2, y + h / 2 + 7, F(800, 18), fg, 'center'); }

// ───────────────────────────── the screens (screen space 1920×1080) ─────────────────────────────
const PY = y => 26 + y * (1054 / 1080), PR = (x, y, w, h) => ({ x, y: PY(y), w, h: h * 1054 / 1080 });
const CLIP = PR(1036, 860, 826, 33), STOPW = { x: 78, y: PY(282) }, SCALEV = PR(333, 271, 52, 22), MON = PR(1066, 113, 762, 398);
const BAR = { x: 560, y: 118, w: 800, h: 66 }, SUG = { x: 576, y: 196, w: 768, h: 232 };
const APPS = {
  pr: { name: 'Premiere Pro', q: 'איך עושים זום אין איטי?', look: 'Adobe Premiere' },
  xl: { name: 'Excel', q: 'איך מוסיפים גרף עמודות?', look: 'Microsoft Excel', target: { x: 1092, y: PY(160) }, ring: PR(1060, 120, 66, 66), card: 'לחצו על Column ובחרו גרף', steps: 2 },
  ae: { name: 'After Effects', q: 'איך עושים פייד-אין לטקסט?', look: 'Adobe After Effects', target: { x: 212, y: PY(956) }, ring: PR(196, 942, 32, 30), card: 'לחצו על השעון ליד Opacity', steps: 3 },
};
const PT = [   // Pointy's pointer in Premiere
  { t0: ENTER + 0.35, t1: T.land1, from: { x: 1240, y: 150 }, to: { x: CLIP.x + 470, y: CLIP.y + 22 }, arc: 160 },
  { t0: K.next - 0.4, t1: T.land2, to: { x: STOPW.x + 12, y: STOPW.y + 10 }, arc: 120 },
  { t0: T.land2 + 0.6, t1: T.land3, to: { x: SCALEV.x + 40, y: SCALEV.y + 16 }, arc: 40 },
];
function pointerAt(t) { let p = PT[0].from;
  for (const s of PT) { if (t < s.t0) return p; if (t <= s.t1) { const u = ease.expoInOut(seg(t, s.t0, s.t1)); return { x: lerp(p.x, s.to.x, u), y: lerp(p.y, s.to.y, u) - s.arc * 4 * u * (1 - u) }; } p = s.to; } return p; }
const STEPS = [
  { R: { x: 1250, y: 548, w: 450, h: 246 }, t0: () => T.card1, t1: () => K.done + 0.25, title: 'בחירת הקליפ', desc: ['לחצו על הקליפ sunset_beach.mp4', 'בטיימליין כדי לבחור אותו.'] },
  { R: { x: 108, y: 330, w: 450, h: 246 }, t0: () => T.land2 + 0.02, t1: () => T.land3 - 0.2, title: 'הפעלת Keyframe ל-Scale', desc: ['ב-Effect Controls לחצו על', 'השעון שליד Scale.'] },
  { R: { x: 108, y: 330, w: 450, h: 246 }, t0: () => T.land3 + 0.02, t1: () => T.play + 0.1, title: 'הגדלה ל-130', desc: ['הזיזו את הסמן לסוף הקליפ', 'ושנו את Scale ל-130.'] },
];
const DONEBTN = { x: STEPS[0].R.x + 22, y: STEPS[0].R.y + STEPS[0].R.h - 60 };
// the user's own mouse: lost at first, then following Pointy's lead
const MK = [
  { t: 0, x: 600, y: 470 }, { t: 0.5, x: 330, y: 300 }, { t: 0.95, x: 820, y: 620 }, { t: 1.4, x: 1500, y: 360 }, { t: 1.85, x: 560, y: 900 }, { t: 2.4, x: 1180, y: 960 },
  { t: T.land1 + 0.1, x: 1400, y: 1000 }, { t: T.click1 - 0.08, x: CLIP.x + 520, y: CLIP.y + 20 }, { t: T.click1 + 0.12, x: CLIP.x + 520, y: CLIP.y + 20 },
  { t: K.done - 0.08, x: DONEBTN.x + 62, y: DONEBTN.y + 22 }, { t: K.done + 0.15, x: DONEBTN.x + 62, y: DONEBTN.y + 22 },
  { t: T.click2 - 0.08, x: STOPW.x + 2, y: STOPW.y + 2 }, { t: T.click2 + 0.12, x: STOPW.x + 2, y: STOPW.y + 2 },
  { t: T.val3 - 0.06, x: SCALEV.x + 30, y: SCALEV.y + 12 }, { t: T.play + 0.8, x: SCALEV.x + 80, y: SCALEV.y + 60 },
];
function mouseAt(t) { for (let i = 0; i < MK.length - 1; i++) if (t <= MK[i + 1].t) { const u = ease.cubicInOut(seg(t, MK[i].t, MK[i + 1].t)); return { x: lerp(MK[i].x, MK[i + 1].x, u), y: lerp(MK[i].y, MK[i + 1].y, u) }; } return MK[MK.length - 1]; }
const CLICKS = [T.click1, K.done, T.click2, T.val3], clickDown = t => CLICKS.some(c => t >= c && t < c + 0.12);

function menuBar(app, t) {
  g.fillStyle = '#26232b'; g.fillRect(0, 0, 1920, 26);
  text('', 22, 19, F(500, 17), '#fff', 'left', 'ltr'); text(APPS[app].name, 52, 19, F(700, 15), '#fff', 'left', 'ltr');
  text('File    Edit    View    Window    Help', 52 + APPS[app].name.length * 9 + 30, 19, F(500, 15), '#e8e6ea', 'left', 'ltr');
  text('Mon 9:41', 1900, 19, F(500, 15), '#fff', 'right', 'ltr');
  const on = t > K.space - 0.1; g.save(); rr(1560, 3, 150, 20, 10); g.fillStyle = on ? 'rgba(240,138,46,0.28)' : 'rgba(255,255,255,0.12)'; g.fill();
  g.beginPath(); g.arc(1578, 13, 8, 0, Math.PI * 2); g.fillStyle = C.or; g.fill(); ARROW(1574, 9, 0.2, '#fff', 0); sparkle(1610, 13, 6, '#ddd'); g.beginPath(); g.arc(1640, 13, 6, 0, Math.PI * 2); g.lineWidth = 1.5; g.strokeStyle = '#ddd'; g.stroke(); g.restore();
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(1802, 8, 22, 11); g.fillRect(1824, 11, 2, 5);
}
function askBar(app, t, n, t0, t1, enter) {     // the frosted ask bar, open between t0 and t1, n chars of the question typed
  const k = t < t1 ? clamp(spr(t - t0, 0.62, 17), 0, 1.08) : 1 - sstep(t1, t1 + 0.3, t); if (k <= 0.01 || t < t0) return;
  const R = BAR, cy = R.y + R.h / 2, Q = APPS[app].q, str = Q.slice(0, n);
  g.save(); g.globalAlpha *= clamp(k, 0, 1); g.translate(R.x + R.w / 2, cy); g.scale(0.92 + 0.08 * k, 0.92 + 0.08 * k); g.translate(-R.x - R.w / 2, -cy);
  glass(R, R.h / 2, whiteTint(R), IMG[app]); ARROW(R.x + 24, cy - 12, 0.6, C.or, 0);
  if (n === 0) text('Ask Pointy how to do anything on your screen...', R.x + 64, cy + 8, F(500, 23), '#77767e', 'left', 'ltr');
  else text(str, R.x + 64, cy + 8, F(500, 25), '#1d1c22', 'left', 'rtl');
  if (t < enter && (n < Q.length || Math.floor(t * 2.4) % 2 === 0)) { g.fillStyle = '#1d1c22'; g.fillRect(R.x + 60, cy - 14, 2, 28); }
  g.strokeStyle = '#8e8d94'; g.lineWidth = 2.2; g.lineCap = 'round'; rr(R.x + R.w - 96, cy - 13, 11, 18, 6); g.stroke(); g.beginPath(); g.arc(R.x + R.w - 90.5, cy - 2, 10, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  const sp = OM.press(t, enter, { depth: 0.18 }); g.save(); g.translate(R.x + R.w - 38, cy); g.scale(sp.s, sp.s); g.beginPath(); g.arc(0, 0, 21, 0, Math.PI * 2); g.fillStyle = n > 0 ? C.or : '#f2b27a'; g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 9); g.lineTo(0, -9); g.moveTo(-7, -2); g.lineTo(0, -9); g.lineTo(7, -2); g.stroke(); g.restore();
  g.restore();
}
function rings(x, y, t, t0, t1) { if (t < t0 || t > t1 + 0.25) return; const a = sstep(t0, t0 + 0.12, t) * (1 - sstep(t1, t1 + 0.25, t)), base = g.globalAlpha;
  g.save(); g.globalAlpha = base * a; const gl = g.createRadialGradient(x, y, 0, x, y, 30); gl.addColorStop(0, 'rgba(240,138,46,0.55)'); gl.addColorStop(1, 'rgba(240,138,46,0)'); g.fillStyle = gl; g.beginPath(); g.arc(x, y, 30, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 3; i++) { const u = ((t - t0) * 1.3 + i / 3) % 1; g.globalAlpha = base * a * (1 - u) * 0.9; g.beginPath(); g.arc(x, y, 12 + 34 * u, 0, Math.PI * 2); g.lineWidth = 3; g.strokeStyle = C.or; g.stroke(); } g.restore(); }
function stepCard(R, t, t0, t1, i, total, title, desc, app, doneT = null) {
  if (t < t0 - 0.02 || t > t1 + 0.3) return; const e = pop(t, t0, { rise: 22, s0: 0.86, ds: 0.14 }), o = 1 - sstep(t1, t1 + 0.18, t);
  g.save(); g.globalAlpha *= e.op * o; g.translate(R.x + R.w / 2, R.y + R.h / 2 + e.dy); g.scale(e.s, e.s); g.translate(-R.x - R.w / 2, -R.y - R.h / 2);
  glass(R, 24, rainbowTint(R), IMG[app]);
  text(`שלב ${i + 1} מתוך ${total}`, R.x + R.w - 24, R.y + 38, F(800, 18), '#e0701a'); sparkle(R.x + R.w - 134, R.y + 32, 7, '#e0701a');
  g.strokeStyle = '#55545c'; g.lineWidth = 2; g.beginPath(); g.moveTo(R.x + 22, R.y + 24); g.lineTo(R.x + 34, R.y + 36); g.moveTo(R.x + 34, R.y + 24); g.lineTo(R.x + 22, R.y + 36); g.stroke();
  text(title, R.x + R.w - 24, R.y + 76, F(800, 27), '#15141a'); desc.forEach((d, j) => text(d, R.x + R.w - 24, R.y + 108 + j * 26, F(500, 19), '#3b3a42'));
  for (let k = 0; k < total; k++) { const w = (R.w - 48) / total; rr(R.x + R.w - 24 - (k + 1) * w + 4, R.y + 166, w - 8, 5, 3); g.fillStyle = k <= i ? C.or : 'rgba(0,0,0,0.12)'; g.fill(); }
  const b = { x: R.x + 22, y: R.y + R.h - 60, w: 124, h: 40 }, done = doneT !== null && t >= doneT, pr = doneT !== null ? OM.press(t, doneT, { depth: 0.12 }) : { s: 1 };
  g.save(); g.translate(b.x + b.w / 2, b.y + b.h / 2); g.scale(pr.s, pr.s); g.translate(-b.x - b.w / 2, -b.y - b.h / 2); pill(b.x, b.y, b.w, b.h, done ? '✓ בוצע' : 'עשיתי ✓', done ? '#33b36a' : C.or, '#fff'); g.restore();
  pill(b.x + b.w + 10, b.y, 116, b.h, 'הראה שוב', 'rgba(255,255,255,0.5)', '#2a2930', 'rgba(0,0,0,0.18)'); text('⌘ מקשים', R.x + R.w - 24, b.y + 27, F(500, 17), '#55545c');
  g.restore();
}
function readingPill(app, x, y, t, t0, t1) { if (t < t0 || t > t1 + 0.25) return; const a = sstep(t0, t0 + 0.15, t) * (1 - sstep(t1, t1 + 0.25, t)), R = { x, y, w: 300, h: 46 };
  g.save(); g.globalAlpha *= a; glass(R, 23, whiteTint(R, 0.88), IMG[app]); g.beginPath(); g.arc(x + R.w - 24, y + 23, 7 + 1.5 * Math.sin(t * 12), 0, Math.PI * 2); g.fillStyle = C.or; g.fill();
  text(`קורא את ${APPS[app].look}`, x + R.w - 40, y + 30, F(700, 19), '#2a2930', 'right', 'rtl'); g.restore(); }

function screenPremiere(t) {
  menuBar('pr', t); const im = IMG.pr; if (im.complete) g.drawImage(im, 0, 26, 1920, 1054);
  const selected = t >= T.click1, stopOn = t >= T.click2, val130 = t >= T.val3, playing = t >= T.play;
  if (selected) { rr(CLIP.x - 1, CLIP.y - 1, CLIP.w + 2, CLIP.h + 2, 3); g.lineWidth = 2.5; g.strokeStyle = '#fff'; g.stroke(); }
  if (stopOn) { g.beginPath(); g.arc(STOPW.x, STOPW.y, 11, 0, Math.PI * 2); g.fillStyle = '#1d1e1d'; g.fill();
