<body>
<canvas id="world"></canvas>
<canvas id="overlay"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <button id="btn-menu" class="hud-btn" title="תפריט (Esc)" aria-label="תפריט">☰</button>
    <button id="btn-chat" class="hud-btn hidden" title="צ'אט (T)" aria-label="צ'אט">💬</button>
    <div class="who-wrap">
      <button id="btn-who" class="hud-btn" title="הפרטים שלי" aria-label="הפרטים שלי" aria-expanded="false"><img id="hud-face" alt=""></button>
      <div id="who-pop" class="hud-card hud-who hidden">
        <div id="hud-name" class="hud-name"></div>
        <div id="hud-unit" class="hud-sub"></div>
        <div id="hud-more" class="hud-sub"></div>
      </div>
    </div>
    <div class="hud-card hud-clock">
      <div id="hud-day" class="hud-sub"></div>
      <div id="hud-time" class="hud-time"></div>
    </div>
    <div class="hud-card hud-bars">
      <div class="bar"><span>אנרגיה</span><i><b id="bar-energy"></b></i></div>
      <div class="bar"><span>מורל</span><i><b id="bar-morale"></b></i></div>
      <div class="bar"><span>ציון פלג"צ</span><i><b id="bar-score"></b></i></div>
      <div class="bar"><span>שחורה</span><i class="dark"><b id="bar-shchora"></b></i></div>
    </div>
    <div class="hud-card hud-money"><span id="hud-money"></span><span id="hud-home" class="hud-sub"></span></div>
  </div>
  <div id="objective" class="objective"></div>
  <div id="prompt" class="prompt hidden"></div>
  <div id="alert-banner" class="alert-banner hidden"></div>
  <canvas id="minimap" width="192" height="138"></canvas>
  <div id="toasts"></div>
  <div id="boss-hud" class="boss-hud hidden"></div>
  <div id="ctl-hud" class="ctl-hud hidden"></div>
</div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div id="stick" class="stick"><span class="ar up">▲</span><span class="ar dn">▼</span><span class="ar lt">◀</span><span class="ar rt">▶</span><div id="stick-knob" class="knob"></div></div>
  <div id="look" class="stick"><span class="eye">👁</span><div id="look-knob" class="knob"></div></div>
  <button id="t-act" class="t-btn">E</button>
  <button id="t-run" class="t-btn small">ריצה</button>
</div>

<!-- Screens / overlays -->
<div id="screen" class="screen"></div>
<div id="dialog" class="dialog hidden"></div>
<div id="mini" class="mini hidden"></div>
<div id="phone" class="phone hidden"></div>
<div id="map" class="map hidden"></div>
<div id="side" class="side hidden"></div>
<div id="fade" class="fade"></div>
<div id="fps" class="fps hidden"></div>
<div id="rotate" class="rotate"><div>📱↻</div><p>סובבו את הטלפון לרוחב</p></div>
