<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שומר</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1321">
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg: #0d1321; --panel: #161f33; --line: #26324d; --ink: #eef2fa; --muted: #9aa7c2; --accent: #ffb703; --ok: #3ddc97; --alert: #ff3b4e; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  .banner { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; margin-bottom: 10px; }
  .banner i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .banner[data-kind="ok"] i { background: var(--ok); }
  .banner[data-kind="lost"] { background: var(--alert); border-color: var(--alert); }
  .banner[data-kind="lost"] i { background: #fff; }
  .live { position: relative; background: #000; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); aspect-ratio: 4 / 3; }
  .live img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .live.stale img { opacity: 0.25; filter: grayscale(1); }
  .live.alarm { border-color: var(--alert); animation: alarm 0.5s steps(2) 8; }
  .live.big { position: fixed; inset: 0; z-index: 9; border-radius: 0; aspect-ratio: auto; }
  .size { position: absolute; bottom: 10px; inset-inline-end: 10px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(13, 19, 33, .8); color: var(--ink); font-size: 20px; }
  @keyframes alarm { 50% { border-color: transparent; } }
  button.main { width: 100%; margin: 10px 0; padding: 14px; border-radius: 999px; border: 0; background: var(--accent); color: #1a1300; font: inherit; font-weight: 700; font-size: 18px; }
  button.main.done { background: var(--ok); }
  .note { color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
  li.new { border-color: var(--alert); }
  li .head { display: flex; justify-content: space-between; }
  li time { color: var(--muted); }
  li img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
</style>
</head>
<body>
<main>
  <h1>שומר</h1>
  <div class="banner" id="banner" data-kind="wait"><i></i><span id="conn">מתחבר…</span></div>
  <div class="live" id="live"><img id="stream" alt="שידור חי מהמצלמה"><button class="size" id="size" aria-label="הגדל">⛶</button></div>
  <button class="main" id="sound">🔊 הפעל צליל והתראות</button>
  <p class="note">השאר את המסך הזה פתוח: הצליל וההתראות עובדים רק כשהוא מוצג. הכול מקומי, ושום דבר לא נשמר.</p>
  <h2>התראות</h2>
  <ul id="alerts"><li class="note">עוד אין התראות.</li></ul>
</main>
<script>
  const $ = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('k') || '';
  const q = `?k=${encodeURIComponent(key)}`;
  let audio = null, lastSeen = Date.now(), lost = false, lostTimer = null, wake = null;

  function tone(freqs, step, level = 0.4) {
    if (!audio || audio.state !== 'running') return;
    const t0 = audio.currentTime;
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * step);
      g.gain.exponentialRampToValueAtTime(level, t0 + i * step + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * step + step - 0.02);
      o.connect(g).connect(audio.destination);
      o.start(t0 + i * step);
      o.stop(t0 + i * step + step);
    });
  }
  const ring = () => { tone([880, 660, 880, 660, 880, 660], 0.22); navigator.vibrate?.([400, 150, 400, 150, 400]); };
  const alarmLost = () => { tone([440, 330, 440, 330], 0.4, 0.5); navigator.vibrate?.([800, 300, 800]); };

  async function keepAwake() {
    try { if (navigator.wakeLock && !document.hidden) wake = await navigator.wakeLock.request('screen'); } catch {}
  }

  $('sound').onclick = async () => {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    await audio.resume().catch(() => {});
    tone([880, 660], 0.22);
    keepAwake();
    $('sound').textContent = '✓ צליל פעיל';
    $('sound').classList.add('done');
  };
  document.addEventListener('visibilitychange', () => !document.hidden && wake !== null && keepAwake());
  $('size').onclick = () => $('live').classList.toggle('big');

  function setConn(kind, text) {
    $('banner').dataset.kind = kind;
    $('conn').textContent = text;
    $('live').classList.toggle('stale', kind === 'lost');
  }

  function startStream() {
    $('stream').src = `stream${q}&t=${Date.now()}`;
  }
  $('stream').onerror = () => setTimeout(startStream, 2000);
  startStream();

  const es = new EventSource(`events${q}`);
  es.addEventListener('hb', e => {
    lastSeen = Date.now();
    const hb = JSON.parse(e.data);
    if (lost) { lost = false; clearInterval(lostTimer); startStream(); }
    setConn('ok', `מחובר ל${hb.name}`);
  });
  es.addEventListener('alert', e => {
    lastSeen = Date.now();
    const a = JSON.parse(e.data);
    const list = $('alerts');
    if (list.firstElementChild?.classList.contains('note')) list.innerHTML = '';
    const li = document.createElement('li');
    li.className = 'new';
    const head = document.createElement('div');
    head.className = 'head';
    const b = document.createElement('b');
    b.textContent = `${a.title} · ${a.name}`;
    const t = document.createElement('time');
    t.textContent = new Date(a.at).toLocaleTimeString('he-IL');
    head.append(b, t);
    li.append(head);
    if (a.photo) { const img = document.createElement('img'); img.src = a.photo; img.alt = 'תמונה מהמצלמה'; li.append(img); }
    list.prepend(li);
    while (list.children.length > 20) list.lastElementChild.remove();
    ring();
    const live = $('live');
    live.classList.remove('alarm'); void live.offsetWidth; live.classList.add('alarm');
  });

  // The Pi sends a heartbeat every 2 s. Silence means it's off, out of range or stuck.
  setInterval(() => {
    const quiet = Date.now() - lastSeen;
    if (quiet > 10000 && !lost) {
      lost = true;
      setConn('lost', '❌ החיבור למצלמה אבד! בדוק את המכשיר ואת ה-Wi-Fi.');
      alarmLost();
      lostTimer = setInterval(alarmLost, 15000);
    } else if (quiet > 5000 && !lost) {
      setConn('wait', 'החיבור למצלמה חלש…');
    }
  }, 1000);
</script>
</body>
</html>
