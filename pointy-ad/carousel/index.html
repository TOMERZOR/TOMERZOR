<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Pointy · קרוסלה</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../composition/fonts/local.css">
<style>
/* Eight 1080×1350 slides for an Instagram carousel. render.cjs screenshots each .slide.
   In a browser they sit side by side, so the glows that cross slide edges can be checked. */
:root { --bg: #0C0907; --txt: #F7F2EC; --mut: #A99E94; --or1: #FFB45C; --or: #F08A2E; --or2: #E8620F; --font: "Heebo", "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #050403; }
body { font-family: var(--font); color: var(--txt); -webkit-font-smoothing: antialiased; }
#slides { display: flex; gap: 0; direction: ltr; width: max-content; }
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); direction: rtl; flex: none; }
.glow { position: absolute; border-radius: 50%; pointer-events: none; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; background: radial-gradient(closest-side, rgba(240, 120, 30, .26), rgba(240, 120, 30, 0)); }
.glow.b { background: radial-gradient(closest-side, rgba(150, 70, 20, .32), rgba(150, 70, 20, 0)); }

/* header */
.top { position: absolute; top: 54px; left: 64px; right: 64px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font-family: Inter, Heebo, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.03em; }
.brand svg { width: 50px; height: 50px; }
.pg { font-family: Inter, sans-serif; font-weight: 600; font-size: 26px; color: var(--mut); direction: ltr; padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .12); }

/* copy */
.copy { position: absolute; top: 150px; left: 70px; right: 70px; }
.kick { display: inline-flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 800; color: var(--or); letter-spacing: -.01em; }
.kick b { display: inline-grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--or); color: #1A0E05; font-size: 30px; font-family: Inter, sans-serif; }
h2 { margin: 14px 0 0; font-size: 92px; font-weight: 900; line-height: 1.04; letter-spacing: -.035em; }
h2 .or { color: var(--or); }
.copy p { margin: 22px 0 0; font-size: 36px; font-weight: 500; line-height: 1.38; color: var(--mut); max-width: 900px; letter-spacing: -.01em; }
.copy p b { color: var(--txt); font-weight: 700; }
.swipe { position: absolute; left: 64px; bottom: 54px; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; color: var(--txt); padding: 14px 26px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1.5px solid rgba(255, 255, 255, .14); }

/* ---------- laptop ---------- */
.mac { position: absolute; width: 1000px; transform-origin: 50% 0; direction: ltr; }
.lid { position: relative; margin: 0 auto; width: 912px; height: 588px; border-radius: 30px 30px 8px 8px; background: #0A0A0B; padding: 19px 16px;
  box-shadow: inset 0 0 0 2px #2C2D30, 0 0 0 3px #9B9EA4, 0 0 0 4px #5F6267, 0 60px 120px -40px rgba(0, 0, 0, .9); }
.screen { position: relative; width: 880px; height: 550px; border-radius: 10px; overflow: hidden; background: #000; }
.notch { position: absolute; top: 19px; left: 50%; width: 132px; height: 24px; margin-left: -66px; background: #0A0A0B; border-radius: 0 0 13px 13px; z-index: 5; }
.notch::after { content: ""; position: absolute; left: 61px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: #1C2330; }
.hinge { width: 900px; height: 12px; margin: 0 auto; background: linear-gradient(#6A6D72, #2B2C2F); border-radius: 0 0 10px 10px; }
.basewrap { perspective: 2600px; perspective-origin: 50% -250px; height: 170px; }
.deck { position: relative; width: 1000px; height: 640px; margin: 0 auto; transform-origin: 50% 0; transform: rotateX(75deg); transform-style: preserve-3d;
  background: linear-gradient(180deg, #DADCDF, #C3C6CA); border-radius: 4px 4px 34px 34px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6); }
.lip { position: absolute; left: 0; right: 0; top: 100%; height: 26px; background: linear-gradient(#C2C5C9, #8B8E93); border-radius: 0 0 26px 26px; transform-origin: 50% 0; transform: rotateX(-90deg); }
.lip::after { content: ""; position: absolute; left: 50%; top: 0; width: 170px; height: 9px; margin-left: -85px; border-radius: 0 0 10px 10px; background: rgba(0, 0, 0, .18); }
.kb { position: absolute; left: 66px; right: 66px; top: 40px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; background: rgba(0, 0, 0, .08); }
.kr { display: flex; gap: 8px; height: 50px; }
.kr.fn { height: 28px; }
.k { border-radius: 8px; background: linear-gradient(#1C1D1F, #0E0F10); color: #C9CBCE; font: 600 16px Inter, sans-serif; display: flex; align-items: flex-end; justify-content: flex-start; padding: 5px 8px; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); white-space: nowrap; overflow: hidden; }
.k.hot { background: linear-gradient(#FFA048, #EC6F18); color: #1A0E05; font-weight: 800; box-shadow: 0 0 0 3px rgba(255, 190, 120, .7), 0 0 40px 10px rgba(240, 138, 46, .85); }
.pad { position: absolute; left: 50%; top: 430px; width: 420px; height: 185px; margin-left: -210px; border-radius: 16px; background: linear-gradient(#D2D5D9, #C6C9CD); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .1); }

/* ---------- screen contents ---------- */
.wall { position: absolute; inset: 0; background: radial-gradient(520px 380px at 72% 30%, rgba(240, 138, 46, .38), transparent 62%), radial-gradient(500px 400px at 15% 90%, rgba(120, 50, 140, .35), transparent 65%), linear-gradient(160deg, #3B2416, #120D0A 72%); }
.mbar { position: absolute; top: 0; left: 0; right: 0; height: 32px; background: rgba(18, 14, 11, .6); display: flex; align-items: center; gap: 22px; padding: 0 18px; font: 600 15px Inter, sans-serif; color: #EEE; direction: ltr; z-index: 3; }
.mbar .dot { width: 14px; height: 14px; border-radius: 50%; background: #EEE; }
.mbar .r { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.mbar .r svg { width: 20px; height: 20px; }
.mbar .r .bat { width: 26px; height: 13px; border-radius: 4px; border: 1.5px solid #EEE; position: relative; }
.mbar .r .bat::after { content: ""; position: absolute; inset: 2px 6px 2px 2px; background: #EEE; border-radius: 1px; }
.sc { position: absolute; transform-origin: 0 0; }

/* windows (same design as the video) */
.win { position: absolute; width: 960px; height: 780px; border-radius: 30px; overflow: hidden; background: #1E1A17; direction: ltr; text-align: left;
  border: 1.5px solid rgba(255, 255, 255, .09); box-shadow: 0 50px 120px -30px rgba(0, 0, 0, .8); font-family: "Inter", "Heebo", sans-serif; color: #CFC8C2; }
.win.light { background: #F5F3F0; color: #222; border-color: rgba(0, 0, 0, .1); }
.tb { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: rgba(255, 255, 255, .04); border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 24px; font-weight: 600; color: #9A928B; }
.light .tb { background: #E9E6E2; border-color: rgba(0, 0, 0, .08); color: #777; }
.tb i { width: 18px; height: 18px; border-radius: 50%; background: #FF5F57; flex: none; }
.tb i:nth-child(2) { background: #FEBC2E; } .tb i:nth-child(3) { background: #28C840; margin-right: 18px; }
.ed .ec { position: absolute; left: 0; top: 60px; width: 420px; height: 410px; border-right: 1px solid rgba(255, 255, 255, .08); }
.ed .ph { height: 54px; display: flex; align-items: center; padding: 0 22px; font-size: 24px; font-weight: 700; color: #D7D0CA; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.ed .row { height: 59px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 26px; }
.ed .row.hd { color: #8E8780; font-weight: 600; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #8A837C; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 11px; top: 4px; width: 3px; height: 10px; background: #8A837C; border-radius: 2px; }
.ed .lb { flex: 1; } .ed .val { color: #5BA7FF; font-weight: 600; }
.ed .mon { position: absolute; left: 430px; top: 72px; width: 518px; height: 390px; }
.shot { position: absolute; left: 0; top: 0; width: 518px; height: 292px; border-radius: 12px; overflow: hidden; }
.shot svg { width: 100%; height: 100%; display: block; }
.ed .tc { position: absolute; left: 0; top: 306px; font-size: 26px; color: #5BA7FF; font-weight: 600; }
.ed .tl { position: absolute; left: 0; right: 0; top: 480px; bottom: 0; border-top: 1px solid rgba(255, 255, 255, .08); background: rgba(0, 0, 0, .18); }
.ruler { position: absolute; left: 100px; right: 20px; top: 0; height: 40px; display: flex; justify-content: space-between; align-items: center; font-size: 19px; color: #7D766F; }
.trk { position: absolute; left: 0; right: 0; height: 76px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.trk b { position: absolute; left: 0; width: 86px; top: 0; bottom: 0; display: grid; place-items: center; font-size: 20px; color: #8E8780; border-right: 1px solid rgba(255, 255, 255, .08); }
.clip { position: absolute; top: 10px; bottom: 10px; left: 110px; width: 700px; border-radius: 10px; font-size: 19px; color: rgba(255, 255, 255, .85); padding: 8px 12px; }
.clip.v { background: linear-gradient(180deg, #8C7AF0, #6B58D6); } .clip.a { background: linear-gradient(180deg, #3FB37A, #2C8F5E); }
.phd { position: absolute; top: 0; bottom: 0; left: 150px; width: 3px; background: #5BA7FF; }
.phd::before { content: ""; position: absolute; left: -13px; top: 4px; width: 30px; height: 32px; border-radius: 6px 6px 15px 15px; background: #5BA7FF; }
.rib { position: absolute; left: 0; right: 0; top: 60px; height: 52px; display: flex; gap: 34px; align-items: center; padding: 0 30px; font-size: 23px; color: #666; border-bottom: 1px solid rgba(0, 0, 0, .08); }
.rib .on { color: #1E6E3E; font-weight: 700; }
.tools { position: absolute; left: 0; right: 0; top: 112px; height: 110px; display: flex; gap: 18px; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(0, 0, 0, .08); background: #FBFAF8; }
.tool { height: 82px; min-width: 120px; padding: 0 16px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 19px; color: #444; border: 2px solid transparent; }
.tool i { width: 34px; height: 26px; border-radius: 5px; background: #C9D3CE; display: block; }
.grid { position: absolute; left: 0; right: 0; top: 222px; bottom: 0; display: grid; grid-template-columns: 50px repeat(6, 1fr); grid-auto-rows: 50px; font-size: 20px; color: #333; }
.grid span { border-right: 1px solid #E2DED9; border-bottom: 1px solid #E2DED9; padding: 12px 10px; text-align: right; }
.grid span.h { background: #EDEAE6; color: #888; text-align: center; font-weight: 600; }
.canvas { position: absolute; left: 96px; top: 60px; width: 600px; bottom: 0; background: repeating-conic-gradient(#2B2724 0 25%, #24201D 0 50%) 0 0 / 40px 40px; }
.canvas svg { position: absolute; inset: 40px; width: calc(100% - 80px); height: calc(100% - 80px); }
.rpanel { position: absolute; left: 696px; right: 0; top: 60px; bottom: 0; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid rgba(255, 255, 255, .08); }
.rpanel div { height: 66px; border-radius: 12px; background: #2A2521; display: flex; align-items: center; padding: 0 18px; font-size: 22px; border: 2px solid transparent; }
.page { position: absolute; left: 150px; right: 150px; top: 250px; bottom: -40px; background: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, .12); padding: 50px 56px; }
.page i { display: block; height: 14px; border-radius: 7px; background: #E3E0DC; margin-bottom: 20px; }
.page i.t { height: 30px; width: 60%; background: #CFCAC4; margin-bottom: 36px; }
.side { position: absolute; left: 0; top: 60px; bottom: 0; width: 380px; padding: 18px 14px; border-right: 1px solid rgba(255, 255, 255, .08); }
.side div { height: 64px; border-radius: 12px; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 24px; border: 2px solid transparent; }
.side div i { width: 36px; height: 36px; border-radius: 9px; display: block; flex: none; }
.mainp { position: absolute; left: 380px; right: 0; top: 60px; bottom: 0; padding: 40px; }
.mainp h5 { margin: 0 0 30px; font-size: 34px; color: #EEE; }
.mainp .box { height: 260px; border-radius: 16px; border: 1.5px dashed #4A443F; display: grid; place-items: center; font-size: 24px; color: #8E8780; }
.hot { border-color: var(--or) !important; box-shadow: 0 0 0 5px rgba(240, 138, 46, .35), 0 0 40px rgba(240, 138, 46, .6); }

/* player */
.player { position: absolute; width: 960px; direction: rtl; text-align: right; font-family: var(--font); }
.player .thumb { position: relative; height: 540px; border-radius: 30px; overflow: hidden; background: linear-gradient(135deg, #2A2F45, #141622 60%, #0C0D14); }
.player .big { position: absolute; left: 50px; top: 60px; right: 50px; font-size: 74px; font-weight: 900; line-height: 1.05; color: #fff; }
.player .big span { background: #FFE14D; color: #111; padding: 0 14px; border-radius: 10px; }
.player .play { position: absolute; left: 50%; top: 56%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: rgba(0, 0, 0, .55); display: grid; place-items: center; }
.player .play svg { width: 60px; height: 60px; margin-left: 10px; }
.player .dur { position: absolute; left: 24px; bottom: 34px; font-size: 32px; font-weight: 800; background: rgba(0, 0, 0, .78); padding: 4px 14px; border-radius: 10px; direction: ltr; color: #fff; }
.player .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: rgba(255, 255, 255, .25); direction: ltr; }
.player .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: #FF3B30; }
.player .meta { padding: 28px 6px 0; font-size: 40px; font-weight: 700; line-height: 1.25; color: #F7F2EC; }
.player .meta small { display: block; font-size: 30px; font-weight: 500; color: var(--mut); margin-top: 6px; }

/* Pointy overlays, at screen scale */
.ask { position: absolute; height: 74px; border-radius: 37px; display: flex; align-items: center; gap: 14px; padding: 0 26px; direction: rtl;
  background: linear-gradient(#1B1613, #1B1613) padding-box, linear-gradient(90deg, #FFB45C, #E8620F) border-box; border: 3px solid transparent;
  box-shadow: 0 0 50px rgba(240, 138, 46, .45), 0 20px 40px -10px rgba(0, 0, 0, .7); font: 600 29px var(--font); color: var(--txt); white-space: nowrap; z-index: 4; }
.ask .spark { width: 34px; height: 34px; color: var(--or); flex: none; }
.ask .mic { width: 30px; height: 30px; color: #7A716A; flex: none; margin-right: auto; }
.ask .mic.on { color: #1A0E05; background: var(--or); border-radius: 50%; padding: 5px; width: 40px; height: 40px; box-shadow: 0 0 22px rgba(240, 138, 46, .9); }
.ask .ph { color: #6E665F; }
.caret { display: inline-block; width: 3px; height: 34px; background: var(--or); border-radius: 2px; vertical-align: middle; }
.pcur { position: absolute; width: 58px; height: 58px; z-index: 6; filter: drop-shadow(0 0 14px rgba(240, 138, 46, .9)) drop-shadow(0 5px 8px rgba(0, 0, 0, .5)); }
.ring { position: absolute; border-radius: 50%; border: 3px solid var(--or); z-index: 5; }
.scur { position: absolute; width: 44px; height: 44px; z-index: 6; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
.qb { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font: 900 40px var(--font); box-shadow: 0 12px 24px -6px rgba(0, 0, 0, .6); z-index: 5; }
.card { position: absolute; width: 330px; padding: 16px 20px 18px; border-radius: 22px; background: rgba(238, 233, 228, .97); color: #1A1512; direction: rtl; text-align: right; box-shadow: 0 24px 50px -14px rgba(0, 0, 0, .75); z-index: 5; font-family: var(--font); }
.card .st { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; color: var(--or2); }
.card .st svg { width: 20px; height: 20px; }
.card h4 { margin: 6px 0 2px; font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.card p { margin: 0; font-size: 18px; font-weight: 500; color: #554B44; }
.card .prog { display: flex; gap: 6px; margin: 12px 0; }
.card .prog i { flex: 1; height: 6px; border-radius: 3px; background: #D3CAC2; } .card .prog i.on { background: var(--or); }
.card .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px; border-radius: 999px; background: linear-gradient(180deg, #FFA048, #EC6F18); color: #1A0E05; font-size: 19px; font-weight: 800; }
.tag { position: absolute; padding: 8px 16px; border-radius: 999px; background: rgba(15, 12, 10, .88); border: 1.5px solid rgba(240, 138, 46, .7); font: 700 19px var(--font); color: var(--txt); direction: rtl; white-space: nowrap; z-index: 5; }
.dd { position: absolute; top: 40px; right: 92px; width: 330px; padding: 18px; border-radius: 18px; background: rgba(32, 26, 22, .96); border: 1.5px solid rgba(255, 255, 255, .1); box-shadow: 0 30px 60px -10px rgba(0, 0, 0, .8); direction: rtl; z-index: 4; font-family: var(--font); }
.dd .hd { display: flex; align-items: center; gap: 12px; font: 800 26px Inter, Heebo, sans-serif; }
.dd .hd svg { width: 42px; height: 42px; }
.dd .ln { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .06); font-size: 19px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.dd .ln kbd { font: 700 17px Inter, sans-serif; padding: 3px 10px; border-radius: 7px; background: #0E0B09; color: var(--or1); direction: ltr; }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; background: rgba(255, 255, 255, .07); border: 1.5px solid rgba(255, 255, 255, .12); font-size: 32px; font-weight: 700; }
.chip svg { width: 32px; height: 32px; color: var(--or); }
.keys3d { position: absolute; display: flex; gap: 22px; direction: ltr; z-index: 3; }
.key3 { height: 120px; border-radius: 26px; display: grid; place-items: center; font: 700 56px Inter, sans-serif; color: #F4EEE8; background: linear-gradient(180deg, #3D3530, #27211D); box-shadow: 0 11px 0 #110D0B, inset 0 2px 0 rgba(255, 255, 255, .14), 0 0 60px rgba(240, 138, 46, .45); }
.plus { align-self: center; font: 800 54px Inter, sans-serif; color: var(--or); }
.pill { display: inline-block; padding: 0 30px 6px; border-radius: 999px; background: linear-gradient(180deg, #FFA048, #EC6F18); color: #1A0E05; box-shadow: 0 20px 60px -10px rgba(240, 120, 30, .7); }
.site { position: absolute; inset: 0; background: radial-gradient(500px 360px at 50% 0%, rgba(240, 120, 30, .35), transparent 70%), #0E0B09; direction: rtl; font-family: var(--font); text-align: right; padding: 60px 56px; }
.site .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); }
.site .nav b { display: flex; align-items: center; gap: 10px; font: 800 26px Inter, Heebo, sans-serif; }
.site .nav b svg { width: 36px; height: 36px; }
.site .nav span { padding: 8px 20px; border-radius: 999px; background: var(--or); color: #1A0E05; font-weight: 800; font-size: 19px; }
.site h3 { margin: 46px 0 0; font-size: 66px; font-weight: 900; line-height: 1.02; letter-spacing: -.035em; }
.site h3 em { font-style: normal; color: var(--or); }
.site p { font-size: 22px; color: var(--mut); margin: 18px 0 26px; max-width: 560px; line-height: 1.4; }
.site .b1 { display: inline-block; padding: 16px 40px; border-radius: 999px; background: var(--or); color: #1A0E05; font-size: 24px; font-weight: 800; }
.site .b2 { display: inline-block; margin-right: 12px; padding: 14px 32px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .2); font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="lgo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB85E"/><stop offset="1" stop-color="#EC6512"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1F4A"/><stop offset=".55" stop-color="#C4476A"/><stop offset="1" stop-color="#FF9E45"/></linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BC0BE"/><stop offset="1" stop-color="#F2C14E"/></linearGradient>
    <symbol id="logo" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="26" fill="url(#lgo)"/>
      <path d="M8 26 Q8 6 28 6 L72 6 Q92 6 92 26 L92 38 Q50 30 8 46 Z" fill="rgba(255,255,255,.14)"/>
      <path d="M34 29 L71 46 Q75 48 71 50 L56 55 L49 70 Q47 74 45 70 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path fill="currentColor" d="M10 2.5 L11.6 8.2 Q12 9.6 13.4 10 L19 11.6 L13.4 13.2 Q12 13.6 11.6 15 L10 20.7 L8.4 15 Q8 13.6 6.6 13.2 L1 11.6 L6.6 10 Q8 9.6 8.4 8.2 Z"/><path fill="currentColor" d="M19 1.5 L19.7 3.8 L22 4.5 L19.7 5.2 L19 7.5 L18.3 5.2 L16 4.5 L18.3 3.8 Z"/></symbol>
    <symbol id="mic" viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11 Q5 18 12 18 Q19 18 19 11 M12 18 L12 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="pcur" viewBox="0 0 60 60"><path d="M7 5 L52 24 Q56 26 52 28 L33 34 L25 53 Q23 57 21 53 Z" fill="#F08A2E" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></symbol>
    <symbol id="scur" viewBox="0 0 60 60"><path d="M6 4 L6 46 L16 36 L23 52 L30 49 L23 34 L37 34 Z" fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="sunset" viewBox="0 0 520 292" preserveAspectRatio="xMidYMid slice">
      <rect width="520" height="292" fill="url(#sky)"/><circle cx="322" cy="190" r="52" fill="#FFD27A"/>
      <path d="M0 210 L80 150 L150 200 L230 130 L310 205 L390 150 L460 190 L520 160 L520 292 L0 292 Z" fill="#4A1F45"/>
      <path d="M0 250 L120 205 L220 245 L330 210 L430 250 L520 225 L520 292 L0 292 Z" fill="#22122A"/>
    </symbol>
  </defs>
</svg>
<div id="slides"></div>

<script>
/* ---------- building blocks ---------- */
const logo = (s = "") => `<svg ${s}><use href="#logo"/></svg>`;
const use = (id, s = "") => `<svg ${s}><use href="#${id}"/></svg>`;

const KEYS = [
  ["fn", [["esc", 1.4], ...Array.from({ length: 12 }, (_, i) => [`F${i + 1}`, 1]), ["", 1]]],
  ["", [["`", 1], ..."1234567890-=".split("").map((c) => [c, 1]), ["delete", 1.6]]],
  ["", [["tab", 1.6], ..."QWERTYUIOP[]\\".split("").map((c) => [c, 1])]],
  ["", [["caps", 1.9], ..."ASDFGHJKL;'".split("").map((c) => [c, 1]), ["return", 1.9]]],
  ["", [["shift", 2.45], ..."ZXCVBNM,./".split("").map((c) => [c, 1]), ["shift", 2.45]]],
  ["", [["fn", 1], ["control", 1], ["⌥ option", 1.15, "opt"], ["⌘ command", 1.35], ["", 5.4, "space"], ["⌘ command", 1.35], ["⌥ option", 1.15], ["◀", 1], ["▲▼", 1], ["▶", 1]]],
];
function keyboard(hot = []) {
  return `<div class="kb">${KEYS.map(([cls, row]) => `<div class="kr ${cls}">${row.map(([l, u, id]) =>
    `<div class="k ${id && hot.includes(id) ? "hot" : ""}" style="flex:${u}">${id === "space" && hot.includes("space") ? "Space" : l}</div>`).join("")}</div>`).join("")}</div>`;
}
function mac(screen, { x = 40, y = 560, s = .85, hot = [] } = {}) {
  return `<div class="mac" style="left:${x}px;top:${y}px;transform:scale(${s})">
    <div class="lid"><div class="screen">${screen}</div><div class="notch"></div></div>
    <div class="hinge"></div>
    <div class="basewrap"><div class="deck">${keyboard(hot)}<div class="pad"></div><div class="lip"></div></div></div>
  </div>`;
}
const menubar = (app, pointyOn = false) => `<div class="mbar"><span class="dot"></span><b>${app}</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
  <span class="r">${pointyOn ? `<span style="display:grid;place-items:center;width:30px;height:26px;border-radius:7px;background:rgba(240,138,46,.35)">${logo('style="width:20px;height:20px"')}</span>` : logo('style="width:20px;height:20px"')}
  <svg viewBox="0 0 24 24"><path d="M2 9 Q12 0 22 9 M5 12.5 Q12 6 19 12.5 M8.5 16 Q12 12.5 15.5 16" fill="none" stroke="#EEE" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="19.5" r="1.6" fill="#EEE"/></svg>
  <span class="bat"></span><span>Tue 10:41</span></span></div>`;
const sc = (inner, x, y, s) => `<div class="sc" style="left:${x}px;top:${y}px;transform:scale(${s})">${inner}</div>`;

const editor = (opts = {}) => `<div class="win ed" style="left:0;top:0">
  <div class="tb"><i></i><i></i><i></i><span>Untitled Project · Video Editor</span></div>
  <div class="ec"><div class="ph">Effect Controls</div><div class="row hd">▾ Motion</div>
    <div class="row"><span class="sw"></span><span class="lb">Position</span><span class="val">960.0 540.0</span></div>
    <div class="row"><span class="sw ${opts.hotSw ? "hot" : ""}" style="${opts.hotSw ? "border-color:#F08A2E" : ""}"></span><span class="lb">Scale</span><span class="val">100.0</span></div>
    <div class="row"><span class="sw"></span><span class="lb">Rotation</span><span class="val">0.0°</span></div>
    <div class="row"><span class="sw"></span><span class="lb">Anchor Point</span><span class="val">960 540</span></div>
    <div class="row"><span class="sw"></span><span class="lb">Opacity</span><span class="val">100 %</span></div></div>
  <div class="mon"><div class="shot"><svg><use href="#sunset"/></svg></div><div class="tc">00:00:00:00</div></div>
  <div class="tl"><div class="ruler"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span></div>
    <div class="trk" style="top:40px"><b>V2</b></div><div class="trk" style="top:116px"><b>V1</b><div class="clip v">sunset_clip.mp4</div></div>
    <div class="trk" style="top:192px"><b>A1</b><div class="clip a">music.wav</div></div><div class="phd"></div></div></div>`;

const sheet = () => { let h = '<span class="h"></span>'; for (const c of "ABCDEF") h += `<span class="h">${c}</span>`;
  const H = ["Month", "Rent", "Food", "Travel", "Fun", "Total"], M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"];
  for (let r = 1; r <= 11; r++) { h += `<span class="h">${r}</span>`; for (let c = 0; c < 6; c++) h += r === 1 ? `<span style="font-weight:700">${H[c]}</span>` : `<span>${c === 0 ? M[r - 2] : (300 + ((r * 37 + c * 91) % 27) * 97).toLocaleString("en")}</span>`; }
  return h; };
const apps = [
  `<div class="win light" style="left:0;top:0"><div class="tb"><i></i><i></i><i></i><span>Budget.xlsx · Spreadsheet</span></div>
    <div class="rib"><span>Home</span><span class="on">Insert</span><span>Formulas</span><span>Data</span></div>
    <div class="tools"><div class="tool hot"><i style="background:#3E9E68"></i>PivotTable</div><div class="tool"><i></i>Table</div><div class="tool"><i></i>Chart</div><div class="tool"><i></i>Image</div></div>
    <div class="grid">${sheet()}</div></div>`,
  `<div class="win" style="left:0;top:0"><div class="tb"><i></i><i></i><i></i><span>portrait.png · Photo Editor</span></div>
    <div class="canvas"><svg viewBox="0 0 520 640"><rect width="520" height="640" rx="14" fill="url(#pbg)"/><circle cx="260" cy="250" r="96" fill="#3B2A23"/><path d="M90 640 Q100 410 260 400 Q420 410 430 640 Z" fill="#E8523F"/></svg></div>
    <div class="rpanel"><div>Adjust</div><div>Filters</div><div class="hot">Remove Background</div><div>Crop</div><div>Export</div></div></div>`,
  `<div class="win light" style="left:0;top:0"><div class="tb"><i></i><i></i><i></i><span>Thesis.docx · Docs</span></div>
    <div class="rib"><span>Home</span><span>Insert</span><span>Layout</span><span class="on" style="color:#2B5BB8">References</span></div>
    <div class="tools"><div class="tool hot"><i style="background:#2B5BB8"></i>Table of Contents</div><div class="tool"><i></i>Footnote</div><div class="tool"><i></i>Citation</div></div>
    <div class="page"><i class="t"></i><i></i><i></i><i style="width:80%"></i><i></i><i style="width:70%"></i><i></i></div></div>`,
  `<div class="win" style="left:0;top:0"><div class="tb"><i></i><i></i><i></i><span>System Settings</span></div>
    <div class="side"><div><i style="background:#2F7BF6"></i>Wi-Fi</div><div><i style="background:#2F7BF6"></i>Bluetooth</div><div><i style="background:#E8453C"></i>Notifications</div>
      <div><i style="background:#E8453C"></i>Sound</div><div><i style="background:#3BA0F2"></i>Displays</div><div class="hot"><i style="background:#8E8E93"></i>Printers &amp; Scanners</div><div><i style="background:#8E8E93"></i>Keyboard</div></div>
    <div class="mainp"><h5>Displays</h5><div class="box">Built-in Display</div></div></div>`,
];

const pcur = (x, y, ring = true) => `${ring ? `<div class="ring" style="left:${x - 34}px;top:${y - 34}px;width:68px;height:68px"></div><div class="ring" style="left:${x - 56}px;top:${y - 56}px;width:112px;height:112px;opacity:.35"></div>` : ""}<svg class="pcur" style="left:${x - 7}px;top:${y - 5}px"><use href="#pcur"/></svg>`;
const ask = (x, y, w, inner, mic = "") => `<div class="ask" style="left:${x}px;top:${y}px;width:${w}px">${use("spark", 'class="spark"')}${inner}<svg class="mic ${mic}"><use href="#mic"/></svg></div>`;
const card = (x, y, n, h, p) => `<div class="card" style="left:${x}px;top:${y}px"><div class="st">${logo()}שלב ${n} מתוך 3</div><h4>${h}</h4><p>${p}</p>
  <div class="prog">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div><span class="btn">עשיתי ${use("check", 'style="width:20px;height:20px"')}</span></div>`;

/* ---------- slides ---------- */
const N = 8;
const SLIDES = [
  { // 1 cover
    copy: `<h2>על מה<br><span class="or">לוחצים פה?!</span></h2><p>יש דרך מהירה יותר מיוטיוב. <b>הנה איך היא עובדת.</b></p>`,
    screen: `<div class="wall"></div>${menubar("Video Editor")}${sc(editor(), 40, 58, .82)}
      <svg class="scur" style="left:520px;top:300px"><use href="#scur"/></svg>
      <div class="qb" style="left:150px;top:150px;transform:rotate(-8deg)">?</div><div class="qb" style="left:640px;top:110px;transform:rotate(10deg)">?</div>
      <div class="qb" style="left:600px;top:400px;transform:rotate(-12deg)">?</div><div class="qb" style="left:300px;top:430px;transform:rotate(6deg)">?</div>`,
    swipe: true,
  },
  { // 2 problem
    kick: "הבעיה",
    copy: `<h2>14 דקות מדריך<br><span class="or">בשביל כפתור אחד.</span></h2><p>מחפשים, מדלגים, חוזרים… ועדיין לא מוצאים איפה זה.</p>`,
    screen: `<div class="wall"></div>${menubar("Browser")}
      <div style="position:absolute;left:150px;right:150px;top:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:12px;padding:0 22px;font:600 22px var(--font);color:#EEE;direction:rtl">🔍 איך עושים זום-אין בעריכה</div>
      ${sc(`<div class="player" style="left:0;top:0"><div class="thumb"><div class="big">איך עושים<br><span>זום-אין?</span></div><div class="play"><svg viewBox="0 0 24 24"><path d="M5 3 L21 12 L5 21 Z" fill="#fff"/></svg></div><div class="dur">05:31 / 14:37</div><div class="bar"><i></i></div></div><div class="meta">מדריך מלא למתחילים: איך עושים זום-אין בעריכה<small>שיעור 1 מתוך 12 · 14:37</small></div></div>`, 152, 122, .6)}`,
  },
  { // 3 meet pointy
    kick: "הכירו את Pointy",
    copy: `<h2>עוזר AI שמראה לך<br><span class="or">בדיוק על מה ללחוץ.</span></h2><p>יושב בשורת התפריטים של המחשב, ועובד מעל <b>כל תוכנה</b>.</p>`,
    screen: `<div class="wall"></div>${menubar("Finder", true)}
      <div class="ring" style="left:676px;top:-4px;width:46px;height:40px;border-radius:12px"></div>
      <div class="dd" style="right:150px;top:46px;transform:scale(1.3);transform-origin:100% 0">
        <div class="hd">${logo()}Pointy</div>
        <div class="ln">לשאול שאלה <kbd>⌥ Space</kbd></div>
        <div class="ln">מדבר עברית <span style="color:var(--or1)">✓</span></div>
        <div class="ln">עובד בכל אפליקציה <span style="color:var(--or1)">✓</span></div>
      </div>
      <div class="tag" style="left:70px;top:62px">הנה הוא, בשורת התפריטים ←</div>`,
  },
  { // 4 step 1
    kick: `<b>1</b> איך זה עובד`,
    copy: `<h2>לוחצים <bdi dir="ltr" class="or" style="font-family:Inter,Heebo;letter-spacing:-.02em">⌥ Space</bdi><br>בכל אפליקציה.</h2><p>לא משנה באיזו תוכנה אתם. Pointy נפתח מעליה.</p>`,
    screen: `<div class="wall"></div>${menubar("Video Editor")}${sc(editor(), 40, 58, .82)}
      <div style="position:absolute;inset:32px 0 0;background:rgba(0,0,0,.45)"></div>
      ${ask(110, 238, 660, `<span class="ph">מה תרצו לעשות?</span><span class="caret"></span>`)}`,
    hot: ["opt", "space"],
  },
  { // 5 step 2
    kick: `<b>2</b> איך זה עובד`,
    copy: `<h2>שואלים בעברית.<br><span class="or">כותבים או אומרים.</span></h2><p>בלי מונחים מקצועיים. בדיוק כמו שהייתם שואלים חבר.</p>`,
    screen: `<div class="wall"></div>${menubar("Video Editor")}${sc(editor(), 40, 58, .82)}
      <div style="position:absolute;inset:32px 0 0;background:rgba(0,0,0,.45)"></div>
      ${ask(70, 238, 740, `<span>איך עושים זום-אין איטי לסרטון?</span><span class="caret"></span>`, "on")}
      <div class="tag" style="left:96px;top:330px">🎙️ אפשר גם להגיד בקול</div>`,
  },
  { // 6 step 3
    kick: `<b>3</b> איך זה עובד`,
    copy: `<h2>הסמן הכתום מצביע,<br><span class="or">צעד אחרי צעד.</span></h2><p>לוחצים איפה שהוא מראה, אומרים <b>"עשיתי"</b>, וממשיכים.</p>`,
    screen: `<div class="wall"></div>${menubar("Video Editor")}${sc(editor({ hotSw: true }), 40, 58, .82)}
      ${pcur(88, 273)}${card(220, 150, 1, "הפעלת Keyframe ל-Scale", "לחצו על השעון ליד Scale")}`,
  },
  { // 7 any app
    kick: "לא רק עריכה",
    copy: `<h2>עובד בכל תוכנה.<br><span class="or">גם בעברית.</span></h2><p>טבלת ציר, הסרת רקע, תוכן עניינים, מדפסת.<br><b>שואלים, והוא מראה.</b></p>`,
    screen: `<div class="wall"></div>${menubar("Finder")}
      ${sc(apps[0], 24, 48, .43)}${sc(apps[1], 452, 48, .43)}${sc(apps[2], 24, 300, .43)}${sc(apps[3], 452, 300, .43)}
      ${pcur(70, 128, false)}${pcur(816, 202, false)}${pcur(80, 380, false)}${pcur(560, 466, false)}
      <div class="tag" style="left:150px;top:228px">איך עושים טבלת ציר?</div><div class="tag" style="left:500px;top:240px">איך מסירים רקע?</div>
      <div class="tag" style="left:132px;top:490px">איך מוסיפים תוכן עניינים?</div><div class="tag" style="left:620px;top:490px">איך מחברים מדפסת?</div>`,
  },
  { // 8 CTA
    copy: `<h2 style="font-size:96px">רוצים לנסות?<br><span style="font-size:80px">שלחו לי בדירקט<br>את המילה <span class="pill">פלאגין</span></span></h2><p style="margin-top:30px">ואשלח לכם את <b>Pointy</b> ישר להודעות.</p>`,
    screen: `<div class="site"><div class="nav"><b>${logo()}Pointy</b><span>נסו בחינם</span></div>
      <h3>על מה לוחצים פה?<br><em>Pointy מראה לך.</em></h3><p>שואלים איך עושים משהו במק, וסמן כתום עף בדיוק לכפתור הנכון ומלווה אותך צעד אחרי צעד.</p>
      <span class="b1">שליחה למק שלי</span><span class="b2">גם לווינדוס</span></div>`,
    macY: 712, macS: .6, macX: 40,
    extra: `<div style="position:absolute;left:40px;right:40px;top:592px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px">
        <span class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 20 L16 20 M12 16 L12 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>מק · ווינדוס</span>
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M4 5 Q4 3 6 3 L18 3 Q20 3 20 5 L20 14 Q20 16 18 16 L10 16 L5 20 L5 16 Q4 16 4 14 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>מדבר עברית באמת</span>
        <span class="chip"><svg viewBox="0 0 24 24"><use href="#check"/></svg>מתחילים בחינם</span></div>
      <div style="position:absolute;left:0;right:0;bottom:30px;text-align:center;font:600 28px Heebo,Inter,sans-serif;color:var(--mut)"><bdi style="font-family:Inter">trypointy.com</bdi></div>`,
  },
];

const host = document.getElementById("slides");
host.innerHTML = SLIDES.map((s, i) => {
  // glows sit on the slide edges at the same height as the neighbour's, so the background runs across the carousel
  const yL = i % 2 ? 1040 : 300, yR = i % 2 ? 300 : 1040;
  return `<section class="slide" id="s${i + 1}">
    <div class="glow" style="left:0;top:${yL}px"></div><div class="glow b" style="left:1080px;top:${yR}px"></div>
    <div class="top"><div class="brand">${logo()}Pointy</div>${s.swipe ? `<div class="pg" style="color:var(--txt);font-family:Heebo;font-weight:700;background:rgba(255,255,255,.08)">החליקו <span style="font-family:Inter">←</span></div>` : `<div class="pg">${i + 1}/${N}</div>`}</div>
    <div class="copy">${s.kick ? `<div class="kick">${s.kick}</div>` : ""}${s.copy}</div>
    ${mac(s.screen, { x: s.macX ?? 40, y: s.macY ?? 560, s: s.macS ?? .85, hot: s.hot || [] })}
    ${s.extra || ""}
    
  </section>`;
}).join("");
</script>
</body>
</html>
