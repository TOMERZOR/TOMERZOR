<title>Never Have I Ever</title>

<style>
/* Layout: one phone-width column. Sticky brand bar on top, fixed tab bar below.
   Every "never" is a ticket with a tear-off stub; doing it stamps the ticket. */
:root {
  --bg: #ECEBF4;
  --surface: #FFFFFF;
  --ink: #19182C;
  --muted: #67657F;
  --line: #D9D7E6;
  --stamp: #2B44E8;
  --on-stamp: #FFFFFF;
  --stamp-soft: #E2E5FD;
  --sun: #FFC53D;
  --sun-ink: #2E2200;
  --scrim: rgb(12 11 30 / .5);
  --live: #D93A3F;
  --font-display: "Secular One", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 14px;
  --col: 440px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100F1F; --surface: #1C1B31; --ink: #EEEDF8; --muted: #A3A1BE; --line: #2F2D4A;
    --stamp: #93A0FF; --on-stamp: #0E1130; --stamp-soft: #262B57; --sun: #FFC53D; --sun-ink: #2E2200;
    --scrim: rgb(0 0 0 / .6); --live: #FF7A7F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100F1F; --surface: #1C1B31; --ink: #EEEDF8; --muted: #A3A1BE; --line: #2F2D4A;
  --stamp: #93A0FF; --on-stamp: #0E1130; --stamp-soft: #262B57; --sun: #FFC53D; --sun-ink: #2E2200;
  --scrim: rgb(0 0 0 / .6); --live: #FF7A7F; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app {
  max-width: var(--col); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 10px;
}
.logo { font-family: var(--font-display); font-size: 28px; line-height: 1; letter-spacing: -.5px; direction: ltr; }
.logo s { color: var(--muted); text-decoration-color: var(--stamp); text-decoration-thickness: 3px; }
.tagline { font-size: 13px; color: var(--muted); direction: ltr; font-style: italic; }

.view { display: flex; flex-direction: column; gap: 16px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-inner { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
.tab { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tab[aria-current="page"] { color: var(--ink); }
.tab-add { justify-self: center; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--sun); color: var(--sun-ink); font-size: 28px; line-height: 1; font-weight: 700; }

/* Segmented */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--line); }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px 10px; font-size: 15px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.seg .count { display: inline-block; min-width: 20px; margin-inline-start: 4px; padding: 0 6px; border-radius: 999px; background: var(--sun); color: var(--sun-ink); font-size: 12px; }

/* Buttons and chips */
.btn { border: 0; border-radius: 999px; padding: 12px 18px; font-size: 16px; font-weight: 800; }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-sun { background: var(--sun); color: var(--sun-ink); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-link { background: none; border: 0; color: var(--stamp); font-weight: 700; padding: 6px 0; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 15px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--stamp); border-color: var(--stamp); color: var(--on-stamp); }

/* Ticket */
.ticket {
  --stub: 92px;
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--stub);
  width: 100%; padding: 0; border: 0; border-radius: var(--r); background: var(--surface); text-align: start;
  -webkit-mask: radial-gradient(circle 9px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle 9px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 9px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
                radial-gradient(circle 9px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
}
.ticket.big { --stub: 108px; }
.t-main { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.t-pre { font-size: 13px; font-weight: 700; color: var(--muted); }
.t-text { font-family: var(--font-display); font-size: 21px; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.ticket.big .t-text { font-size: 28px; }
.t-meta { font-size: 14px; color: var(--muted); }
.t-stub { border-inline-start: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 6px; text-align: center; }
.t-stub b { font-family: var(--font-display); font-size: 19px; font-weight: 400; font-variant-numeric: tabular-nums; }
.t-stub small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.ticket.done .t-text { color: var(--muted); }
.t-priv { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

/* Stamp */
.stamp-at { position: absolute; pointer-events: none; }
.ticket .stamp-at { left: calc(var(--stub) + 14px); top: 50%; translate: 0 -50%; }
.stamp {
  display: block; transform: rotate(-10deg); color: var(--stamp); text-align: center; line-height: 1.1;
  border: 3px solid var(--stamp); outline: 1.5px solid var(--stamp); outline-offset: 2px; border-radius: 9px; padding: 5px 11px;
  font-family: var(--font-display);
}
.stamp span { display: block; font-size: 15px; }
.stamp b { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.stamp.big span { font-size: 22px; }
.stamp.anim { animation: stamp .5s cubic-bezier(.2, 1.5, .4, 1) .15s both; }
@keyframes stamp { from { transform: rotate(-26deg) scale(2.4); opacity: 0; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }

/* Posts */
.post { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; font-size: 68px; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph .stamp-at { left: 14px; bottom: 14px; }
.ph .stamp { background: var(--surface); }
.post-body { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.post-head { font-size: 15px; }
.post-head b { font-weight: 800; }
.post-head em { font-style: normal; font-family: var(--font-display); font-size: 18px; display: block; line-height: 1.25; }
.post-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px; }
.cheer { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cheer[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }

/* Cards */
.card { background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pill { font-size: 12px; font-weight: 800; color: var(--stamp); background: var(--stamp-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.quote { font-size: 16px; }
textarea, input[type="text"] {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  font: inherit; padding: 10px 12px; resize: vertical;
}
.bubble { background: var(--stamp-soft); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 15px; }
.bubble b { font-weight: 800; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.facts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.facts b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* Onboarding */
.hero { display: flex; flex-direction: column; gap: 8px; padding-block: 8px 4px; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 11vw, 46px); line-height: 1; direction: ltr; text-align: left; }
.hero h1 span { color: var(--stamp); }
.hero p { font-size: 17px; }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.dock-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.dock-inner .btn { flex: 1; }

/* Detail */
.back { align-self: flex-start; background: none; border: 0; padding: 4px 0; font-weight: 700; color: var(--muted); }
.actions { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; padding-block: 8px; }
.actions .btn { flex: 1; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.panel {
  width: min(100%, var(--col)); max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.x { border: 0; background: var(--line); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; flex: none; }
.photo-pick { display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; border: 2px dashed var(--line); border-radius: var(--r); background: var(--surface); color: var(--muted); font-weight: 700; position: relative; overflow: hidden; cursor: pointer; }
.photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.celebrate { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.celebrate h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }

.toast {
  position: fixed; z-index: 30; left: 50%; translate: -50% 0; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px;
  max-width: calc(100% - 32px); text-align: center;
}
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* Feed post types */
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--stamp); }
.who { display: inline-flex; align-items: center; gap: 8px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-weight: 800; font-size: 14px; background: hsl(var(--h) 75% 80%); color: #1B1A2E; }
.avs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.avs .av { border: 2px solid var(--surface); margin-inline-start: -10px; }
.avs .av:first-child { margin-inline-start: 0; }
.avs .small { margin-inline-start: 6px; }
.confess { font-family: var(--font-display); font-size: 24px; line-height: 1.2; text-wrap: balance; }
.reacts { display: flex; flex-wrap: wrap; gap: 8px; }
.comment { font-size: 15px; border-inline-start: 3px solid var(--line); padding-inline-start: 10px; }
.game { background: var(--ink); color: var(--bg); gap: 10px; }
.game .kicker { color: var(--sun); }
.game-pre { font-weight: 700; opacity: .75; }
.game-q { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; margin-top: -6px; }
.btn-inv { background: transparent; color: var(--bg); border: 1.5px solid var(--bg); }
.big-num { display: flex; align-items: baseline; gap: 8px; }
.big-num b { font-family: var(--font-display); font-weight: 400; font-size: 46px; line-height: 1; color: var(--stamp); font-variant-numeric: tabular-nums; }
.live-tag { color: var(--live); font-size: 13px; font-weight: 800; }
.timeline { list-style: none; margin: 0; padding: 0 12px 0 0; padding-inline-start: 12px; border-inline-start: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.timeline li { display: flex; gap: 10px; }
.timeline time { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline li:last-child span { font-weight: 800; }
.betbar { display: flex; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800; }
.betbar span { padding: 6px 12px; white-space: nowrap; }
.betbar .y { background: var(--stamp); color: var(--on-stamp); }
.betbar .n { background: var(--line); color: var(--ink); text-align: end; }
.expect { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.expect dt { font-weight: 800; color: var(--muted); }
.expect dd { margin: 0; }
.stamp.fail { color: var(--live); border-color: var(--live); outline-color: var(--live); border-style: dashed; }

@media (prefers-reduced-motion: reduce) { .stamp.anim { animation: none; } }
</style>

</div>

</nav>

    <div class="facts">
      <span><b>${fmt(n.count || 0)}</b> עוד לא עשו</span>
      <span><b>${fmt(Math.round((n.count || 0) * 0.07))}</b> עשו את זה החודש</span>
      <span>מוצג ל: <b>${PRIV[n.privacy]}</b></span>
    </div>
    <div class="section">
      <span class="label">טיפים מאנשים שכבר עשו את זה</span>
      ${n.tips.length ? n.tips.map((t, i) => `
        <div class="card">
          <div class="card-head"><b>${esc(t.by)}</b><span class="small muted">${esc(t.since)}</span></div>
          <p>${esc(t.text)}</p>
          <div><button class="btn-link" data-a="thank" data-id="${n.id}" data-i="${i}" ${t.thanked ? 'disabled' : ''}>${t.thanked ? 'התודה נשלחה ✓' : 'תודה'}</button></div>
        </div>`).join('') : `<p class="empty">עוד אין טיפים. נודיע כשמישהו עם ניסיון יענה.</p>`}
    </div>
    ${n.nudges.length ? `<div class="section"><span class="label">חברים דוחפים</span>
      ${n.nudges.map(x => `<p class="bubble"><b>${esc(x.by)}:</b> ${esc(x.text)}</p>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="btn btn-ghost" data-a="nudge" data-id="${n.id}" style="background:var(--surface)">לבקש דחיפה</button>
      <button class="btn btn-sun" data-a="done" data-id="${n.id}">עשיתי! ✦</button>
    </div>`;
}

function viewProfile() {
  const done = S.mine.filter(n => n.done);
  const learned = [...LEARNED, ...done.flatMap(n => n.done.helpers.map(h => ({ name: h, what: n.text })))];
  return `
    <div class="section"><h2 style="font-family:var(--font-display);font-weight:400;font-size:26px">הפרופיל שלי</h2></div>
    <div class="stats">
      <div class="stat"><b>${S.mine.length - done.length}</b><span>עוד לא</span></div>
      <div class="stat"><b>${done.length}</b><span>פעם ראשונה</span></div>
      <div class="stat"><b>${S.veteran.length}</b><span>נושאים עם ניסיון</span></div>
    </div>
    <div class="section"><span class="label">יש לי ניסיון ב</span>
      <div class="chips">${S.veteran.map(v => `<span class="chip">${esc(v)}</span>`).join('')}</div></div>
    <div class="section"><span class="label">השושלת שלי</span>
      <div class="card">
        <p><b>למדתי מ:</b> ${learned.map(l => `${esc(l.name)} <span class="muted">(${esc(l.what)})</span>`).join(', ')}</p>
        <p><b>למדו ממני:</b> ${S.taughtBase + S.tipsSent} אנשים</p>
      </div></div>
    ${done.length ? `<div class="section"><span class="label">הפעמים הראשונות שלי</span>${done.map(n => ticket(n)).join('')}</div>` : ''}
    <div><button class="btn-link" data-a="reset">להתחיל את אב-הטיפוס מההתחלה</button></div>`;
}

// ---------- Sheets ----------
let comp = null, addPriv = 'friends';
function openSheet(html) { $('#toast').hidden = true; const s = $('#sheet'); s.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`; s.hidden = false; }
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; comp = null; }

function openComposer(id) {
  const n = findNever(id);
  comp = { id, photo: null, helpers: new Set() };
  const people = [...new Set([...n.tips.map(t => t.by), ...n.nudges.map(x => x.by)])];
  openSheet(`
    <div class="panel-head"><h2>פעם ראשונה ש${esc(n.text)}</h2><button class="x" data-a="close" aria-label="סגירה">✕</button></div>
    <label class="photo-pick" for="c-photo" id="c-photo-box"><span>להוסיף תמונה מהרגע</span><input type="file" id="c-photo" accept="image/*"></label>
    <div class="section"><label class="label" for="c-feel">איך היה?</label>
      <textarea id="c-feel" rows="3" placeholder="מה הפתיע? מה היית אומר/ת למי שעוד לא עשה?"></textarea></div>
    ${people.length ? `<div class="section"><span class="label">מי עזר לי</span>
      <div class="chips">${people.map(p => `<button class="chip" data-a="helper" data-name="${esc(p)}" aria-pressed="false">${esc(p)}</button>`).join('')}</div></div>` : ''}
    <button class="btn btn-sun" data-a="publish">לחתום ולפרסם ✦</button>`);
}
function publish() {
  const n = findNever(comp.id);
  n.done = { date: today(), photo: comp.photo, feeling: $('#c-feel').value.trim(), helpers: [...comp.helpers] };
  if (!S.veteran.includes(n.text)) S.veteran.push(n.text);
  S.feed.unshift({ id: 'f' + S.nid++, who: 'אני', cat: n.cat, never: n.text, caption: n.done.feeling, helpers: n.done.helpers, date: 'עכשיו', cheers: 0, cheered: false, photo: n.done.photo });
  if (n.count) S.help.unshift({ id: 'h' + S.nid++, who: 'גל', never: n.text, note: 'רוצה לעשות את זה כבר שנה ולא מעז. איך מתחילים?', waiting: n.count, open: false, sent: false });
  save();
  openSheet(`
    <div class="celebrate">
      ${ticket(n, { big: true, anim: true, asButton: false })}
      <h2>ברוך הבא לוותיקים</h2>
      <p>${n.count ? `${fmt(n.count)} אנשים עוד לא עשו את זה. מישהו מהם כבר שאל שאלה, ועכשיו יש לך מה לענות.` : 'זה Never חדש, ויש לך ניסיון בו לפני כולם.'}</p>
      ${n.done.helpers.length ? `<p class="small muted">${n.done.helpers.map(esc).join(', ')} יקבלו הודעה שעזרו לך.</p>` : ''}
      <div class="row">
        <button class="btn btn-ghost" data-a="closeToList">לרשימה</button>
        ${n.count ? `<button class="btn btn-sun" data-a="goHelp">לעזור למישהו</button>` : ''}
      </div>
    </div>`);
}

function openAdd() {
  addPriv = 'friends';
  const mineTexts = S.mine.map(n => n.text);
  const sugg = CATALOG.filter(i => !mineTexts.includes(i.text)).slice(0, 8);
  openSheet(`
    <div class="panel-head"><h2>Never חדש</h2><button class="x" data-a="close" aria-label="סגירה">✕</button></div>
    <div class="section"><label class="label" for="add-text">אף פעם לא…</label>
      <input type="text" id="add-text" placeholder="למשל: צללתי עם בלון" maxlength="60" autocomplete="off"></div>
    <div class="section"><span class="label">רעיונות</span>
      <div class="chips">${sugg.map(i => `<button class="chip" data-a="sugg" data-text="${esc(i.text)}">${esc(i.text)}</button>`).join('')}</div></div>
    <div class="section"><span class="label">מי יראה את זה</span>
      <div class="seg" role="group" id="add-priv">${Object.entries(PRIV).map(([k, l]) => `<button data-a="priv" data-p="${k}" aria-pressed="${k === addPriv}">${l}</button>`).join('')}</div></div>
    <button class="btn btn-ink" data-a="addSubmit">להוסיף לרשימה</button>`);
  $('#add-text').focus();
}
function addSubmit() {
  const text = $('#add-text').value.trim();
  if (!text) { toast('צריך לכתוב מה עוד לא עשית'); return; }
  if (S.mine.some(n => n.text === text)) { toast('זה כבר ברשימה'); return; }
  const c = CATALOG.find(i => i.text === text);
  S.mine.unshift(makeNever(text, c ? c.cat : 'life', c ? c.count : 0, addPriv));
  S.tab = 'list'; S.listSeg = 'open'; S.view = null;
  closeSheet(); save(); render(); scrollTo(0, 0);
  toast(c ? `נוסף. ${fmt(c.count)} אנשים איתך בזה` : 'נוסף. נודיע כשיגיעו ותיקים');
}

// ---------- Events ----------
const go = (patch) => { Object.assign(S, patch); save(); render(); scrollTo(0, 0); };
const H = {
  pick: el => { const id = el.dataset.id; S.picked = S.picked.includes(id) ? S.picked.filter(x => x !== id) : [...S.picked, id]; el.setAttribute('aria-pressed', S.picked.includes(id)); save(); renderDock(); },
  finish: () => { S.mine = S.picked.map(id => CATALOG.find(c => c.id === id)).map(c => makeNever(c.text, c.cat, c.count)); go({ onboarded: true, tab: 'home', seg: 'friends', view: null }); toast('הרשימה שלך מחכה בלשונית "הרשימה שלי"'); },
  skip: () => { if (!S.picked.length) S.picked = fresh().picked; H.finish(); },
  answer: el => { S.fun.q = el.dataset.v; save(); render(); toast('התשובה נשמרה. החשיפה ב-21:00'); },
  react: el => { const k = el.dataset.k; S.fun.r[k] = !S.fun.r[k]; save(); render(); },
  bet: el => { S.fun.bet = el.dataset.v; save(); render(); },
  join: () => {
    S.fun.joined = true;
    if (!S.mine.some(n => n.text === FUN.group.never)) { const c = CATALOG.find(i => i.text === FUN.group.never); S.mine.unshift(makeNever(c.text, c.cat, c.count)); }
    save(); render(); toast('שמרו לך מקום. יציאה בחמישי ב-02:30');
  },
  addFromFeed: el => {
    const text = el.dataset.text, c = CATALOG.find(i => i.text === text);
    S.mine.unshift(makeNever(text, c ? c.cat : 'life', c ? c.count : 0)); save(); render(); toast('נוסף לרשימה שלך');
  },
  toast: el => toast(el.dataset.msg),
  tab: el => go({ tab: el.dataset.tab, view: null }),
  seg: el => go({ seg: el.dataset.seg }),
  lseg: el => go({ listSeg: el.dataset.seg }),
  open: el => go({ view: el.dataset.id }),
  back: () => go({ view: null }),
  thank: el => { findNever(el.dataset.id).tips[+el.dataset.i].thanked = true; save(); render(); },
  nudge: el => { const n = findNever(el.dataset.id); n.nudges.push({ by: 'מאיה', text: 'יאללה, אני איתך בזה 💪' }); save(); render(); toast('ביקשת דחיפה. מאיה כבר ענתה'); },
  done: el => openComposer(el.dataset.id),
  helper: el => { const p = el.dataset.name; comp.helpers.has(p) ? comp.helpers.delete(p) : comp.helpers.add(p); el.setAttribute('aria-pressed', comp.helpers.has(p)); },
  publish: () => publish(),
  close: () => closeSheet(),
  closeToList: () => { closeSheet(); go({ tab: 'list', listSeg: 'done', view: null }); },
  goHelp: () => { closeSheet(); go({ tab: 'home', seg: 'help', view: null }); },
  cheer: el => { const p = S.feed.find(x => x.id === el.dataset.id); p.cheered = !p.cheered; save(); render(); },
  tipOpen: el => { S.help.forEach(h => (h.open = h.id === el.dataset.id)); render(); $(`#tip-${el.dataset.id}`)?.focus(); },
  tipSend: el => {
    const h = S.help.find(x => x.id === el.dataset.id), t = $(`#tip-${h.id}`).value.trim();
    if (!t) { toast('הטיפ ריק'); return; }
    h.sent = true; h.open = false; S.tipsSent++; save(); render(); toast(`${h.who} קיבל/ה את הטיפ שלך`);
  },
  add: () => openAdd(),
  sugg: el => { $('#add-text').value = el.dataset.text; },
  priv: el => { addPriv = el.dataset.p; document.querySelectorAll('#add-priv button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === addPriv)); },
  addSubmit: () => addSubmit(),
  reset: () => { S = fresh(); save(); render(); scrollTo(0, 0); },
};
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && H[el.dataset.a]) H[el.dataset.a](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'add-text') addSubmit();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'c-photo' || !e.target.files[0] || !comp) return;
  const r = new FileReader();
  r.onload = () => { comp.photo = r.result; $('#c-photo-box').insertAdjacentHTML('beforeend', `<img src="${r.result}" alt="">`); };
  r.readAsDataURL(e.target.files[0]);
});

if (location.hash === '#feed' && !S.onboarded) H.skip(); else render();
</script>
