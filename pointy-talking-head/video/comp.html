<script>
// ═══════════════════════════════════════════════════════════════════════════════════════════
// Layers: A-roll (restyled footage, 24 fps frames) · the Mac screen in a panel (Premiere + Pointy, every
// moving part drawn here) · keycaps · explainer graphics · word-synced Hebrew subtitles.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const W = 1080, H = 1920, FPS = 24, AR_N = window.AROLL_N || 1130, END = 48.2;
const { clamp, lerp, seg, sstep, ssstep, ease } = OM, spr = OM.spring;
const F = (w, s) => `${w} ${s}px Heebo`;
const C = { or: '#F08A2E', or2: '#FFAE5C', ord: '#D2600E', ink: '#15121A', white: '#fff', red: '#FF3B30', blue: '#2F8CFF', ppBlue: '#37a3f0' };
const cv = document.getElementById('cv'); cv.width = W; cv.height = H; const g = cv.getContext('2d');

// ───────────────────────────── timeline: words → key times ─────────────────────────────
const WORDS = TL.words, SEGS = TL.segments;
const wt = (seg, word, k = 0) => { const ws = WORDS.filter(w => w.seg === seg && w.w.replace(/[.,]/g, '') === word); return ws[k] ? ws[k].t0 : NaN; };
const wend = (seg, word) => { const w = WORDS.find(w => w.seg === seg && w.w.replace(/[.,]/g, '') === word); return w ? w.t1 : NaN; };
const segOf = id => SEGS.find(s => s.id === id);
const K = {
  w14: wt('A1', '14'), button: wt('A1', 'כפתור'), watch: wt('A2', 'צפיתם'), back: wt('A2', 'חזרתם'), stop: wt('A2', 'עצרתם'), bad: wt('A2', 'לא'),
  notYou: wt('B', 'לא'), where: wt('B', 'איפה'), pointy: wt('C1', 'פוינטי'),
  demo0: segOf('C2').film0, opt: wt('C2', 'אופשן'), space: wt('C2', 'ורווח'), pc: wt('C3', 'ובמחשב'), alt: wt('C3', 'Alt'),
  ask: wt('D1', 'שואל'), type0: wt('D1', 'איך'), typeEnd: wend('D2', 'בפרימייר') + 0.05, now: wt('D3', 'ועכשיו'),
  press: wt('E1', 'לוחץ'), done: wt('E1', 'עשיתי'), thatsit: wt('E2', 'וזהו'), five: wt('E2', '5'), fourteen: wt('E2', '14'),
  prem: wt('F', 'בפרימייר'), excel: wt('F', 'באקסל'), ae: wt('F', 'באפטר'), every: wt('F', 'כל'), works: wt('F', 'יודע'),
  mac: wt('G', 'במקבוק'), win: wt('G', 'בווינדוס'), comment: wt('G', 'תגיבו'), plugin: wt('G', 'פלאגין'), dm: wt('G', 'בפרטי'),
};
const DEMO_IN = K.demo0, DEMO_OUT = K.five + 0.02;          // the screen is on between these
const ENTER = K.typeEnd + 0.08;                                  // Pointy gets the question
const T = { land1: ENTER + 0.85, card1: ENTER + 0.95, click1: K.done - 1.05, doneBtn: K.done + 0.18, land2: K.done + 0.42, click2: K.done + 0.6,
  land3: K.done + 0.78, val3: K.done + 0.95, play: K.done + 1.05 };

// ───────────────────────────── assets ─────────────────────────────
const PREM = new Image(); PREM.src = 'premiere.jpg';
const AR = []; let arCur = -1, arImg = new Image();
const arIndex = t => { let c = AROLL[0]; for (const k of AROLL) if (t >= k.film0) c = k;      // per chunk, so lip sync never drifts
  return c.off + clamp(Math.round((t - c.film0) * FPS), 0, c.n - 1); };
function arollFrame(t) { const i = arIndex(t); if (i !== arCur) { arCur = i; arImg = new Image(); arImg.src = `aroll/f_${String(i + 1).padStart(5, '0')}.jpg`; } return arImg; }

// ───────────────────────────── helpers ─────────────────────────────
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
function text(s, x, y, font, color, align = 'right', dir = 'rtl', alpha = 1) { if (alpha <= 0.003) return; g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.textAlign = align; g.direction = dir; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); g.restore(); }
function shadow(b, dy, a, col = '0,0,0') { g.shadowColor = `rgba(${col},${a})`; g.shadowBlur = b; g.shadowOffsetY = dy; }
const noShadow = () => { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; };
const win = (t, a, b, fin = 0.25, fout = 0.25) => sstep(a - fin, a, t) * (1 - sstep(b, b + fout, t));
function pop(t, t0, opt) { return OM.popIn(t, t0, { rise: 40, s0: 0.6, ds: 0.4, zeta: 0.55, omega: 16, ...opt }); }
function ARROW(x, y, S, col, outline = 1, sh = 1) {   // the Pointy pointer, tip at (x, y)
  const P = [[0, 0], [40, 16], [21, 21], [16, 40]].map(([a, b]) => [x + a * S, y + b * S]);
  const path = () => { g.beginPath(); P.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath(); };
  g.save(); g.lineJoin = 'round';
  if (outline) { path(); g.lineWidth = 7 * S / 1.4; g.strokeStyle = '#fff'; if (sh) shadow(14 * S, 4 * S, 0.35); g.stroke(); noShadow(); }
  path(); g.fillStyle = col; g.fill(); g.lineWidth = 3.4 * S / 1.4; g.strokeStyle = col; g.stroke(); g.restore();
}
function MACCURSOR(x, y, s = 1) {      // the macOS arrow, tip at (x, y)
  g.save(); g.translate(x, y); g.scale(s, s); g.beginPath();
  g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.2, 17); g.lineTo(9, 25.5); g.lineTo(12.4, 24); g.lineTo(8.8, 15.8); g.lineTo(15.6, 15.6); g.closePath();
  shadow(4, 1.5, 0.45); g.fillStyle = '#000'; g.fill(); noShadow(); g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.stroke(); g.restore();
}
function sparkle(x, y, r, col) { g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, d = i % 2 ? r * 0.3 : r; g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } g.closePath(); g.fillStyle = col; g.fill(); }
function pointyIcon(cx, cy, s, alpha = 1) {   // orange rounded square + white arrow
  if (alpha <= 0.003 || s <= 0.01) return;
  g.save(); g.globalAlpha *= alpha; g.translate(cx, cy);
  const gr = g.createLinearGradient(0, -s / 2, 0, s / 2); gr.addColorStop(0, C.or2); gr.addColorStop(1, C.ord);
  rr(-s / 2, -s / 2, s, s, s * 0.26); shadow(s * 0.25, s * 0.08, 0.45); g.fillStyle = gr; g.fill(); noShadow();
  ARROW(-s * 0.27, -s * 0.27, s / 75, '#fff', 0, 0); g.restore();
}
function chip(cx, cy, label, t0, t, { font = F(800, 46), bg = 'rgba(20,16,28,0.86)', fg = '#fff', icon = null, out = 99, rtl = true, pad = 30 } = {}) {
  if (t < t0 - 0.02 || t > out + 0.4) return;
  const e = pop(t, t0), o = OM.liftOut(t, out, { dur: 0.25, dist: 40, blur: 0 });
  g.save(); g.font = font; const tw = g.measureText(label).width, iw = icon ? 64 : 0, w = tw + pad * 2 + iw, h = 92;
  g.globalAlpha = e.op * o.op; g.translate(cx, cy + e.dy + o.dy); g.scale(e.s, e.s);
  rr(-w / 2, -h / 2, w, h, h / 2); shadow(30, 10, 0.4); g.fillStyle = bg; g.fill(); noShadow();
  g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.14)'; g.stroke();
  if (icon) icon(rtl ? w / 2 - pad - 26 : -w / 2 + pad + 26, 0);
  text(label, rtl ? w / 2 - pad - iw : -w / 2 + pad + iw, 16, font, fg, rtl ? 'right' : 'left', rtl ? 'rtl' : 'ltr');
  g.restore();
}

// ───────────────────────────── A-roll placement ─────────────────────────────
const FACE = { x: 540, y: 470 };                 // where his face sits in the restyled frame
const PUNCH = { A1: 1.0, A2: 1.13, B: 1.0, C1: 1.09, E2: 1.0, F: 1.12, G: 1.0 };   // jump cuts alternate the framing
const demoK = t => { const a = spr(t - DEMO_IN, 0.78, 11), b = spr(t - DEMO_OUT, 0.8, 12); return clamp(t < DEMO_OUT ? a : 1 - b, 0, 1.08); };
function arollXform(t) {
  const s = SEGS.find(s => t >= s.film0 && t < s.film1) || SEGS[SEGS.length - 1];
  const punch = PUNCH[s.id] ?? 1.0, k = clamp(demoK(t), 0, 1);
  const sFull = punch, sDemo = 0.9;
  const sc = lerp(sFull, sDemo, k), fy = lerp(FACE.y, 1300, k);
  return { s: sc, x: FACE.x - FACE.x * sc, y: fy - FACE.y * sc, k };
}
function drawAroll(t) {
  const A = arollXform(t), img = arollFrame(t);
  if (A.k > 0.001) {     // the room colours fill what the shifted frame uncovers
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#120d1c'); gr.addColorStop(0.45, '#2a1530'); gr.addColorStop(1, '#0d0a12');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  g.save(); g.setTransform(A.s, 0, 0, A.s, A.x, A.y); if (img.complete && img.naturalWidth) g.drawImage(img, 0, 0, W, H); g.restore();
  if (A.k > 0.001) { const gr = g.createLinearGradient(0, A.y, 0, A.y + 260); gr.addColorStop(0, `rgba(18,13,28,${A.k})`); gr.addColorStop(1, 'rgba(18,13,28,0)'); g.fillStyle = gr; g.fillRect(0, A.y - 2, W, 262); }
}

// ───────────────────────────── the Mac screen (screen space = 1920×1080) ─────────────────────────────
const PY = y => 26 + y * (1054 / 1080);           // Premiere view y → screen y (menu bar above)
const PR = (x, y, w, h) => ({ x, y: PY(y), w, h: h * 1054 / 1080 });
const CLIP = PR(1036, 860, 826, 33), STOPW = { x: 78, y: PY(282) }, SCALEV = PR(333, 271, 52, 22), MON = PR(1066, 113, 762, 398);
const BAR = { x: 650, y: 118, w: 620, h: 58 }, Q = 'איך אני עושה זום אין בפרימייר?';
const PANEL = { x: 24, y: 112, w: 1032, h: 900, r: 34 };
const SCAM = [
  { t: DEMO_IN, x: 960, y: 560, zoom: 0.54 }, { t: K.opt - 0.1, x: 960, y: 560, zoom: 0.54 },
  { t: K.space + 0.35, x: 960, y: 330, zoom: 1.0, curve: ease.expoInOut },
  { t: K.ask, x: 960, y: 230, zoom: 1.18, curve: ease.sineInOut },
  { t: ENTER + 0.1, x: 960, y: 220, zoom: 1.24, curve: ease.sineInOut },
  { t: T.land1 - 0.08, x: 1330, y: 770, zoom: 1.4, curve: ease.expoInOut },
  { t: K.done - 0.2, x: 1345, y: 760, zoom: 1.46, curve: ease.sineInOut },
  { t: T.land2 - 0.06, x: 430, y: 330, zoom: 1.35, curve: ease.expoInOut },
  { t: T.land3 + 0.1, x: 430, y: 330, zoom: 1.35 },
  { t: T.play + 0.12, x: 1300, y: 330, zoom: 1.0, curve: ease.expoInOut },
  { t: DEMO_OUT + 1, x: 1300, y: 330, zoom: 1.0 },
];
const scam = t => OM.camera(t, SCAM, { W: 1920, H: 1080 });
// Pointy's orange pointer (screen space): from the bar to each target
const PT = [
  { t0: ENTER + 0.25, t1: T.land1, from: { x: 1240, y: 150 }, to: { x: CLIP.x + 470, y: CLIP.y + 22 }, arc: 160 },
  { t0: K.done + 0.22, t1: T.land2, to: { x: STOPW.x + 12, y: STOPW.y + 10 }, arc: 120 },
  { t0: T.land2 + 0.12, t1: T.land3, to: { x: SCALEV.x + 40, y: SCALEV.y + 16 }, arc: 40 },
];
function pointerAt(t) {
  let p = PT[0].from;
  for (const s of PT) { if (t < s.t0) return p; if (t <= s.t1) { const u = ease.expoInOut(seg(t, s.t0, s.t1)); return { x: lerp(p.x, s.to.x, u), y: lerp(p.y, s.to.y, u) - s.arc * 4 * u * (1 - u) }; } p = s.to; }
  return p;
}
// the user's own mouse
const MK = [
  { t: 0, x: 1720, y: 980 }, { t: T.land1 + 0.15, x: 1720, y: 980 }, { t: T.click1 - 0.05, x: CLIP.x + 520, y: CLIP.y + 20 }, { t: T.click1 + 0.2, x: CLIP.x + 520, y: CLIP.y + 20 },
  { t: K.done - 0.06, x: 0, y: 0, card: 1 }, { t: K.done + 0.2, x: 0, y: 0, card: 1 },
  { t: T.click2 - 0.05, x: STOPW.x + 2, y: STOPW.y + 2 }, { t: T.click2 + 0.12, x: STOPW.x + 2, y: STOPW.y + 2 },
  { t: T.val3 - 0.06, x: SCALEV.x + 30, y: SCALEV.y + 12 }, { t: T.play + 0.5, x: SCALEV.x + 60, y: SCALEV.y + 40 },
];
function mouseAt(t) {
  const ks = MK.map(k => k.card ? { t: k.t, x: DONEBTN.x + 62, y: DONEBTN.y + 22 } : k);
  for (let i = 0; i < ks.length - 1; i++) if (t <= ks[i + 1].t) { const u = ease.cubicInOut(seg(t, ks[i].t, ks[i + 1].t)); return { x: lerp(ks[i].x, ks[i + 1].x, u), y: lerp(ks[i].y, ks[i + 1].y, u) }; }
  return ks[ks.length - 1];
}
const CLICKS = [T.click1, K.done, T.click2, T.val3];
const clickDown = t => CLICKS.some(c => t >= c && t < c + 0.12);

function drawScreen(t) {
  // menu bar
  g.fillStyle = '#26232b'; g.fillRect(0, 0, 1920, 26);
  text('', 22, 19, F(500, 17), '#fff', 'left', 'ltr');
  text('Premiere Pro', 52, 19, F(700, 15), '#fff', 'left', 'ltr');
  text('File    Edit    Clip    Sequence    Markers    Graphics    View    Window    Help', 162, 19, F(500, 15), '#e8e6ea', 'left', 'ltr');
  text('Sun 9:41', 1900, 19, F(500, 15), '#fff', 'right', 'ltr');
  // Pointy lives in the menu bar
  { g.save(); rr(1560, 3, 150, 20, 10); g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill(); g.beginPath(); g.arc(1578, 13, 8, 0, Math.PI * 2); g.fillStyle = C.or; g.fill(); rr(1575.5, 7.5, 5, 8, 2.5); g.fillStyle = '#fff'; g.fill(); sparkle(1610, 13, 6, '#ddd'); g.beginPath(); g.arc(1640, 13, 6, 0, Math.PI * 2); g.lineWidth = 1.5; g.strokeStyle = '#ddd'; g.stroke(); g.restore(); }
  { const on = t > K.space; g.save(); g.translate(1772, 13); rr(-12, -10, 24, 20, 5); g.fillStyle = on ? C.or : 'rgba(255,255,255,0.0)'; g.fill(); ARROW(-6, -7, 0.3, on ? '#fff' : '#fff', 0, 0); g.restore(); }
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(1802, 8, 22, 11); g.fillRect(1824, 11, 2, 5);   // battery
  // Premiere
  if (PREM.complete) g.drawImage(PREM, 0, 26, 1920, 1054);
  // ── live Premiere state ──
  const selected = t >= T.click1, stopOn = t >= T.click2, val130 = t >= T.val3, playing = t >= T.play;
  if (selected) { rr(CLIP.x - 1, CLIP.y - 1, CLIP.w + 2, CLIP.h + 2, 3); g.lineWidth = 2.5; g.strokeStyle = '#fff'; g.stroke(); }
  if (stopOn) {   // stopwatch on + keyframes in the mini timeline
    g.beginPath(); g.arc(STOPW.x, STOPW.y, 11, 0, Math.PI * 2); g.fillStyle = '#1d1e1d'; g.fill();
    g.beginPath(); g.arc(STOPW.x, STOPW.y + 1, 8, 0, Math.PI * 2); g.lineWidth = 2.2; g.strokeStyle = C.ppBlue; g.stroke(); g.beginPath(); g.moveTo(STOPW.x, STOPW.y + 1); g.lineTo(STOPW.x, STOPW.y - 4); g.stroke();
    const kf = x => { g.save(); g.translate(x, STOPW.y); g.rotate(Math.PI / 4); g.fillStyle = '#c9cdd6'; g.fillRect(-5, -5, 10, 10); g.restore(); };
    kf(689); if (val130) kf(945);
  }
  if (val130) {
    g.fillStyle = '#1d1e1d'; g.fillRect(SCALEV.x - 2, SCALEV.y - 1, SCALEV.w + 8, SCALEV.h + 2);
    const tk = OM.tick(t, T.val3); g.save(); g.translate(SCALEV.x, SCALEV.y + 17); g.scale(tk.s, tk.s); text('130.0', 2, 0, F(500, 18), '#4aa8ff', 'left', 'ltr'); g.restore();
    // the playhead moved to the end of the clip
    if (PREM.complete) { g.drawImage(PREM, 2074, 1500, 8, 580, 1033, PY(750), 4, 290); }
    g.fillStyle = C.ppBlue; g.fillRect(1723, PY(762), 2, PY(1045) - PY(762)); g.beginPath(); g.moveTo(1717, PY(758)); g.lineTo(1731, PY(758)); g.lineTo(1724, PY(770)); g.closePath(); g.fill();
    g.fillStyle = '#1d1d1d'; g.fillRect(785, PY(708), 140, 30); text('00:00:10:00', 787, PY(732), F(700, 23), '#f5c518', 'left', 'ltr');
  }
  if (playing && PREM.complete) {     // the result: a slow zoom in the program monitor
    const z = 1 + 0.3 * ease.sineInOut(seg(t, T.play, T.play + 1.4)), sw = 762 * 2 / z, sh = 398 * 2 / z;
    g.drawImage(PREM, 1066 * 2 + (762 * 2 - sw) / 2, 113 * 2 + (398 * 2 - sh) / 2, sw, sh, MON.x, MON.y, MON.w, MON.h);
    g.fillStyle = '#1d1d1d'; g.fillRect(1002, PY(518), 130, 30);
    text(`00:00:0${Math.min(9, Math.floor((t - T.play) * 7))}:${String(Math.floor(((t - T.play) * 7 % 1) * 24)).padStart(2, '0')}`, 1004, PY(541), F(700, 22), '#f5c518', 'left', 'ltr');
  }
  // ── Pointy (as in the real app: frosted glass, orange accents) ──
  drawPointy(t);
}
function glass(R, r, tint) {        // macOS-style frosted glass: the screen behind, blurred, under a tint
  g.save(); rr(R.x, R.y, R.w, R.h, r); shadow(46, 16, 0.5); g.fillStyle = 'rgba(40,40,46,0.35)'; g.fill(); noShadow(); g.clip();
  if (PREM.complete) { const m = 40, sx = (R.x - m) * 2, sy = (R.y - 26 - m) * 2 * 1080 / 1054; g.filter = 'blur(16px)';
    g.drawImage(PREM, sx, sy, (R.w + 2 * m) * 2, (R.h + 2 * m) * 2 * 1080 / 1054, R.x - m, R.y - m, R.w + 2 * m, R.h + 2 * m); g.filter = 'none'; }
  tint(); g.restore();
  rr(R.x, R.y, R.w, R.h, r); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.65)'; g.stroke();
}
const whiteTint = (R, a = 0.82) => () => { g.fillStyle = `rgba(246,246,248,${a})`; g.fillRect(R.x - 50, R.y - 50, R.w + 100, R.h + 100); };
const rainbowTint = R => () => { g.fillStyle = 'rgba(250,250,252,0.55)'; g.fillRect(R.x, R.y, R.w, R.h);
  const gr = g.createLinearGradient(R.x + R.w, R.y, R.x, R.y + R.h); gr.addColorStop(0, 'rgba(165,205,255,0.62)'); gr.addColorStop(0.5, 'rgba(196,240,206,0.55)'); gr.addColorStop(1, 'rgba(252,240,160,0.62)');
  g.fillStyle = gr; g.fillRect(R.x, R.y, R.w, R.h); };
function pill(x, y, w, h, label, fill, fg, outline) { rr(x, y, w, h, h / 2); if (fill) { g.fillStyle = fill; g.fill(); } if (outline) { g.lineWidth = 1.6; g.strokeStyle = outline; g.stroke(); } text(label, x + w / 2, y + h / 2 + 7, F(800, 18), fg, 'center'); }
const BAR2 = { x: 560, y: 118, w: 800, h: 66 }, SUG = { x: 576, y: 196, w: 768, h: 232 };
const STEPS = [
  { R: { x: 1250, y: 548, w: 450, h: 246 }, t0: () => T.card1, t1: () => K.done + 0.22, title: 'בחירת הקליפ', desc: ['לחצו על הקליפ sunset_beach.mp4', 'בטיימליין כדי לבחור אותו.'] },
  { R: { x: 108, y: 330, w: 450, h: 246 }, t0: () => T.land2 + 0.02, t1: () => T.land3 - 0.2, title: 'הפעלת Keyframe ל-Scale', desc: ['ב-Effect Controls לחצו על', 'השעון שליד Scale.'] },
  { R: { x: 108, y: 330, w: 450, h: 246 }, t0: () => T.land3 + 0.02, t1: () => T.play + 0.1, title: 'הגדלה ל-130', desc: ['הזיזו את הסמן לסוף הקליפ', 'ושנו את Scale ל-130.'] },
];
const DONEBTN = { x: STEPS[0].R.x + 22, y: STEPS[0].R.y + STEPS[0].R.h - 60, w: 124, h: 40 };
