<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פריטה · לומדים גיטרה</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="פריטה">
<meta name="description" content="פריטה: אימון גיטרה יומי שמתאים את עצמו אליכם. מכוון, מטרונום, אקורדים, סולמות, אימון אוזן ומסלול מהאקורד הראשון ועד סולו מהיר.">
<meta property="og:title" content="פריטה · לומדים גיטרה">
<meta property="og:description" content="אימון גיטרה יומי שמתאים את עצמו אליכם, מהאקורד הראשון ועד סולו מהיר.">
<meta property="og:image" content="https://tomerzor.github.io/TOMERZOR/prita/img/og.png">
<meta property="og:url" content="https://tomerzor.github.io/TOMERZOR/prita/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Heebo:wght@400;500;600;700;800&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main>
  <section id="v-home" class="view active"></section>
  <section id="v-path" class="view"></section>
  <section id="v-chords" class="view"></section>
  <section id="v-train" class="view"></section>
  <section id="v-tools" class="view"></section>
</main>
<div class="navbar" aria-hidden="true"><b></b></div>
<nav class="tabbar" aria-label="ניווט">
  <button data-v="home" class="on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><span>אימון</span></button>
  <button data-v="path"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><span>מסלול</span></button>
  <button data-v="chords"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><span>אקורדים</span></button>
  <button data-v="train"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><span>אימונים</span></button>
  <button data-v="tools"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><span>כלים</span></button>
</nav>
<script src="js/data.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/icons.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script>document.querySelectorAll(".tabbar svg").forEach(function (s) { s.innerHTML = ICONS[{ home: "practice", path: "path", chords: "chords", train: "train", tools: "tools" }[s.parentNode.dataset.v]]; });</script>
<script src="js/app.js?v=2"></script>
</body>
</html>
