<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
body{margin:0;width:1400px;height:900px;background:#17153A;font-family:"DejaVu Sans",sans-serif;color:#F4EAD5;display:grid;grid-template-columns:1fr 360px;gap:0}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.main img{width:860px}
.tag{font-weight:bold;font-size:40px;margin-top:6px;letter-spacing:1px}
.tag b{color:#F2A23A}
.orn{display:flex;gap:18px;margin:26px 0 22px}.orn i{width:12px;height:12px;background:#F2A23A;transform:rotate(45deg);opacity:.85}
.note{font-size:21px;opacity:.7;line-height:1.7;text-align:center}
.side{background:#F4EAD5;color:#17153A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.side img.ic{width:200px}.side img.lt{width:300px}.side span{font-size:18px;font-weight:bold;opacity:.7}
</style></head><body>
<div class="main">
  <img src="logo-dark.svg" alt="">
  <div class="tag">העוזר שלך, <b>עם ניסיון של סבא</b></div>
  <div class="orn"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="note">מימין לשמאל: <b>ז · כ · א · י</b> &nbsp;—&nbsp; משמאל לימין מסתתר <b dir="ltr">AI</b><br>הנקודה של האות <span dir="ltr">i</span> היא בעצם יוד</div>
</div>
<div class="side"><img class="ic" src="icon.svg" alt=""><span>אייקון אפליקציה</span><img class="lt" src="logo-transparent.svg" alt=""><span>גרסה בהירה</span></div>
</body></html>
