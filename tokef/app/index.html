/* Layout: an ink rail on the right (RTL) beside a paper workspace. Data is set
   in mono like a filled-in form; status is carried three ways at once: a stamp
   on the record, a pill in lists and a severity edge on rows.
   Shape rule: inputs 8px, buttons 10px, cards 14px, pills fully round. */
:root {
  --paper: #F2EEE6; --sunk: #E8E2D6; --card: #FBF9F4; --raised: #FFFFFF;
  --ink: #1A1916; --soft: #57524A; --mute: #857F73;
  --rule: #DDD6C9; --hair: #EAE4D9;
  --accent: #E2581F; --on-accent: #1A1916; --accent-ink: #9A3208; --accent-tint: #F7D9C8;
  --ok: #2F5D46; --ok-tint: #DCE7DF; --warn: #7A5310; --warn-tint: #F3E3C4;
  --rail: #1A1916; --rail-fg: #F2EEE6; --rail-mute: #A8A194; --rail-hi: #2B2925; --rail-line: #34312C;
  --on-image: #FFFFFF; --image-scrim: rgba(18, 16, 13, .62);
  --scrim: rgba(26, 25, 22, .42);
  --shadow: 0 1px 2px rgba(64, 52, 33, .06), 0 10px 28px rgba(64, 52, 33, .10);
  --ring: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent);
  --f-ui: 'Rubik', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151412; --sunk: #0F0E0C; --card: #1D1B18; --raised: #24221E;
    --ink: #EFEAE1; --soft: #B8B1A5; --mute: #8E877B;
    --rule: #34312C; --hair: #29261F;
    --accent: #F0703A; --on-accent: #151412; --accent-ink: #FFAE86; --accent-tint: #3B2216;
    --ok: #8CC7A7; --ok-tint: #1A2B22; --warn: #EAC27B; --warn-tint: #33280F;
    --rail: #0C0B0A; --rail-fg: #EFEAE1; --rail-mute: #8E877B; --rail-hi: #1F1D1A; --rail-line: #26231F;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151412; --sunk: #0F0E0C; --card: #1D1B18; --raised: #24221E;
  --ink: #EFEAE1; --soft: #B8B1A5; --mute: #8E877B;
  --rule: #34312C; --hair: #29261F;
  --accent: #F0703A; --on-accent: #151412; --accent-ink: #FFAE86; --accent-tint: #3B2216;
  --ok: #8CC7A7; --ok-tint: #1A2B22; --warn: #EAC27B; --warn-tint: #33280F;
  --rail: #0C0B0A; --rail-fg: #EFEAE1; --rail-mute: #8E877B; --rail-hi: #1F1D1A; --rail-line: #26231F;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html, body { height: 100%; }
#app { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: 100%; }
::selection { background: var(--accent-tint); }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; letter-spacing: -.2px; white-space: nowrap; }
.addr { direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: 13.5px; overflow-wrap: anywhere; }
.wordmark { font-weight: 900; letter-spacing: -.6px; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.wordmark b { color: var(--accent); font-weight: 900; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--mute); }
.soft { color: var(--soft); }

/* icons: Material Symbols ligatures, clipped so a missing font never breaks layout */
.ic { font-family: 'Tokef Icons'; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1; width: 1em; height: 1em; display: inline-block; overflow: hidden; white-space: nowrap; direction: ltr; flex: none; font-variation-settings: 'FILL' 0; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; user-select: none; }
.ic.fill { font-variation-settings: 'FILL' 1; }
.no-icons .ic { display: none; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-fg); position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding-block: 26px 18px; padding-inline: max(18px, env(safe-area-inset-right, 0px)) 18px; overflow-y: auto; }
.rail .wordmark { font-size: 30px; color: var(--rail-fg); padding-inline: 10px; margin-bottom: 14px; }
.switcher { position: relative; margin-bottom: 14px; }
.switcher > button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rail-line); background: var(--rail-hi); color: var(--rail-fg); }
.switcher > button:hover { border-color: var(--rail-mute); }
.switcher .pname { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher .plabel { display: block; font-size: 11.5px; color: var(--rail-mute); font-weight: 400; }
.menu { position: absolute; inset-inline: 0; top: calc(100% + 6px); z-index: 40; background: var(--raised); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; }
.menu button { display: flex; align-items: center; gap: 10px; text-align: start; padding: 9px 10px; border: 0; background: transparent; border-radius: 8px; font-size: 14px; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--sunk); }
.menu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 0; }
.rail .cta { margin-bottom: 14px; }
.nav { display: flex; align-items: center; gap: 12px; height: 42px; padding-inline: 12px; border-radius: 10px; color: var(--rail-mute); text-decoration: none; border: 0; background: transparent; font-size: 15px; width: 100%; text-align: start; }
.nav:hover { color: var(--rail-fg); background: var(--rail-hi); }
.nav[aria-current="page"] { color: var(--rail-fg); background: var(--rail-hi); font-weight: 600; }
.nav .count { margin-inline-start: auto; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 1px 8px; font-family: var(--f-num); }
.rail .grow { flex: 1; }
.rail .who { display: flex; align-items: center; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--rail-line); font-size: 13px; color: var(--rail-mute); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--rail-hi); color: var(--rail-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.rail .who b { display: block; color: var(--rail-fg); font-weight: 600; font-size: 13.5px; }

.main { min-width: 0; padding-block: 28px 72px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) 36px; }
.page { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; animation: enter .22s var(--ease) both; }
@keyframes enter { from { opacity: .001; transform: translateY(6px); } }

.topbar, .tabbar { display: none; }

/* ---------- type ---------- */
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .2px; color: var(--accent-ink); }
.h1 { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; text-wrap: balance; }
.h2 { font-size: 18px; font-weight: 700; line-height: 1.3; }
.lede { color: var(--soft); font-size: 15px; max-width: 68ch; }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
.crumb button { border: 0; background: none; padding: 0; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.crumb button:hover { color: var(--ink); text-decoration-color: currentColor; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding-inline: 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font-weight: 600; font-size: 14.5px; white-space: nowrap; text-decoration: none; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--mute); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--soft); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); }
.btn.danger { background: transparent; color: var(--accent-ink); border-color: var(--accent-tint); }
.btn.danger:hover { background: var(--accent-tint); }
.btn.sm { height: 32px; padding-inline: 11px; font-size: 13.5px; border-radius: 8px; gap: 6px; }
.btn.sm .ic { font-size: 18px; }
.btn.lg { height: 50px; padding-inline: 22px; font-size: 16px; border-radius: 12px; }
.btn.block { width: 100%; }
.rail .btn.primary { width: 100%; height: 44px; }
.iconbtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--soft); }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; }
.card > .head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.card > .body { padding: 18px 20px; }
.card .h2 + .muted { font-size: 13px; }

/* ---------- pills, stamps, chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding-inline: 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok { background: var(--ok-tint); color: var(--ok); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--accent-tint); color: var(--accent-ink); }
.pill.block { background: var(--ink); color: var(--paper); }
.pill.plain { background: var(--sunk); color: var(--soft); }
.pill.plain::before { display: none; }
.tag { display: inline-flex; align-items: center; height: 22px; padding-inline: 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--soft); white-space: nowrap; }
.tag.accent { background: var(--accent-tint); color: var(--accent-ink); }

.stamp { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 190px; padding: 12px 20px; border: 2px solid currentColor; border-radius: 12px; outline: 1px solid currentColor; outline-offset: 3px; color: var(--ok); text-align: center; animation: press .28s var(--ease) both; }
.stamp.out { color: var(--accent-ink); }
.stamp b { font-size: 19px; font-weight: 800; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.stamp b .ic { font-size: 22px; }
.stamp span { font-size: 12.5px; font-weight: 500; opacity: .9; }
@keyframes press { from { transform: scale(1.06); opacity: .001; } }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding-inline: 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--soft); font-size: 13.5px; white-space: nowrap; }
.chip:hover { border-color: var(--mute); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip .n { font-family: var(--f-num); font-size: 12px; opacity: .8; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 500; color: var(--soft); }
.field .hint { font-size: 12.5px; color: var(--mute); }
.input, select.input, textarea.input { width: 100%; min-width: 0; height: 42px; padding-inline: 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); font-size: 15px; transition: border-color .15s; }
textarea.input { height: auto; min-height: 120px; padding-block: 10px; line-height: 1.55; resize: vertical; }
.input:hover { border-color: var(--mute); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.input.ltr, .input[type="date"], .input[type="tel"], .input[type="email"] { direction: ltr; text-align: right; }
.input.mono { font-family: var(--f-num); font-size: 14px; }
.money .input { padding-left: 30px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--rule); transition: background-color .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--raised); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .18s var(--ease); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(-16px); }
.switch input:focus-visible + span { box-shadow: var(--ring); }

/* ---------- hero band with photo ---------- */
.hero { position: relative; border-radius: 18px; overflow: hidden; min-height: 210px; display: flex; align-items: flex-end; background: var(--rail); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--image-scrim), rgba(18, 16, 13, .12) 70%); }
.hero .in { position: relative; z-index: 1; width: 100%; display: flex; align-items: flex-end; gap: 16px; padding: 22px 26px; color: var(--on-image); flex-wrap: wrap; }
.hero .eyebrow { color: var(--on-image); opacity: .85; }
.hero .h1 { color: var(--on-image); }
.hero .meta { font-size: 14px; color: var(--on-image); opacity: .9; }
.hero .btn:not(.primary) { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .35); color: var(--on-image); backdrop-filter: blur(6px); }
.hero .btn:not(.primary):hover { background: rgba(255, 255, 255, .24); }
.demo-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .18); color: var(--on-image); border: 1px solid rgba(255, 255, 255, .35); }

/* ---------- KPI strip ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { text-align: start; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .1s; }
.kpi:hover { border-color: var(--mute); }
.kpi:active { transform: translateY(1px); }
.kpi[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.kpi .v { font-family: var(--f-num); font-size: 36px; font-weight: 500; line-height: 1.1; letter-spacing: -1px; }
.kpi .l { font-size: 13.5px; color: var(--soft); }
.kpi.k-ok .v { color: var(--ok); }
.kpi.k-warn .v { color: var(--warn); }
.kpi.k-bad .v { color: var(--accent-ink); }
.kpi.k-block { background: var(--ink); border-color: var(--ink); }
.kpi.k-block .v, .kpi.k-block .l { color: var(--paper); }
.kpi.k-block[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }

/* ---------- lists ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.qlist > li { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--hair); border-inline-start: 3px solid transparent; }
.qlist > li:first-child { border-top: 0; }
.qlist > li.t-block { border-inline-start-color: var(--ink); }
.qlist > li.t-bad { border-inline-start-color: var(--accent); }
.qlist > li.t-warn { border-inline-start-color: #D9A441; }
.qlist .who { flex: 1; min-width: 0; }
.qlist .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qlist .who span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; color: var(--soft); overflow: hidden; }
.linkrow { border: 0; background: none; padding: 0; text-align: start; width: 100%; display: block; }
.linkrow:hover b { text-decoration: underline; text-underline-offset: 3px; }

.up > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 20px; border-top: 1px solid var(--hair); align-items: center; }
.up > li:first-child { border-top: 0; }
.up .bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.up .bar i { display: block; height: 100%; border-radius: 999px; background: #D9A441; margin-inline-start: auto; }
.up .bar i.late { background: var(--accent); }

/* ---------- the subcontractor table ---------- */
.tablewrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { font-weight: 500; color: var(--mute); font-size: 12.5px; text-align: start; padding: 10px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; position: sticky; top: 0; background: var(--card); }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--hair); white-space: nowrap; vertical-align: middle; }
.tbl tbody tr { cursor: pointer; transition: background-color .12s; }
.tbl tbody tr:hover { background: var(--sunk); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td:first-child { border-inline-start: 3px solid transparent; }
.tbl tr.t-block td:first-child { border-inline-start-color: var(--ink); }
.tbl tr.t-bad td:first-child { border-inline-start-color: var(--accent); }
.tbl tr.t-warn td:first-child { border-inline-start-color: #D9A441; }
.tbl .co { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.tbl .tr { font-size: 12.5px; color: var(--soft); }
.tbl button.rowlink { border: 0; background: none; padding: 0; text-align: start; font-weight: 600; }
.miss { color: var(--accent-ink); font-weight: 600; }
.okt { color: var(--ok); }
.gate-ic { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.gate-ic.in { color: var(--ok); }
.gate-ic.out { color: var(--accent-ink); }
.cards { display: none; }
.subcard { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--hair); border-inline-start: 3px solid transparent; text-align: start; width: 100%; background: none; border-inline-end: 0; border-bottom: 0; }
.subcard.t-block { border-inline-start-color: var(--ink); }
.subcard.t-bad { border-inline-start-color: var(--accent); }
.subcard.t-warn { border-inline-start-color: #D9A441; }
.subcard .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.subcard .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subcard .who span { font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search .ic { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--mute); font-size: 19px; }
.search .input { padding-inline-start: 38px; height: 38px; }
.empty { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--soft); }
.empty .ic { font-size: 34px; color: var(--mute); }
.empty b { color: var(--ink); font-size: 16px; }

/* ---------- record (subcontractor) ---------- */
.rec-head { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.rec-head .t { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 6px; }
.rec-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--soft); font-size: 14px; }
.rec-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.rec-grid > div { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.findings > li { display: flex; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--hair); align-items: flex-start; }
.findings > li:first-child { border-top: 0; }
.findings .ic { margin-top: 1px; font-size: 21px; }
.findings .f-block .ic, .findings .f-fix .ic { color: var(--accent-ink); }
.findings .f-warn .ic { color: var(--warn); }
.findings .f-info .ic { color: var(--soft); }
.findings .f-ok .ic { color: var(--ok); }
.findings .waived { opacity: .6; }
.findings .tx { flex: 1; min-width: 0; }
.findings .tx b { display: block; font-weight: 600; }
.findings .tx span { display: block; font-size: 13.5px; color: var(--soft); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.copyline { display: inline-flex; align-items: center; gap: 4px; }
.copyline .iconbtn { width: 28px; height: 28px; }
.copyline .iconbtn .ic { font-size: 16px; }

.cov { width: 100%; border-collapse: collapse; font-size: 14px; }
.cov th { font-weight: 500; font-size: 12.5px; color: var(--mute); text-align: start; padding: 8px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.cov td { padding: 11px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.cov tr:last-child td { border-bottom: 0; }
.cov .codes, .cov-cards .codes { display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
.cov-cards { display: none; }
.cov-cards > li { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--hair); }
.cov-cards > li:first-child { border-top: 0; }
.cov-cards .kv { grid-template-columns: auto minmax(0, 1fr); font-size: 13.5px; }
.code { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding-inline: 7px; border-radius: 6px; font-size: 12px; background: var(--sunk); color: var(--soft); white-space: nowrap; }
.code .num { font-size: 11.5px; }

const STATUS = {
  ok: { label: 'תקין', tone: 'ok', rank: 4 },
  soon: { label: 'פג בקרוב', tone: 'warn', rank: 3 },

function latestCert(certs, sid) {
  let best = null;
  for (const c of certs) {
    if (c.sid !== sid) continue;
    if (!best || (c.createdAt || 0) > (best.createdAt || 0)) best = c;
  }
  return best;

function evaluate(sub, cert, profile, project, today) {
  const warnDays = Number(project && project.warnDays) || 30;
  const prof = profile || { lines: {}, cancelDays: 0, requester: false };
  const req = REQ_TYPES.filter((t) => prof.lines && prof.lines[t] && prof.lines[t].on);
  const out = { status: 'ok', gate: 'in', findings: [], lines: [], until: null, daysLeft: null, waived: false, certId: cert ? cert.id : null };
  const add = (lvl, key, title, ask, extra) => out.findings.push(Object.assign({ lvl, key, title, ask }, extra || {}));

  if (!cert) {
    out.status = 'missing';
    out.gate = 'out';
    add('block', 'nocert', 'לא הועלה אישור קיום ביטוחים', 'נא להעביר אישור קיום ביטוחים חתום, לפי דרישות הביטוח של הפרויקט.');
    out.lines = req.map((t) => ({ type: t, req: prof.lines[t], got: null, state: 'missing', missingCodes: [], daysLeft: null }));
    return out;
  }

  const f = cert.fields || {};
  const pols = Array.isArray(f.policies) ? f.policies : [];
  let block = false, fix = false, soon = false;
  const ends = [];

  for (const t of req) {
    const r = prof.lines[t];
    const C = COVER[t];
    let p = null;
    for (const q of pols) {
      if (!q || q.type !== t) continue;
      if (!p || (q.end || '') > (p.end || '')) p = q;
    }
    const ln = { type: t, req: r, got: p, state: 'ok', missingCodes: [], daysLeft: null };
    out.lines.push(ln);
    if (!p) {
      ln.state = 'missing';
      fix = true;
      add('fix', 'miss-' + t, 'חסר ' + C.long, 'נא להוסיף לאישור ' + C.long + (r.min ? ' בגבול אחריות של ' + money(r.min) + ' לפחות' : '') + '.', { type: t });
      continue;
    }
    const end = isISO(p.end) ? p.end : null;
    const start = isISO(p.start) ? p.start : null;
    if (!end) {
      ln.state = 'fix';
      fix = true;
      add('fix', 'noend-' + t, 'לא צוין תאריך סיום ל' + C.long, 'נא לציין באישור את תקופת הביטוח של ' + C.long + '.', { type: t });
    } else {
      ends.push(end);
      const d = diffDays(end, today);
      ln.daysLeft = d;
      if (d < 0) {
        ln.state = 'expired';
        block = true;
        add('block', 'exp-' + t, C.long + ' פג ב-' + fmtDate(end), 'נא להנפיק אישור מעודכן ל' + C.long + ' לתקופה שמתחילה ב-' + fmtDate(addDays(end, 1)) + '.', { type: t });
      } else if (d <= warnDays) {
        ln.state = 'soon';
        soon = true;
        add('warn', 'soon-' + t, C.long + (d === 0 ? ' פג היום' : d === 1 ? ' פג מחר' : ' פג בעוד ' + d + ' ימים'), 'נא להעביר אישור לתקופה הבאה לפני ' + fmtDate(end) + '.', { type: t });
      }
    }
    if (start && start > today) {
      fix = true;
      if (ln.state === 'ok') ln.state = 'future';
      add('fix', 'start-' + t, C.long + ' נכנס לתוקף רק ב-' + fmtDate(start), 'נא לוודא שהביטוח בתוקף ממועד תחילת העבודה באתר.', { type: t });
    }
    if (r.min > 0) {
      if (p.limit == null || !(p.limit > 0)) {
        fix = true;
        if (ln.state === 'ok') ln.state = 'fix';
        add('fix', 'nolim-' + t, 'לא צוין גבול אחריות ב' + C.long, 'נא לציין באישור את גבול האחריות ב' + C.long + ' (נדרש ' + money(r.min) + ' לפחות).', { type: t });
      } else if (p.currency === 'USD') {
        add('warn', 'usd-' + t, 'גבול האחריות ב' + C.long + ' נקוב בדולרים', 'נא לאשר שגבול האחריות ב' + C.long + ' שווה ל-' + money(r.min) + ' לפחות.', { type: t });
      } else if (p.limit < r.min) {
        fix = true;
        if (ln.state === 'ok') ln.state = 'low';
        add('fix', 'low-' + t, 'גבול האחריות ב' + C.long + ' הוא ' + moneyIn(p.limit) + ', נדרש ' + moneyIn(r.min), 'נא להגדיל את גבול האחריות ב' + C.long + ' ל-' + money(r.min) + ' לפחות.', { type: t });
      }

    const miss = (r.codes || []).filter((c) => !have.has(Number(c)));

      ln.missingCodes = miss;
      if (ln.state === 'ok') ln.state = 'codes';
      add('fix', 'codes-' + t, 'ב' + C.long + ' ' + (miss.length === 1 ? 'חסר סעיף: ' : 'חסרים סעיפים: ') + miss.map(codeShort).join(', '),
        'נא להוסיף ל' + C.long + ' את ' + miss.map((c) => 'קוד ' + c + ' (' + codeLong(c) + ')').join(', ') + '.', { type: t, codes: miss });
    }
  }

  if (subId && certId && subId !== certId) {
    fix = true;
    add('fix', 'insured-id', 'מספר החברה באישור (' + f.insuredId + ') שונה מהרשום (' + sub.companyId + ')',
      'נא להנפיק את האישור על שם ' + (sub.name || 'החברה שמבצעת את העבודה') + ', ח.פ. ' + sub.companyId + '.');
  } else if (f.insuredName && sub && sub.name && !namesMatch(f.insuredName, sub.name) && !(subId && certId)) {

    } else if (!idOk && !namesMatch(f.requester, project.client)) {
      fix = true;
      add('fix', 'requester', 'מבקש האישור באישור הוא "' + f.requester + '"', 'נא לציין את ' + project.client + (project.clientId ? ' (ח.פ. ' + project.clientId + ')' : '') + ' כמבקש האישור.');
    }

  const needDays = Number(prof.cancelDays) || 0;
  if (needDays && f.cancelDays != null && Number(f.cancelDays) < needDays) {
    fix = true;

  }

  if (ends.length) {
    out.until = ends.reduce((a, b) => (a < b ? a : b));
    out.daysLeft = diffDays(out.until, today);
    if (sub && isISO(sub.workTo) && out.until < sub.workTo && out.daysLeft >= 0) {
      add('info', 'renew', 'הביטוח מסתיים לפני סוף העבודה בפרויקט', 'יידרש אישור לתקופה הבאה עד ' + fmtDate(out.until) + '.');

  out.gate = out.status === 'ok' || out.status === 'soon' ? 'in' : 'out';

  out.findings.sort((a, b) => (a.waived ? 1 : 0) - (b.waived ? 1 : 0) || order[a.lvl] - order[b.lvl]);

}

/* One line that explains the state, used in tables, the gate and the queue. */
function reason(ev) {
  if (!ev) return '';
  if (ev.status === 'missing') return 'לא הועלה אישור';
  if (ev.status === 'ok') return ev.waived ? 'אושר בחריגה' : 'כל הדרישות התקיימו';
  const first = ev.findings.find((x) => !x.waived && (x.lvl === 'block' || x.lvl === 'fix' || x.lvl === 'warn'));
  if (!first) return '';
  const more = ev.findings.filter((x) => !x.waived && (x.lvl === 'block' || x.lvl === 'fix')).length - (first.lvl === 'warn' ? 0 : 1);
  return first.title + (more > 0 ? ' ועוד ' + (more === 1 ? 'ממצא אחד' : more + ' ממצאים') : '');
}

function statusLabel(ev) {
  if (!ev) return '';
  if (ev.status === 'soon') {
    const d = ev.daysLeft;
    return d === 0 ? 'פג היום' : d === 1 ? 'פג מחר' : 'פג בעוד ' + d + ' ימים';
  }
  return STATUS[ev.status].label;
}

function urgency(ev) {
  const r = STATUS[ev.status].rank;
  return r * 100000 + (ev.status === 'soon' ? Math.max(0, ev.daysLeft || 0) : 0);
}

function reportRows(rows, profiles) {

  const body = rows.map(({ sub, ev }) => {

    return [

    ];
  });

}
function toCSV(table) { return '﻿' + table.map((r) => r.map(csvCell).join(',')).join('\r\n'); }
function toTSV(table) { return table.map((r) => r.map((v) => String(v == null ? '' : v).replace(/[\t\n\r]+/g, ' ')).join('\t')).join('\n'); }

/* Paste from Excel: name, company id, trade, contact, phone (any subset, in that order). */
function parseSubList(text) {
  const rows = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const cells = raw.includes('\t') ? raw.split('\t') : raw.split(/\s*[,;]\s*/);
    const c = cells.map((x) => x.trim());
    if (!c[0] || /^(שם|קבלן|name)/i.test(c[0]) && rows.length === 0 && !/\d/.test(c[1] || '')) continue;
    let [name, id, trade, contact, phone] = c;
    if (id && /^0\d{8,9}$/.test(digits(id)) && !trade) { phone = id; id = ''; }
    else if (id && !/\d{5,}/.test(digits(id)) && !phone) { phone = contact; contact = trade; trade = id; id = ''; }
    rows.push({ name: name.slice(0, 80), companyId: digits(id) ? id : '', trade: trade || '', contact: contact || '', phone: phone || '' });
    if (rows.length >= 200) break;
  }
  return rows;
}

/* ---- platform.js ---- */
/* Tokef platform layer: reaches the viewer's capabilities, keeps the shared
   data in memory and writes it back. With the `db` capability the data is
   shared by everyone who opens the page; without it a local store in this
   browser stands in, with the same interface. */

const Caps = { db: null, assets: null, sample: null, downloads: null, user: null, ai: false, aiImages: false, imgMax: 1, imgTypes: [] };

function capUse(name) {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    return Promise.resolve(window.claude.use(name)).catch(() => null);
  } catch (e) {
    return Promise.resolve(null);
  }
}

function safeGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, v) { try { window.localStorage.setItem(key, v); return true; } catch (e) { return false; } }

/* ---- a small local store with the subset of the db interface we use ---- */
function makeLocalDB(key) {
  let docs = {};
  try { docs = JSON.parse(safeGet(key) || '{}') || {}; } catch (e) { docs = {}; }
  const listeners = new Set();
  const snap = (path, data) => ({ id: path.split('/').pop(), exists: data !== undefined, data: () => (data === undefined ? undefined : JSON.parse(JSON.stringify(data))), metadata: { fromCache: false, hasPendingWrites: false } });
  const inCol = (col, path) => path.startsWith(col + '/') && path.split('/').length === col.split('/').length + 1;
  function fire(l) {
    if (l.kind === 'doc') l.cb(snap(l.path, docs[l.path]));
    else {
      const list = Object.keys(docs).filter((p) => inCol(l.path, p) && l.filters.every(([f, op, v]) => op === '==' && docs[p][f] === v)).sort().map((p) => snap(p, docs[p]));
      l.cb({ docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } });
    }
  }
  let queued = false;
  function changed() {
    safeSet(key, JSON.stringify(docs));
    if (queued) return;
    queued = true;
    setTimeout(() => { queued = false; listeners.forEach(fire); }, 0);
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      get: async () => snap(path, docs[path]),
      set: async (data) => { docs[path] = JSON.parse(JSON.stringify(data)); changed(); },
      update: async (data) => {
        if (!docs[path]) throw { code: 'invalid_argument', message: 'missing document' };
        docs[path] = Object.assign({}, docs[path], JSON.parse(JSON.stringify(data)));
        changed();
      },
      delete: async () => { delete docs[path]; changed(); },
      onSnapshot: (cb) => { const l = { kind: 'doc', path, cb }; listeners.add(l); setTimeout(() => listeners.has(l) && fire(l), 0); return () => listeners.delete(l); },
    };
  }
  function query(path, filters) {
    return {
      path,
      where: (f, op, v) => query(path, filters.concat([[f, op, v]])),
      doc: (id) => docRef(path + '/' + (id || uid())),
      onSnapshot: (cb) => { const l = { kind: 'col', path, filters, cb }; listeners.add(l); setTimeout(() => listeners.has(l) && fire(l), 0); return () => listeners.delete(l); },
      get: async () => new Promise((res) => fire({ kind: 'col', path, filters, cb: res })),
    };
  }
  return { local: true, doc: docRef, collection: (path) => query(path, []) };
}

/* ---- error copy ---- */
function dbErrorText(e) {
  const code = e && e.code;
  if (code === 'read_only') return 'יש לך הרשאת צפייה בלבד בעמוד הזה, ולכן אי אפשר לשמור שינויים.';
  if (code === 'quota_exceeded') return 'מאגר הנתונים מלא. מחקו פרויקטים או אישורים ישנים ונסו שוב.';
  if (code === 'resource_exhausted') return 'יותר מדי פעולות ברגע אחד. חכו כמה שניות ונסו שוב.';
  if (code === 'revoked' || code === 'not_granted') return 'אין כרגע גישה לשמירת נתונים בעמוד הזה.';
  if (code === 'invalid_argument') return 'השמירה נדחתה. ייתכן שהרשומה נמחקה בינתיים.';
  return 'השמירה לא הצליחה. בדקו את החיבור ונסו שוב.';
}

/* ---- the app store ---- */
const Store = {
  mode: 'boot', // boot | db | local
  db: null,
  projects: [], subs: [], certs: [], profiles: [], log: [],
  pid: null,
  readOnly: false,
  canWrite: null, // what user.can("data.write") said: true, false, or null when the platform said nothing
  loaded: { projects: false, project: false },
  problem: null,
  me: { id: null, name: '' },
  listeners: new Set(),
  unsubs: [],
  _pending: {},

  version: 0,
  emit() { this.version++; this.listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },

  attach(db, mode) {
    this.db = db;
    this.mode = mode;
    if (this._projUnsub) this._projUnsub();
    this._projUnsub = db.collection('projects').onSnapshot(
      (snap) => {
        this.projects = snap.docs.filter((d) => d.exists).map((d) => normProject(d.id, d.data()));
        this.projects.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        this.loaded.projects = true;
        const saved = safeGet('tokef.pid');
        if (!this.pid || !this.projects.some((p) => p.id === this.pid)) {
          const next = this.projects.find((p) => p.id === saved) || this.projects[0];
          this.selectProject(next ? next.id : null);
        }
        this.emit();
      },
      (e) => this.fail(e)
    );
  },

  fail(e) {
    const code = (e && e.code) || 'unavailable';
    this.problem = code === 'revoked' ? 'revoked' : 'lost';
    this.emit();
  },

  selectProject(pid) {
    if (pid === this.pid && this.loaded.project) return;
    this.unsubs.forEach((u) => { try { u(); } catch (e) {} });
    this.unsubs = [];
    this.pid = pid;
    this.subs = []; this.certs = []; this.profiles = []; this.log = [];
    this.loaded.project = false;
    if (pid) safeSet('tokef.pid', pid);
    if (!pid || !this.db) { this.loaded.project = true; this.emit(); return; }
    const got = { subs: false, certs: false, profiles: false, log: false };
    const done = (k) => { got[k] = true; if (got.subs && got.certs && got.profiles && got.log) this.loaded.project = true; this.emit(); };
    const db = this.db;
    const err = (e) => this.fail(e);
    this.unsubs.push(db.collection('subs').where('pid', '==', pid).onSnapshot((s) => { if (this.pid !== pid) return; this.subs = s.docs.filter((d) => d.exists).map((d) => normSub(d.id, d.data())); done('subs'); }, err));
    this.unsubs.push(db.collection('certs').where('pid', '==', pid).onSnapshot((s) => { if (this.pid !== pid) return; this.certs = s.docs.filter((d) => d.exists).map((d) => normCert(d.id, d.data())); done('certs'); }, err));
    this.unsubs.push(db.collection('profiles').where('pid', '==', pid).onSnapshot((s) => { if (this.pid !== pid) return; this.profiles = s.docs.filter((d) => d.exists).map((d) => normProfile(d.id, d.data())).sort((a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0)); done('profiles'); }, err));
    this.unsubs.push(db.doc('logs/' + pid).onSnapshot((d) => { if (this.pid !== pid) return; const x = d.exists ? d.data() : null; this.log = x && Array.isArray(x.items) ? x.items.slice() : []; done('log'); }, err));
    this.emit();
  },

  project() { return this.projects.find((p) => p.id === this.pid) || null; },

  /* A transient failure is retried once; a busy store is given a few seconds to catch up. */
  async retry(fn) {
    for (let attempt = 0; ; attempt++) {
      try { return await fn(); } catch (e) {
        const code = e && e.code;
        const again = (code === 'unavailable' && attempt < 1) || (code === 'resource_exhausted' && attempt < 3);
        if (!again) throw e;
        await new Promise((r) => setTimeout(r, code === 'unavailable' ? 300 + Math.random() * 500 : 1000 * 2 ** attempt));
      }
    }
  },
  /* A refused write on a view the platform said nothing about means this viewer may only read. */
  refused(e) {
    if (e && e.code === 'invalid_argument' && this.mode === 'db' && this.canWrite === null && !this.readOnly) { this.readOnly = true; this.emit(); }
    throw e;
  },
  async write(path, data) {
    if (this.readOnly) throw { code: 'read_only', message: 'read only' };
    const body = stripUndef(data);
    try { await this.retry(() => this.db.doc(path).set(body)); } catch (e) { this.refused(e); }
  },
  async remove(path) {
    if (this.readOnly) throw { code: 'read_only', message: 'read only' };
    try { await this.retry(() => this.db.doc(path).delete()); } catch (e) { this.refused(e); }
  },

  async saveProject(p) { const { id, ...rest } = p; await this.write('projects/' + id, rest); },
  async saveSub(s) { const { id, ...rest } = s; await this.write('subs/' + id, rest); },
  async saveCert(c) { const { id, ...rest } = c; await this.write('certs/' + id, rest); },
  async saveProfile(p) { const { id, ...rest } = p; await this.write('profiles/' + id, rest); },
  async deleteSub(id) {
    const certs = this.certs.filter((c) => c.sid === id);
    for (const c of certs) await this.deleteCert(c.id);
    await this.remove('subs/' + id);
  },
  async deleteCert(id) {
    const c = this.certs.find((x) => x.id === id);
    await this.remove('certs/' + id);
    if (c && c.file && c.file.id && Caps.assets) { try { await Caps.assets.delete(c.file.id); } catch (e) {} }
  },
  async deleteProfile(id) { await this.remove('profiles/' + id); },

  async createProject(fields) {
    const id = uid('p');
    const now = Date.now();
    await this.saveProject(Object.assign({ id, name: '', client: '', clientId: '', address: '', warnDays: 30, cover: 'day', createdAt: now, demo: false }, fields));
    let i = 0;
    for (const d of DEFAULT_PROFILES) {
      await this.saveProfile({ id: uid('r'), pid: id, key: d.key, name: d.name, lines: JSON.parse(JSON.stringify(d.lines)), cancelDays: d.cancelDays, requester: d.requester, order: i++, createdAt: now });
    }
    await this.write('logs/' + id, { pid: id, items: [{ at: now, by: this.me.id, kind: 'project', text: 'הפרויקט נוצר' }] });
    this.selectProject(id);
    return id;
  },

  async deleteProject(pid) {
    const wasCurrent = pid === this.pid;
    const subs = wasCurrent ? this.subs : [];
    const certs = wasCurrent ? this.certs : [];
    const profs = wasCurrent ? this.profiles : [];
    for (const c of certs) await this.deleteCert(c.id);
    for (const s of subs) await this.remove('subs/' + s.id);
    for (const r of profs) await this.remove('profiles/' + r.id);
    await this.remove('logs/' + pid);
    await this.remove('projects/' + pid);
    if (wasCurrent) {
      const next = this.projects.find((p) => p.id !== pid);
      this.selectProject(next ? next.id : null);
    }
  },

  /* The log is one document per project; entries queue up so only one write to it runs at a time. */
  async log_(kind, text, sid) {
    if (!this.pid || this.readOnly) return;
    this.log = [{ at: Date.now(), by: this.me.id, kind, text, sid: sid || null }].concat(this.log).slice(0, 300);
    this.emit();
    this._logPid = this.pid;
    this._logDirty = true;
    if (this._logBusy) return;
    this._logBusy = true;
    try {
      while (this._logDirty) {
        this._logDirty = false;
        const pid = this._logPid;
        if (pid !== this.pid) break;
        try { await this.write('logs/' + pid, { pid, items: this.log }); } catch (e) { /* the log is best effort */ }
      }
    } finally { this._logBusy = false; }
  },

  /* Loads demo.json (published next to the page) into the store. */
  async loadDemo() {
    const res = await fetch('demo.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('demo');
    const data = await res.json();
    const jobs = [];
    for (const col of ['projects', 'profiles', 'subs', 'certs', 'logs']) {
      for (const d of data[col] || []) { const { id, ...rest } = d; jobs.push([col + '/' + id, rest]); }
    }
    for (const [p, d] of jobs) await this.write(p, d);
    const first = (data.projects || [])[0];
    if (first) this.selectProject(first.id);
  },
};

async function bootPlatform() {
  const viewer = !!(window.claude && typeof window.claude.use === 'function');
  if (!viewer) {
    Store.attach(makeLocalDB('tokef.local.v1'), 'local');
    return;
  }
  capUse('user').then(async (u) => {
    Caps.user = u;
    if (!u) return;
    try { const me = await u.me(); Store.me = { id: me.id || null, name: me.name || '' }; } catch (e) {}
    try {
      const can = await u.can('data.write');
      Store.canWrite = can === true ? true : can === false ? false : null;
      if (can === false) Store.readOnly = true;
    } catch (e) {}
    Store.emit();
  });
  capUse('assets').then((a) => { Caps.assets = a; Store.emit(); });
  capUse('downloads').then((d) => { Caps.downloads = d; Store.emit(); });
  capUse('sample').then(async (s) => {
    Caps.sample = s;
    if (s) {
      Caps.ai = true;
      try {
        const lim = await s.limits();
        if (lim && lim.images) { Caps.aiImages = true; Caps.imgMax = Math.max(1, lim.images.maxCount || 1); Caps.imgTypes = lim.images.mediaTypes || []; }
      } catch (e) {}
    }
    Store.emit();
  });
  const db = await capUse('db');
  if (db) { Caps.db = db; Store.attach(db, 'db'); }
  else Store.attach(makeLocalDB('tokef.local.v1'), 'local');
}

/* ---- ui-base.js ---- */
/* Tokef UI: primitives, navigation, toasts, the app shell. */
const { h, render, Fragment } = preact;
const { useState, useEffect, useMemo, useRef, useCallback } = preactHooks;
const html = htm.bind(h);

/* ---------- store hooks ---------- */
/* Subscribes after the first paint, so a change that landed in between is caught by comparing versions. */
function useStore() {
  const [, force] = useState(0);
  const seen = useRef(Store.version);
  seen.current = Store.version;
  useEffect(() => {
    const fn = () => force((n) => n + 1);
    const off = Store.on(fn);
    if (seen.current !== Store.version) fn();
    return off;
  }, []);
  return Store;
}

let derivedMemo = { key: null, val: null };
function derive() {
  const S = Store;
  const today = todayISO();
  const key = [S.subs, S.certs, S.profiles, S.projects, S.pid, today];
  if (derivedMemo.key && key.every((k, i) => k === derivedMemo.key[i])) return derivedMemo.val;
  const project = S.project();
  const byId = new Map(S.profiles.map((p) => [p.id, p]));
  const fallback = S.profiles[0] || null;
  const rows = S.subs.map((sub) => {
    const profile = byId.get(sub.profile) || fallback;
    const cert = latestCert(S.certs, sub.id);
    const ev = evaluate(sub, cert, profile, project, today);
    return { sub, profile, cert, ev, orphan: !byId.has(sub.profile) };
  });
  rows.sort((a, b) => urgency(a.ev) - urgency(b.ev) || a.sub.name.localeCompare(b.sub.name, 'he'));
  const counts = { all: rows.length, in: 0, soon: 0, fix: 0, blocked: 0, ok: 0, attention: 0 };
  for (const r of rows) {
    const s = r.ev.status;
    if (r.ev.gate === 'in') counts.in++;
    if (s === 'soon') counts.soon++;
    if (s === 'fix') counts.fix++;
    if (s === 'expired' || s === 'missing') counts.blocked++;
    if (s === 'ok') counts.ok++;
    if (s !== 'ok' && s !== 'soon') counts.attention++;
  }
  const val = { project, today, rows, counts };
  derivedMemo = { key, val };
  return val;
}
function useDerived() { useStore(); return derive(); }

function toneOf(ev) {
  const s = ev.status;
  return s === 'expired' || s === 'missing' ? 't-block' : s === 'fix' ? 't-bad' : s === 'soon' ? 't-warn' : '';
}

/* ---------- navigation: state lives in the page, the hash names the view ---------- */
const Nav = {
  view: 'home', id: null, listeners: new Set(), version: 0,
  parse(hash) {
    const t = String(hash || '').replace(/^#/, '');
    if (t.startsWith('s-')) return { view: 'sub', id: t.slice(2) };
    if (t.startsWith('u-')) return { view: 'portal', id: t.slice(2) };
    if (t.startsWith('c-')) return { view: 'check', id: t.slice(2) };
    if (['gate', 'rules', 'log', 'check', 'project'].includes(t)) return { view: t, id: null };
    return { view: 'home', id: null };
  },
  token() {
    if (this.view === 'sub') return 's-' + this.id;
    if (this.view === 'portal') return 'u-' + this.id;
    if (this.view === 'check') return this.id ? 'c-' + this.id : 'check';
    return this.view === 'home' ? '' : this.view;
  },
  go(view, id) {
    this.view = view;
    this.id = id || null;
    try { history.replaceState(null, '', this.token() ? '#' + this.token() : location.pathname + location.search); } catch (e) {}
    try { window.scrollTo(0, 0); } catch (e) {}
    this.version++;
    this.listeners.forEach((fn) => fn());
  },
};
function useNav() {
  const [, force] = useState(0);
  const seen = useRef(Nav.version);
  seen.current = Nav.version;
  useEffect(() => {
    const fn = () => force((n) => n + 1);
    Nav.listeners.add(fn);
    if (seen.current !== Nav.version) fn();
    return () => Nav.listeners.delete(fn);
  }, []);
  return Nav;
}
const go = (v, id) => Nav.go(v, id);

/* ---------- toasts ---------- */
const Toasts = {
  list: [], listeners: new Set(), version: 0,
  push(text, tone) {
    const id = uid('t');
    this.list = this.list.concat([{ id, text, tone }]).slice(-3);
    this.emit();
    setTimeout(() => { this.list = this.list.filter((t) => t.id !== id); this.emit(); }, tone === 'bad' ? 6500 : 4200);
  },
  emit() { this.version++; this.listeners.forEach((fn) => fn()); },
};
function toast(text, tone) { Toasts.push(text, tone); }
function ToastHost() {
  const [, force] = useState(0);
  const seen = useRef(Toasts.version);
  seen.current = Toasts.version;
  useEffect(() => {
    const fn = () => force((n) => n + 1);
    Toasts.listeners.add(fn);
    if (seen.current !== Toasts.version) fn();
    return () => Toasts.listeners.delete(fn);
  }, []);
  return html`<div class="toasts" role="status" aria-live="polite">
    ${Toasts.list.map((t) => html`<div key=${t.id} class=${'toast' + (t.tone === 'bad' ? ' bad' : '')}><${Icon} n=${t.tone === 'bad' ? 'error' : 'check_circle'} />${t.text}</div>`)}
  </div>`;
}

function copyText(text, okMsg) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) toast(okMsg || 'הועתק');
    else toast('ההעתקה נחסמה כאן. סמנו את הטקסט והעתיקו ידנית.', 'bad');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg || 'הועתק'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

function Icon({ n, fill, cls }) {

function Num({ children }) { return html`<span class="num">${children}</span>`; }
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function plural(n, one, many) { return n === 1 ? one : n + ' ' + many; }

function Modal({ title, onClose, wide, children, footer }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const el = ref.current && (ref.current.querySelector('.mb input:not([type=hidden]), .mb textarea, .mb select') || ref.current.querySelector('.mb button'));
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} }
    return () => { window.removeEventListener('keydown', onKey); if (prev && prev.focus) { try { prev.focus({ preventScroll: true }); } catch (e) {} } };
  }, []);
  return html`<div class="overlay" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title} ref=${ref}>
      <div class="mh"><h2 class="h2">${title}</h2><button type="button" class="iconbtn" aria-label="סגירה" onClick=${onClose}><${Icon} n="close" /></button></div>
      <div class="mb">${children}</div>
      ${footer ? html`<div class="mf">${footer}</div>` : null}
    </div>
  </div>`;
}

/* A two-step destructive button: the first press arms it, the second acts. */
function ConfirmButton({ label, confirm, onConfirm, cls, icon, disabled, aria }) {
  const [armed, setArmed] = useState(false);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 5000); return () => clearTimeout(t); }, [armed]);
  return html`<button type="button" class=${'btn ' + (cls || 'danger')} aria-label=${armed ? confirm : (label || aria)} disabled=${disabled || busy} onClick=${async () => {
    if (!armed) { setArmed(true); return; }
    setBusy(true);
    try { await onConfirm(); } finally { setBusy(false); setArmed(false); }
  }}>${icon ? html`<${Icon} n=${icon} />` : null}${armed ? confirm : label}</button>`;
}

function ProjectModal({ onClose }) {
  const [draft, setDraft] = useState({ name: '', address: '', client: '', clientId: '', cover: 'day' });
  const [busy, setBusy] = useState(false);
  const set = (p) => setDraft(Object.assign({}, draft, p));
  const ok = draft.name.trim() && draft.client.trim();
  const save = async (e) => {
    if (e) e.preventDefault();
    if (!ok || busy) return;
    setBusy(true);
    try {
      await Store.createProject({ name: draft.name.trim(), address: draft.address.trim(), client: draft.client.trim(), clientId: draft.clientId.trim(), cover: draft.cover });
      toast('הפרויקט נוצר עם ארבעה פרופילי דרישות לדוגמה');
      onClose();
      go('home');
    } catch (err) { toast(dbErrorText(err), 'bad'); setBusy(false); }
  };
  return html`<${Modal} title="פרויקט חדש" onClose=${onClose} footer=${html`
      <button type="button" class="btn primary" disabled=${!ok || busy} onClick=${save}>${busy ? 'יוצר…' : 'יצירת הפרויקט'}</button>
      <button type="button" class="btn quiet" onClick=${onClose}>ביטול</button>`}>
    <form onSubmit=${save} style=${{ display: 'contents' }}>
      <p class="lede">לכל פרויקט יש דרישות ביטוח משלו, לפי החוזה הראשי. נתחיל עם ארבעה פרופילים נפוצים שאפשר לערוך.</p>
      <${ProjectFields} draft=${draft} set=${set} idp="np-" />
    </form>
  <//>`;
}

/* ---------- dashboard ---------- */
const FILTERS = {
  all: { label: 'הכול', test: () => true },
  attention: { label: 'דורשים טיפול', test: (r) => r.ev.status !== 'ok' && r.ev.status !== 'soon' },
  soon: { label: 'פגים בקרוב', test: (r) => r.ev.status === 'soon' },
  ok: { label: 'תקינים', test: (r) => r.ev.status === 'ok' },
  in: { label: 'מורשים לכניסה', test: (r) => r.ev.gate === 'in' },
  fix: { label: 'דורשים תיקון', test: (r) => r.ev.status === 'fix' },
  blocked: { label: 'חסומים', test: (r) => r.ev.status === 'expired' || r.ev.status === 'missing' },
};
function matchQuery(r, q) {
  if (!q) return true;
  const s = q.trim().toLowerCase();
  if (!s) return true;
  const d = digits(s);
  return r.sub.name.toLowerCase().includes(s) || (r.sub.trade || '').toLowerCase().includes(s) || (r.sub.contact || '').toLowerCase().includes(s) || (d.length >= 3 && digits(r.sub.companyId).includes(d));
}

function waLink(r, project) {
  const msg = whatsappText(r.sub, r.ev, project, r.profile);
  const ph = phoneIntl(r.sub.phone);
  return 'https://wa.me/' + ph + '?text=' + encodeURIComponent(msg);
}

function exportReport(D) {
  const table = reportRows(D.rows, Store.profiles);
  const name = 'tokef-report-' + D.today + '.csv';
  if (Caps.downloads) {
    Caps.downloads.save({ filename: name, data: toCSV(table) }).then(
      () => toast('הדוח נשמר'),
      (e) => { if (e && e.code === 'declined') return; copyText(toTSV(table), 'שמירת קבצים לא זמינה כאן, אז הטבלה הועתקה. אפשר להדביק באקסל.'); }
    );
  } else {
    copyText(toTSV(table), 'הטבלה הועתקה. אפשר להדביק אותה באקסל.');
  }
}

/* ---------- coverage ribbon ---------- */
/* Indexes of tick positions that keep labels apart from each other and from the "today" label. */
function spaced(positions, todayPos) {
  const out = [];
  let last = -100;
  positions.forEach((p, i) => {
    if (p - last >= 24 && Math.abs(p - todayPos) >= 20 && p <= 96) { out.push(i); last = p; }
  });
  return out;
}
function Ribbon({ ev, sub, today }) {
  const lines = ev.lines;
  if (!lines.length) return null;
  const dates = [addDays(today, -45), addDays(today, 300)];
  for (const l of lines) {
    if (l.got && isISO(l.got.end)) dates.push(l.got.end);
    if (l.got && isISO(l.got.start)) dates.push(l.got.start);
  }
  if (isISO(sub.workFrom)) dates.push(sub.workFrom);
  if (isISO(sub.workTo)) dates.push(sub.workTo);
  let from = dates.reduce((a, b) => (a < b ? a : b));
  let to = dates.reduce((a, b) => (a > b ? a : b));
  if (diffDays(to, from) > 1100) { from = addDays(today, -180); to = addDays(today, 900); }
  from = from.slice(0, 8) + '01';
  const span = Math.max(30, diffDays(to, from));
  const pos = (d) => Math.max(0, Math.min(100, (diffDays(d, from) / span) * 100));
  const ticks = [];
  let m = from;
  while (m <= to) {
    const mm = +m.slice(5, 7);
    if ((mm - 1) % 3 === 0) ticks.push(m);
    const y = +m.slice(0, 4), nm = mm === 12 ? 1 : mm + 1, ny = mm === 12 ? y + 1 : y;
    m = ny + '-' + String(nm).padStart(2, '0') + '-01';
  }
  const tPos = pos(today);
  const work = isISO(sub.workFrom) || isISO(sub.workTo) ? [pos(sub.workFrom || from), pos(sub.workTo || to)] : null;
  return html`<div class="ribbon" aria-label="ציר זמן של תקופות הביטוח">
    ${lines.map((l) => {
      const p = l.got;
      const end = p && isISO(p.end) ? p.end : null;
      const start = p && isISO(p.start) ? p.start : end ? addDays(end, -364) : null;
      const cls = l.state === 'expired' ? 'expired' : l.state === 'soon' ? 'soon' : l.state === 'ok' ? '' : 'fix';
      return html`<div key=${l.type} class="rb-row">
        <span title=${COVER[l.type].long}>${COVER[l.type].label}</span>
        <div class="rb-track">
          ${work ? html`<div class="rb-work" style=${{ right: work[0] + '%', width: Math.max(0.5, work[1] - work[0]) + '%' }}></div>` : null}
          ${end ? html`<div class=${'rb-bar ' + cls} style=${{ right: pos(start) + '%', width: Math.max(0.8, pos(end) - pos(start)) + '%' }} title=${fmtDate(start) + ' - ' + fmtDate(end)}></div>` : html`<div class="rb-none">${p ? 'אין תאריכים' : 'חסר באישור'}</div>`}
          <div class="rb-today" style=${{ right: 'calc(' + tPos + '% - 1px)' }}></div>
        </div>
      </div>`;
    })}
    <div class="rb-axis"><span></span><div class="rb-ticks">
      ${spaced(ticks.map(pos), tPos).map((i) => html`<span key=${ticks[i]} style=${{ right: pos(ticks[i]) + '%' }}>${fmtMonth(ticks[i])}</span>`)}
      <span class="today" style=${{ right: tPos + '%' }}>היום</span>
    </div></div>
    <div class="rb-legend">
      <span><i style=${{ background: 'var(--ok)' }}></i>בתוקף</span>
      <span><i style=${{ background: '#D9A441' }}></i>מסתיים בקרוב</span>
      <span><i style=${{ background: 'var(--accent)' }}></i>פג או לא תקין</span>
      ${work ? html`<span><i style=${{ border: '1px dashed var(--mute)', background: 'transparent' }}></i>תקופת העבודה בפרויקט</span>` : null}
    </div>
  </div>`;
}

            <dt>אימייל</dt><dd>${sub.email ? html`<span class="copyline"><span class="addr">${sub.email}</span><button type="button" class="iconbtn" aria-label="העתקת האימייל" onClick=${() => copyText(sub.email, 'האימייל הועתק')}><${Icon} n="content_copy" /></button></span>` : html`<span class="muted">—</span>`}</dd>

function WaiveModal({ r, onClose }) {
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const fixes = r.ev.findings.filter((f) => f.lvl === 'fix');
  const save = async () => {
    if (!note.trim()) return;
    setBusy(true);
    try {
      await Store.saveCert(Object.assign({}, r.cert, { exception: { note: note.trim(), by: Store.me.id, at: Date.now() } }));
      Store.log_('exception', 'אושרה חריגה ל' + r.sub.name + ': ' + note.trim(), r.sub.id);
      toast('החריגה אושרה. הקבלן מורשה להיכנס.');
      onClose();
    } catch (e) { toast(dbErrorText(e), 'bad'); setBusy(false); }
  };
  return html`<${Modal} title="אישור חריגה" onClose=${onClose} footer=${html`
    <button type="button" class="btn primary" disabled=${!note.trim() || busy} onClick=${save}>אישור החריגה</button>
    <button type="button" class="btn quiet" onClick=${onClose}>ביטול</button>`}>
    <p class="lede">חריגה מאפשרת כניסה לאתר למרות הממצאים הבאים. אישור שפג לא ניתן לאשר בחריגה.</p>
    <ul class="findings card" style=${{ background: 'var(--card)' }}>${fixes.map((f) => html`<li key=${f.key} class="f-fix"><${Icon} n="error" /><div class="tx"><b>${f.title}</b></div></li>`)}</ul>
    <div class="field"><label for="waive-note">מי אישר ולמה</label><textarea id="waive-note" class="input" style=${{ minHeight: '96px' }} placeholder="לדוגמה: אושר על ידי מנהל הביטוח, הסוכן הבטיח תיקון עד יום ה׳" value=${note} onInput=${(e) => setNote(e.target.value)}></textarea></div>
  <//>`;
}

/* ---------- add or edit subcontractors ---------- */
function blankSub(profiles) {
  return { name: '', companyId: '', trade: '', profile: profiles[0] ? profiles[0].id : '', contact: '', phone: '', email: '', agent: '', agentEmail: '', agentPhone: '', workFrom: null, workTo: null, notes: '' };
}
function SubModal({ sub, onClose, onCreated }) {
  const S = useStore();
  const editing = !!sub;
  const [tab, setTab] = useState('one');
  const [d, setD] = useState(() => Object.assign(blankSub(S.profiles), sub || {}));
  const [paste, setPaste] = useState('');
  const [pasteProf, setPasteProf] = useState(S.profiles[0] ? S.profiles[0].id : '');
  const [busy, setBusy] = useState(false);
  const set = (x) => setD(Object.assign({}, d, x));
  const parsed = useMemo(() => parseSubList(paste), [paste]);
  const dup = !editing && d.name.trim() && S.subs.some((s) => namesMatch(s.name, d.name) || (digits(d.companyId) && digits(s.companyId) === digits(d.companyId)));
  const saveOne = async (e) => {
    if (e) e.preventDefault();
    if (!d.name.trim() || busy) return;
    setBusy(true);
    try {
      const rec = Object.assign({}, d, { name: d.name.trim(), companyId: d.companyId.trim(), workFrom: isISO(d.workFrom) ? d.workFrom : null, workTo: isISO(d.workTo) ? d.workTo : null });
      if (editing) {
        await Store.saveSub(Object.assign({}, sub, rec));
        Store.log_('edit', 'פרטי ' + rec.name + ' עודכנו', sub.id);
        toast('הפרטים נשמרו');
        onClose();
      } else {
        const id = uid('s');
        await Store.saveSub(Object.assign({ id, pid: Store.pid, createdAt: Date.now() }, rec));
        Store.log_('sub', rec.name + ' נוסף לפרויקט', id);
        toast(rec.name + ' נוסף לפרויקט');
        onClose();
        if (onCreated) onCreated(id); else go('sub', id);
      }
    } catch (err) { toast(dbErrorText(err), 'bad'); setBusy(false); }
  };
  const saveMany = async () => {
    if (!parsed.length || busy) return;
    setBusy(true);
    try {
      const now = Date.now();
      let i = 0;
      for (const x of parsed) await Store.saveSub(Object.assign(blankSub(S.profiles), x, { id: uid('s'), pid: Store.pid, profile: pasteProf, createdAt: now + i++ }));
      Store.log_('sub', plural(parsed.length, 'קבלן משנה אחד נוסף', 'קבלני משנה נוספו') + ' מרשימה');
      toast(plural(parsed.length, 'קבלן משנה אחד נוסף', 'קבלני משנה נוספו') + ' לפרויקט');
      onClose();
    } catch (err) { toast(dbErrorText(err), 'bad'); setBusy(false); }
  };
  const footer = tab === 'one' || editing
    ? html`<button type="button" class="btn primary" disabled=${!d.name.trim() || busy} onClick=${saveOne}>${editing ? 'שמירה' : 'הוספה'}</button><button type="button" class="btn quiet" onClick=${onClose}>ביטול</button>`
    : html`<button type="button" class="btn primary" disabled=${!parsed.length || busy} onClick=${saveMany}>${parsed.length ? 'הוספת ' + plural(parsed.length, 'קבלן אחד', 'קבלנים') : 'הוספה'}</button><button type="button" class="btn quiet" onClick=${onClose}>ביטול</button>`;
  return html`<${Modal} title=${editing ? 'עריכת ' + sub.name : 'הוספת קבלני משנה'} onClose=${onClose} wide footer=${footer}>
    ${!editing ? html`<div class="chips" role="group" aria-label="אופן ההוספה">
      <button type="button" class="chip" aria-pressed=${tab === 'one' ? 'true' : 'false'} onClick=${() => setTab('one')}>קבלן אחד</button>
      <button type="button" class="chip" aria-pressed=${tab === 'many' ? 'true' : 'false'} onClick=${() => setTab('many')}>רשימה מאקסל</button>
    </div>` : null}
    ${tab === 'one' || editing ? html`<form onSubmit=${saveOne} style=${{ display: 'contents' }}>
      <div class="grid2">
        <${Field} id="sm-name" label="שם החברה"><input id="sm-name" class="input" required value=${d.name} onInput=${(e) => set({ name: e.target.value })} placeholder="ש.מ. חשמל בע״מ" /><//>
        <${Field} id="sm-cid" label="ח.פ." hint=${dup ? 'כבר קיים בפרויקט קבלן עם שם או ח.פ. דומים' : 'משמש לוודא שהאישור הונפק לחברה הנכונה'}><input id="sm-cid" class="input mono ltr" inputmode="numeric" value=${d.companyId} onInput=${(e) => set({ companyId: e.target.value })} placeholder="515123456" /><//>
      </div>
      <div class="grid2">
        <${Field} id="sm-trade" label="תחום"><input id="sm-trade" class="input" list="trades" value=${d.trade} onInput=${(e) => set({ trade: e.target.value })} placeholder="חשמל" /><datalist id="trades">${TRADES.map((t) => html`<option key=${t} value=${t}></option>`)}</datalist><//>
        <${Field} id="sm-prof" label="דרישות ביטוח"><select id="sm-prof" class="input" value=${d.profile} onChange=${(e) => set({ profile: e.target.value })}>${S.profiles.map((x) => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
      </div>
      <div class="grid3">
        <${Field} id="sm-contact" label="איש קשר"><input id="sm-contact" class="input" value=${d.contact} onInput=${(e) => set({ contact: e.target.value })} /><//>
        <${Field} id="sm-phone" label="טלפון נייד" hint="לבקשות בוואטסאפ"><input id="sm-phone" class="input" type="tel" value=${d.phone} onInput=${(e) => set({ phone: e.target.value })} placeholder="050-1234567" /><//>
        <${Field} id="sm-email" label="אימייל"><input id="sm-email" class="input" type="email" value=${d.email} onInput=${(e) => set({ email: e.target.value })} /><//>
      </div>
      <div class="grid3">
        <${Field} id="sm-agent" label="סוכן ביטוח"><input id="sm-agent" class="input" value=${d.agent} onInput=${(e) => set({ agent: e.target.value })} /><//>
        <${Field} id="sm-aemail" label="אימייל הסוכן"><input id="sm-aemail" class="input" type="email" value=${d.agentEmail} onInput=${(e) => set({ agentEmail: e.target.value })} /><//>
        <${Field} id="sm-aphone" label="טלפון הסוכן"><input id="sm-aphone" class="input" type="tel" value=${d.agentPhone} onInput=${(e) => set({ agentPhone: e.target.value })} /><//>
      </div>
      <div class="grid2">
        <${Field} id="sm-from" label="תחילת העבודה בפרויקט"><input id="sm-from" class="input" type="date" value=${d.workFrom || ''} onInput=${(e) => set({ workFrom: e.target.value || null })} /><//>
        <${Field} id="sm-to" label="סיום משוער"><input id="sm-to" class="input" type="date" value=${d.workTo || ''} onInput=${(e) => set({ workTo: e.target.value || null })} /><//>
      </div>
      <${Field} id="sm-notes" label="הערות"><textarea id="sm-notes" class="input" style=${{ minHeight: '72px' }} value=${d.notes} onInput=${(e) => set({ notes: e.target.value })}></textarea><//>
    </form>` : html`
      <p class="lede">העתיקו עמודות מאקסל והדביקו כאן. סדר העמודות: שם, ח.פ., תחום, איש קשר, טלפון. אפשר להשמיט עמודות מהסוף.</p>
      <${Field} id="sm-paste" label="הרשימה"><textarea id="sm-paste" class="input" style=${{ minHeight: '150px' }} value=${paste} onInput=${(e) => setPaste(e.target.value)} placeholder=${'ש.מ. חשמל\t515123456\tחשמל\tשמעון\t050-1234567'}></textarea><//>
