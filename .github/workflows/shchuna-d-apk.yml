# Builds the Android app of שכונה ד׳ (shchuna-d/app, a Capacitor shell around the game)
# and keeps the debug APK as a workflow artifact.
name: שכונה ד׳ · APK

on:
  workflow_dispatch:
  push:
    branches: [claude/loving-sagan-0etvis, main]
    paths: ["shchuna-d/**", ".github/workflows/shchuna-d-apk.yml"]

concurrency:
  group: shchuna-d-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        working-directory: shchuna-d/app
        run: |
          npm ci
          node sync.mjs
          npx cap sync android
      - name: Build debug APK
        working-directory: shchuna-d/app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shchuna-d-debug-apk
          path: shchuna-d/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
