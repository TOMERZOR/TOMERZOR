<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ערסלייט</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ערסלייט מתרגם עברית לערסית, בזמן אמת.">
<meta property="og:title" content="ערסלייט">
<meta property="og:description" content="כותבים עברית, מקבלים ערסית.">
<meta property="og:url" content="https://tomerzor.github.io/TOMERZOR/arslate/">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:image" content="https://tomerzor.github.io/TOMERZOR/arslate/icons/icon-512.png">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ערסלייט">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: one column, nothing else. A small wordmark, the input line with a hairline under it
   (it turns gold and runs while translating), and the answer set in a serif below.
   Actions appear only once there is an answer. Gold is the only accent. Light and dark follow the device. */
:root {
  color-scheme: light dark;
  --bg: #F7F6F3;
  --ink: #111113;
  --ink-2: #5E5F65;
  --ink-3: #9A9BA1;
  --line: #E3E1DB;
  --hover: rgba(17, 17, 19, .05);
  --gold: #A27326;
  --gold-2: #C9A25A;
  --sans: "IBM Plex Sans Hebrew", "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --serif: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0D; --ink: #F2F1EC; --ink-2: #A9A9AF; --ink-3: #66666D; --line: #2A2A2E;
    --hover: rgba(255, 255, 255, .06); --gold: #D6AE62; --gold-2: #E7C887;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0D; --ink: #F2F1EC; --ink-2: #A9A9AF; --ink-3: #66666D; --line: #2A2A2E;
  --hover: rgba(255, 255, 255, .06); --gold: #D6AE62; --gold-2: #E7C887;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.col { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }

header.col { padding-top: max(22px, env(safe-area-inset-top)); }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
.brand svg { width: 20px; height: 20px; color: var(--gold); }
.brand span { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }

main.col { padding-top: 16vh; padding-bottom: max(40px, env(safe-area-inset-bottom)); }
@media (max-width: 640px) { main.col { padding-top: 11vh; } }

.field { position: relative; display: flex; align-items: flex-start; gap: 8px; }
textarea {
  display: block; flex: 1; min-width: 0; min-height: 1.4em; max-height: 45vh; resize: none;
  border: 0; outline: 0; background: transparent; color: var(--ink);
  font: 400 26px/1.4 var(--sans); padding: 0; margin: 0; caret-color: var(--gold);
}
@media (min-width: 640px) { textarea { font-size: 30px; } }
textarea::placeholder { color: var(--ink-3); opacity: 1; }
textarea:focus-visible { outline: none; }

.rule { position: relative; height: 1px; margin-top: 18px; background: var(--line); overflow: hidden; }
.rule::after {
  content: ""; position: absolute; inset: 0; background: var(--gold);
  transform: scaleX(0); transform-origin: right; transition: transform .5s var(--ease);
}
.field:focus-within + .rule::after { transform: scaleX(1); }
.rule::before {
  content: ""; position: absolute; top: 0; width: 35%; height: 100%; z-index: 1; opacity: 0;
  background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
}
.busy .rule::before { opacity: 1; animation: run .9s linear infinite; }
@keyframes run { from { right: -35%; } to { right: 100%; } }

.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none;
  transition: background .2s, color .2s, transform .15s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[hidden] { display: none; }
.field .icon-btn { margin-top: 2px; }

.result { margin-top: 32px; }
.result[hidden] { display: none; }
.out {
  margin: 0; font-family: var(--serif); font-weight: 500;
  font-size: 28px; line-height: 1.45; color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
@media (min-width: 640px) { .out { font-size: 32px; } }
.out .w { animation: rise .5s var(--ease) both; }
@keyframes rise { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }

.actions { display: flex; gap: 4px; margin-top: 18px; margin-inline-start: -8px; animation: fade .4s .2s var(--ease) both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500;
  padding: 9px 15px; border-radius: 10px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .35s var(--ease); white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="col">
  <a class="brand" href="./" aria-label="ערסלייט">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="11" width="15" height="10" rx="5" transform="rotate(-45 11 16)"/><rect x="13.5" y="11" width="15" height="10" rx="5" transform="rotate(-45 21 16)"/></svg>
    <span>ערסלייט</span>
  </a>
</header>

<main class="col" id="app">
  <div class="field">
    <label for="src" class="sr">טקסט בעברית לתרגום לערסית</label>
    <textarea id="src" rows="1" maxlength="1000" placeholder="מה רוצים להגיד?" enterkeyhint="done" autocomplete="off" spellcheck="false" autofocus></textarea>
    <button class="icon-btn" id="clear" type="button" aria-label="ניקוי" title="ניקוי" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="rule" aria-hidden="true"></div>

  <section class="result" id="result" hidden>
    <h2 class="sr">בערסית</h2>
    <p class="out" id="out" aria-live="polite"></p>
    <div class="actions">
      <button class="icon-btn" id="copy" type="button" aria-label="העתקה" title="העתקה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
      </button>
      <button class="icon-btn" id="again" type="button" aria-label="נוסח אחר" title="נוסח אחר">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>
      </button>
      <button class="icon-btn" id="speak" type="button" aria-label="השמעה" title="השמעה" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="icon-btn" id="share" type="button" aria-label="שיתוף" title="שיתוף">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>
      </button>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="lexicon.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const app = $("app"), src = $("src"), out = $("out"), result = $("result");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let variant = 0, timer = 0, current = null;

  function grow() {
    src.style.height = "auto";
    src.style.height = src.scrollHeight + "px";
  }

  function render(res) {
    current = res;
    app.classList.remove("busy");
    out.textContent = "";
    if (!res || !res.text) { result.hidden = true; return; }
    if (reduced) out.textContent = res.text;
    else {
      let i = 0;
      for (const p of res.text.split(/(\s+)/)) {
        if (!p) continue;
        if (/^\s+$/.test(p)) { out.appendChild(document.createTextNode(p)); continue; }
        const s = document.createElement("span");
        s.className = "w";
        s.style.animationDelay = Math.min(i++ * 28, 900) + "ms";
        s.textContent = p;
        out.appendChild(s);
      }
    }
    result.hidden = false;
  }

  function run() { render(Arslate.translate(src.value, variant)); }

  function onInput(now) {
    $("clear").hidden = !src.value.length;
    grow();
    clearTimeout(timer);
    if (!src.value.trim()) { render(null); return; }
    app.classList.add("busy");
    timer = setTimeout(run, now === true ? 120 : 420);
  }

  src.addEventListener("input", () => { variant = 0; onInput(); });
  src.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      clearTimeout(timer);
      if (src.value.trim()) run();
      if (matchMedia("(pointer: coarse)").matches) src.blur();
    }
  });

  $("clear").addEventListener("click", () => { src.value = ""; variant = 0; onInput(); src.focus(); });
  $("again").addEventListener("click", () => { variant++; app.classList.add("busy"); setTimeout(run, 200); });

  $("copy").addEventListener("click", async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(current.text); }
    catch (err) {
      const ta = document.createElement("textarea");
      ta.value = current.text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      ta.remove();
    }
    toast("הועתק");
  });

  $("share").addEventListener("click", async () => {
    if (!current) return;
    const url = location.origin + location.pathname;
    if (navigator.share) {
      try { await navigator.share({ text: current.text, url }); } catch (e) {}
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(current.text + "\n" + url), "_blank", "noopener");
    }
  });

  /* השמעה, רק אם יש קול עברי במכשיר */
  let heVoice = null;
  function findVoice() {
    heVoice = speechSynthesis.getVoices().find(v => /^(he|iw)/i.test(v.lang)) || null;
    $("speak").hidden = !heVoice;
  }
  if ("speechSynthesis" in window) {
    findVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", findVoice);
  }
  $("speak").addEventListener("click", () => {
    if (!current || !heVoice) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(current.text);
    u.voice = heVoice; u.lang = heVoice.lang; u.rate = 1.04; u.pitch = .9;
    speechSynthesis.speak(u);
  });

  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  /* ?q= בכתובת ממלא את השדה */
  const q = new URLSearchParams(location.search).get("q");
  if (q) { src.value = q.slice(0, 1000); onInput(true); }
  grow();
})();
</script>
</body>
</html>
